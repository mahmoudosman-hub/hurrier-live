    function isRealHurrierZoneId(id) {
      const n = Number(id);
      return Number.isInteger(n) && n >= 10000 && n < 90000;
    }

    function normalizeText(v) {
      return String(v || "").replace(/\s+/g, " ").trim();
    }

    function isTalabatMartVendor(vendorName) {
      const s = normalizeText(vendorName).toLowerCase();
      return s.includes("talabat mart") || s.includes("طلبات مارت") || s.includes("tmart");
    }

    function extractMartBranchLabel(vendorName) {
      const raw = normalizeText(vendorName);
      if (!raw) return "Unknown Mart";
      const cleaned = raw
        .replace(/^vo\s*#?\d+\s*-\s*/i, "")
        .replace(/^talabat\s*mart\s*,?\s*/i, "")
        .replace(/^طلبات\s*مارت\s*,?\s*/i, "")
        .replace(/^tmart\s*,?\s*/i, "")
        .trim();
      return cleaned || raw;
    }

    function formatRelativeDeadline(isoDate, isPreorder = false) {
      if (!isoDate) return "-";
      const target = new Date(isoDate);
      if (Number.isNaN(target.getTime())) return "-";
      if (isPreorder) {
        return target.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      }
      const diffMins = Math.round((target.getTime() - Date.now()) / 60000);
      const absMins = Math.abs(diffMins);
      const sign = diffMins < 0 ? "-" : "";
      if (absMins >= 60) {
        const h = Math.floor(absMins / 60);
        const m = absMins % 60;
        return `${sign}${h}h ${m}min`;
      }
      return `${sign}${absMins}min`;
    }

    function formatReadableTimestamp(isoDate) {
      if (!isoDate) return "-";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleString("en-US", {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatExactTimeSeconds(val) {
      if (!val) return "-";
      const d = typeof val === "number" ? new Date(val > 1e12 ? val : val * 1000) : new Date(val);
      if (Number.isNaN(d.getTime())) return String(val);
      return d.toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });
    }

    function formatDurationMinutes(minutes) {
      if (minutes === null || minutes === undefined || Number.isNaN(Number(minutes))) return "-";
      const m = Math.round(Number(minutes));
      if (Math.abs(m) >= 60) {
        const h = Math.floor(Math.abs(m) / 60);
        const rem = Math.abs(m) % 60;
        return `${m < 0 ? "-" : ""}${h}h ${rem}m`;
      }
      return `${m}m`;
    }

    function formatMoney(amount, currency = "EGP") {
      if (amount === null || amount === undefined || amount === "") return "-";
      const num = Number(amount);
      if (Number.isNaN(num)) return String(amount);
      const val = Math.abs(num) > 5000 && Number.isInteger(num) ? num / 100 : num;
      return `${val.toFixed(2)} ${currency}`;
    }

    function isValidPhoneCandidate(str) {
      const s = normalizeText(str);
      if (!s) return false;
      const digitsOnly = s.replace(/[^\d+]/g, "");
      if (digitsOnly.length < 8 || digitsOnly.length > 16) return false;
      if (/^(010|011|012|015|\+2010|\+2011|\+2012|\+2015|2010|2011|2012|2015)\d{7,8}$/.test(digitsOnly)) {
        return true;
      }
      return /^\+?\d{9,15}$/.test(digitsOnly);
    }

    function extractPhoneFromAnyText(text) {
      const s = String(text || "");
      if (!s) return "";
      const telMatch = s.match(/tel:\s*([+\d][\d\s\-().]{7,18})/i);
      if (telMatch && isValidPhoneCandidate(telMatch[1])) {
        return normalizeText(telMatch[1]);
      }
      const egMobileMatch = s.match(/(?:\+?20)?0?1[0125]\d{8}/);
      if (egMobileMatch) {
        const raw = egMobileMatch[0];
        if (raw.startsWith("+")) return raw;
        if (raw.startsWith("201")) return `+${raw}`;
        return raw.startsWith("0") ? raw : `0${raw}`;
      }
      return "";
    }

    function extractCustomerInfoFromOrder(orderObj, detailRawObj) {
      const sources = [
        detailRawObj?.customerExtra,
        detailRawObj?.customerExtra2,
        detailRawObj?.detail?.customer,
        detailRawObj?.detail?.customer_details,
        detailRawObj?.detail?.recipient,
        detailRawObj?.detail?.order?.customer,
        detailRawObj?.detail?.order?.customer_details,
        detailRawObj?.detail?.order?.recipient,
        detailRawObj?.detailFull?.customer,
        detailRawObj?.detailFull?.order?.customer,
        detailRawObj?.detailShort?.customer,
        detailRawObj?.detailShort?.order?.customer,
        orderObj?.customer,
        orderObj?.customer_details,
        orderObj?.recipient,
        orderObj
      ].filter((x) => x && typeof x === "object");

      const addrSources = [
        orderObj?.dropoff_address,
        orderObj?.delivery_address,
        detailRawObj?.detail?.dropoff_address,
        detailRawObj?.detail?.delivery_address,
        detailRawObj?.detail?.order?.dropoff_address,
        detailRawObj?.customerExtra?.dropoff_address,
        detailRawObj?.customerExtra?.delivery_address,
        detailRawObj?.customerExtra?.address,
        ...sources.map((s) => s.address || s.default_address || s.delivery_address || s.dropoff_address)
      ].filter((x) => x && typeof x === "object");

      let name = "";
      for (const src of sources) {
        const first = normalizeText(src.first_name || src.firstName);
        const last = normalizeText(src.last_name || src.lastName);
        const full = normalizeText(
          src.customer_name ||
            src.customerName ||
            src.full_name ||
            src.fullName ||
            src.recipient_name ||
            src.name ||
            (first || last ? `${first} ${last}` : "")
        );
        if (full && !/^customer\s*#?\d*$/i.test(full)) {
          name = full;
          break;
        }
      }

      if (!name) {
        const tagCust =
          (Array.isArray(orderObj.tags) ? orderObj.tags : [])
            .map((t) => String(t || ""))
            .find((t) => /customer|address_id|external/i.test(t)) || "";
        const numMatch = tagCust.match(/\d{5,}/);
        name = numMatch ? `Customer #${numMatch[0]}` : "Customer";
      }

      let phone = "";
      const phoneKeys = [
        "phone",
        "mobile",
        "mobile_number",
        "phone_number",
        "customer_phone",
        "recipient_phone",
        "contact_phone",
        "tel"
      ];

      for (const src of [...sources, ...addrSources]) {
        for (const k of phoneKeys) {
          const val = src[k];
          if (!val) continue;
          if (typeof val === "object") {
            const nestedPhone = normalizeText(
              val.number || val.phone || val.mobile || val.raw || val.formatted || ""
            );
            if (isValidPhoneCandidate(nestedPhone)) {
              phone = nestedPhone;
              break;
            }
            const extractedNested = extractPhoneFromAnyText(JSON.stringify(val));
            if (extractedNested) {
              phone = extractedNested;
              break;
            }
          } else {
            const candidate = normalizeText(val);
            if (isValidPhoneCandidate(candidate)) {
              phone = candidate;
              break;
            }
            const extracted = extractPhoneFromAnyText(candidate);
            if (extracted) {
              phone = extracted;
              break;
            }
          }
        }
        if (phone) break;
      }

      if (!phone && detailRawObj) {
        try {
          const serialized = JSON.stringify(detailRawObj);
          const foundInJson = extractPhoneFromAnyText(serialized);
          if (foundInJson) phone = foundInJson;
        } catch {
          // تجاهل
        }
      }

      const pickField = (keys) => {
        for (const src of [...addrSources, ...sources]) {
          for (const k of keys) {
            const v = src[k];
            if (v !== undefined && v !== null && normalizeText(v) !== "") {
              return normalizeText(v);
            }
          }
        }
        return "NA";
      };

      const apartment = pickField(["apartment", "apartment_number", "apt", "flat"]);
      const building = pickField(["building", "building_number", "building_name"]);
      const floor = pickField(["floor", "floor_number"]);
      const zipcode = pickField(["zipcode", "zip_code", "postal_code"]);
      const intercom = pickField(["intercom"]);
      const entrance = pickField(["entrance", "door"]);

      return { name, phone, apartment, building, floor, zipcode, intercom, entrance };
    }

    function mapHurrierRecordToDelivery(rec, tabName) {
      const order = rec.order || rec;
      const instructions = [];
      if (order.is_cash_collection || rec.is_cash_collection) instructions.push("Cash");
      if (order.is_card_on_delivery) instructions.push("Card");

      const vRaw = String(order.vertical_type || order.vertical || rec.vertical_type || "").toLowerCase();
      if (isTalabatMartVendor(order.vendor_name || rec.vendor_name)) {
        instructions.push("Darkstores");
      } else if (vRaw.includes("darkstore")) {
        instructions.push("Darkstores");
      } else if (vRaw.includes("supermarket") || vRaw.includes("grocery")) {
        instructions.push("Supermarket");
      } else if (vRaw.includes("restaurant")) {
        instructions.push("Restaurants");
      } else if (vRaw) {
        instructions.push(vRaw.replace(/_/g, " "));
      } else {
        instructions.push("Restaurants");
      }

      const statusRaw = rec.status || order.status || (tabName === "Queued" ? "queued" : "active");
      const statusLabel = String(statusRaw)
        .split("_")
        .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
        .join(" ");

      const scheduledDropoff = order.scheduled_dropoff_at || rec.scheduled_dropoff_at || order.promised_delivery_at;
      const deadlineStr = formatRelativeDeadline(scheduledDropoff, tabName === "Pre-order");
      const distKm = typeof rec.distance === "number" ? `${(rec.distance / 1000).toFixed(2)} km` : "-";
      const rawOrderVal = order.order_value ?? order.total_amount ?? rec.order_value;
      const valEgp = rawOrderVal !== undefined ? formatMoney(rawOrderVal, "EGP") : "-";

      const rawZones = Array.isArray(rec.starting_points)
        ? rec.starting_points.map((sp) => (typeof sp === "object" ? sp?.name || sp?.id : sp)).filter(Boolean)
        : Array.isArray(order.starting_points)
        ? order.starting_points.map((sp) => (typeof sp === "object" ? sp?.name || sp?.id : sp)).filter(Boolean)
        : ["Cairo"];

      const rawZoneObjects = Array.isArray(rec.starting_points)
        ? rec.starting_points
            .filter((sp) => sp && typeof sp === "object" && (sp.id || sp.starting_point_id) && (sp.name || sp.starting_point_name))
            .map((sp) => ({
              id: Number(sp.id || sp.starting_point_id),
              name: normalizeText(sp.name || sp.starting_point_name),
              city: normalizeText(rec.city_name || order.city_name || "Cairo")
            }))
        : [];

      const orderIdNum = String(order.code || rec.order_id || rec.id || "");
      const courierName = rec.courier_name || order.courier_name || (tabName === "Queued" ? "Assigning..." : "-");
      const isSplit = Boolean(rec.is_split || order.is_split || (Array.isArray(order.deliveries) && order.deliveries.length > 1));

      return {
        uid: `${tabName}-${orderIdNum}-${rec.id || courierName}-${Math.random().toString(36).slice(2, 6)}`,
        id: orderIdNum,
        orderCode: order.order_code || `HF_EG${orderIdNum}`,
        vendor: order.vendor_name || rec.vendor_name || "Unknown Vendor",
        vo: order.vendor_order_number || order.vo || "-",
        deadline: deadlineStr,
        courier: courierName,
        courierId: rec.courier_id || order.courier_id || null,
        status: statusLabel,
        time_in: deadlineStr.startsWith("-") ? deadlineStr : "-",
        time_at: formatReadableTimestamp(scheduledDropoff),
        zone: rawZones.join(", "),
        zonesList: rawZones,
        zoneObjects: rawZoneObjects,
        city: rec.city_name || order.city_name || "Cairo",
        instructions,
        tab: tabName,
        distance: distKm,
        orderValue: valEgp,
        isSplit,
        rawRecord: rec
      };
    }

    function App() {
      const [activeTab, setActiveTab] = useState("Active");
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCity, setSelectedCity] = useState("All Cities");
      const [cityFilterMode, setCityFilterMode] = useState("all");
      const [selectedMultiCities, setSelectedMultiCities] = useState(["Cairo"]);
      const [selectedZoneIds, setSelectedZoneIds] = useState([]);
      const [isZoneModalOpen, setIsZoneModalOpen] = useState(false);
      const [zoneSearchQuery, setZoneSearchQuery] = useState("");
      const [syncSelectedZonesToHurrier, setSyncSelectedZonesToHurrier] = useState(true);

      const [activeQuickFilter, setActiveQuickFilter] = useState("All");
      const [selectedMartBranch, setSelectedMartBranch] = useState("ALL");

      const [deliveries, setDeliveries] = useState([]);
      const [couriers, setCouriers] = useState([]);
      const [citySummary, setCitySummary] = useState([]);
      const [dispatcherStats, setDispatcherStats] = useState([]);
      const [issuesList, setIssuesList] = useState([]);
      const [discoveredZonesFromBundle, setDiscoveredZonesFromBundle] = useState([]);
      const [tabCounts, setTabCounts] = useState({});

      const [expandedZoneId, setExpandedZoneId] = useState(null);
      const [selectedOrder, setSelectedOrder] = useState(null);
      const [liveOrderDetailDoc, setLiveOrderDetailDoc] = useState(null);
      const [detailModalTab, setDetailModalTab] = useState("Deliveries");
      const [copiedText, setCopiedText] = useState("");
      const [lastSyncTime, setLastSyncTime] = useState("-");
      const [connectionStatus, setConnectionStatus] = useState("connecting");

      const selectedOrderRef = useRef(null);
      selectedOrderRef.current = selectedOrder;

      const copyToClipboard = useCallback((label, text) => {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(String(text)).catch(() => {});
        }
        setCopiedText(label);
        setTimeout(() => setCopiedText(""), 1500);
      }, []);

      const pushSelectedZonesToFirebase = useCallback(async (zoneIds, shouldSyncHurrier) => {
        try {
          await fetch(`${FIREBASE_DB_URL}/config/selected_zones.json`, {
            method: "PUT",
            body: JSON.stringify({
              zone_ids: shouldSyncHurrier ? zoneIds : [],
              updated_at: new Date().toISOString()
            })
          });
        } catch {
          // تجاهل
        }
      }, []);

      const requestOrderDetailsFromHurrier = useCallback(async (orderId) => {
        if (!orderId) return;
        const cleanId = String(orderId).replace(/^HF_[A-Z]{2}/i, "").trim();
        if (!cleanId) return;
        try {
          const existingRes = await fetch(`${FIREBASE_DB_URL}/config/requested_order_details.json`);
          const existing = existingRes.ok ? await existingRes.json() : [];
          const arr = Array.isArray(existing) ? existing.map(String) : [];
          if (!arr.includes(cleanId)) {
            arr.push(cleanId);
            await fetch(`${FIREBASE_DB_URL}/config/requested_order_details.json`, {
              method: "PUT",
              body: JSON.stringify(arr.slice(-25))
            });
          }
        } catch {
          // تجاهل
        }
      }, []);

      const fetchSingleOrderDetailDoc = useCallback(async (orderId) => {
        if (!orderId) return;
        const cleanId = String(orderId).replace(/^HF_[A-Z]{2}/i, "").trim();
        if (!cleanId) return;
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/order_details/${cleanId}.json`, { cache: "no-store" });
          if (res.ok) {
            const doc = await res.json();
            if (doc && typeof doc === "object") {
              setLiveOrderDetailDoc(doc);
            }
          }
        } catch {
          // تجاهل
        }
      }, []);

      useEffect(() => {
        if (!selectedOrder) {
          setLiveOrderDetailDoc(null);
          return;
        }
        setDetailModalTab("Deliveries");
        setLiveOrderDetailDoc(null);
        fetchSingleOrderDetailDoc(selectedOrder.id);
        requestOrderDetailsFromHurrier(selectedOrder.id);

        const pollTimer = setInterval(() => {
          if (selectedOrderRef.current?.id) {
            fetchSingleOrderDetailDoc(selectedOrderRef.current.id);
          }
        }, 2000);

        return () => clearInterval(pollTimer);
      }, [selectedOrder, fetchSingleOrderDetailDoc, requestOrderDetailsFromHurrier]);

      const applyFirebaseBundle = useCallback((bundle) => {
        if (!bundle || typeof bundle !== "object") return;

        const bucketMap = [
          { key: "active", tab: "Active" },
          { key: "queued", tab: "Queued" },
          { key: "dispatched", tab: "Dispatched" },
          { key: "actionable", tab: "Actionable" },
          { key: "preorder", tab: "Pre-order" },
          { key: "waitingAssembly", tab: "Waiting for Assembly" }
        ];

        const nextDeliveries = [];
        const nextCounts = {};

        bucketMap.forEach(({ key, tab }) => {
          const payload = bundle[key];
          const recs = Array.isArray(payload?.records)
            ? payload.records
            : Array.isArray(payload)
            ? payload
            : [];
          recs.forEach((r) => nextDeliveries.push(mapHurrierRecordToDelivery(r, tab)));
          nextCounts[tab] = payload?.metadata?.total_count ?? recs.length;
        });

        setDeliveries(nextDeliveries);
        setTabCounts(nextCounts);

        if (bundle.stats && Array.isArray(bundle.stats.cities)) {
          const summaries = [];
          const zones = [];

          bundle.stats.cities.forEach((c) => {
            const s = c.stat || {};
            summaries.push({
              city: c.city_name,
              queued: s.queued_count ?? 0,
              queuedPct: s.queued_percent ?? 0,
              dispatched: s.dispatched_count ?? 0,
              dispatchedPct: s.dispatched_percent ?? 0,
              active: s.active_count ?? 0,
              activePct: s.active_percent ?? 0,
              delay: `${Number(s.delay || 0).toFixed(1)}m`,
              puPct: s.picked_up_percent ?? 0,
              doPct: s.drop_off_percent ?? 0,
              zeroDel: s.zero_deliveries ?? 0,
              lowDel: s.low_deliveries ?? 0,
              medDel: s.medium_deliveries ?? 0,
              highDel: s.high_deliveries ?? 0,
              starting: s.couriers_in_starting ?? 0,
              working: s.couriers_in_working ?? 0,
              ending: s.couriers_in_ending ?? 0,
              tempBreak: s.couriers_in_temp_break ?? 0,
              break: s.couriers_in_break ?? 0
            });

            (c.zones || []).forEach((z) => {
              const zDelay = `${Number(z.stat?.delay || 0).toFixed(1)}m`;
              (z.starting_points || []).forEach((sp) => {
                const st = sp.stat || {};
                zones.push({
                  id: sp.id,
                  zone: sp.name,
                  city: c.city_name,
                  starting: st.couriers_in_starting ?? 0,
                  working: st.couriers_in_working ?? 0,
                  ending: st.couriers_in_ending ?? 0,
                  break: st.couriers_in_break ?? 0,
                  tempBreak: st.couriers_in_temp_break ?? 0,
                  delay: st.delay ? `${Number(st.delay).toFixed(1)}m` : zDelay,
                  queued: st.queued_count ?? 0,
                  dispatched: st.dispatched_count ?? 0,
                  active: st.active_count ?? 0,
                  puPercent: st.picked_up_percent ?? 0,
                  doPercent: st.drop_off_percent ?? 0,
                  zeroDel: st.zero_deliveries ?? 0,
                  lowDel: st.low_deliveries ?? 0,
                  medDel: st.medium_deliveries ?? 0,
                  highDel: st.high_deliveries ?? 0
                });
              });
            });
          });

          if (summaries.length > 0) setCitySummary(summaries);
          if (zones.length > 0) setCouriers(zones);
        }

        if (Array.isArray(bundle.discoveredZonesList) && bundle.discoveredZonesList.length > 0) {
          setDiscoveredZonesFromBundle(bundle.discoveredZonesList);
        }

        if (Array.isArray(bundle.dispatchers)) {
          setDispatcherStats(
            bundle.dispatchers.map((d) => ({
              picked_by: d.picked_by || d.email || "Dispatcher",
              picked: d.picked ?? 0,
              processing: d.processing ?? 0,
              max_picked_for: d.min_picked_at ? formatRelativeDeadline(d.min_picked_at).replace("-", "") : "-"
            }))
          );
        }

        const rawIssues = Array.isArray(bundle.issues?.issues)
          ? bundle.issues.issues
          : Array.isArray(bundle.issues?.records)
          ? bundle.issues.records
          : Array.isArray(bundle.issues)
          ? bundle.issues
          : [];
        setIssuesList(rawIssues);

        if (bundle.syncedAt) {
          const d = new Date(bundle.syncedAt);
          if (!Number.isNaN(d.getTime())) {
            setLastSyncTime(d.toLocaleTimeString("en-US", { hour12: true }));
          }
        }
        setConnectionStatus("live");
      }, []);

      const fetchLiveBundleFromFirebase = useCallback(async () => {
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/live_bundle.json`, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (data) {
            applyFirebaseBundle(data);
          } else {
            setConnectionStatus("waiting");
          }
        } catch {
          setConnectionStatus("error");
        }
      }, [applyFirebaseBundle]);

      useEffect(() => {
        fetchLiveBundleFromFirebase();
        const interval = setInterval(fetchLiveBundleFromFirebase, 2000);
        return () => clearInterval(interval);
      }, [fetchLiveBundleFromFirebase]);

      const availableZones = useMemo(() => {
        const map = new Map();
        ALL_ZONES_CATALOG.forEach((z) => {
          const numId = Number(z.id);
          if (!isRealHurrierZoneId(numId)) return;
          const key = normalizeText(z.name).toLowerCase();
          map.set(key, { ...z, id: numId });
        });
        discoveredZonesFromBundle.forEach((z) => {
          const numId = Number(z?.id);
          if (z && z.name && isRealHurrierZoneId(numId)) {
            const key = normalizeText(z.name).toLowerCase();
            const existing = map.get(key);
            map.set(key, {
              id: existing ? existing.id : numId,
              name: normalizeText(z.name),
              city: z.city || existing?.city || "Cairo"
            });
          }
        });
        couriers.forEach((c) => {
          const numId = Number(c?.id);
          if (c.zone && isRealHurrierZoneId(numId)) {
            const key = normalizeText(c.zone).toLowerCase();
            const existing = map.get(key);
            map.set(key, {
              id: existing ? existing.id : numId,
              name: normalizeText(c.zone),
              city: c.city || existing?.city || "Cairo"
            });
          }
        });
        deliveries.forEach((d) => {
          (d.zoneObjects || []).forEach((zo) => {
            const numId = Number(zo?.id);
            if (zo && zo.name && isRealHurrierZoneId(numId)) {
              const key = normalizeText(zo.name).toLowerCase();
              const existing = map.get(key);
              map.set(key, {
                id: existing ? existing.id : numId,
                name: normalizeText(zo.name),
                city: zo.city || d.city || existing?.city || "Cairo"
              });
            }
          });
        });
        return Array.from(map.values())
          .filter((z) => selectedCity === "All Cities" || z.city === selectedCity)
          .sort((a, b) => String(a.name).localeCompare(String(b.name)));
      }, [couriers, discoveredZonesFromBundle, deliveries, selectedCity]);

      const selectedZoneNames = useMemo(() => {
        if (!Array.isArray(selectedZoneIds) || selectedZoneIds.length === 0) return [];
        const idSet = new Set(selectedZoneIds.map(Number));
        return availableZones
          .filter((z) => idSet.has(Number(z.id)))
          .map((z) => normalizeText(z.name).toLowerCase())
          .filter(Boolean);
      }, [availableZones, selectedZoneIds]);

      const matchesZoneFilter = useCallback(
        (delivery) => {
          if (cityFilterMode === "zones" && selectedZoneIds.length > 0) {
            const recZoneIds = (delivery.zoneObjects || [])
              .map((zo) => Number(zo.id))
              .filter((n) => !Number.isNaN(n) && n > 0);
            const matchesById = recZoneIds.some((zid) => selectedZoneIds.map(Number).includes(zid));
            if (matchesById) return true;

            const recNames = [
              ...(delivery.zonesList || []),
              ...(delivery.zoneObjects || []).map((zo) => zo.name),
              delivery.zone
            ]
              .map((n) => normalizeText(n).toLowerCase())
              .filter(Boolean);

            return selectedZoneNames.some((selName) =>
              recNames.some((rn) => rn === selName || rn.includes(selName) || selName.includes(rn))
            );
          }

          if (cityFilterMode === "multi_cities") {
            if (!selectedMultiCities.length) return true;
            return selectedMultiCities.some(
              (c) => normalizeText(c).toLowerCase() === normalizeText(delivery.city).toLowerCase()
            );
          }

          if (selectedCity && selectedCity !== "All Cities") {
            return normalizeText(selectedCity).toLowerCase() === normalizeText(delivery.city).toLowerCase();
          }

          return true;
        },
        [cityFilterMode, selectedZoneIds, selectedZoneNames, selectedMultiCities, selectedCity]
      );

      const baseTabDeliveries = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return deliveries.filter((d) => {
          const matchesTab = d.tab === activeTab;
          const matchesZone = matchesZoneFilter(d);
          const matchesSearch =
            !q ||
            d.id.toLowerCase().includes(q) ||
            d.vendor.toLowerCase().includes(q) ||
            d.courier.toLowerCase().includes(q) ||
            d.zone.toLowerCase().includes(q);
          return matchesTab && matchesZone && matchesSearch;
        });
      }, [deliveries, activeTab, matchesZoneFilter, searchQuery]);

      const martBranchesSummary = useMemo(() => {
        const martOrders = baseTabDeliveries.filter((d) => isTalabatMartVendor(d.vendor));
        const branchMap = new Map();

        martOrders.forEach((o) => {
          const label = extractMartBranchLabel(o.vendor);
          const isLate = o.deadline.includes("-") || o.deadline === "Late";
          const current = branchMap.get(label) || { label, count: 0, late: 0 };
          current.count += 1;
          if (isLate) current.late += 1;
          branchMap.set(label, current);
        });

        return {
          totalMartCount: martOrders.length,
          branches: Array.from(branchMap.values()).sort((a, b) => b.count - a.count)
        };
      }, [baseTabDeliveries]);

      const filteredDeliveries = useMemo(() => {
        return baseTabDeliveries.filter((d) => {
          const isLate = d.deadline.includes("-") || d.deadline === "Late";
          const hasCash = d.instructions.includes("Cash");
          const hasCard = d.instructions.includes("Card");
          const isMart = isTalabatMartVendor(d.vendor);
          const isDarkstore = isMart || d.instructions.includes("Darkstores");
          const isRestaurant = !isDarkstore && (d.instructions.includes("Restaurants") || d.instructions.includes("Supermarket"));

          if (activeQuickFilter === "Delayed" && !isLate) return false;
          if (activeQuickFilter === "Cash" && !hasCash) return false;
          if (activeQuickFilter === "Card" && !hasCard) return false;
          if (activeQuickFilter === "Restaurants" && !isRestaurant) return false;
          if (activeQuickFilter === "Darkstores") {
            if (!isDarkstore) return false;
            if (selectedMartBranch !== "ALL") {
              const branchLabel = extractMartBranchLabel(d.vendor);
              if (normalizeText(branchLabel) !== normalizeText(selectedMartBranch)) return false;
            }
          }
          if (activeQuickFilter === "Split" && !d.isSplit) return false;

          return true;
        });
      }, [baseTabDeliveries, activeQuickFilter, selectedMartBranch]);

      const selectedOrderFullView = useMemo(() => {
        if (!selectedOrder) return null;
        const doc = liveOrderDetailDoc || {};
        const rec = selectedOrder.rawRecord || {};
        const detail = doc.detail || doc.detailFull || doc.detailShort || {};
        const orderObj = detail.order || detail || rec.order || rec || {};

        const customerInfo = extractCustomerInfoFromOrder(orderObj, doc);

        const vendorName = orderObj.vendor_name || selectedOrder.vendor || "Unknown Vendor";
        const vendorOrderNo = orderObj.vendor_order_number || selectedOrder.vo || "-";
        const globalEntityId = orderObj.global_entity_id || detail.global_entity_id || "HF_EG";
        const platformName = orderObj.platform || (isTalabatMartVendor(vendorName) ? "talabat" : "TB_OT");
        const vendorCode = orderObj.vendor_code || orderObj.vendor_id || "-";

        const rawOrderValue = orderObj.order_value ?? orderObj.total_price ?? orderObj.amount;
        const orderValueStr = rawOrderValue !== undefined ? formatMoney(rawOrderValue, "EGP") : selectedOrder.orderValue;
        const cashPickupStr = formatMoney(orderObj.cash_at_pickup ?? orderObj.collection_amount ?? 0, "EGP");
        const cashDropoffStr = formatMoney(
          orderObj.cash_at_dropoff ?? (selectedOrder.instructions.includes("Cash") ? rawOrderValue || 0 : 0),
          "EGP"
        );

        const distanceStr =
          typeof (rec.distance ?? orderObj.distance) === "number"
            ? `${((rec.distance ?? orderObj.distance) / 1000).toFixed(2)} km`
            : selectedOrder.distance;

        const prepDurationStr = formatDurationMinutes(orderObj.prep_duration ?? orderObj.preparation_time ?? 5);
        const courierDelayStr = formatDurationMinutes(orderObj.courier_delay ?? rec.courier_delay ?? 0);

        const pickupAddrObj = orderObj.pickup_address || detail.pickup_address || {};
        const dropoffAddrObj = orderObj.dropoff_address || detail.dropoff_address || {};

        const pickupAddressStr =
          pickupAddrObj.street_address ||
          pickupAddrObj.formatted_address ||
          pickupAddrObj.address ||
          orderObj.pickup_address_text ||
          "-";

        const dropoffAddressStr =
          dropoffAddrObj.street_address ||
          dropoffAddrObj.formatted_address ||
          dropoffAddrObj.address ||
          orderObj.dropoff_address_text ||
          "-";

        const timeChecks = [
          { label: "Ordered at", value: formatReadableTimestamp(orderObj.ordered_at || orderObj.created_at) },
          { label: "Send to restaurant", value: formatReadableTimestamp(orderObj.send_to_restaurant_at) },
          { label: "Restaurant confirmed at", value: formatReadableTimestamp(orderObj.restaurant_confirmed_at) },
          { label: "Pickup - Committed", value: formatReadableTimestamp(orderObj.pickup_committed_at || orderObj.scheduled_pickup_at) },
          { label: "Food is ready at", value: formatReadableTimestamp(orderObj.food_ready_at || orderObj.prepared_at) },
          {
            label: "Picked up at",
            value: formatReadableTimestamp(orderObj.picked_up_at || rec.picked_up_at)
          },
          {
            label: "Promised delivery time",
            value: formatReadableTimestamp(orderObj.scheduled_dropoff_at || orderObj.promised_delivery_at || rec.scheduled_dropoff_at)
          }
        ];

        const rawDeliveries = Array.isArray(doc.deliveries) && doc.deliveries.length > 0 ? doc.deliveries : [rec];
        const allEvents = [];
        const riderMap = new Map();

        rawDeliveries.forEach((del, dIdx) => {
          const delCourier = del.courier_name || selectedOrder.courier || "-";
          const transitions = Array.isArray(del.transitions) ? del.transitions : [];

          transitions.forEach((tr, tIdx) => {
            const stateRaw = String(tr.to_state || tr.state || tr.event || tr.status || "").toLowerCase();
            const eventLabel =
              tr.event_label ||
              stateRaw
                .split("_")
                .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
                .join(" ") ||
              "Event";

            const rawTimeVal =
              tr.created_at ||
              tr.timestamp ||
              tr.event_timestamp ||
              tr.occurred_at ||
              tr.time ||
              tr.metadata?.performed_at;

            const timeSec = formatExactTimeSeconds(rawTimeVal);
            const courierName = tr.courier_name || delCourier || "-";

            if (courierName && courierName !== "-" && courierName !== "Assigning...") {
              const entry = riderMap.get(courierName) || {
                courierName,
                dispatchedAt: "-",
                acceptedAt: "-",
                pickedUpAt: "-",
                removedAt: "-",
                accepted: false
              };
              if (stateRaw.includes("dispatch") || stateRaw.includes("notif")) {
                if (entry.dispatchedAt === "-") entry.dispatchedAt = timeSec;
              }
              if (stateRaw.includes("accept")) {
                entry.accepted = true;
                if (entry.acceptedAt === "-") entry.acceptedAt = timeSec;
              }
              if (stateRaw.includes("pick")) {
                entry.accepted = true;
                if (entry.pickedUpAt === "-") entry.pickedUpAt = timeSec;
              }
              if (stateRaw.includes("undispatch") || stateRaw.includes("cancel") || stateRaw.includes("reject") || stateRaw.includes("unassign")) {
                entry.removedAt = timeSec;
              }
              riderMap.set(courierName, entry);
            }

            allEvents.push({
              key: `${dIdx}-${tIdx}`,
              deliveryId: del.id || selectedOrder.id,
              timeSec,
              eventLabel,
              subLabel: tr.reason || tr.triggered_by || tr.source || "",
              courierName,
              isAccepted: stateRaw.includes("accept"),
              isRemoved: stateRaw.includes("undispatch") || stateRaw.includes("cancel") || stateRaw.includes("unassign")
            });
          });
        });

        const ridersHistory = Array.from(riderMap.values());
        const acceptedRiders = ridersHistory.filter((r) => r.accepted);

        const notes = Array.isArray(doc.dispatcher_notes) ? doc.dispatcher_notes : [];
        const items = Array.isArray(orderObj.items) && orderObj.items.length > 0
          ? orderObj.items
          : [{ name: `${vendorName} #${vendorOrderNo}`, quantity: 1, price: orderValueStr }];

        return {
          ...selectedOrder,
          customerName: customerInfo.name,
          customerPhone: customerInfo.phone,
          apartment: customerInfo.apartment,
          building: customerInfo.building,
          floor: customerInfo.floor,
          zipcode: customerInfo.zipcode,
          intercom: customerInfo.intercom,
          entrance: customerInfo.entrance,
          vendorName,
          vendorOrderNo,
          globalEntityId,
          platformName,
          vendorCode,
          orderValue: orderValueStr,
          cashPickupStr,
          cashDropoffStr,
          distance: distanceStr,
          prepDurationStr,
          courierDelayStr,
          pickupAddress: pickupAddressStr,
          dropoffAddress: dropoffAddressStr,
          timeChecks,
          deliveriesList: rawDeliveries,
          allEvents,
          ridersHistory,
          acceptedRiders,
          notes,
          items,
          isLoadedFromApi: Boolean(liveOrderDetailDoc)
        };
      }, [selectedOrder, liveOrderDetailDoc]);

      const filteredZonesForModal = useMemo(() => {
        const q = zoneSearchQuery.trim().toLowerCase();
        return availableZones.filter((z) => {
          const nameClean = normalizeText(z.name);
          if (!nameClean || !isRealHurrierZoneId(z.id)) return false;
          if (/^(vo\s*#|hf_eg|\d{6,})/i.test(nameClean)) return false;
          if (/\b(vo\s*#|talabat\s*mart|طلبات\s*مارت)\b/i.test(nameClean)) return false;

                                                  {ev.subLabel && (
                                                    <div className="text-[11px] text-gray-500">{ev.subLabel}</div>
                                                  )}
                                                </div>
                                              </div>
                                            </td>
                                            <td className="py-2.5 px-3 font-medium text-blue-600">{ev.courierName}</td>
                                          </tr>
                                        ))
                                      )}
                                    </tbody>
                                  </table>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}

                        {detailModalTab === "Order Items" && (
                          <div className="border border-gray-200 rounded-lg divide-y divide-gray-100 text-xs">
                            {selectedOrderFullView.items.map((it, idx) => (
                              <div key={idx} className="p-3 flex justify-between items-center">
                                <div>
                                  <span className="font-bold text-gray-900">{it.quantity || it.qty || 1}x</span>{" "}
                                  <span className="text-gray-700">{it.name || it.title || "Item"}</span>
                                </div>
                                <span className="font-semibold text-gray-900">
                                  {it.price || selectedOrderFullView.orderValue}
                                </span>
                              </div>
                            ))}
                          </div>
                        )}

                        {(detailModalTab === "Issues" || detailModalTab === "Routes") && (
                          <div className="py-8 text-center text-xs text-gray-400">
                            No {detailModalTab.toLowerCase()} records available for this order.
                          </div>
                        )}
                      </div>
                    </div>

                    {/* Right Column: Notes & Time Checks */}
                    <div className="lg:col-span-3 space-y-5">
                      <div className="bg-amber-50/70 border border-amber-200 rounded-xl p-4 space-y-2.5 text-xs shadow-sm">
                        <div className="flex items-center justify-between font-bold text-gray-900">
                          <span>Notes</span>
                          <span className="text-gray-500 font-normal">{selectedOrderFullView.notes.length} notes</span>
                        </div>
                        {selectedOrderFullView.notes.length === 0 ? (
                          <div className="text-gray-400 py-4 text-center">No dispatcher notes</div>
                        ) : (
                          <div className="space-y-2">
                            {selectedOrderFullView.notes.map((n, idx) => (
                              <div key={idx} className="bg-white p-2.5 rounded border border-amber-200">
                                <div className="text-gray-800 font-medium">{n.note || n.text || n.content || "-"}</div>
                                <div className="text-[10px] text-gray-400 mt-1">
                                  {n.author || n.created_by || "Dispatcher"}
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      <div className="bg-white border border-gray-200 rounded-xl p-4 space-y-3 text-xs shadow-sm">
                        <div className="font-bold text-sm text-gray-900 pb-2 border-b border-gray-100">
                          Time Checks
                        </div>
                        {selectedOrderFullView.timeChecks.map((tc, idx) => (
                          <div key={idx} className="flex justify-between gap-2">
                            <span className="text-gray-500">{tc.label}</span>
                            <span className="font-semibold text-gray-800 text-right">{tc.value}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                {/* Modal Footer */}
                <div className="px-6 py-3 bg-white border-t border-gray-200 flex items-center justify-between text-xs">
                  <span className="text-amber-700 font-medium">
                    Read-Only View (Send to Vendor &amp; Cancel disabled for viewers)
                  </span>
                  <button
                    type="button"
                    onClick={() => setSelectedOrder(null)}
                    className="px-4 py-1.5 bg-white border border-gray-300 rounded-lg font-semibold text-gray-700 hover:bg-gray-100"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootEl = document.getElementById("root");
    if (rootEl && window.ReactDOM) {
      ReactDOM.createRoot(rootEl).render(<App />);
    }
  </script>
</body>
</html>
