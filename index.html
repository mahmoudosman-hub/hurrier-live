    // =========================================================================
    // 3) UTILITY HELPERS (Clipboard, Formatting, Normalization)
    // =========================================================================
    function copyTextToClipboard(text, onNotify) {
      const str = String(text || "").trim();
      if (!str) return;
      try {
        const ta = document.createElement("textarea");
        ta.value = str;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        if (onNotify) onNotify(`تم النسخ: ${str.length > 35 ? str.slice(0, 35) + "..." : str}`);
      } catch {
        if (onNotify) onNotify("تعذر النسخ التلقائي");
      }
    }

    function emailToFirebaseKey(email) {
      return String(email || "")
        .trim()
        .toLowerCase()
        .replace(/\./g, ",");
    }

    function formatCairoTime(isoOrMs) {
      if (!isoOrMs) return "—";
      const d = new Date(isoOrMs);
      if (Number.isNaN(d.getTime())) return "—";
      return new Intl.DateTimeFormat("en-US", {
        timeZone: "Africa/Cairo",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      }).format(d);
    }

    function formatCairoShortTime(isoOrMs) {
      if (!isoOrMs) return "";
      const d = new Date(isoOrMs);
      if (Number.isNaN(d.getTime())) return "";
      return new Intl.DateTimeFormat("en-US", {
        timeZone: "Africa/Cairo",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      }).format(d);
    }

    function getCairoTodayDateStr() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Africa/Cairo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function formatDeadlineDiff(deadlineIso, nowMs) {
      if (!deadlineIso) return { label: "—", diffMin: 0, isDelayed: false, isWarning: false };
      const targetMs = new Date(deadlineIso).getTime();
      if (Number.isNaN(targetMs)) return { label: "—", diffMin: 0, isDelayed: false, isWarning: false };
      const diffSec = Math.round((targetMs - nowMs) / 1000);
      const absSec = Math.abs(diffSec);
      const totalMin = Math.floor(absSec / 60);
      const hours = Math.floor(totalMin / 60);
      const mins = totalMin % 60;
      const sign = diffSec < 0 ? "-" : "";
      const label = hours > 0 ? `${sign}${hours}h ${mins}min` : `${sign}${mins}min`;
      return {
        label,
        diffMin: Math.round(diffSec / 60),
        isDelayed: diffSec < 0,
        isWarning: diffSec >= 0 && diffSec <= 10 * 60
      };
    }

    function formatStatusTitle(rawStatus) {
      const key = String(rawStatus || "").trim().toLowerCase();
      if (STATUS_STYLES[key]) return STATUS_STYLES[key].label;
      return key
        .split("_")
        .filter(Boolean)
        .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
        .join(" ");
    }

    function formatSecondsDuration(secVal) {
      if (secVal === null || secVal === undefined || secVal === "") return "—";
      const n = Number(secVal);
      if (Number.isNaN(n)) return String(secVal);
      const abs = Math.abs(Math.round(n));
      const m = Math.floor(abs / 60);
      const s = abs % 60;
      const sign = n < 0 ? "-" : "";
      return m > 0 ? `${sign}${m}m ${s}s` : `${sign}${s}s`;
    }

    function normalizeDeliveryRecord(rec, nowMs) {
      const ord = rec?.order || {};
      const code = String(
        ord.code ||
          ord.confirmation_number ||
          String(ord.order_code || "").replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "") ||
          rec?.id ||
          ""
      ).trim();
      const orderCode = String(ord.order_code || (code ? `HF_EG${code}` : "")).trim();
      const rawStatus = String(rec?.status || ord.status || "active").trim().toLowerCase();
      const deadlineIso =
        ord.scheduled_dropoff_at ||
        rec?.scheduled_dropoff_at ||
        ord.scheduled_pickup_at ||
        "";
      const deadlineInfo = formatDeadlineDiff(deadlineIso, nowMs);
      const verticalRaw = String(ord.vertical_type || "").toLowerCase();
      const tags = Array.isArray(ord.tags) ? ord.tags.map((t) => String(t).toLowerCase()) : [];
      const isDarkstore =
        verticalRaw === "darkstores" ||
        verticalRaw === "supermarket" ||
        verticalRaw === "hypermarket" ||
        tags.includes("grocery") ||
        tags.includes("tmart_dedicated");
      const isSplit = tags.includes("split_order") || rec?.is_primary === false;
      const isCash = Boolean(ord.is_cash_collection);
      const isCard = Boolean(ord.is_card_on_delivery);
      const isPreorder = Boolean(ord.is_pre_order || ord.is_preorder);
      const sps = Array.isArray(rec?.starting_points)
        ? rec.starting_points.map((s) => (typeof s === "string" ? s : s?.name || "")).filter(Boolean)
        : [];
      const distKm = rec?.distance ? (Number(rec.distance) / 1000).toFixed(2) : "0.00";
      const rawVal = Number(ord.order_value ?? ord.total ?? 0);
      const valEgp = rawVal > 0 ? (rawVal / 100).toFixed(2) : "0.00";

      return {
        uid: `${rec?.id || code}_${rawStatus}`,
        deliveryId: rec?.id || code,
        code,
        orderCode,
        vendorName: ord.vendor_name || "—",
        vendorOrderNumber: ord.vendor_order_number || "",
        courierId: rec?.courier_id || "",
        courierName: rec?.courier_name || "",
        rawStatus,
        statusLabel: formatStatusTitle(rawStatus),
        deadlineIso,
        deadlineTargetMs: deadlineIso ? new Date(deadlineIso).getTime() || 9e15 : 9e15,
        deadlineLabel: deadlineInfo.label,
        isDelayed: deadlineInfo.isDelayed,
        isWarning: deadlineInfo.isWarning,
        startingPoints: sps,
        distanceKm: distKm,
        orderValueEgp: valEgp,
        isCash,
        isCard,
        isDarkstore,
        isSplit,
        isPreorder,
        verticalType: verticalRaw || "restaurants",
        raw: rec
      };
    }

      const [courierModalData, setCourierModalData] = useState(null);

      // Live 1-second clock for accurate deadlines

      }, []);

      // Mirror Firebase Auth Token to LocalStorage for Tampermonkey Bridge
      const mirrorAuthToLocalStorage = useCallback(async (user) => {
        if (!user) {
          try {
            localStorage.removeItem(AUTH_BRIDGE_STORAGE_KEY);
          } catch {}
          return;
        }
        try {
          const idToken = await user.getIdToken(false);
          const payload = {
            idToken,
            refreshToken: user.refreshToken || "",
            apiKey: FIREBASE_CONFIG.apiKey,
            email: user.email || "",
            uid: user.uid || "",
            updatedAt: Date.now()
          };
          localStorage.setItem(AUTH_BRIDGE_STORAGE_KEY, JSON.stringify(payload));
        } catch {}
      }, []);

      // Listen to Firebase Auth State
      useEffect(() => {
        const unsub = auth.onAuthStateChanged(async (user) => {
          setAuthUser(user);
          setAuthLoading(false);
          if (!user) {
            setUserAccess(null);
            setAccessChecked(true);
            mirrorAuthToLocalStorage(null);
            return;
          }

          await mirrorAuthToLocalStorage(user);
          try {
            const emailKey = emailToFirebaseKey(user.email);
            const snap = await db.ref(`/allowed_emails/${emailKey}`).once("value");
            const val = snap.val();
            if (val && val.role) {
              setUserAccess(val);
            } else {
              const allSnap = await db.ref("/allowed_emails").once("value");
              if (!allSnap.exists()) {
                const initObj = {
                  email: user.email.toLowerCase(),
                  name: user.displayName || user.email,
                  role: "admin",
                  addedAt: Date.now()
                };
                await db.ref(`/allowed_emails/${emailKey}`).set(initObj);
                setUserAccess(initObj);
              } else {
                setUserAccess(null);
              }
            }
          } catch (err) {
            setAuthErrorMsg(err?.message || "تعذر التحقق من الصلاحيات");
          } finally {
            setAccessChecked(true);
          }
        });
        return () => unsub();
      }, [mirrorAuthToLocalStorage]);

      // Keep Auth Bridge token fresh every 20 minutes
      useEffect(() => {
        if (!authUser) return;
        const iv = setInterval(() => mirrorAuthToLocalStorage(authUser), 20 * 60 * 1000);
        return () => clearInterval(iv);

      // Load Dynamic Zones Catalog from Firebase
      useEffect(() => {
        if (!authUser || !userAccess) return;
        const ref = db.ref("/config/dynamic_zones_catalog");

          const list = snap.val();
          if (Array.isArray(list) && list.length > 0) {
            const map = new Map();
            DEFAULT_ZONES_CATALOG.forEach((z) => map.set(Number(z.id), z));
            list.forEach((z) => {

                map.set(Number(z.id), {
                  id: Number(z.id),
                  name: String(z.name).trim(),
                  city: z.city || "Cairo"

              }
            });
            setDynamicZonesCatalog(Array.from(map.values()));
          }
        };
        ref.on("value", handler);
        return () => ref.off("value", handler);
      }, [authUser, userAccess]);

        if (!authUser || !userAccess) return;

            .set({
              sessionId: sid,
              email: authUser.email || "",
              employeeName: userAccess.name || authUser.displayName || authUser.email || "Captain",
              role: userAccess.role || "employee",
              zoneIds: selectedZoneIds,
              activeTab,
              lastSeen: Date.now()
            })
            .catch(() => {});
        };

        sendHeartbeat();
        const iv = setInterval(sendHeartbeat, 8000);
        return () => {
          clearInterval(iv);
          sessRef.remove().catch(() => {});
        };
      }, [authUser, userAccess, selectedZoneIds, activeTab]);

        if (!authUser || !userAccess) return;

        const bRef = db.ref(`/session_bundles/${sid}`);

          const val = snap.val();

              ...val,
              tabRecords: {

                Active: Array.isArray(val?.tabRecords?.Active) ? val.tabRecords.Active : []

              zoneStats: Array.isArray(val?.zoneStats) ? val.zoneStats : [],
              activeViewers: Array.isArray(val?.activeViewers) ? val.activeViewers : []
            }));
          }
        };
        bRef.on("value", handler);
        return () => bRef.off("value", handler);
      }, [authUser, userAccess]);

      const [sharedCompletedCache, setSharedCompletedCache] = useState([]);

        if (!authUser || !userAccess) return;
        const archRef = db.ref("/config/shared_completed_archive");

          const val = snap.val();
          if (val && typeof val === "object") {
            setSharedCompletedCache(Object.values(val).filter((r) => r && typeof r === "object"));

        archRef.on("value", handler);
        return () => archRef.off("value", handler);
      }, [authUser, userAccess]);

        const zoneIdSet = new Set(selectedZoneIds.map(Number));
        const zoneNameSet = new Set();
        dynamicZonesCatalog.forEach((z) => {
          if (zoneIdSet.has(Number(z.id))) {

        const matchesZones = (rec) => {
          const rawSps = Array.isArray(rec?.starting_points)
            ? rec.starting_points
            : Array.isArray(rec?.order?.drop_off_address?.starting_points)
            ? rec.order.drop_off_address.starting_points
            : Array.isArray(rec?.order?.dropoff_address?.starting_points)
            ? rec.order.dropoff_address.starting_points
            : [];
          if (rawSps.length === 0) return true;
          return rawSps.some((sp) => {
            if (sp && typeof sp === "object" && sp.id && zoneIdSet.has(Number(sp.id))) return true;
            const nm = String(typeof sp === "string" ? sp : sp?.name || "").trim().toLowerCase();
            return nm ? zoneNameSet.has(nm) : false;
          });
        };

        const mergedByCode = new Map();
        sharedCompletedCache.forEach((r, idx) => {
          if (!matchesZones(r)) return;
          const ord = r?.order || r || {};
          const code = String(ord.confirmation_number || ord.code || `cache_${idx}`).trim();
          mergedByCode.set(code, r);
        });
        bundleData.completedRecords.forEach((r, idx) => {
          const ord = r?.order || r || {};
          const code = String(ord.confirmation_number || ord.code || `sess_${idx}`).trim();
          mergedByCode.set(code, r);
        });
        return Array.from(mergedByCode.values());
      }, [sharedCompletedCache, bundleData.completedRecords, selectedZoneIds, dynamicZonesCatalog]);

      // Reset pagination & status filter when switching tabs
      const handleSwitchTab = (tabName) => {
        setActiveTab(tabName);
        setCurrentPage(1);
        setQuickFilter("all");
        setStatusFilter("all");
        setSelectedOrderCodes(new Set());
        setMobileMenuOpen(false);
      };

      // Normalized Orders for Current Delivery Tab (Queued / Dispatched / Active)
      const normalizedTabOrders = useMemo(() => {
        const rawList = bundleData.tabRecords[activeTab] || [];
        return rawList.map((r) => normalizeDeliveryRecord(r, nowTickMs));
      }, [bundleData.tabRecords, activeTab, nowTickMs]);

      // Category & Status Counts for Current Delivery Tab
      const deliveryMetrics = useMemo(() => {
        let delayed = 0;
        let cash = 0;
        let card = 0;
        let restaurants = 0;
        let darkstores = 0;
        let split = 0;
        const statusCounts = {};

        for (const o of normalizedTabOrders) {
          if (o.isDelayed) delayed++;
          if (o.isCash) cash++;
          if (o.isCard) card++;
          if (o.isDarkstore) darkstores++;
          else restaurants++;
          if (o.isSplit) split++;
          statusCounts[o.rawStatus] = (statusCounts[o.rawStatus] || 0) + 1;
        }

        return {
          total: normalizedTabOrders.length,
          delayed,
          cash,
          card,
          restaurants,
          darkstores,
          split,
          statusCounts
        };
      }, [normalizedTabOrders]);

      // Filtered & Sorted Orders for Current Delivery Tab
      const filteredTabOrders = useMemo(() => {
        const q = tableSearch.trim().toLowerCase();
        let list = normalizedTabOrders.filter((o) => {
          if (quickFilter === "delayed" && !o.isDelayed) return false;
          if (quickFilter === "cash" && !o.isCash) return false;
          if (quickFilter === "card" && !o.isCard) return false;
          if (quickFilter === "restaurants" && o.isDarkstore) return false;
          if (quickFilter === "darkstores" && !o.isDarkstore) return false;
          if (quickFilter === "split" && !o.isSplit) return false;

          if (statusFilter !== "all" && o.rawStatus !== statusFilter) return false;

          if (q) {
            const hay = `${o.code} ${o.vendorName} ${o.courierName} ${o.startingPoints.join(" ")}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        if (sortMode === "deadline_asc") {
          list = [...list].sort((a, b) => a.deadlineTargetMs - b.deadlineTargetMs);
        } else if (sortMode === "deadline_desc") {
          list = [...list].sort((a, b) => b.deadlineTargetMs - a.deadlineTargetMs);
        }
        return list;
      }, [normalizedTabOrders, quickFilter, statusFilter, tableSearch, sortMode]);

      // Open Order Details + Dispatcher Notes Modal
      const openOrderDetailModal = useCallback((code, orderCode) => {
        const cleanCode = String(code || "").trim();
        if (!cleanCode) return;
        setOrderModalCode(cleanCode);
        setOrderModalData(null);
        setOrderModalLoading(true);

        const reqKey = `${cleanCode}_${Date.now()}`;
        db.ref(`/config/order_detail_reqs/${reqKey}`)
          .set({
            code: cleanCode,
            orderCode: orderCode || `HF_EG${cleanCode}`,
            requestedAt: Date.now()
          })
          .catch(() => {});

        const detRef = db.ref(`/order_details/${cleanCode}`);
        const handler = (snap) => {
          const val = snap.val();
          if (val) {
            setOrderModalData(val);
            setOrderModalLoading(false);
          }
        };
        detRef.on("value", handler);
        setTimeout(() => setOrderModalLoading(false), 6000);
      }, []);

      // Open Courier Detail & Balance Modal
      const openCourierDetailModal = useCallback((courierId, courierName = "") => {
        const cid = String(courierId || "").trim();
        if (!cid) return;
        setCourierModalId(cid);
        setCourierModalName(courierName);
        setCourierModalData(null);
        setCourierModalLoading(true);

        db.ref("/config/courier_detail_req")
          .set({
            courierId: cid,
            courierName,
            requestedAt: Date.now()
          })
          .catch(() => {});

        const cRef = db.ref(`/courier_details/${cid}`);
        const handler = (snap) => {
          const val = snap.val();
          if (val) {
            setCourierModalData(val);
            setCourierModalLoading(false);
          }
        };
        cRef.on("value", handler);
        setTimeout(() => setCourierModalLoading(false), 6000);
      }, []);

      // Global Rider Search Handler
      const handleGlobalRiderSearch = async (e) => {
        if (e) e.preventDefault();
        const q = globalRiderSearchInput.trim();
        if (!q) return;
        setGlobalRiderSearching(true);
        const reqId = `rs_${Date.now()}`;
        await db.ref("/config/rider_search_req").set({ reqId, query: q, requestedAt: Date.now() });
        const resRef = db.ref("/config/rider_search_res");
        const onRes = (snap) => {
          const val = snap.val();
          if (val && val.reqId === reqId) {
            setGlobalRiderResults(Array.isArray(val.results) ? val.results : []);
            setGlobalRiderSearching(false);
            resRef.off("value", onRes);
          }
        };
        resRef.on("value", onRes);
        setTimeout(() => {
          setGlobalRiderSearching(false);
          resRef.off("value", onRes);
        }, 6500);
      };

      // Completed Orders Custom Time Range Fetch
      const handleFetchCompletedCustomRange = async () => {
        const todayStr = getCairoTodayDateStr();
        const fromMs = new Date(`${todayStr}T${compCustomFrom}:00+02:00`).getTime();
        const toMs = new Date(`${todayStr}T${compCustomTo}:59+02:00`).getTime();
        if (Number.isNaN(fromMs) || Number.isNaN(toMs)) {
          notify("يرجى إدخال وقت صحيح");
          return;
        }
        setCompCustomLoading(true);
        const sid = sessionIdRef.current;
        const reqId = `cr_${Date.now()}`;
        await db.ref(`/config/completed_range_reqs/${sid}`).set({
          reqId,
          sessionId: sid,
          dateStr: todayStr,
          fromMs,
          toMs,
          requestedAt: Date.now()
        });
        const resRef = db.ref(`/session_bundles/comp_range_${sid}`);
        const onRes = (snap) => {
          const val = snap.val();
          if (val && val.reqId === reqId) {
            setCompCustomRecords(Array.isArray(val.records) ? val.records : []);
            setCompCustomLoading(false);
            setCompPage(1);
            resRef.off("value", onRes);
          }
        };
        resRef.on("value", onRes);
        setTimeout(() => {
          setCompCustomLoading(false);
          resRef.off("value", onRes);
        }, 12000);
      };

      // Completed Orders Direct ID Lookup when typing digits
      useEffect(() => {
        if (activeTab !== "Completed") return;
        const digits = compSearchInput.trim().replace(/\D/g, "");
        if (digits.length < 7) {
          setCompDirectLookupResult(null);
          return;
        }
        const existsLocally = effectiveCompletedRecords.some((r) => {
          const ord = r?.order || r || {};
          const code = String(ord.confirmation_number || ord.code || "");
          return code.includes(digits);
        });
        if (existsLocally) {
          setCompDirectLookupResult(null);
          return;
        }
        const timer = setTimeout(async () => {
          setCompDirectLookupLoading(true);
          const reqKey = `${digits}_${Date.now()}`;
          await db.ref(`/config/completed_id_reqs/${reqKey}`).set({
            code: digits,
            requestedAt: Date.now()
          });
          const resRef = db.ref(`/session_bundles/comp_id_${digits}`);
          const onRes = (snap) => {
            const val = snap.val();
            if (val && String(val.code) === digits) {
              setCompDirectLookupResult(val);
              setCompDirectLookupLoading(false);
              resRef.off("value", onRes);
            }
          };
          resRef.on("value", onRes);
          setTimeout(() => {
            setCompDirectLookupLoading(false);
            resRef.off("value", onRes);
          }, 6000);
        }, 550);
        return () => clearTimeout(timer);
      }, [compSearchInput, activeTab, effectiveCompletedRecords]);

      // Admin Allowed Emails Listener
      useEffect(() => {
        if (!showEmailsModal || userAccess?.role !== "admin") return;
        const ref = db.ref("/allowed_emails");
        const handler = (snap) => setAllowedEmailsMap(snap.val() || {});
        ref.on("value", handler);
        return () => ref.off("value", handler);
      }, [showEmailsModal, userAccess]);

      // =========================================================================
      // 5) AUTHENTICATION & ACCESS GUARD SCREENS
      // =========================================================================
      if (authLoading || (authUser && !accessChecked)) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
            <div className="bg-white rounded-2xl shadow-lg border border-slate-200 px-8 py-6 text-center space-y-2">
              <div className="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
              <p className="text-sm font-bold text-slate-700">جاري التحقق من الجلسة...</p>
            </div>
          </div>
        );
      }

      if (!authUser) {
        const handleGoogleSignIn = async () => {
          setAuthErrorMsg("");
          try {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: "select_account" });
            await auth.signInWithPopup(provider);
          } catch (err) {
            if (err?.code === "auth/popup-blocked") {
              try {
                await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
                return;
              } catch (redirErr) {
                setAuthErrorMsg(redirErr?.message || "تعذر فتح نافذة تسجيل الدخول");
                return;
              }
            }
            setAuthErrorMsg(err?.message || "حدث خطأ أثناء تسجيل الدخول بحساب Google");
          }
        };

        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
            <div className="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full overflow-hidden">
              <div className="bg-slate-900 px-6 py-5 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <span className="text-3xl">🚴‍♂️</span>
                  <div>
                    <h1 className="text-lg font-extrabold text-white leading-tight">
                      Hurrier Live Operations
                    </h1>
                    <p className="text-xs text-slate-400 mt-0.5">
                      v{APP_VERSION} • Secured Google Access
                    </p>
                  </div>
                </div>
                <span className="px-3 py-1 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-bold">
                  Protected
                </span>
              </div>

              <div className="p-7 text-center space-y-5">
                <div className="space-y-1.5">
                  <h2 className="text-lg font-extrabold text-slate-900">
                    تسجيل الدخول للمتابعة
                  </h2>
                  <p className="text-xs text-slate-500">
                    الدخول مقتصر على حسابات Gmail المصرح لها فقط
                  </p>
                </div>

                <button
                  type="button"
                  onClick={handleGoogleSignIn}
                  className="w-full py-3 px-4 rounded-xl bg-white hover:bg-slate-50 text-slate-800 border border-slate-300 font-bold text-sm shadow-sm transition-colors flex items-center justify-center gap-2.5"
                >
                  <svg className="w-5 h-5" viewBox="0 0 24 24">
                    <path
                      fill="#EA4335"
                      d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"
                    />
                    <path
                      fill="#4285F4"
                      d="M23.5 12.3c0-.8-.1-1.7-.2-2.5H12v4.8h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"
                    />
                    <path
                      fill="#FBBC05"
                      d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 11.2 0 13.5s.6 4.5 1.6 6.5l3.7-2.9z"
                    />
                    <path
                      fill="#34A853"
                      d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.9C3.5 21.1 7.4 24 12 24z"
                    />
                  </svg>
                  <span>Sign in with Google</span>
                </button>

                {authErrorMsg && (
                  <div className="p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold text-right leading-relaxed">
                    {authErrorMsg}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      if (!userAccess) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
            <div className="bg-white rounded-2xl shadow-xl border border-red-200 max-w-md w-full p-7 text-center space-y-4">
              <div className="text-4xl">⛔</div>
              <h2 className="text-lg font-extrabold text-slate-900">غير مصرح لهذا الحساب بالدخول</h2>
              <p className="text-xs text-slate-600">
                البريد <span className="font-bold text-slate-900">{authUser.email}</span> غير مضاف في قائمة الصلاحيات. تواصل مع الأدمن لتفعيل حسابك.
              </p>
              <button
                type="button"
                onClick={() => auth.signOut()}
                className="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800"
              >
                تسجيل الخروج
              </button>
            </div>
          </div>
        );
      }

      // =========================================================================
      // 6) SUB-VIEW RENDERERS
      // =========================================================================
      const isSyncLive = bundleData.updatedAt > 0 && nowTickMs - bundleData.updatedAt < 15000;
      const isAdmin = userAccess.role === "admin";

      const renderDeliveriesTableView = () => {
        const titleMap = {
          Queued: "Queued Deliveries",
          Dispatched: "Dispatched Deliveries",
          Active: "Active Deliveries"
        };
        const totalPages = Math.max(1, Math.ceil(filteredTabOrders.length / PAGE_SIZE));
        const safePage = Math.min(currentPage, totalPages);
        const startIdx = (safePage - 1) * PAGE_SIZE;
        const pageOrders = filteredTabOrders.slice(startIdx, startIdx + PAGE_SIZE);

        const orderedStatusKeys = [
          "accepted",
          "near_pickup",
          "picked_up",
          "left_pickup",
          "near_dropoff",
          "courier_notified",
          "dispatched",
          "queued"
        ];
        const extraStatusKeys = Object.keys(deliveryMetrics.statusCounts).filter(
          (k) => !orderedStatusKeys.includes(k) && deliveryMetrics.statusCounts[k] > 0
        );
        const allStatusKeys = [...orderedStatusKeys, ...extraStatusKeys].filter(
          (k) => (deliveryMetrics.statusCounts[k] || 0) > 0 || statusFilter === k
        );

        const delayedCodes = normalizedTabOrders.filter((o) => o.isDelayed).map((o) => o.code);

        const toggleSelectOrder = (code) => {
          setSelectedOrderCodes((prev) => {
            const next = new Set(prev);
            if (next.has(code)) next.delete(code);
            else next.add(code);
            return next;
          });
        };

        const toggleSelectAllOnPage = () => {
          const allSelected =
            pageOrders.length > 0 && pageOrders.every((o) => selectedOrderCodes.has(o.code));
          setSelectedOrderCodes((prev) => {
            const next = new Set(prev);
            pageOrders.forEach((o) => {
              if (allSelected) next.delete(o.code);
              else next.add(o.code);
            });
            return next;
          });
        };

        return (
          <div className="space-y-3">
            {/* Title & Top Refresh */}
            <div className="flex flex-wrap items-center justify-between gap-3">
              <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                {titleMap[activeTab]} ({deliveryMetrics.total})
              </h1>
              <div className="flex items-center gap-2">
                {selectedOrderCodes.size > 0 && (
                  <button
                    type="button"
                    onClick={() =>
                      copyTextToClipboard(Array.from(selectedOrderCodes).join("\n"), notify)
                    }
                    className="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-sm"
                  >
                    📋 نسخ المحدد ({selectedOrderCodes.size})
                  </button>
                )}
                <button
                  type="button"
                  onClick={() => notify("البيانات تتحدث تلقائياً كل ثانيتين")}
                  className="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-xs font-bold shadow-sm flex items-center gap-1.5"
                >
                  <span>↻</span>
                  <span>Refresh</span>
                </button>
              </div>
            </div>

            {/* Row 1: Primary Category Filter Pills + Delayed Copy + Sort + Page Info */}
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="flex flex-wrap items-center gap-1.5">
                {[
                  { id: "all", label: `All (${deliveryMetrics.total})` },
                  { id: "delayed", label: `Delayed (${deliveryMetrics.delayed})` },
                  { id: "cash", label: `Cash (${deliveryMetrics.cash})` },
                  { id: "card", label: `Card (${deliveryMetrics.card})` },
                  { id: "restaurants", label: `Restaurants (${deliveryMetrics.restaurants})` },
                  {
                    id: "darkstores",
                    label: `Darkstores - Talabat Mart (${deliveryMetrics.darkstores})`
                  },
                  { id: "split", label: `Split Orders (${deliveryMetrics.split})` }
                ].map((pill) => {
                  const active = quickFilter === pill.id;
                  return (
                    <button
                      key={pill.id}
                      type="button"
                      onClick={() => {
                        setQuickFilter(pill.id);
                        setCurrentPage(1);
                      }}
                      className={`px-3.5 py-1.5 rounded-full text-xs font-bold border transition-all ${
                        active
                          ? "bg-blue-600 text-white border-blue-600 shadow-sm"
                          : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"
                      }`}
                    >
                      {pill.label}
                    </button>
                  );
                })}
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  type="button"
                  onClick={() => copyTextToClipboard(delayedCodes.join("\n"), notify)}
                  className="px-3.5 py-1.5 rounded-full bg-red-600 hover:bg-red-700 text-white text-xs font-bold shadow-sm flex items-center gap-1.5"
                >
                  <span>📋</span>
                  <span>نسخ كل المتأخرات ({deliveryMetrics.delayed})</span>
                </button>

                <button
                  type="button"
                  onClick={() => {
                    setSortMode((m) =>
                      m === "default"
                        ? "deadline_asc"
                        : m === "deadline_asc"
                        ? "deadline_desc"
                        : "default"
                    );
                    setCurrentPage(1);
                  }}
                  className="px-3.5 py-1.5 rounded-full bg-white hover:bg-slate-50 border border-slate-200 text-slate-800 text-xs font-bold shadow-sm"
                >
                  {sortMode === "default"
                    ? "Order: Hurrier Default"
                    : sortMode === "deadline_asc"
                    ? "Order: Most Delayed ↑"
                    : "Order: Latest Deadline ↓"}
                </button>

                <span className="text-xs text-slate-500 font-semibold px-1">
                  Page <strong className="text-slate-800">{safePage}</strong> of{" "}
                  <strong className="text-slate-800">{totalPages}</strong> ({PAGE_SIZE} rows • Total{" "}
                  {filteredTabOrders.length})
                </span>
              </div>
            </div>

            {/* Row 2: Live Status Filter Pills Bar (Accepted / Near Pickup / Picked Up / Left Pickup / Near Dropoff) */}
            {allStatusKeys.length > 0 && (
              <div className="flex flex-wrap items-center justify-between gap-2 bg-white px-3.5 py-2.5 rounded-2xl border border-slate-200 shadow-sm">
                <div className="flex flex-wrap items-center gap-1.5">
                  <span className="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mr-1">
                    STATUS:
                  </span>
                  <button
                    type="button"
                    onClick={() => {
                      setStatusFilter("all");
                      setCurrentPage(1);
                    }}
                    className={`px-3 py-1 rounded-full text-xs font-bold border transition-all ${
                      statusFilter === "all"
                        ? "bg-slate-900 text-white border-slate-900 shadow-sm"
                        : "bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100"
                    }`}
                  >
                    All Statuses ({deliveryMetrics.total})
                  </button>

                  {allStatusKeys.map((stKey) => {
                    const stMeta = STATUS_STYLES[stKey] || {
                      label: formatStatusTitle(stKey),
                      dot: "bg-slate-400",
                      pillActive: "bg-blue-600 text-white border-blue-600 shadow-sm",
                      pillIdle: "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"
                    };
                    const isActive = statusFilter === stKey;
                    const cnt = deliveryMetrics.statusCounts[stKey] || 0;
                    return (
                      <button
                        key={stKey}
                        type="button"
                        onClick={() => {
                          setStatusFilter((prev) => (prev === stKey ? "all" : stKey));
                          setCurrentPage(1);
                        }}
                        className={`px-3 py-1 rounded-full text-xs font-bold border transition-all flex items-center gap-1.5 ${
                          isActive ? stMeta.pillActive : stMeta.pillIdle
                        }`}
                      >
                        <span
                          className={`w-2 h-2 rounded-full ${
                            isActive ? "bg-white" : stMeta.dot
                          }`}
                        ></span>
                        <span>
                          {stMeta.label} ({cnt})
                        </span>
                      </button>
                    );
                  })}
                </div>

                {statusFilter !== "all" && (
                  <div className="flex items-center gap-1.5">
                    <button
                      type="button"
                      onClick={() =>
                        copyTextToClipboard(
                          filteredTabOrders.map((o) => o.code).join("\n"),
                          notify
                        )
                      }
                      className="px-3 py-1 rounded-full bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-bold"
                    >
                      📋 نسخ ({filteredTabOrders.length})
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setStatusFilter("all");
                        setCurrentPage(1);
                      }}
                      className="px-2.5 py-1 rounded-full bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 text-xs font-bold"
                    >
                      ✕ مسح الحالة
                    </button>
                  </div>
                )}
              </div>

        const rolling2hCutoff = nowTickMs - 2 * 3600 * 1000;
        const baseRecords =
          compTimeWindow === "custom"
            ? compCustomRecords
            : compTimeWindow === "today"
            ? effectiveCompletedRecords
            : effectiveCompletedRecords.filter((r) => {
                const ms = Number(r?.__completed_at_ms || 0);
                return ms === 0 || ms >= rolling2hCutoff;
              });

        const citiesList = Array.from(
          new Set(
            baseRecords
              .map((r) => r?.order?.drop_off_address?.city || "Cairo")
              .filter(Boolean)
          )
        );

        const q = compSearchInput.trim().toLowerCase();
        const filteredCompleted = baseRecords
          .filter((r) => {
            const ord = r?.order || r || {};
            const city = ord?.drop_off_address?.city || "Cairo";
            if (compCityFilter !== "ALL" && city !== compCityFilter) return false;

            const sps = Array.isArray(r?.starting_points)
              ? r.starting_points.map((s) => (typeof s === "string" ? s : s?.name || ""))
              : Array.isArray(ord?.drop_off_address?.starting_points)
              ? ord.drop_off_address.starting_points.map((s) =>
                  typeof s === "string" ? s : s?.name || ""
                )
              : [];

            if (compZoneFilter !== "ALL" && !sps.includes(compZoneFilter)) return false;

            if (q) {
              const code = String(ord.confirmation_number || ord.code || "");
              const courier = String(
                r?.primary_delivery?.courier_name || r?.courier_name || ""
              );
              const vendor = String(ord.vendor_name || "");
              if (!`${code} ${courier} ${vendor}`.toLowerCase().includes(q)) return false;
            }
            return true;
          })
          .sort(
            (a, b) =>
              Number(b?.__completed_at_ms || 0) - Number(a?.__completed_at_ms || 0)
          );

                            <td className="py-3 px-3 whitespace-nowrap">

                            </td>
                            <td className="py-3 px-3 whitespace-nowrap">

                <span className="text-slate-500 font-semibold">
                  Showing {filteredCompleted.length === 0 ? 0 : (safeCompPage - 1) * PAGE_SIZE + 1}

                  </button>

          </div>

      // =========================================================================

        <div className="min-h-screen flex flex-col lg:flex-row bg-slate-50">

                          }`}
                        >
                          <input
                            type="checkbox"
                            checked={checked}
                            onChange={() =>
                              setDraftZoneIds((prev) =>
                                prev.includes(zid)
                                  ? prev.filter((x) => x !== zid)
                                  : [...prev, zid]
                              )
                            }
                            className="rounded border-slate-300 text-blue-600"
                          />
                          <span className="truncate">{z.name}</span>
                          <span className="text-[10px] text-slate-400 ml-auto">#{zid}</span>
                        </label>
                      );
                    })}
                </div>

                <div className="px-5 py-3.5 border-t border-slate-200 bg-slate-50 flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setShowZoneModal(false)}
                    className="px-4 py-2 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-700"
                  >
                    إلغاء
                  </button>
                  <button
                    type="button"
                    disabled={draftZoneIds.length === 0}
                    onClick={() => {
                      setSelectedZoneIds(draftZoneIds);
                      try {
                        localStorage.setItem(
                          SELECTED_ZONES_STORAGE_KEY,
                          JSON.stringify(draftZoneIds)
                        );
                      } catch {}
                      setShowZoneModal(false);
                      notify(`تم تحديث الزونات (${draftZoneIds.length})`);
                    }}
                    className="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold disabled:opacity-40"
                  >
                    بدء المتابعة لهذه الزونات
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Order Detail & Dispatcher Notes Modal */}
          {orderModalCode && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden">
                <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <h3 className="text-base font-extrabold text-slate-900">
                      Order #{orderModalCode}
                    </h3>
                    <button
                      type="button"
                      onClick={() => copyTextToClipboard(orderModalCode, notify)}
                      className="px-2 py-0.5 rounded-lg bg-slate-100 text-xs font-bold text-slate-700"
                    >
                      نسخ
                    </button>
                  </div>
                  <button
                    type="button"
                    onClick={() => setOrderModalCode("")}
                    className="text-slate-400 hover:text-slate-700 font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-5 overflow-y-auto custom-scrollbar space-y-4 text-xs">
                  {orderModalLoading && !orderModalData ? (
                    <div className="py-8 text-center text-slate-500 font-bold">
                      جاري سحب تفاصيل الأوردر والملاحظات من الهورير...
                    </div>
                  ) : !orderModalData ? (
                    <div className="py-8 text-center text-slate-400 font-bold">
                      لم تصل بيانات إضافية بعد.
                    </div>
                  ) : (
                    (() => {
                      const dOrd =
                        orderModalData?.detail?.order || orderModalData?.detail || {};
                      const notesList = Array.isArray(
                        orderModalData?.notes?.dispatcher_notes
                      )
                        ? orderModalData.notes.dispatcher_notes
                        : Array.isArray(orderModalData?.notes)
                        ? orderModalData.notes
                        : [];
                      return (
                        <>
                          <div className="grid grid-cols-2 gap-3 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                            <div>
                              <span className="text-slate-400 block">Vendor:</span>
                              <strong className="text-slate-900">
                                {dOrd.vendor_name || "—"}
                              </strong>
                            </div>
                            <div>
                              <span className="text-slate-400 block">Status:</span>
                              <strong className="text-blue-700 uppercase">
                                {dOrd.status || "—"}
                              </strong>
                            </div>
                            <div>
                              <span className="text-slate-400 block">Customer:</span>
                              <strong className="text-slate-900">
                                {dOrd.customer_name || "—"}
                              </strong>
                            </div>
                            <div>
                              <span className="text-slate-400 block">Total:</span>
                              <strong className="text-emerald-700">
                                {dOrd.total ? `${(Number(dOrd.total) / 100).toFixed(2)} EGP` : "—"}
                              </strong>
                            </div>
                          </div>

                          <div className="space-y-2">
                            <h4 className="font-extrabold text-slate-800">
                              Dispatcher Notes ({notesList.length})
                            </h4>
                            {notesList.length === 0 ? (
                              <p className="text-slate-400 italic">لا توجد ملاحظات مسجلة.</p>
                            ) : (
                              <div className="space-y-2">
                                {notesList.map((n, i) => (
                                  <div
                                    key={i}
                                    className="p-3 rounded-xl bg-amber-50/70 border border-amber-200"
                                  >
                                    <div className="font-bold text-slate-900">
                                      {n.note || n.comment || n.message || JSON.stringify(n)}
                                    </div>
                                    <div className="text-[11px] text-slate-500 mt-1">
                                      {n.created_by || n.user_email || ""} •{" "}
                                      {n.created_at ? formatCairoTime(n.created_at) : ""}
                                    </div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        </>
                      );
                    })()
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Courier Detail & Balance Modal */}
          {courierModalId && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full overflow-hidden">
                <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
                  <h3 className="text-sm font-extrabold text-slate-900 truncate">
                    {courierModalName || `Courier #${courierModalId}`}
                  </h3>
                  <button
                    type="button"
                    onClick={() => setCourierModalId("")}
                    className="text-slate-400 hover:text-slate-700 font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-5 text-xs space-y-3">
                  {courierModalLoading && !courierModalData ? (
                    <div className="py-6 text-center text-slate-500 font-bold">
                      جاري سحب بيانات الرايدر والمحفظة...
                    </div>
                  ) : !courierModalData?.normalized ? (
                    <div className="py-6 text-center text-slate-400 font-bold">
                      لا توجد تفاصيل إضافية متاحة حالياً.
                    </div>
                  ) : (
                    (() => {
                      const n = courierModalData.normalized;
                      return (
                        <div className="space-y-2.5">
                          <div className="flex justify-between py-1.5 border-b border-slate-100">
                            <span className="text-slate-500">Courier ID / User ID:</span>
                            <strong className="text-slate-900">
                              {n.courierId} / {n.userId || "—"}
                            </strong>
                          </div>
                          <div className="flex justify-between py-1.5 border-b border-slate-100">
                            <span className="text-slate-500">Phone:</span>
                            <strong className="text-blue-600">{n.phone || "—"}</strong>
                          </div>
                          <div className="flex justify-between py-1.5 border-b border-slate-100">
                            <span className="text-slate-500">Status:</span>
                            <strong className="uppercase text-emerald-700">
                              {n.status || "—"}
                            </strong>
                          </div>
                          <div className="flex justify-between py-1.5 border-b border-slate-100">
                            <span className="text-slate-500">Vehicle / Contract:</span>
                            <strong className="text-slate-800">
                              {n.vehicle || "—"} • {n.contract || "—"}
                            </strong>
                          </div>
                          <div className="flex justify-between py-1.5">
                            <span className="text-slate-500">Balance:</span>
                            <strong className="text-amber-700 text-sm">
                              {n.balance !== null && n.balance !== undefined
                                ? `${n.balance} EGP`
                                : "—"}
                            </strong>
                          </div>
                        </div>
                      );
                    })()
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Admin Allowed Emails Modal */}
          {showEmailsModal && isAdmin && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full max-h-[85vh] flex flex-col overflow-hidden">
                <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
                  <h3 className="text-base font-extrabold text-slate-900">
                    🛡️ إدارة الإيميلات المصرح لها
                  </h3>
                  <button
                    type="button"
                    onClick={() => setShowEmailsModal(false)}
                    className="text-slate-400 hover:text-slate-700 font-bold"
                  >
                    ✕
                  </button>
                </div>

                <form
                  onSubmit={async (e) => {
                    e.preventDefault();
                    const em = newAdminEmail.trim().toLowerCase();
                    if (!em) return;
                    const key = emailToFirebaseKey(em);
                    await db.ref(`/allowed_emails/${key}`).set({
                      email: em,
                      name: newAdminName.trim() || em,
                      role: newAdminRole,
                      addedAt: Date.now()
                    });
                    setNewAdminEmail("");
                    setNewAdminName("");
                    notify("تمت إضافة الحساب بنجاح");
                  }}
                  className="p-4 border-b border-slate-100 space-y-2 bg-slate-50"
                >
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <input
                      type="email"
                      required
                      value={newAdminEmail}
                      onChange={(e) => setNewAdminEmail(e.target.value)}
                      placeholder="Gmail..."
                      className="px-3 py-1.5 rounded-xl border border-slate-200 text-xs bg-white"
                    />
                    <input
                      type="text"
                      value={newAdminName}
                      onChange={(e) => setNewAdminName(e.target.value)}
                      placeholder="الاسم..."
                      className="px-3 py-1.5 rounded-xl border border-slate-200 text-xs bg-white"
                    />
                    <select
                      value={newAdminRole}
                      onChange={(e) => setNewAdminRole(e.target.value)}
                      className="px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold bg-white"
                    >
                      <option value="employee">Employee (عرض)</option>
                      <option value="admin">Admin (تغذية + تحكم)</option>
                    </select>
                  </div>
                  <button
                    type="submit"
                    className="w-full py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold"
                  >
                    + إضافة الإيميل
                  </button>
                </form>

                <div className="p-4 overflow-y-auto custom-scrollbar divide-y divide-slate-100 text-xs flex-1">
                  {Object.entries(allowedEmailsMap).map(([k, item]) => (
                    <div key={k} className="py-2.5 flex items-center justify-between gap-2">
                      <div>
                        <div className="font-bold text-slate-900">{item.email}</div>
                        <div className="text-[11px] text-slate-500">
                          {item.name} •{" "}
                          <strong
                            className={
                              item.role === "admin" ? "text-emerald-700" : "text-blue-700"
                            }
                          >
                            {item.role}
                          </strong>
                        </div>
                      </div>
                      {item.email !== authUser.email?.toLowerCase() && (
                        <button
                          type="button"
                          onClick={() => db.ref(`/allowed_emails/${k}`).remove()}
                          className="px-2.5 py-1 rounded-lg bg-red-50 text-red-700 font-bold"
                        >
                          حذف
                        </button>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Online Viewers Modal */}
          {showViewersModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full overflow-hidden">
                <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
                  <h3 className="text-sm font-extrabold text-slate-900">
                    👥 المتصلون حالياً ({bundleData.activeViewers.length})
                  </h3>
                  <button
                    type="button"
                    onClick={() => setShowViewersModal(false)}
                    className="text-slate-400 hover:text-slate-700 font-bold"
                  >
                    ✕
                  </button>
                </div>
                <div className="p-4 divide-y divide-slate-100 text-xs max-h-80 overflow-y-auto">
                  {bundleData.activeViewers.map((v) => (
                    <div key={v.sessionId} className="py-2.5 flex items-center justify-between">
                      <div>
                        <div className="font-bold text-slate-900">{v.employeeName}</div>
                        <div className="text-[11px] text-slate-500">{v.email}</div>
                      </div>
                      <span className="px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700 font-bold">
                        {v.zoneCount} Zones • {v.activeTab}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
