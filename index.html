    function isRealHurrierZoneId(id) {
      const n = Number(id);
      return Number.isInteger(n) && n >= 10000 && n < 90000;
    }

    function normalizeText(v) {
      return String(v || "")
        .replace(/&#39;/g, "'")
        .replace(/&amp;/g, "&")
        .replace(/&quot;/g, '"')
        .replace(/\s+/g, " ")
        .trim();
    }

    function isTalabatMartVendor(vendorName) {
      const s = normalizeText(vendorName).toLowerCase();
      return s.includes("talabat mart") || s.includes("طلبات مارت") || s.includes("tmart");
    }

    function extractMartBranchLabel(vendorName) {
      const raw = normalizeText(vendorName);
      if (!raw) return "Unknown Mart";
      const cleaned = raw
        .replace(/^vo\s*#?\d+\s*-\s*/i, "")
        .replace(/^talabat\s*mart\s*,?\s*/i, "")
        .replace(/^طلبات\s*مارت\s*,?\s*/i, "")
        .replace(/^tmart\s*,?\s*/i, "")
        .trim();
      return cleaned || raw;
    }

    function isExactOrderIdPattern(q) {
      const clean = String(q || "")
        .trim()
        .replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "")
        .trim();
      return /^\d{7,14}(-\d+)?$/.test(clean);
    }

    function normalizePhoneDigits(rawStr) {
      const digits = String(rawStr || "").replace(/\D/g, "");
      if (!digits) return { rawDigits: "", core10: "" };
      let core = digits;
      if (core.startsWith("0020") && core.length >= 13) {
        core = core.slice(4);
      } else if (core.startsWith("20") && core.length === 12 && core[2] === "1") {
        core = core.slice(2);
      } else if (core.startsWith("0") && core.length === 11 && core[1] === "1") {
        core = core.slice(1);
      }
      const core10 = core.length === 10 && core.startsWith("1") ? core : "";
      return { rawDigits: digits, core10 };
    }

    function isPhoneLikeQuery(q) {
      const trimmed = String(q || "").trim();
      if (!trimmed) return false;
      const { rawDigits, core10 } = normalizePhoneDigits(trimmed);
      if (core10.length === 10) return true;
      return rawDigits.length >= 9 && /^(\+?20|0020|01)/.test(trimmed.replace(/[\s\-()]+/g, ""));
    }

    function isRiderIdLikeQuery(q) {
      const trimmed = String(q || "").trim();
      if (!trimmed || isPhoneLikeQuery(trimmed)) return false;
      if (/^\d{3,9}$/.test(trimmed)) return true;
      if (/^\d{10}$/.test(trimmed) && !trimmed.startsWith("47")) return true;
      return false;
    }

    function formatRelativeDeadline(isoDate, isPreorder = false) {
      if (!isoDate) return "-";
      const target = new Date(isoDate);
      if (Number.isNaN(target.getTime())) return "-";
      if (isPreorder) {
        return target.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      }
      const diffMins = Math.round((target.getTime() - Date.now()) / 60000);
      const absMins = Math.abs(diffMins);
      const sign = diffMins < 0 ? "-" : "";
      if (absMins >= 60) {
        const h = Math.floor(absMins / 60);
        const m = absMins % 60;
        return `${sign}${h}h ${m}min`;
      }
      return `${sign}${absMins}min`;
    }

    function formatDiffBetweenIsos(scheduledIso, estimatedIso) {
      if (!scheduledIso || !estimatedIso) return "";
      const s = new Date(scheduledIso).getTime();
      const e = new Date(estimatedIso).getTime();
      if (Number.isNaN(s) || Number.isNaN(e)) return "";
      const diffMins = Math.round((s - e) / 60000);
      return `${diffMins}min`;
    }

    function formatReadableTimestamp(isoDate) {
      if (!isoDate) return "-";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleString("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatShortTimeOnly(isoDate) {
      if (!isoDate) return "-";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatExactTimeSeconds(val) {
      if (!val) return "-";
      const d = typeof val === "number" ? new Date(val > 1e12 ? val : val * 1000) : new Date(val);
      if (Number.isNaN(d.getTime())) return String(val);
      return d.toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });
    }

    function formatShortEstTime(val) {
      if (!val) return "-";
      const d = typeof val === "number" ? new Date(val > 1e12 ? val : val * 1000) : new Date(val);
      if (Number.isNaN(d.getTime())) return String(val);
      return d.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatSinceTimestamp(isoDate) {
      if (!isoDate) return "";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "";
      const dayPart = d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
      const timePart = d
        .toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: true })
        .toLowerCase();
      return `Since ${dayPart} ${timePart}`;
    }

    function formatDurationSecondsToMin(secondsVal) {
      if (secondsVal === null || secondsVal === undefined || secondsVal === "") return "-";
      const s = Number(secondsVal);
      if (Number.isNaN(s)) return String(secondsVal);
      return `${Math.round(s / 60)}m`;
    }

    function formatCompletedTimingSeconds(secondsVal) {
      if (secondsVal === null || secondsVal === undefined || secondsVal === "") return "-";
      const totalSec = Math.round(Number(secondsVal));
      if (Number.isNaN(totalSec)) return String(secondsVal);
      const absSec = Math.abs(totalSec);
      const sign = totalSec < 0 ? "-" : "";
      if (absSec < 60) return `${sign}${absSec}s`;
      const mins = Math.floor(absSec / 60);
      const remSec = absSec % 60;
      if (mins >= 60) {
        const hrs = Math.floor(mins / 60);
        const remMin = mins % 60;
        return `${sign}${hrs}h ${remMin}m`;
      }
      return remSec > 0 ? `${sign}${mins}m ${remSec}s` : `${sign}${mins}m`;
    }

    function humanizeSnakeCase(str) {
      return String(str || "")
        .split("_")
        .map((w) => (w ? w.charAt(0).toUpperCase() + w.slice(1) : ""))
        .join(" ")
        .trim();
    }

    function formatPiastersMoney(val, currency = "EGP") {
      if (val === null || val === undefined || val === "") return "-";
      if (typeof val === "string" && /[A-Z]{3}|\$/.test(val)) return val;
      const num = Number(val);
      if (Number.isNaN(num)) return String(val);
      return `${(num / 100).toFixed(2)} ${currency}`;
    }

    function extractCompletedTimestampFromRec(rec) {
      if (rec?.__completed_at_ms && Number(rec.__completed_at_ms) > 0) {
        return Number(rec.__completed_at_ms);
      }
      const order = rec?.order || {};
      const primaryDel = rec?.primary_delivery || {};
      const timings = rec?.primary_delivery_timings || {};

      const candidates = [
        primaryDel.completed_at,
        primaryDel.delivered_at,
        primaryDel.dropped_off_at,
        primaryDel.finished_at,
        timings.completed_at,
        timings.delivered_at,
        timings.dropped_off_at,
        order.current_state_transition,
        order.completed_at,
        order.delivered_at,
        order.dropped_off_at,
        order.finished_at,
        rec?.completed_at,
        rec?.delivered_at,
        rec?.dropped_off_at
      ];

      for (const val of candidates) {
        if (val) {
          const ms = typeof val === "number" ? (val > 1e12 ? val : val * 1000) : new Date(val).getTime();
          if (!Number.isNaN(ms) && ms > 0) return ms;
        }
      }

      const placedMs = order.placed_at ? new Date(order.placed_at).getTime() : 0;
      const rawTotalTime = Number(timings.total_time);
      if (placedMs > 0 && !Number.isNaN(rawTotalTime) && rawTotalTime > 0) {
        const durationMs = rawTotalTime < 240 ? rawTotalTime * 60 * 1000 : rawTotalTime * 1000;
        return placedMs + durationMs;
      }

      if (order.updated_at) {
        const updMs = new Date(order.updated_at).getTime();
        if (!Number.isNaN(updMs) && updMs > 0) return updMs;
      }
      return 0;
    }

    function mapHurrierCompletedRecord(rec) {
      const order = rec?.order || {};
      const primaryDel = rec?.primary_delivery || {};
      const timings = rec?.primary_delivery_timings || {};
      const dropoff = order.drop_off_address || order.dropoff_address || {};
      const sps = Array.isArray(dropoff.starting_points)
        ? dropoff.starting_points
        : Array.isArray(rec?.starting_points)
        ? rec.starting_points
        : [];
      const zonesList = sps
        .map((sp) => (typeof sp === "string" ? sp : sp?.name))
        .filter(Boolean);

      const codeStr = String(
        order.confirmation_number ||
          order.code ||
          String(order.order_code || "").replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "") ||
          order.id ||
          ""
      ).trim();

      const completedTimestamp = extractCompletedTimestampFromRec(rec);
      const completedAtFormatted = completedTimestamp > 0 ? formatExactTimeSeconds(completedTimestamp) : "-";
      const rawTotalTime = Number(timings.total_time);
      const totalDurationSec =
        !Number.isNaN(rawTotalTime) && rawTotalTime > 0
          ? rawTotalTime < 240
            ? rawTotalTime * 60
            : rawTotalTime
          : timings.total_time;

      const distMeters = Number(primaryDel.delivery_distance ?? rec?.distance ?? 0);

      return {
        uid: `Completed-${order.id || codeStr}`,
        id: codeStr || "-",
        orderCode: order.order_code || (codeStr ? `HF_EG${codeStr}` : "-"),
        vo: String(order.vendor_order_number || "-"),
        city: normalizeText(dropoff.city || dropoff.city_name || "Cairo"),
        zone: zonesList.length > 0 ? zonesList.join(", ") : "Unknown Zone",
        zonesList,
        courier: normalizeText(primaryDel.courier_name || "-"),
        courierId: primaryDel.courier_id ? String(primaryDel.courier_id) : "",
        vendor: normalizeText(order.vendor_name || order.featured_business?.name || "Vendor"),
        distance: distMeters > 0 ? `${(distMeters / 1000).toFixed(2)} km` : "-",
        acceptTime: formatCompletedTimingSeconds(timings.accepting_time),
        retailerLate: formatCompletedTimingSeconds(timings.vendor_late),
        courierLate: formatCompletedTimingSeconds(timings.courier_late),
        waitTime: formatCompletedTimingSeconds(timings.wait_pickup_time),
        deliveryLate: formatCompletedTimingSeconds(timings.delivery_late),
        timeInBag: formatCompletedTimingSeconds(timings.time_in_bag),
        orderDuration: formatCompletedTimingSeconds(totalDurationSec),
        isPreorder: Boolean(order.is_preorder),
        dropoffIssue: normalizeText(order.deliveries_dropoff_issues || "-"),
        placedTimestamp: order.placed_at ? new Date(order.placed_at).getTime() : 0,
        completedTimestamp,
        completedAtFormatted,
        rawRecord: rec
      };
    }

    function mapHurrierDeliveryRecord(rec, tabName, sourceOrderIndex = 0) {
      const order = rec?.order || {};
      const codeStr = String(
        order.code ||
          order.confirmation_number ||
          String(order.order_code || "").replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "") ||
          order.id ||
          ""
      ).trim();

      const sps = Array.isArray(rec?.starting_points)
        ? rec.starting_points
        : Array.isArray(order.starting_points)
        ? order.starting_points
        : [];
      const zonesList = sps
        .map((sp) => (typeof sp === "string" ? sp : sp?.name))
        .filter(Boolean);

      const rawStatus = String(rec?.status || order.status || tabName || "active").toLowerCase();
      const statusLabel = humanizeSnakeCase(rawStatus);
      const isPreorder = tabName === "Pre-order" || Boolean(order.is_pre_order || order.is_preorder);
      const deadlineIso = order.scheduled_dropoff_at || order.promised_delivery_time || order.scheduled_pickup_at;

      const tags = Array.isArray(order.tags) ? order.tags : [];
      const instructions = [];
      if (order.is_cash_collection) instructions.push("Cash");
      else if (order.is_card_on_delivery) instructions.push("Card");
      else instructions.push("Online");

      const vType = String(order.vertical_type || "").toLowerCase();
      if (vType === "darkstores" || isTalabatMartVendor(order.vendor_name)) {
        instructions.push("Darkstores");
      } else if (vType) {
        instructions.push(humanizeSnakeCase(vType));
      }

      const distMeters = Number(rec?.distance ?? 0);
      const valPiasters = Number(order.order_value ?? 0);

      let courierDisplay = normalizeText(rec?.courier_name || "");
      if (!courierDisplay) {
        if (rawStatus === "queued" || rawStatus === "pending") courierDisplay = "Assigning...";
        else if (rawStatus === "courier_notified") courierDisplay = "Pending Acceptance";
        else courierDisplay = "-";
      }

      return {
        uid: `${tabName}-${rec?.id || order.id || codeStr}`,
        id: codeStr || "-",
        orderCode: order.order_code || (codeStr ? `HF_EG${codeStr}` : "-"),
        vo: String(order.vendor_order_number || "-"),
        status: statusLabel,
        tab: tabName,
        deadline: formatRelativeDeadline(deadlineIso, isPreorder),
        courier: courierDisplay,
        courierId: rec?.courier_id ? String(rec.courier_id) : "",
        time_in: rec?.time_in_status ? formatDurationSecondsToMin(rec.time_in_status) : "-",
        time_at: order.scheduled_pickup_at ? formatShortTimeOnly(order.scheduled_pickup_at) : "-",
        zone: zonesList.length > 0 ? zonesList.join(", ") : "Unknown Zone",
        zonesList,
        distance: distMeters > 0 ? `${(distMeters / 1000).toFixed(2)} km` : "-",
        orderValue: valPiasters > 0 ? formatPiastersMoney(valPiasters) : "-",
        vendor: normalizeText(order.vendor_name || "Vendor"),
        instructions,
        isSplit: tags.includes("split_order") || rec?.is_primary === false,
        placedTimestamp: order.send_to_restaurant_at ? new Date(order.send_to_restaurant_at).getTime() : 0,
        sourceOrderIndex,
        rawRecord: rec
      };
    }

    function mapHurrierIssueRecord(iss, idx) {
      const orderCode = String(iss?.order_code || iss?.code || "").replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "").trim();

    function buildFullOrderDetailsView(baseOrder, apiDetailDoc) {
      if (!baseOrder) return null;
      const rawRec = baseOrder.rawRecord || {};
      const baseOrd = rawRec.order || {};
      const apiOrder = apiDetailDoc?.order || {};
      const ord = { ...baseOrd, ...apiOrder };

      const pickupAddr = ord.pickup_address || {};
      const dropoffAddr = ord.drop_off_address || ord.dropoff_address || {};
      const cust = ord.customer || {};
      const vendorObj = ord.vendor || {};
      const detailObj = ord.detail || {};
      const estObj = ord.estimations || {};
      const timingObj = ord.timing || {};

      const tags = Array.isArray(ord.tags) ? ord.tags : [];
      const orderBadges = [];
      if (ord.is_cash_collection || baseOrder.instructions?.includes("Cash")) orderBadges.push("Cash");
      else if (ord.is_card_on_delivery || baseOrder.instructions?.includes("Card")) orderBadges.push("Card");
      if (tags.includes("proof_of_pickup")) orderBadges.push("Proof of pickup");
      if (tags.includes("large_order")) orderBadges.push("Large order");
      if (ord.is_pre_order || ord.is_preorder || baseOrder.isPreorder) orderBadges.push("Pre-order");
      if (baseOrder.isSplit || tags.includes("split_order")) orderBadges.push("Split");

      const apiDeliveries = Array.isArray(apiDetailDoc?.deliveries) ? apiDetailDoc.deliveries : [];
      const rawDeliveries =
        apiDeliveries.length > 0
          ? apiDeliveries
          : rawRec.id
          ? [rawRec]
          : rawRec.primary_delivery
          ? [
              {
                id: ord.order_id || ord.id || baseOrder.id,
                status: ord.status || baseOrder.status,
                courier_id: rawRec.primary_delivery.courier_id,
                courier_name: rawRec.primary_delivery.courier_name,
                utilization: ord.utilization,
                starting_points: dropoffAddr.starting_points || []
              }
            ]
          : [];

      const structuredDeliveries = rawDeliveries.map((del, dIdx) => {
        const sps = Array.isArray(del.starting_points) ? del.starting_points : [];
        const zStr = sps.map((sp) => (typeof sp === "string" ? sp : sp?.name)).filter(Boolean).join(", ") || baseOrder.zone;
        const transitions = Array.isArray(del.transitions) ? del.transitions : [];

        const events = transitions.map((tr, tIdx) => {
          const toState = String(tr.to_state || tr.event_type || "event").toLowerCase();
          const meta = tr.metadata || {};
          const loc = tr.courier_location || {};
          const locUrl =
            loc.latitude && loc.longitude
              ? `https://www.google.com/maps?q=${encodeURIComponent(loc.latitude)},${encodeURIComponent(loc.longitude)}`
              : "";

          const estDropArr = meta.estimated_dropoff_arrival_at || tr.estimated_drop_off_arrival_at;
          const estDropDep = meta.estimated_dropoff_departure_at || tr.estimated_drop_off_departure_at;
          const schedDrop = tr.scheduled_drop_off_at || timingObj.scheduled_drop_off_at || ord.scheduled_dropoff_at;

          const subParts = [];
          if (tr.dispatch_type) subParts.push(humanizeSnakeCase(tr.dispatch_type));
          if (tr.un_dispatch_type) subParts.push(`Reason: ${humanizeSnakeCase(tr.un_dispatch_type)}`);
          if (meta.reason) subParts.push(String(meta.reason));

          return {
            key: tr.id || `${dIdx}-${tIdx}`,
            timeSec: tr.created_at ? formatExactTimeSeconds(tr.created_at) : "-",
            eventLabel: humanizeSnakeCase(toState),
            subLabel: subParts.join(" • "),
            isRemoved: toState.includes("un_dispatch") || toState.includes("cancel") || toState.includes("reject"),
            isAccepted: toState === "accepted" || toState === "completed" || toState === "picked_up",
            courierName: normalizeText(tr.courier_name || (toState === "queued" ? "-" : del.courier_name || "-")),
            courierId: tr.courier_id ? String(tr.courier_id) : del.courier_id ? String(del.courier_id) : "",
            locUrl,
            estAcceptTime: formatShortEstTime(meta.expected_accept_time || tr.expected_accept_time),
            estPickupArrival: formatShortEstTime(meta.estimated_pickup_arrival_at || tr.estimated_pickup_arrival_at),
            estPickupDeparture: formatShortEstTime(meta.estimated_pickup_departure_at || tr.estimated_pickup_departure_at),
            estDropoffArrival: formatShortEstTime(estDropArr),
            estDropoffDeparture: formatShortEstTime(estDropDep),
            estDropoffDelta: formatDiffBetweenIsos(schedDrop, estDropDep)
          };
        });

        return {
          id: del.id || `${baseOrder.id}-${dIdx + 1}`,
          status: humanizeSnakeCase(del.status || baseOrder.status),
          zones: zStr,
          courier: normalizeText(del.courier_name || baseOrder.courier || "-"),
          courierId: del.courier_id ? String(del.courier_id) : baseOrder.courierId || "",
          utilization: del.utilization !== undefined && del.utilization !== null ? `${del.utilization}%` : "-",
          events
        };
      });

      const rawItems = Array.isArray(detailObj.order_items) ? detailObj.order_items : [];
      let totalQty = 0;
      const items = rawItems.map((it, idx) => {
        const q = Number(it.quantity || 1);
        totalQty += q;
        return {
          id: it.id || idx,
          name: normalizeText(it.item || it.name || "Item"),
          quantity: q,
          volume: it.volume !== undefined && it.volume !== null ? Number(it.volume).toFixed(2) : "-",
          weight: it.weight !== undefined && it.weight !== null ? Number(it.weight).toFixed(2) : "-",
          priceFormatted: formatPiastersMoney(it.price)
        };
      });

      const itemsSummary = {
        totalQty,
        totalVolume: ord.total_volume !== undefined ? Number(ord.total_volume).toFixed(2) : "-",
        totalWeight: ord.total_weight !== undefined ? Number(ord.total_weight).toFixed(2) : "-",
        subtotal: formatPiastersMoney(ord.subtotal),
        deliveryFee: formatPiastersMoney(ord.delivery_fee),
        total: formatPiastersMoney(ord.order_value ?? ord.total),
        payAtPickup: formatPiastersMoney(detailObj.cod_pay_at_pickup ?? 0),
        collectAtDropoff: formatPiastersMoney(detailObj.cod_collect_at_drop_off ?? 0),
        deliveryBags: ord.total_bags ?? "-"
      };

      const rawNotes = Array.isArray(apiDetailDoc?.dispatcher_notes) ? apiDetailDoc.dispatcher_notes : [];
      const notes = rawNotes.map((n, idx) => ({
        id: n.id || idx,
        author: normalizeText(n.created_by || n.author || n.user_email || "Dispatcher"),
        createdAt: formatReadableTimestamp(n.created_at),
        text: String(n.note || n.text || n.content || "")
      }));

      const timeChecks = [
        { label: "Placed at", value: formatReadableTimestamp(ord.placed_at) },
        { label: "Sent to vendor", value: formatReadableTimestamp(ord.send_to_restaurant_at || ord.sent_to_vendor_at) },
        { label: "Confirmed by vendor", value: formatReadableTimestamp(ord.restaurant_confirmed_at || ord.accepted_by_vendor_at) },
        { label: "Food is ready", value: formatReadableTimestamp(ord.food_is_ready_at) },
        { label: "Scheduled pickup", value: formatReadableTimestamp(timingObj.scheduled_pickup_at || ord.scheduled_pickup_at) },
        { label: "Promised delivery", value: formatReadableTimestamp(estObj.promised_delivery_time || ord.scheduled_dropoff_at) },
        { label: "Completed / Transition", value: formatReadableTimestamp(ord.current_state_transition || ord.completed_at) }
      ];

      return {
        ...baseOrder,
        isLoadedFromApi: Boolean(apiDetailDoc),
        orderBadges,
        statusSinceStr: formatSinceTimestamp(ord.current_state_transition),
        platformName: ord.platform || "TB_OT",
        globalEntityId: ord.global_entity_id || "HF_EG",
        vendorCode: vendorObj.vendor_code || ord.vendor_code || "-",
        vendorOrderNo: vendorObj.vendor_order_number || ord.vendor_order_number || baseOrder.vo || "-",
        orderValue: formatPiastersMoney(ord.order_value ?? ord.total) !== "-" ? formatPiastersMoney(ord.order_value ?? ord.total) : baseOrder.orderValue,
        prepDurationStr: detailObj.prep_duration ? formatDurationSecondsToMin(detailObj.prep_duration) : "-",
        courierDelayStr:
          ord.estimated_courier_delay !== undefined && ord.estimated_courier_delay !== null
            ? `${ord.estimated_courier_delay}m`
            : "-",
        customerUpdatedStr: dropoffAddr.updated_at ? formatReadableTimestamp(dropoffAddr.updated_at) : "-",
        vendorName: normalizeText(vendorObj.vendor_name || ord.vendor_name || ord.restaurant_name || baseOrder.vendor),
        pickupAddress: normalizeText(pickupAddr.street_address || pickupAddr.address_line_1 || "-"),
        pickupAreaBanner: normalizeText(pickupAddr.special_instructions || ""),
        customerName: normalizeText(cust.customer_name || ord.customer_name || "Customer"),
        customerPhone: normalizeText(cust.customer_phone_number || ord.customer_phone || ""),
        dropoffAddress: normalizeText(dropoffAddr.street_address || dropoffAddr.address_line_1 || "-"),
        building: normalizeText(dropoffAddr.building || "-"),
        floor: normalizeText(dropoffAddr.floor || "-"),
        apartment: normalizeText(dropoffAddr.apartment_number || "-"),
        intercom: normalizeText(dropoffAddr.intercom || "-"),
        entrance: normalizeText(dropoffAddr.entrance || "-"),
        deliveryNote: normalizeText(dropoffAddr.special_instructions || ""),
        structuredDeliveries,
        orderIssues: Array.isArray(apiDetailDoc?.order_issues) ? apiDetailDoc.order_issues : [],
        items,
        itemsSummary,
        timeChecks,
        notes
      };
    }

    function buildFullCourierDetailsView(baseCourier, apiCourierDoc) {
      if (!baseCourier) return null;
      const c = apiCourierDoc?.courier || {};
      const statusMeta = apiCourierDoc?.status_meta_data || c.status_meta_data || {};

        performedBy: normalizeText(statusMeta.performed_by || ""),

        contract: contractStr || "-",

        phone: normalizeText(c.phone_number || c.phone || c.mobile || baseCourier.phone || ""),
        fleetId: String(c.fleet_id || baseCourier.fleetId || "-")
      };
    }

      const copyToClipboard = useCallback((key, text) => {
        const val = String(text || "");
        if (!val) return;
        try {
          const ta = document.createElement("textarea");
          ta.value = val;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          setCopiedText(key);
          setTimeout(() => setCopiedText((prev) => (prev === key ? "" : prev)), 2000);
        } catch {}
      }, []);

        return "";

        async (method, path, body = null) => {
          const token = await getFreshIdToken();
          const cleanPath = String(path || "").replace(/^\/+/, "");
          const url = `${FIREBASE_DB_URL}/${cleanPath}.json${token ? `?auth=${encodeURIComponent(token)}` : ""}`;
          const res = await fetch(url, {
            method,
            headers: body !== null ? { "Content-Type": "application/json" } : {},
            body: body !== null ? JSON.stringify(body) : undefined
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);

      // Initialize Firebase Auth & Check Whitelist

        if (!firebaseApiKey) {

          return;

        try {
          if (!firebase.apps.length) {
            firebase.initializeApp({
              apiKey: firebaseApiKey,
              authDomain: FIREBASE_AUTH_DOMAIN,
              projectId: FIREBASE_PROJECT_ID,
              databaseURL: FIREBASE_DB_URL
            });
          }
        } catch (err) {
          setAuthErrorMsg(err?.message || "Firebase init error");
          setAuthState("signed_out");
          return;
        }

        const unsub = firebase.auth().onAuthStateChanged(async (user) => {
          if (!user || !user.email) {
            setCurrentUser(null);
            setAuthState("signed_out");
            try {
              window.localStorage.removeItem(AUTH_BRIDGE_STORAGE_KEY);
            } catch {}
            return;
          }

          setCurrentUser(user);
          setAuthState("checking");
          try {
            const idToken = await user.getIdToken(true);
            const emailKey = emailToFirebaseKey(user.email);
            const resp = await fetch(
              `${FIREBASE_DB_URL}/allowed_emails/${encodeURIComponent(emailKey)}.json?auth=${encodeURIComponent(idToken)}`
            );
            const allowedEntry = resp.ok ? await resp.json() : null;

            if (!allowedEntry || typeof allowedEntry !== "object") {
              setAuthState("unauthorized");
              try {
                window.localStorage.removeItem(AUTH_BRIDGE_STORAGE_KEY);
              } catch {}
              return;
            }

            const role = allowedEntry.role === "admin" ? "admin" : "employee";
            setUserRole(role);
            setAuthState("authorized");

            if (role === "admin") {
              const bridgePayload = JSON.stringify({
                email: user.email,
                role: "admin",
                idToken,
                refreshToken: user.refreshToken || "",
                apiKey: firebaseApiKey,
                expiresAt: Date.now() + 55 * 60 * 1000
              });
              try {
                window.localStorage.setItem(AUTH_BRIDGE_STORAGE_KEY, bridgePayload);
              } catch {}
            } else {
              try {
                window.localStorage.removeItem(AUTH_BRIDGE_STORAGE_KEY);
              } catch {}
            }
          } catch (err) {
            setAuthErrorMsg(err?.message || "فشل التحقق من الصلاحيات");
            setAuthState("signed_out");
          }
        });

        return () => unsub();
      }, [firebaseApiKey]);

      // Persist zone preferences

      }, [selectedZoneIds, isZoneSetupConfirmed, employeeName]);

      const allAvailableZones = useMemo(() => {

      const filteredZonesForModal = useMemo(() => {

      const handleConfirmZoneSelection = () => {

      // Session Heartbeat & Live Bundle Polling (every 2s)
      const fetchMySessionBundleFromFirebase = useCallback(async () => {
        if (authState !== "authorized" || !isZoneSetupConfirmed || selectedZoneIds.length === 0) return;
        const sid = sessionIdRef.current;
        try {
          const bundle = await fbFetch("GET", `session_bundles/${sid}`);
          if (!bundle || typeof bundle !== "object") {
            setConnectionStatus("connecting");
            return;
          }

          if (Array.isArray(bundle.discoveredZonesList) && bundle.discoveredZonesList.length > 0) {
            setDiscoveredZones(bundle.discoveredZonesList);
          }
          if (bundle.stats) setHurrierStats(bundle.stats);
          if (Array.isArray(bundle.dispatchers)) setDispatchersList(bundle.dispatchers);

          const rawIssues = Array.isArray(bundle.issues?.issues)
            ? bundle.issues.issues
            : Array.isArray(bundle.issues)
            ? bundle.issues
            : [];
          setIssuesList(rawIssues.map((iss, idx) => mapHurrierIssueRecord(iss, idx)));

          const mergedDeliveries = [];
          const tabSources = [
            { key: "active", tab: "Active" },
            { key: "queued", tab: "Queued" },
            { key: "dispatched", tab: "Dispatched" },
            { key: "actionable", tab: "Actionable" },
            { key: "preorder", tab: "Pre-order" },
            { key: "waitingAssembly", tab: "Waiting for Assembly" }
          ];

          const newCouriersMeta = {};
          tabSources.forEach(({ key, tab }) => {

                  courierId: mapped.courierId,
                  name: mapped.courier

          setDeliveries(mergedDeliveries);

          const compRecs = Array.isArray(bundle.completed?.records) ? bundle.completed.records : [];
          const mappedCompleted = compRecs.map((r) => {
            const m = mapHurrierCompletedRecord(r);
            if (m.courierId && m.courier && m.courier !== "-") {
              newCouriersMeta[m.courierId] = {
                courierId: m.courierId,
                name: m.courier

            return m;

          setCompletedOrders(mappedCompleted);
          setIsCompletedLoading(false);

          if (Object.keys(newCouriersMeta).length > 0) {

          setConnectionStatus("error");

          } catch {}

          try {
            const delId = orderItem.rawRecord?.id || "";
            const token = `${cleanId}|${delId}`;
            const cur = (await fbFetch("GET", "config/requested_order_details").catch(() => [])) || [];
            const next = Array.from(new Set([...(Array.isArray(cur) ? cur : []), token]));
            await fbFetch("PUT", "config/requested_order_details", next);

            setTimeout(async () => {
              const doc = await fbFetch("GET", `order_details/${encodeURIComponent(cleanId)}`).catch(() => null);
              if (doc && typeof doc === "object") {
                setOrderDetailsMap((prev) => ({ ...prev, [cleanId]: doc }));

        },
        [orderDetailsMap, fbFetch]

            const cachedDoc = await fbFetch("GET", `courier_details/${encodeURIComponent(key)}`);
            if (cachedDoc && typeof cachedDoc === "object") {
              setCourierDetailsMap((prev) => ({ ...prev, [key]: cachedDoc }));
              const phone = cachedDoc.courier?.phone_number || cachedDoc.courier?.phone || "";
              const uid = cachedDoc.userId || cachedDoc.user_id || "";
              if (phone || uid) {
                setKnownCouriersMeta((prev) => ({
                  ...prev,
                  [key]: { ...(prev[key] || {}), courierId: key, userId: uid, name: courierName, phone }
                }));

            const next = Array.from(new Set([...(Array.isArray(cur) ? cur : []), token]));
            await fbFetch("PUT", "config/requested_courier_details", next);

              const doc = await fbFetch("GET", `courier_details/${encodeURIComponent(key)}`).catch(() => null);
              if (doc && typeof doc === "object") {

      const handleCourierHover = useCallback(

      const martBranchesSummary = useMemo(() => {

          totalMartCount += 1;
          const label = extractMartBranchLabel(d.vendor);
          const isLate = d.deadline.includes("-") || d.deadline === "Late";

          cur.count += 1;
          if (isLate) cur.late += 1;
          branchMap.set(label, cur);

            if (!hasZ) return false;

          return (
            String(item.id).toLowerCase().includes(q) ||
            String(item.vo).toLowerCase().includes(q) ||
            String(item.courier).toLowerCase().includes(q) ||
            String(item.courierId).toLowerCase().includes(q) ||
            String(item.vendor).toLowerCase().includes(q) ||
            String(item.zone).toLowerCase().includes(q)
          );
        });

          const localMeta = knownCouriersMeta[key];
          if (localMeta?.phone) return localMeta.phone;

          const cachedPhone = cachedDoc?.courier?.phone_number || cachedDoc?.courier?.phone;
          if (cachedPhone) return cachedPhone;

          try {
            const fbDoc = await fbFetch("GET", `courier_details/${encodeURIComponent(key)}`);

            if (fbPhone) return fbPhone;

            const token = `${cid}|${cname}`;

            const next = Array.from(new Set([...(Array.isArray(cur) ? cur : []), token]));
            await fbFetch("PUT", "config/requested_courier_details", next);

            await new Promise((r) => setTimeout(r, 1200));
            const retryDoc = await fbFetch("GET", `courier_details/${encodeURIComponent(key)}`).catch(() => null);
            return retryDoc?.courier?.phone_number || retryDoc?.courier?.phone || "N/A";

        return [
          `Order ID: ${item.id}`,
          `Vendor: ${item.vendor}`,

                <button
                  type="button"
                  disabled={completedPage <= 1}
                  onClick={() => {
                    setCompletedPage((p) => Math.max(1, p - 1));
                    if (mainContainerRef.current) mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
                  }}
                  className={`w-9 h-9 flex items-center justify-center rounded text-base font-bold transition-colors ${
                    completedPage <= 1 ? "text-gray-300 cursor-not-allowed" : "text-gray-600 hover:bg-gray-100"
                  }`}
                >
                  ‹
                </button>

                {completedVisiblePages.map((p, idx) =>
                  p === "..." ? (
                    <span key={`comp-dots-${idx}`} className="px-2 text-gray-400 text-sm">
                      ...
                    </span>
                  ) : (
                    <button
                      key={p}
                      type="button"
                      onClick={() => {
                        setCompletedPage(Number(p));
                        if (mainContainerRef.current) mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
                      }}
                      className={`min-w-[36px] h-9 px-2.5 flex items-center justify-center text-sm transition-colors ${
                        Number(completedPage) === Number(p)
                          ? "border-b-2 border-blue-600 text-blue-600 font-bold"
                          : "text-gray-700 hover:bg-gray-100 rounded font-medium"
                      }`}
                    >
                      {p}
                    </button>
                  )
                )}

                <button
                  type="button"
                  disabled={completedPage >= completedTotalPages}
                  onClick={() => {
                    setCompletedPage((p) => Math.min(completedTotalPages, p + 1));
                    if (mainContainerRef.current) mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
                  }}
                  className={`w-9 h-9 flex items-center justify-center rounded text-base font-bold transition-colors ${
                    completedPage >= completedTotalPages
                      ? "text-gray-300 cursor-not-allowed"
                      : "text-gray-600 hover:bg-gray-100"
                  }`}
                >
                  ›
                </button>
              </div>

              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  const num = Number(completedJumpPage);
                  if (num >= 1) {
                    setCompletedPage(Math.min(completedTotalPages, num));
                    setCompletedJumpPage("");
                    if (mainContainerRef.current) mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
                  }
                }}
                className="flex items-center gap-1.5 text-xs"
              >
                <span className="text-gray-500">Go to:</span>
                <input
                  type="number"
                  min={1}
                  max={completedTotalPages}
                  value={completedJumpPage}
                  onChange={(e) => setCompletedJumpPage(e.target.value)}
                  placeholder="Page"
                  className="w-16 px-2 py-1 border border-gray-300 rounded text-xs focus:outline-none focus:border-blue-500"
                />
                <button
                  type="submit"
                  className="px-2.5 py-1 rounded border border-gray-300 bg-white hover:bg-gray-50 font-semibold text-gray-700"
                >
                  Go
                </button>
              </form>
            </div>
          </div>
        );
      };

      const totalItemsForPagination = filteredDeliveries.length;
      const totalPages = Math.max(1, Math.ceil(totalItemsForPagination / PAGE_SIZE));

      const paginatedDeliveries = useMemo(() => {
        const safePage = Math.min(currentPage, totalPages);
        const startIdx = (safePage - 1) * PAGE_SIZE;
        return filteredDeliveries.slice(startIdx, startIdx + PAGE_SIZE);
      }, [currentPage, totalPages, filteredDeliveries]);

      const handlePageChange = useCallback(
        (nextPage) => {
          const clamped = Math.max(1, Math.min(totalPages, Number(nextPage) || 1));
          setCurrentPage(clamped);
          if (mainContainerRef.current) {
            mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
          }
        },
        [totalPages]
      );

      const visiblePageNumbers = useMemo(() => {
        if (totalPages <= 7) {
          return Array.from({ length: totalPages }, (_, i) => i + 1);
        }
        if (currentPage <= 4) {
          return [1, 2, 3, 4, 5, "...", totalPages];
        }
        if (currentPage >= totalPages - 3) {
          return [1, "...", totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
        }
        return [1, "...", currentPage - 1, currentPage, currentPage + 1, "...", totalPages];
      }, [currentPage, totalPages]);

      const renderDeliveriesTable = () => {
        const lateCount = baseTabDeliveries.filter((d) => d.deadline.includes("-") || d.deadline === "Late").length;
        const cashCount = baseTabDeliveries.filter((d) => d.instructions.includes("Cash")).length;
        const cardCount = baseTabDeliveries.filter((d) => d.instructions.includes("Card")).length;
        const darkstoreCount = baseTabDeliveries.filter(
          (d) => isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores")
        ).length;
        const restaurantCount = baseTabDeliveries.filter((d) => {
          const isDs = isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores");
          return !isDs && (d.instructions.includes("Restaurants") || d.instructions.includes("Supermarket"));
        }).length;
        const splitCount = baseTabDeliveries.filter((d) => d.isSplit).length;
        const tabExactTotal = effectiveTabCounts[activeTab] ?? baseTabDeliveries.length;

        const delayedWithRiderList = filteredDeliveries.filter(
          (d) => (d.deadline.includes("-") || d.deadline === "Late") && hasValidAssignedRider(d)
        );
        const selectedWithRiderList = filteredDeliveries.filter(
          (d) => selectedOrderUids.has(d.uid) && hasValidAssignedRider(d)
        );
        const pageSelectableItems = paginatedDeliveries.filter(hasValidAssignedRider);
        const allPageSelected =
          pageSelectableItems.length > 0 && pageSelectableItems.every((d) => selectedOrderUids.has(d.uid));

        const quickFilters = [
          { id: "All", label: `All (${tabExactTotal})` },
          { id: "Delayed", label: `Delayed (${lateCount})` },
          { id: "Cash", label: `Cash (${cashCount})` },
          { id: "Card", label: `Card (${cardCount})` },
          { id: "Restaurants", label: `Restaurants (${restaurantCount})` },
          { id: "Darkstores", label: `Darkstores - Talabat Mart (${darkstoreCount})` },
          { id: "Split", label: `Split Orders (${splitCount})` }
        ];

        return (
          <div className="mt-4 space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-gray-100">
              <div className="flex flex-wrap items-center gap-1.5">
                {quickFilters.map((qf) => {
                  const active = activeQuickFilter === qf.id;
                  return (
                    <button
                      key={qf.id}
                      type="button"
                      onClick={() => {
                        setActiveQuickFilter(qf.id);
                        setCurrentPage(1);
                        if (qf.id !== "Darkstores") setSelectedMartBranch("ALL");
                      }}
                      className={`px-3 py-1 rounded-full text-xs font-semibold border transition-colors ${
                        active
                          ? "bg-blue-600 text-white border-blue-600"
                          : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"
                      }`}
                    >
                      {qf.label}
                    </button>
                  );
                })}
              </div>

              <div className="flex flex-wrap items-center gap-2 text-xs text-gray-500">
                {selectedWithRiderList.length > 0 && (
                  <div className="inline-flex items-center gap-1">
                    <button
                      type="button"
                      disabled={copyingFollowupState === "loading:selected"}
                      onClick={() => handleCopyBulkFollowup("selected", selectedWithRiderList)}
                      className="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-sm transition-colors flex items-center gap-1.5"
                      title="نسخ كليشة متابعة الرايدر للأوردرات المحددة فقط"
                    >
                      {copyingFollowupState === "loading:selected"
                        ? "⏳ جاري سحب أرقام الموبايل..."
                        : copyingFollowupState?.startsWith("done:selected:")
                        ? `✓ تم نسخ (${selectedWithRiderList.length}) أوردر`
                        : `📋 نسخ المحدد (${selectedWithRiderList.length})`}
                    </button>
                    <button
                      type="button"
                      onClick={() => setSelectedOrderUids(new Set())}
                      className="px-2 py-1 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 text-gray-600 font-semibold"
                      title="إلغاء تحديد الأوردرات"
                    >
                      ✕
                    </button>
                  </div>
                )}

                {delayedWithRiderList.length > 0 && (
                  <button
                    type="button"
                    disabled={copyingFollowupState === "loading:delayed"}
                    onClick={() => handleCopyBulkFollowup("delayed", delayedWithRiderList)}
                    className="px-3 py-1 rounded-lg bg-red-600 hover:bg-red-700 text-white font-bold shadow-sm transition-colors flex items-center gap-1.5"
                    title="نسخ كليشة متابعة الرايدر لكل الأوردرات المتأخرة المعروضة"
                  >
                    {copyingFollowupState === "loading:delayed"
                      ? "⏳ جاري سحب الأرقام..."
                      : copyingFollowupState?.startsWith("done:delayed:")
                      ? `✓ تم نسخ المتأخرات (${delayedWithRiderList.length})`

                      </span>
                      {br.late > 0 && (
                        <span className="px-1.5 py-0.2 rounded text-[10px] font-bold bg-red-600 text-white">

                        </span>
                      )}
                    </button>
                  );
                })}
              </div>

              {paginatedDeliveries.length === 0 ? (
                <div className="p-8 text-center bg-white border border-gray-200 rounded-xl text-gray-500 text-xs space-y-2.5">
                  {connectionStatus === "connecting" || connectionStatus === "waiting" ? (
                    <span className="text-blue-600 font-semibold">
                      جاري سحب أوردرات الزونات المختارة من Hurrier...
                    </span>
                  ) : (
                    <>
                      <div>
                        لا توجد أوردرات في قسم <span className="font-semibold">{activeTab}</span> للزونات المختارة حالياً.
                      </div>
                      {searchQuery.trim() && (
                        <button
                          type="button"
                          onClick={() => handleJumpToCompletedOrderSearch(searchQuery)}
                          className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-indigo-600 text-white text-xs font-bold shadow-sm"
                        >
                          ⚡ بحث سريع عن "{searchQuery.trim()}" في Completed Orders
                        </button>
                      )}
                    </>
                  )}
                </div>
              ) : (
                paginatedDeliveries.map((item) => {
                  const isNegative = item.deadline.includes("-") || item.deadline === "Late";
                  const posMinsMatch = !isNegative ? /^(\d+)min$/.exec(item.deadline) : null;
                  const posMins = posMinsMatch ? Number(posMinsMatch[1]) : 0;
                  const deadlineColor = isNegative
                    ? "bg-[#e53935] text-white"
                    : posMins > 5 && posMins <= 20
                    ? "bg-[#f59e0b] text-white"
                    : "bg-gray-100 text-gray-800";

                  const prioritizedZones = [...(item.zonesList || [])].sort((a, b) => {
                    const aMatch = selectedZoneNames.some((s) => normalizeText(a).toLowerCase().includes(s));
                    const bMatch = selectedZoneNames.some((s) => normalizeText(b).toLowerCase().includes(s));
                    if (aMatch === bMatch) return 0;
                    return aMatch ? -1 : 1;
                  });
                  const shownZones = prioritizedZones.slice(0, 2);
                  const extraZonesCount = Math.max(0, prioritizedZones.length - shownZones.length);
                  const canCopyFollowup = hasValidAssignedRider(item);
                  const isRowSelected = selectedOrderUids.has(item.uid);

                  return (
                    <div
                      key={`m-card-${item.uid}`}
                      onClick={() => setSelectedOrder(item)}
                      className={`p-3.5 rounded-xl border transition-all shadow-sm space-y-2.5 text-xs ${
                        isRowSelected
                          ? "bg-blue-50/80 border-blue-400"
                          : "bg-white border-gray-200 active:bg-gray-50"

                    >
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-2 min-w-0">
                          {canCopyFollowup && (
                            <input
                              type="checkbox"
                              checked={isRowSelected}
                              onClick={(e) => e.stopPropagation()}
                              onChange={(e) => toggleOrderSelection(e, item)}
                              className="w-4 h-4 rounded text-blue-600 flex-shrink-0"
                            />
                          )}
                          <span className="text-blue-600 font-bold text-[15px] tracking-tight">
                            {item.id}
                          </span>
                          <button
                            type="button"
                            onClick={(e) => {
                              e.stopPropagation();
                              copyToClipboard(item.id, item.id);
                            }}
                            className="px-1.5 py-1 rounded bg-gray-100 text-gray-700 font-semibold"
                          >
                            {copiedText === item.id ? "✓" : "⧉"}
                          </button>
                          {canCopyFollowup && (
                            <button
                              type="button"
                              onClick={(e) => handleCopySingleFollowup(e, item)}
                              className={`px-2 py-1 rounded font-bold border ${
                                copiedText === `followup:${item.uid}`
                                  ? "bg-emerald-50 text-emerald-700 border-emerald-300"
                                  : "bg-blue-50 text-blue-700 border-blue-200"
                              }`}
                            >
                              {copyingFollowupState === `single:${item.uid}`
                                ? "⏳"
                                : copiedText === `followup:${item.uid}`
                                ? "✓ تم"
                                : "📋 متابعة"}
                            </button>
                          )}
                        </div>

                        <div className="flex flex-col items-end gap-1 flex-shrink-0">
                          <span className={`px-2.5 py-0.5 rounded-md text-xs font-bold ${deadlineColor}`}>
                            {item.deadline}
                          </span>
                          <span className="font-bold text-gray-900 text-[11px]">{item.status}</span>
                        </div>
                      </div>

                      <div className="space-y-1">
                        <div className="text-gray-800 font-semibold leading-snug">
                          🏪 {item.vendor}{" "}
                          <span className="text-gray-400 font-normal">(VO #{item.vo})</span>
                        </div>
                        <div className="flex items-center justify-between gap-2 text-[11px]">
                          <span className="text-blue-700 font-semibold truncate">
                            📍 {shownZones.join(", ") || item.zone}
                            {extraZonesCount > 0 ? ` (+${extraZonesCount})` : ""}
                          </span>
                          <span className="text-gray-500 font-mono flex-shrink-0">
                            {item.distance} • {item.orderValue}
                          </span>
                        </div>
                      </div>

                      <div className="pt-2 border-t border-gray-100 flex flex-wrap items-center justify-between gap-2">
                        <div className="min-w-0 flex-1">
                          {item.courier === "-" ||
                          item.courier === "Assigning..." ||
                          item.courier === "Pending Acceptance" ? (
                            <span className="text-gray-500 font-medium">🚴‍♂️ {item.courier}</span>
                          ) : (
                            <button
                              type="button"
                              onClick={(e) => openCourierModal(e, item.courierId, item.courier)}
                              className="text-left text-blue-600 font-bold underline decoration-blue-300 leading-snug break-words"
                            >
                              🚴‍♂️ {item.courier}
                            </button>
                          )}
                        </div>

                        <div className="flex items-center gap-1 flex-wrap flex-shrink-0">
                          {item.instructions.map((inst, idx) => (
                            <span
                              key={idx}
                              className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${
                                inst === "Cash"
                                  ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                                  : inst === "Card"
                                  ? "bg-indigo-50 text-indigo-700 border-indigo-200"
                                  : "bg-gray-50 text-gray-700 border-gray-200"
                              }`}
                            >
                              {inst}
                            </span>
                          ))}
                          {item.isSplit && (
                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-purple-50 text-purple-700 border border-purple-200">
                              Split
                            </span>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            {selectedWithRiderList.length > 0 && (
              <div className="fixed bottom-0 inset-x-0 z-40 md:hidden bg-slate-900/95 backdrop-blur border-t border-slate-700 px-4 py-3 flex items-center justify-between gap-2 shadow-2xl">
                <button
                  type="button"
                  disabled={copyingFollowupState === "loading:selected"}
                  onClick={() => handleCopyBulkFollowup("selected", selectedWithRiderList)}
                  className="flex-1 py-2.5 px-4 rounded-xl bg-emerald-600 active:bg-emerald-700 text-white font-bold text-xs shadow-sm flex items-center justify-center gap-2"
                >
                  {copyingFollowupState === "loading:selected"
                    ? "⏳ جاري سحب أرقام الموبايل..."
                    : copyingFollowupState?.startsWith("done:selected:")
                    ? `✓ تم نسخ (${selectedWithRiderList.length}) أوردر`
                    : `📋 نسخ المحدد (${selectedWithRiderList.length})`}
                </button>
                <button
                  type="button"
                  onClick={() => setSelectedOrderUids(new Set())}
                  className="py-2.5 px-3.5 rounded-xl bg-slate-800 text-slate-200 font-bold text-xs border border-slate-600"
                >
                  ✕ إلغاء
                </button>
              </div>
            )}

            <div className={`${mobileViewMode === "cards" ? "hidden md:block" : "block"} w-full overflow-x-auto bg-white border border-gray-200 rounded-lg shadow-sm`}>
              <table className="w-full text-left text-sm whitespace-nowrap">
                <thead>
                  <tr className="border-b border-gray-200 text-gray-500 font-semibold tracking-wide text-xs bg-gray-50/70">
                    <th className="py-3 pl-3 pr-1 w-8 text-center">
                      <input
                        type="checkbox"
                        checked={allPageSelected}
                        disabled={pageSelectableItems.length === 0}
                        onChange={() => {
                          setSelectedOrderUids((prev) => {
                            const next = new Set(prev);
                            if (allPageSelected) {
                              pageSelectableItems.forEach((d) => next.delete(d.uid));
                            } else {
                              pageSelectableItems.forEach((d) => next.add(d.uid));
                            }
                            return next;
                          });
                        }}
                        className="w-4 h-4 rounded text-blue-600 cursor-pointer"
                      />
                    </th>
                    <th className="py-3 px-4 w-1/4">ORDER</th>
                    <th className="py-3 px-3">DEADLINE</th>
                    <th className="py-3 px-3 w-1/4">COURIER</th>
                    <th className="py-3 px-3">STATUS</th>
                    <th className="py-3 px-3">ZONE / DISTANCE</th>
                    <th className="py-3 px-4">DELIVERY INSTRUCTION</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {paginatedDeliveries.length === 0 ? (
                    <tr>
                      <td colSpan={7} className="py-12 text-center text-gray-500">
                        {connectionStatus === "connecting" || connectionStatus === "waiting" ? (
                          <span className="text-blue-600 font-semibold">

                          </span>
                        ) : (
                          <div className="space-y-2.5">
                            <div>

                            </div>

                              <button
                                type="button"
                                onClick={() => handleJumpToCompletedOrderSearch(searchQuery)}
                                className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-sm transition-colors"
                              >
                                ⚡ بحث سريع عن "{searchQuery.trim()}" في Completed Orders
                              </button>
                            )}
                          </div>
                        )}
                      </td>
                    </tr>

                    paginatedDeliveries.map((item) => {

            {totalPages > 1 && (

        const rawQ = String(riderSearchReq.query).trim();
        const qLower = rawQ.toLowerCase();
        const qPhone = normalizePhoneDigits(rawQ);

        const mergedMap = new Map();
        const addRider = (rObj) => {
          if (!rObj) return;
          const key = String(rObj.courierId || rObj.userId || rObj.name || "").toLowerCase();
          if (!key) return;
          if (!mergedMap.has(key)) {
            mergedMap.set(key, rObj);
          }

        (Array.isArray(riderSearchResults) ? riderSearchResults : []).forEach(addRider);

        Object.entries(knownCouriersMeta || {}).forEach(([cid, meta]) => {
          if (!meta) return;
          const mPhone = normalizePhoneDigits(meta.phone || "");
          const phoneMatch =
            (qPhone.core10 && mPhone.core10 === qPhone.core10) ||
            (qPhone.rawDigits.length >= 7 && mPhone.rawDigits.includes(qPhone.rawDigits));
          const idMatch =
            String(cid) === rawQ || (meta.userId && String(meta.userId) === rawQ);
          const nameMatch = meta.name && meta.name.toLowerCase().includes(qLower);

          if (phoneMatch || idMatch || nameMatch) {
            addRider({
              courierId: String(cid),
              userId: String(meta.userId || cid),
              name: meta.name || `Courier #${cid}`,
              phone: meta.phone || "",
              status: "Working"
            });
          }
        });

        return Array.from(mergedMap.values());
