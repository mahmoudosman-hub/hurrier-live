    function isRealHurrierZoneId(id) {
      const n = Number(id);
      return Number.isInteger(n) && n >= 10000 && n < 90000;
    }

    function normalizeText(v) {
      return String(v || "")
        .replace(/&#39;/g, "'")
        .replace(/&amp;/g, "&")
        .replace(/&quot;/g, '"')
        .replace(/\s+/g, " ")
        .trim();
    }

    function isTalabatMartVendor(vendorName) {
      const s = normalizeText(vendorName).toLowerCase();
      return s.includes("talabat mart") || s.includes("طلبات مارت") || s.includes("tmart");
    }

    function extractMartBranchLabel(vendorName) {
      const raw = normalizeText(vendorName);
      if (!raw) return "Unknown Mart";
      const cleaned = raw
        .replace(/^vo\s*#?\d+\s*-\s*/i, "")
        .replace(/^talabat\s*mart\s*,?\s*/i, "")
        .replace(/^طلبات\s*مارت\s*,?\s*/i, "")
        .replace(/^tmart\s*,?\s*/i, "")
        .trim();
      return cleaned || raw;
    }

    function formatRelativeDeadline(isoDate, isPreorder = false) {
      if (!isoDate) return "-";
      const target = new Date(isoDate);
      if (Number.isNaN(target.getTime())) return "-";
      if (isPreorder) {
        return target.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      }
      const diffMins = Math.round((target.getTime() - Date.now()) / 60000);
      const absMins = Math.abs(diffMins);
      const sign = diffMins < 0 ? "-" : "";
      if (absMins >= 60) {
        const h = Math.floor(absMins / 60);
        const m = absMins % 60;
        return `${sign}${h}h ${m}min`;
      }
      return `${sign}${absMins}min`;
    }

    function formatDiffBetweenIsos(scheduledIso, estimatedIso) {
      if (!scheduledIso || !estimatedIso) return "";
      const s = new Date(scheduledIso).getTime();
      const e = new Date(estimatedIso).getTime();
      if (Number.isNaN(s) || Number.isNaN(e)) return "";
      const diffMins = Math.round((s - e) / 60000);
      return `${diffMins}min`;
    }

    function formatReadableTimestamp(isoDate) {
      if (!isoDate) return "-";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleString("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatShortTimeOnly(isoDate) {
      if (!isoDate) return "-";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatExactTimeSeconds(val) {
      if (!val) return "-";
      const d = typeof val === "number" ? new Date(val > 1e12 ? val : val * 1000) : new Date(val);
      if (Number.isNaN(d.getTime())) return String(val);
      return d.toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });
    }

    function formatShortEstTime(val) {
      if (!val) return "-";
      const d = typeof val === "number" ? new Date(val > 1e12 ? val : val * 1000) : new Date(val);
      if (Number.isNaN(d.getTime())) return String(val);
      return d.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatSinceTimestamp(isoDate) {
      if (!isoDate) return "";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "";
      const dayPart = d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
      const timePart = d
        .toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: true })
        .toLowerCase();
      return `Since ${dayPart} ${timePart}`;
    }

    function formatDurationSecondsToMin(secondsVal) {
      if (secondsVal === null || secondsVal === undefined || secondsVal === "") return "-";
      const s = Number(secondsVal);
      if (Number.isNaN(s)) return String(secondsVal);
      return `${Math.round(s / 60)}m`;
    }

    function formatPiastersMoney(val, currency = "EGP") {
      if (val === null || val === undefined || val === "") return "-";
      if (typeof val === "string" && /[A-Z]{3}|\$/.test(val)) return val;
      const num = Number(val);
      if (Number.isNaN(num)) return String(val);
      return `${(num / 100).toFixed(2)} ${currency}`;
    }

    function humanizeSnakeCase(str) {
      return String(str || "")
        .split("_")
        .map((w) => (w ? w.charAt(0).toUpperCase() + w.slice(1) : ""))
        .join(" ")
        .trim();
    }

    function extractCustomerInfoFromOrder(orderObj, doc) {
      const o = orderObj || {};
      const d = doc || {};
      const apiOrder = d.order || d.detail || {};

      const cust =
        apiOrder.customer ||
        o.customer ||
        o.customer_details ||
        o.recipient ||
        {};

      const addr =
        apiOrder.drop_off_address ||
        o.drop_off_address ||
        o.dropoff_address ||
        o.delivery_address ||
        cust.address ||
        {};

      const fullName = normalizeText(
        cust.customer_name ||
          cust.full_name ||
          [cust.first_name, cust.last_name].filter(Boolean).join(" ") ||
          cust.name ||
          addr.recipient_name ||
          addr.name ||
          o.customer_name
      );

      const tagCustId = Array.isArray(o.tags)
        ? o.tags.find((t) => String(t).startsWith("external_address_id:"))
        : "";
      const fallbackName = cust.customer_id
        ? `Customer #${cust.customer_id}`
        : tagCustId
        ? String(tagCustId).replace("external_address_id:", "Customer #")
        : "Customer";

      const phone = normalizeText(
        cust.customer_phone_number ||
          cust.phone ||
          cust.phone_number ||
          cust.mobile ||
          cust.mobile_number ||
          addr.phone ||
          addr.phone_number ||
          o.customer_phone
      );

      const streetAddress = normalizeText(
        addr.street_address ||
          addr.address_line_1 ||
          addr.formatted_address ||
          [addr.street, addr.area, addr.city_name || addr.city].filter(Boolean).join(", ") ||
          addr.address
      );

      return {
        name: fullName || fallbackName,
        phone: phone || "",
        apartment: normalizeText(addr.apartment_number || addr.apartment || addr.flat || addr.unit) || "NA",
        building: normalizeText(addr.building || addr.building_number || addr.house_number) || "NA",
        floor: normalizeText(addr.floor || addr.floor_number) || "NA",
        zipcode: normalizeText(addr.zip || addr.zipcode || addr.postal_code) || "NA",
        intercom: normalizeText(addr.intercom || addr.intercom_code) || "NA",
        entrance: normalizeText(addr.entrance || addr.gate) || "NA",
        streetAddress,
        deliveryNote: normalizeText(addr.special_instructions || addr.delivery_instructions || addr.instructions || addr.note) || ""
      };
    }

    function sanitizeCourierKey(rawKey) {
      return String(rawKey || "")
        .trim()
        .replace(/[.#$\[\]\/\\]/g, "_")
        .slice(0, 80);
    }

    function extractCourierProfileFromDoc(selectedCourier, doc) {
      const base = selectedCourier || {};
      const c = doc?.courier || {};
      const courierId = String(c.id || doc?.courierId || base.id || "").trim();
      const userId = String(doc?.user_id || doc?.userId || c.user_id || courierId || "").trim();
      const resolvedName = normalizeText(c.name || doc?.courierName || base.name || "Courier");
      const phone = normalizeText(c.phone_number || c.phone || c.mobile || "");

      const contractInfo = doc?.contract_info || c.contract_info || {};
      const contractType = contractInfo.type ? humanizeSnakeCase(contractInfo.type) : "";
      const contractName = normalizeText(contractInfo.name);
      const contract = contractType
        ? contractName
          ? `${contractType} (${contractName})`
          : contractType
        : contractName || "-";

      const vehicle = normalizeText(c.vehicle || c.vehicle_type) || "-";
      const fleetId = normalizeText(c.fleet_id || c.city_code) || "eg-cairo";

      const statusRaw = c.status || "Working";
      const statusLabel = humanizeSnakeCase(statusRaw);
      const statusMeta = doc?.status_meta_data || c.status_meta_data || {};
      const performedBy = normalizeText(statusMeta.performed_by);
      const statusReason = statusMeta.reason ? humanizeSnakeCase(statusMeta.reason) : "";
      const statusUntil = doc?.status_until ? formatShortTimeOnly(doc.status_until) : "";

      const rawBalance = doc?.balance ?? c.balance;
      const balanceStr =
        rawBalance !== undefined && rawBalance !== null && rawBalance !== ""
          ? `${Number(rawBalance).toFixed(2)} EGP`
          : "";

      return {
        courierId,
        userId,
        name: resolvedName,
        phone,
        contract,
        vehicle,
        fleetId,
        statusLabel,
        performedBy,
        statusReason,
        statusUntil,
        balanceStr,
        isLoadedFromApi: Boolean(doc?.fetchedFromApi)
      };
    }

    function mapHurrierRecordToDelivery(rec, tabName) {
      const order = rec?.order || {};
      const verticalMap = {
        restaurants: "Restaurants",
        darkstores: "Darkstores",
        dairy_products: "Dairy Products",
        convenience: "Convenience",
        courier_business: "Courier Business"
      };

      const instructions = [];
      if (order.is_cash_collection || rec?.is_cash_collection) instructions.push("Cash");
      if (order.is_card_on_delivery || order.payment_method === "card" || order.is_online_payment) instructions.push("Card");
      const vLabel = verticalMap[order.vertical_type] || (order.vertical_type ? humanizeSnakeCase(order.vertical_type) : "Restaurants");
      instructions.push(vLabel);

      const statusLabel = humanizeSnakeCase(rec?.status || "queued");

      const targetIso = order.scheduled_dropoff_at || rec?.scheduled_dropoff_at;
      const deadlineStr = formatRelativeDeadline(targetIso, tabName === "Pre-order");
      const distKm = typeof rec?.distance === "number" ? `${(rec.distance / 1000).toFixed(2)} km` : "-";
      const valEgp =
        typeof order.order_value === "number"
          ? `${(order.order_value / 100).toFixed(2)} EGP`
          : "-";

      const rawSps = Array.isArray(rec?.starting_points)
        ? rec.starting_points
        : Array.isArray(order.starting_points)
        ? order.starting_points
        : [];
      const zoneObjects = [];
      const zonesList = [];
      rawSps.forEach((sp) => {
        if (sp && typeof sp === "object") {
          const nm = normalizeText(sp.name || sp.starting_point_name);
          const id = Number(sp.id || sp.starting_point_id);
          if (nm) zonesList.push(nm);
          if (nm || id) zoneObjects.push({ id, name: nm });
        } else if (sp) {
          const nm = normalizeText(sp);
          if (nm) zonesList.push(nm);
        }
      });

      const codeStr = String(order.code || rec?.display_id || rec?.id || "");
      const isSplit =
        Boolean(order.is_split || rec?.is_split) || (codeStr.includes("-") && codeStr.length > 14);

      return {
        uid: `${tabName}-${rec?.id || codeStr}-${Math.random().toString(36).slice(2, 7)}`,
        id: codeStr,
        orderCode: order.order_code || `HF_EG${codeStr}`,
        vendor: order.vendor_name || "Unknown Vendor",
        vo: order.vendor_order_number || "-",
        deadline: deadlineStr,
        courier: rec?.courier_name || (tabName === "Queued" ? "Assigning..." : "-"),
        courierId: rec?.courier_id || null,
        status: statusLabel,
        time_in: deadlineStr.startsWith("-") ? deadlineStr : "-",
        time_at: formatReadableTimestamp(targetIso),
        zone: zonesList.join(", ") || "Cairo",
        zonesList,
        zoneObjects,
        city: rec?.city_name || order.city_name || "Cairo",
        instructions,
        isSplit,
        tab: tabName,
        distance: distKm,
        orderValue: valEgp,
        rawRecord: rec
      };
    }

    function readSessionStorageJson(key, fallback) {
      try {
        const raw = window.sessionStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function writeSessionStorageJson(key, val) {
      try {
        window.sessionStorage.setItem(key, JSON.stringify(val));
      } catch {}
    }

    function App() {
      const sessionId = useMemo(() => {
        const existing = readSessionStorageJson("hurrier_emp_session_id", "");

        const fresh = `emp_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
        writeSessionStorageJson("hurrier_emp_session_id", fresh);

      const [employeeName, setEmployeeName] = useState(() =>

      const [selectedZoneIds, setSelectedZoneIds] = useState(() =>
        readSessionStorageJson("hurrier_emp_zone_ids", [])
      );
      const [isZoneSetupConfirmed, setIsZoneSetupConfirmed] = useState(() => {

        const savedIds = readSessionStorageJson("hurrier_emp_zone_ids", []);
        return Boolean(savedConfirmed && Array.isArray(savedIds) && savedIds.length > 0);

      const [activeTab, setActiveTab] = useState(() =>

      const [searchQuery, setSearchQuery] = useState("");

      const [selectedMartBranch, setSelectedMartBranch] = useState("ALL");
      const [orderSortMode, setOrderSortMode] = useState("hurrier_order");
      const [currentPage, setCurrentPage] = useState(1);
      const [jumpPageInput, setJumpPageInput] = useState("");
      const [zoneSearchQuery, setZoneSearchQuery] = useState("");
      const [expandedZoneId, setExpandedZoneId] = useState(null);

      const [selectedOrder, setSelectedOrder] = useState(null);
      const selectedOrderRef = useRef(null);
      selectedOrderRef.current = selectedOrder;
      const [liveOrderDetailDoc, setLiveOrderDetailDoc] = useState(null);
      const [detailModalTab, setDetailModalTab] = useState("Deliveries");
      const [copiedText, setCopiedText] = useState(null);

      const [selectedCourier, setSelectedCourier] = useState(null);
      const selectedCourierRef = useRef(null);
      selectedCourierRef.current = selectedCourier;
      const [liveCourierDetailDoc, setLiveCourierDetailDoc] = useState(null);
      const prewarmedCourierKeysRef = useRef(new Set());
      const courierHoverTimerRef = useRef(null);

      const [deliveries, setDeliveries] = useState([]);
      const [tabCounts, setTabCounts] = useState({
        Actionable: 0,
        "Pre-order": 0,
        "Waiting for Assembly": 0,
        Queued: 0,
        Dispatched: 0,
        Active: 0
      });
      const [couriers, setCouriers] = useState([]);
      const [citySummary, setCitySummary] = useState([]);
      const [dispatcherStats, setDispatcherStats] = useState([]);
      const [issuesList, setIssuesList] = useState([]);
      const [discoveredZonesFromBundle, setDiscoveredZonesFromBundle] = useState([]);
      const [lastSyncTime, setLastSyncTime] = useState("-");
      const [connectionStatus, setConnectionStatus] = useState("connecting");

      const hoverTimerRef = useRef(null);
      const prewarmedOrderIdsRef = useRef(new Set());
      const mainContainerRef = useRef(null);

      useEffect(() => {
        writeSessionStorageJson("hurrier_emp_name", employeeName);
      }, [employeeName]);

      useEffect(() => {
        writeSessionStorageJson("hurrier_emp_zone_ids", selectedZoneIds);
      }, [selectedZoneIds]);

      useEffect(() => {
        writeSessionStorageJson("hurrier_emp_zone_confirmed", isZoneSetupConfirmed);
      }, [isZoneSetupConfirmed]);

      useEffect(() => {
        writeSessionStorageJson("hurrier_emp_active_tab", activeTab);
      }, [activeTab]);

      const copyToClipboard = useCallback((key, text) => {
        const str = String(text || "");
        if (!str) return;
        try {
          const ta = document.createElement("textarea");
          ta.value = str;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        } catch {}
        setCopiedText(key);
        setTimeout(() => setCopiedText(null), 1500);
      }, []);

      const requestOrderDetailsFromHurrier = useCallback(async (orderId, deliveryId = "") => {
        if (!orderId) return;
        const cleanId = String(orderId).replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "").trim();
        if (!cleanId) return;
        const cleanDelId = String(deliveryId || "").trim();
        const requestToken = cleanDelId && cleanDelId !== cleanId ? `${cleanId}|${cleanDelId}` : cleanId;
        try {
          const curRes = await fetch(`${FIREBASE_DB_URL}/config/requested_order_details.json`, { cache: "no-store" });
          const curList = curRes.ok ? await curRes.json() : [];
          const nextList = Array.from(
            new Set([requestToken, ...(Array.isArray(curList) ? curList.map(String) : [])])
          ).slice(0, 12);
          await fetch(`${FIREBASE_DB_URL}/config/requested_order_details.json`, {
            method: "PUT",
            body: JSON.stringify(nextList)
          });
        } catch {}
      }, []);

      const handleOrderRowHover = useCallback(
        (item) => {
          const orderId = item?.id;
          const delId = item?.rawRecord?.id || item?.rawRecord?.delivery_id || "";
          if (!orderId) return;
          const cleanId = String(orderId).replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "").trim();
          if (!cleanId || prewarmedOrderIdsRef.current.has(cleanId)) return;
          if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
          hoverTimerRef.current = setTimeout(() => {
            prewarmedOrderIdsRef.current.add(cleanId);
            requestOrderDetailsFromHurrier(cleanId, delId);
          }, 180);
        },
        [requestOrderDetailsFromHurrier]
      );

      const fetchSingleOrderDetailDoc = useCallback(async (orderId) => {
        if (!orderId) return;
        const cleanId = String(orderId).replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "").trim();
        if (!cleanId) return;
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/order_details/${cleanId}.json`, { cache: "no-store" });
          if (res.ok) {
            const doc = await res.json();
            if (doc && typeof doc === "object") {
              setLiveOrderDetailDoc(doc);
            }
          }
        } catch {}
      }, []);

      useEffect(() => {
        if (!selectedOrder) {
          setLiveOrderDetailDoc(null);
          return;
        }
        const delId = selectedOrder.rawRecord?.id || selectedOrder.rawRecord?.delivery_id || "";
        setDetailModalTab("Deliveries");
        setLiveOrderDetailDoc(null);
        fetchSingleOrderDetailDoc(selectedOrder.id);
        requestOrderDetailsFromHurrier(selectedOrder.id, delId);

        const pollTimer = setInterval(() => {
          if (selectedOrderRef.current?.id) {
            fetchSingleOrderDetailDoc(selectedOrderRef.current.id);
          }
        }, 600);

        return () => clearInterval(pollTimer);
      }, [selectedOrder, fetchSingleOrderDetailDoc, requestOrderDetailsFromHurrier]);

      const requestCourierDetailsFromHurrier = useCallback(async (courierId, courierName = "") => {
        const cleanId = String(courierId || "").trim();
        const cleanName = normalizeText(courierName);
        if (!cleanId && (!cleanName || cleanName === "-" || cleanName === "Assigning..." || cleanName === "Pending Acceptance")) {
          return;
        }
        const token = cleanId ? `${cleanId}|${cleanName}` : `|${cleanName}`;
        try {
          const curRes = await fetch(`${FIREBASE_DB_URL}/config/requested_courier_details.json`, { cache: "no-store" });
          const curList = curRes.ok ? await curRes.json() : [];
          const nextList = Array.from(
            new Set([token, ...(Array.isArray(curList) ? curList.map(String) : [])])
          ).slice(0, 12);
          await fetch(`${FIREBASE_DB_URL}/config/requested_courier_details.json`, {
            method: "PUT",
            body: JSON.stringify(nextList)
          });
        } catch {}
      }, []);

      const handleCourierHover = useCallback(
        (courierId, courierName) => {
          const key = sanitizeCourierKey(courierId || String(courierName || "").toLowerCase());
          if (!key || prewarmedCourierKeysRef.current.has(key)) return;
          if (courierHoverTimerRef.current) clearTimeout(courierHoverTimerRef.current);
          courierHoverTimerRef.current = setTimeout(() => {
            prewarmedCourierKeysRef.current.add(key);
            requestCourierDetailsFromHurrier(courierId, courierName);
          }, 180);
        },
        [requestCourierDetailsFromHurrier]
      );

      const fetchSingleCourierDetailDoc = useCallback(async (courierObj) => {
        if (!courierObj) return;
        const primaryKey = sanitizeCourierKey(courierObj.id || String(courierObj.name || "").toLowerCase());
        if (!primaryKey) return;
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/courier_details/${primaryKey}.json`, { cache: "no-store" });
          if (res.ok) {
            const doc = await res.json();
            if (doc && typeof doc === "object") {
              setLiveCourierDetailDoc(doc);
            }
          }
        } catch {}
      }, []);

      const openCourierModal = useCallback((e, courierId, courierName) => {
        if (e) e.stopPropagation();
        const cleanName = normalizeText(courierName);
        if (!cleanName || cleanName === "-" || cleanName === "Assigning..." || cleanName === "Pending Acceptance") {
          return;
        }
        setSelectedCourier({
          id: courierId ? String(courierId).trim() : "",
          name: cleanName
        });
      }, []);

      useEffect(() => {
        if (!selectedCourier) {
          setLiveCourierDetailDoc(null);
          return;
        }
        setLiveCourierDetailDoc(null);
        fetchSingleCourierDetailDoc(selectedCourier);
        requestCourierDetailsFromHurrier(selectedCourier.id, selectedCourier.name);

        const pollTimer = setInterval(() => {
          if (selectedCourierRef.current) {
            fetchSingleCourierDetailDoc(selectedCourierRef.current);
          }
        }, 600);

        return () => clearInterval(pollTimer);
      }, [selectedCourier, fetchSingleCourierDetailDoc, requestCourierDetailsFromHurrier]);

      const selectedCourierFullView = useMemo(() => {
        if (!selectedCourier) return null;
        return extractCourierProfileFromDoc(selectedCourier, liveCourierDetailDoc);
      }, [selectedCourier, liveCourierDetailDoc]);

      const availableZones = useMemo(() => {
        const map = new Map();
        ALL_ZONES_CATALOG.forEach((z) => {
          const numId = Number(z.id);
          if (!isRealHurrierZoneId(numId)) return;
          const key = normalizeText(z.name).toLowerCase();
          map.set(key, { ...z, id: numId });
        });
        discoveredZonesFromBundle.forEach((z) => {
          const numId = Number(z?.id);
          if (z && z.name && isRealHurrierZoneId(numId)) {
            const key = normalizeText(z.name).toLowerCase();
            const existing = map.get(key);
            map.set(key, {
              id: existing ? existing.id : numId,
              name: normalizeText(z.name),
              city: z.city || existing?.city || "Cairo"
            });
          }
        });
        return Array.from(map.values())
          .filter((z) => selectedCity === "All Cities" || z.city === selectedCity)
          .sort((a, b) => String(a.name).localeCompare(String(b.name)));
      }, [discoveredZonesFromBundle, selectedCity]);

      const selectedZoneNames = useMemo(() => {
        if (!Array.isArray(selectedZoneIds) || selectedZoneIds.length === 0) return [];
        const idSet = new Set(selectedZoneIds.map(Number));
        return ALL_ZONES_CATALOG.filter((z) => idSet.has(Number(z.id)))
          .map((z) => normalizeText(z.name).toLowerCase())
          .filter(Boolean);
      }, [selectedZoneIds]);

      const registerOrHeartbeatSession = useCallback(async () => {
        if (!isZoneSetupConfirmed || selectedZoneIds.length === 0) return;
        try {
          await fetch(`${FIREBASE_DB_URL}/active_sessions/${sessionId}.json`, {
            method: "PUT",
            body: JSON.stringify({
              session_id: sessionId,
              employee_name: normalizeText(employeeName) || `Employee (${sessionId.slice(-5)})`,
              zone_ids: selectedZoneIds.map(Number).filter(isRealHurrierZoneId),
              zone_names: selectedZoneNames,
              heartbeat_at: Date.now()
            })
          });
        } catch {}
      }, [isZoneSetupConfirmed, selectedZoneIds, sessionId, employeeName, selectedZoneNames]);

      useEffect(() => {
        if (!isZoneSetupConfirmed || selectedZoneIds.length === 0) return;
        registerOrHeartbeatSession();
        const hbTimer = setInterval(registerOrHeartbeatSession, 15000);
        return () => clearInterval(hbTimer);
      }, [isZoneSetupConfirmed, selectedZoneIds, registerOrHeartbeatSession]);

      const handleConfirmZoneSelection = useCallback(() => {
        if (selectedZoneIds.length === 0) return;
        setConnectionStatus("waiting");
        setCurrentPage(1);
        setIsZoneSetupConfirmed(true);
      }, [selectedZoneIds]);

      const handleChangeZones = useCallback(async () => {
        setIsZoneSetupConfirmed(false);
        setDeliveries([]);
        setSelectedOrder(null);
        setCurrentPage(1);
        try {
          await Promise.all([
            fetch(`${FIREBASE_DB_URL}/active_sessions/${sessionId}.json`, { method: "DELETE" }),
            fetch(`${FIREBASE_DB_URL}/session_bundles/${sessionId}.json`, { method: "DELETE" })
          ]);
        } catch {}
      }, [sessionId]);

      const applySessionBundle = useCallback((bundle) => {
        if (!bundle || typeof bundle !== "object") return;

        const bucketMap = [
          { key: "active", tab: "Active" },
          { key: "queued", tab: "Queued" },
          { key: "dispatched", tab: "Dispatched" },
          { key: "actionable", tab: "Actionable" },
          { key: "preorder", tab: "Pre-order" },
          { key: "waitingAssembly", tab: "Waiting for Assembly" }
        ];

        const nextDeliveries = [];
        const nextCounts = {};

        bucketMap.forEach(({ key, tab }) => {
          const payload = bundle[key];
          const recs = Array.isArray(payload?.records)
            ? payload.records
            : Array.isArray(payload)
            ? payload
            : [];
          recs.forEach((r) => nextDeliveries.push(mapHurrierRecordToDelivery(r, tab)));
          nextCounts[tab] = payload?.metadata?.total_count ?? recs.length;
        });

        setDeliveries(nextDeliveries);
        setTabCounts(nextCounts);

        if (bundle.stats && Array.isArray(bundle.stats.cities)) {
          const summaries = [];
          const zones = [];

          bundle.stats.cities.forEach((c) => {
            const s = c.stat || {};
            summaries.push({
              city: c.city_name,
              queued: s.queued_count ?? 0,
              queuedPct: s.queued_percent ?? 0,
              dispatched: s.dispatched_count ?? 0,
              dispatchedPct: s.dispatched_percent ?? 0,
              active: s.active_count ?? 0,
              activePct: s.active_percent ?? 0,
              delay: `${Number(s.delay || 0).toFixed(1)}m`,
              puPct: s.picked_up_percent ?? 0,
              doPct: s.drop_off_percent ?? 0,
              zeroDel: s.zero_deliveries ?? 0,
              lowDel: s.low_deliveries ?? 0,
              medDel: s.medium_deliveries ?? 0,
              highDel: s.high_deliveries ?? 0,
              starting: s.couriers_in_starting ?? 0,
              working: s.couriers_in_working ?? 0,
              ending: s.couriers_in_ending ?? 0,
              tempBreak: s.couriers_in_temp_break ?? 0,
              break: s.couriers_in_break ?? 0
            });

            (c.zones || []).forEach((z) => {
              const zDelay = `${Number(z.stat?.delay || 0).toFixed(1)}m`;
              (z.starting_points || []).forEach((sp) => {
                const st = sp.stat || {};
                zones.push({
                  id: sp.id,
                  zone: sp.name,
                  city: c.city_name,
                  starting: st.couriers_in_starting ?? 0,
                  working: st.couriers_in_working ?? 0,
                  ending: st.couriers_in_ending ?? 0,
                  break: st.couriers_in_break ?? 0,
                  tempBreak: st.couriers_in_temp_break ?? 0,
                  delay: st.delay ? `${Number(st.delay).toFixed(1)}m` : zDelay,
                  queued: st.queued_count ?? 0,
                  dispatched: st.dispatched_count ?? 0,
                  active: st.active_count ?? 0,
                  puPercent: st.picked_up_percent ?? 0,
                  doPercent: st.drop_off_percent ?? 0,
                  zeroDel: st.zero_deliveries ?? 0,
                  lowDel: st.low_deliveries ?? 0,
                  medDel: st.medium_deliveries ?? 0,
                  highDel: st.high_deliveries ?? 0
                });
              });
            });
          });

          if (summaries.length > 0) setCitySummary(summaries);
          if (zones.length > 0) setCouriers(zones);
        }

        if (Array.isArray(bundle.discoveredZonesList) && bundle.discoveredZonesList.length > 0) {
          setDiscoveredZonesFromBundle(bundle.discoveredZonesList);
        }

        if (Array.isArray(bundle.dispatchers)) {
          setDispatcherStats(
            bundle.dispatchers.map((d) => ({
              picked_by: d.picked_by || d.email || "Dispatcher",
              picked: d.picked ?? 0,
              processing: d.processing ?? 0,
              max_picked_for: d.min_picked_at ? formatRelativeDeadline(d.min_picked_at).replace("-", "") : "-"
            }))
          );
        }

        const rawIssues = Array.isArray(bundle.issues?.issues)
          ? bundle.issues.issues
          : Array.isArray(bundle.issues?.records)
          ? bundle.issues.records
          : Array.isArray(bundle.issues)
          ? bundle.issues
          : [];
        setIssuesList(rawIssues);

        if (bundle.syncedAt) {
          const d = new Date(bundle.syncedAt);
          if (!Number.isNaN(d.getTime())) {
            setLastSyncTime(d.toLocaleTimeString("en-US", { hour12: true }));
          }
        }
        setConnectionStatus("live");
      }, []);

      const fetchMySessionBundleFromFirebase = useCallback(async () => {
        if (!isZoneSetupConfirmed) return;
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/session_bundles/${sessionId}.json`, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (data) {
            applySessionBundle(data);
          } else {
            setConnectionStatus("waiting");
          }
        } catch {
          setConnectionStatus("error");
        }
      }, [applySessionBundle, isZoneSetupConfirmed, sessionId]);

      useEffect(() => {
        if (!isZoneSetupConfirmed) return;
        fetchMySessionBundleFromFirebase();
        const interval = setInterval(fetchMySessionBundleFromFirebase, 2000);
        return () => clearInterval(interval);
      }, [fetchMySessionBundleFromFirebase, isZoneSetupConfirmed]);

      const matchesZoneFilter = useCallback(
        (delivery) => {
          if (selectedZoneIds.length === 0) return false;
          const recZoneIds = (delivery.zoneObjects || [])
            .map((zo) => Number(zo.id))
            .filter((n) => !Number.isNaN(n) && n > 0);
          if (recZoneIds.some((zid) => selectedZoneIds.map(Number).includes(zid))) return true;

          const recNames = [
            ...(delivery.zonesList || []),
            ...(delivery.zoneObjects || []).map((zo) => zo.name),
            delivery.zone
          ]
            .map((n) => normalizeText(n).toLowerCase())
            .filter(Boolean);

          return selectedZoneNames.some((selName) =>
            recNames.some((rn) => rn === selName || rn.includes(selName) || selName.includes(rn))
          );
        },
        [selectedZoneIds, selectedZoneNames]
      );

      const baseTabDeliveries = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return deliveries.filter((d) => {
          const matchesTab = d.tab === activeTab;
          const matchesZone = matchesZoneFilter(d);
          const matchesSearch =
            !q ||
            d.id.toLowerCase().includes(q) ||
            d.vendor.toLowerCase().includes(q) ||
            d.courier.toLowerCase().includes(q) ||
            d.zone.toLowerCase().includes(q);
          return matchesTab && matchesZone && matchesSearch;
        });
      }, [deliveries, activeTab, matchesZoneFilter, searchQuery]);

      const martBranchesSummary = useMemo(() => {
        const martOrders = baseTabDeliveries.filter((d) => isTalabatMartVendor(d.vendor));
        const branchMap = new Map();
        martOrders.forEach((d) => {
          const label = extractMartBranchLabel(d.vendor);
          const isLate = d.deadline.includes("-") || d.deadline === "Late";
          const current = branchMap.get(label) || { label, count: 0, late: 0 };
          current.count += 1;
          if (isLate) current.late += 1;
          branchMap.set(label, current);
        });

        return {
          totalMartCount: martOrders.length,
          branches: Array.from(branchMap.values()).sort((a, b) => b.count - a.count)
        };
      }, [baseTabDeliveries]);

      const filteredDeliveries = useMemo(() => {
        const list = baseTabDeliveries.filter((d) => {
          const isLate = d.deadline.includes("-") || d.deadline === "Late";
          const hasCash = d.instructions.includes("Cash");
          const hasCard = d.instructions.includes("Card");
          const isMart = isTalabatMartVendor(d.vendor);
          const isDarkstore = isMart || d.instructions.includes("Darkstores");
          const isRestaurant =
            !isDarkstore && (d.instructions.includes("Restaurants") || d.instructions.includes("Supermarket"));

          if (activeQuickFilter === "Delayed" && !isLate) return false;
          if (activeQuickFilter === "Cash" && !hasCash) return false;
          if (activeQuickFilter === "Card" && !hasCard) return false;
          if (activeQuickFilter === "Restaurants" && !isRestaurant) return false;
          if (activeQuickFilter === "Darkstores") {
            if (!isDarkstore) return false;
            if (selectedMartBranch !== "ALL") {
              const branchLabel = extractMartBranchLabel(d.vendor);
              if (normalizeText(branchLabel) !== normalizeText(selectedMartBranch)) return false;
            }
          }
          if (activeQuickFilter === "Split" && !d.isSplit) return false;

          return true;
        });

        const getDeadlineMinutes = (d) => {
          const iso =
            d.rawRecord?.order?.scheduled_dropoff_at ||
            d.rawRecord?.scheduled_dropoff_at ||
            d.rawRecord?.order?.promised_delivery_at;
          if (!iso) return 0;
          const t = new Date(iso).getTime();
          if (Number.isNaN(t)) return 0;
          return Math.round((t - Date.now()) / 60000);
        };

        return [...list].sort((a, b) => {
          if (orderSortMode === "hurrier_order") return 0;
          const ma = getDeadlineMinutes(a);
          const mb = getDeadlineMinutes(b);
          if (orderSortMode === "live_first") {
            const aIsRecent = ma > -1440;
            const bIsRecent = mb > -1440;
            if (aIsRecent !== bIsRecent) return aIsRecent ? -1 : 1;
            return ma - mb;
          }
          return ma - mb;
        });
      }, [baseTabDeliveries, activeQuickFilter, selectedMartBranch, orderSortMode]);

      const selectedOrderFullView = useMemo(() => {
        if (!selectedOrder) return null;
        const doc = liveOrderDetailDoc || {};
        const rec = selectedOrder.rawRecord || {};
        const recOrder = rec.order || {};
        const apiOrder = doc.order || doc.detail || {};
        const orderObj = {
          ...rec,
          ...recOrder,
          ...apiOrder
        };
        const orderDetailObj = apiOrder.detail || recOrder.detail || {};
        const timingObj = apiOrder.timing || recOrder.timing || {};
        const estimationsObj = apiOrder.estimations || recOrder.estimations || {};
        const vendorObj = apiOrder.vendor || recOrder.vendor || {};

        const customerInfo = extractCustomerInfoFromOrder(orderObj, doc);

        const vendorName = normalizeText(
          vendorObj.vendor_name || orderObj.vendor_name || orderObj.restaurant_name || selectedOrder.vendor || "Unknown Vendor"
        );
        const vendorOrderNo = vendorObj.vendor_order_number || orderObj.vendor_order_number || selectedOrder.vo || "-";
        const globalEntityId = orderObj.global_entity_id || "HF_EG";
        const platformName = orderObj.platform || (isTalabatMartVendor(vendorName) ? "talabat" : "TB_OT");
        const vendorCode = vendorObj.vendor_code || orderObj.vendor_code || orderObj.vendor_id || "-";

        const rawOrderValue = orderObj.order_value ?? recOrder.order_value;
        const orderValueStr = rawOrderValue !== undefined ? formatPiastersMoney(rawOrderValue, "EGP") : selectedOrder.orderValue;

        const dteMeters =
          estimationsObj.pickup_to_drop_off_distance ??
          estimationsObj.distance_and_time_estimated_dte?.bike?.distances ??
          estimationsObj.distance_and_time_estimated_dte?.car?.distances ??
          rec.distance;
        const distanceStr =
          typeof dteMeters === "number"
            ? `${(dteMeters > 50 ? dteMeters / 1000 : dteMeters).toFixed(2)} KM`
            : selectedOrder.distance;

        const prepDurationStr = formatDurationSecondsToMin(
          orderDetailObj.prep_duration ?? orderObj.prep_duration
        );
        const courierDelayStr = formatDurationSecondsToMin(
          orderObj.estimated_courier_delay ?? orderObj.courier_delay ?? 0
        );

        const pickupAddrObj =
          apiOrder.pickup_address || recOrder.pickup_address || rec.pickup_address || {};
        const dropoffAddrObj =
          apiOrder.drop_off_address ||
          apiOrder.dropoff_address ||
          recOrder.dropoff_address ||
          rec.dropoff_address ||
          {};

        const pickupAddressStr =
          normalizeText(
            pickupAddrObj.street_address ||
              pickupAddrObj.address_line_1 ||
              pickupAddrObj.formatted_address ||
              pickupAddrObj.address
          ) || "-";

        const pickupAreaBanner = normalizeText(
          pickupAddrObj.special_instructions ||
            [
              pickupAddrObj.city_name || pickupAddrObj.city ? `City: ${pickupAddrObj.city_name || pickupAddrObj.city}` : "",
              pickupAddrObj.district || pickupAddrObj.area ? `Area: ${pickupAddrObj.district || pickupAddrObj.area}` : ""
            ]
              .filter(Boolean)
              .join(" ")
        );

        const dropoffAddressStr =
          customerInfo.streetAddress ||
          normalizeText(
            dropoffAddrObj.street_address ||
              dropoffAddrObj.address_line_1 ||
              dropoffAddrObj.formatted_address ||
              dropoffAddrObj.address
          ) ||
          "-";

        const customerUpdatedStr = formatReadableTimestamp(
          dropoffAddrObj.updated_at || orderObj.customer_details_updated_at || orderObj.updated_at
        );

        const orderBadges = [...selectedOrder.instructions];
        if (
          orderObj.show_proof_of_pickup ||
          orderObj.proof_of_pickup_link ||
          (Array.isArray(orderObj.tags) && orderObj.tags.some((t) => /proof_of_pickup/i.test(String(t))))
        ) {
          if (!orderBadges.includes("Proof of pickup")) orderBadges.push("Proof of pickup");
        }

        const rawDeliveries = Array.isArray(doc.deliveries) && doc.deliveries.length > 0 ? doc.deliveries : [rec];
        const allEvents = [];
        const riderMap = new Map();
        const transitionTimeByState = new Map();
        const structuredDeliveries = [];

        rawDeliveries.forEach((del, dIdx) => {
          const delId = del.id || del.delivery_id || selectedOrder.id;
          const delStatusRaw = del.status || selectedOrder.status || "Active";
          const delStatusLabel = humanizeSnakeCase(delStatusRaw);
          const delZones = Array.isArray(del.starting_points)
            ? del.starting_points.map((sp) => (typeof sp === "object" ? sp?.name || sp?.id : sp)).filter(Boolean).join(", ")
            : selectedOrder.zone;
          const delCourier = del.courier_name || del.courier?.name || selectedOrder.courier || "-";
          const delCourierId = del.courier_id || del.courier?.id || selectedOrder.courierId || null;
          const delUtilization = del.utilization ?? del.capacity ?? "-";
          const transitions = Array.isArray(del.transitions) ? del.transitions : [];
          const delEvents = [];

          transitions.forEach((tr, tIdx) => {
            const stateRaw = String(tr.to_state || tr.state || tr.status || "").toLowerCase();
            const eventTypeRaw = String(tr.event_type || "").toLowerCase();
            const eventLabel = stateRaw ? humanizeSnakeCase(stateRaw) : humanizeSnakeCase(eventTypeRaw || "Event");

            const rawTimeVal =
              tr.created_at ||
              tr.metadata?.performed_at ||
              tr.timestamp ||
              tr.event_timestamp;

            if (stateRaw && rawTimeVal && !transitionTimeByState.has(stateRaw)) {
              transitionTimeByState.set(stateRaw, rawTimeVal);
            }

            const timeSec = formatExactTimeSeconds(rawTimeVal);
            const courierName =
              tr.courier_name ||
              tr.courier?.name ||
              tr.metadata?.courier_name ||
              (stateRaw === "queued" && tIdx === 0 ? "-" : delCourier) ||
              "-";
            const eventCourierId =
              tr.courier_id ||
              tr.courier?.id ||
              tr.metadata?.courier_id ||
              (courierName === delCourier ? delCourierId : null);

            const subReasonRaw =
              tr.un_dispatch_type ||
              tr.dispatch_type ||
              tr.metadata?.undispatch_type ||
              tr.metadata?.dispatch_type ||
              tr.reason ||
              "";
            const subLabel = humanizeSnakeCase(subReasonRaw);

            const estAcceptTime = formatShortEstTime(
              tr.expected_accept_time || tr.metadata?.expected_accept_time
            );
            const estPickupArrival = formatShortEstTime(
              tr.estimated_pickup_arrival_at || tr.metadata?.estimated_pickup_arrival_at
            );
            const estPickupDeparture = formatShortEstTime(
              tr.estimated_pickup_departure_at || tr.metadata?.estimated_pickup_departure_at
            );
            const estDropoffArrival = formatShortEstTime(
              tr.estimated_drop_off_arrival_at || tr.metadata?.estimated_dropoff_arrival_at
            );
            const rawDropDep =
              tr.estimated_drop_off_departure_at || tr.metadata?.estimated_dropoff_departure_at;
            const estDropoffDeparture = formatShortEstTime(rawDropDep);
            const estDropoffDelta = formatDiffBetweenIsos(tr.scheduled_drop_off_at, rawDropDep);

            const locObj = tr.courier_location;
            const locUrl =
              locObj && typeof locObj.latitude === "number" && typeof locObj.longitude === "number"
                ? `https://www.google.com/maps?q=${locObj.latitude},${locObj.longitude}`
                : "";

            if (courierName && courierName !== "-" && courierName !== "Assigning...") {
              const entry = riderMap.get(courierName) || {
                courierName,
                dispatchedAt: "-",
                acceptedAt: "-",
                pickedUpAt: "-",
                removedAt: "-",
                accepted: false
              };
              if (stateRaw.includes("dispatch") || stateRaw.includes("notif")) {
                if (entry.dispatchedAt === "-") entry.dispatchedAt = timeSec;
              }
              if (stateRaw.includes("accept")) {
                entry.accepted = true;
                if (entry.acceptedAt === "-") entry.acceptedAt = timeSec;
              }
              if (stateRaw.includes("pick")) {
                entry.accepted = true;
                if (entry.pickedUpAt === "-") entry.pickedUpAt = timeSec;
              }
              if (
                stateRaw.includes("undispatch") ||
                stateRaw.includes("cancel") ||
                stateRaw.includes("reject") ||
                stateRaw.includes("unassign")
              ) {
                entry.removedAt = timeSec;
              }
              riderMap.set(courierName, entry);
            }

            const evObj = {
              key: `${dIdx}-${tr.id || tIdx}`,
              deliveryId: delId,
              timeSec,
              eventLabel,
              subLabel,
              courierName,
              courierId: eventCourierId,
              locUrl,
              estAcceptTime,
              estPickupArrival,
              estPickupDeparture,
              estDropoffArrival,
              estDropoffDeparture,
              estDropoffDelta,
              isAccepted: stateRaw.includes("accept"),
              isRemoved:
                stateRaw.includes("undispatch") || stateRaw.includes("cancel") || stateRaw.includes("unassign")
            };

            delEvents.push(evObj);
            allEvents.push(evObj);
          });

          structuredDeliveries.push({
            id: delId,
            status: delStatusLabel,
            zones: delZones,
            courier: delCourier,
            courierId: delCourierId,
            utilization: delUtilization,
            events: delEvents
          });
        });

        const orderedAtRaw =
          orderObj.placed_at ||
          orderObj.ordered_at ||
          orderObj.created_at ||
          transitionTimeByState.get("queued");
        const sentToRestRaw =
          orderObj.send_to_restaurant_at ||
          recOrder.send_to_restaurant_at;
        const restConfirmedRaw =
          orderObj.restaurant_confirmed_at ||
          recOrder.restaurant_confirmed_at;
        const pickupCommittedRaw =
          timingObj.original_scheduled_pickup_at ||
          timingObj.original_pickup_time ||
          recOrder.original_scheduled_pickup_at;
        const foodReadyRaw =
          orderObj.food_is_ready_at ||
          orderObj.food_ready_at;
        const pickedUpRaw =
          transitionTimeByState.get("picked_up") ||
          transitionTimeByState.get("left_pickup") ||
          orderObj.picked_up_at;
        const promisedDeliveryRaw =
          estimationsObj.promised_delivery_time ||
          timingObj.scheduled_drop_off_at ||
          recOrder.scheduled_dropoff_at;

        const timeChecks = [
          { label: "Ordered at", value: formatReadableTimestamp(orderedAtRaw) },
          { label: "Send to restaurant", value: formatShortTimeOnly(sentToRestRaw) },
          { label: "Restaurant confirmed at", value: formatShortTimeOnly(restConfirmedRaw) },
          { label: "Pickup - Committed", value: formatShortTimeOnly(pickupCommittedRaw) },
          { label: "Food is ready at", value: formatShortTimeOnly(foodReadyRaw) },
          { label: "Picked up at", value: pickedUpRaw ? formatExactTimeSeconds(pickedUpRaw) : "-" },
          { label: "Promised delivery time", value: formatReadableTimestamp(promisedDeliveryRaw) }
        ];

        const statusSinceStr = formatSinceTimestamp(
          orderObj.current_state_transition || orderObj.event_timestamp || pickedUpRaw || orderedAtRaw
        );

        const ridersHistory = Array.from(riderMap.values());
        const notes = Array.isArray(doc.dispatcher_notes)
          ? doc.dispatcher_notes.map((n, idx) => ({
              id: n.id || idx,
              author: n.created_by || n.author || n.user_email || n.email || n.user?.email || "Dispatcher",
              createdAt: formatReadableTimestamp(n.created_at || n.timestamp || n.updated_at),
              text: n.note || n.body || n.text || n.content || n.comment || n.message || ""
            }))
          : [];
        const orderIssues = Array.isArray(doc.order_issues) ? doc.order_issues : [];

        const rawOrderItems = Array.isArray(orderDetailObj.order_items) ? orderDetailObj.order_items : [];
        const parsedItems = rawOrderItems.length > 0
          ? rawOrderItems.map((it, idx) => ({
              id: it.id || idx + 1,
              name: normalizeText(it.item || it.name || it.title || "Item"),
              quantity: Number(it.quantity || it.qty || 1),
              volume: Number(it.volume || 0),
              weight: Number(it.weight || 0),
              priceFormatted: formatPiastersMoney(it.price, "EGP"),
              subItems: Array.isArray(it.sub_items) ? it.sub_items : []
            }))
          : [
              {
                id: 1,
                name: `${vendorName} #${vendorOrderNo}`,
                quantity: 1,
                volume: 0,
                weight: 0,
                priceFormatted: orderValueStr,
                subItems: []
              }
            ];

        const totalItemsQty = parsedItems.reduce((acc, it) => acc + it.quantity, 0);
        const totalItemsVol = parsedItems.reduce((acc, it) => acc + it.volume, 0) || Number(orderObj.total_volume || 0);
        const totalItemsWeight = parsedItems.reduce((acc, it) => acc + it.weight, 0) || Number(orderObj.total_weight || 0);

        const itemsSummary = {
          totalQty: totalItemsQty,
          totalVolume: totalItemsVol.toFixed(3),
          totalWeight: totalItemsWeight.toFixed(3),
          subtotal: orderObj.subtotal !== undefined ? formatPiastersMoney(orderObj.subtotal, "EGP") : orderValueStr,
          deliveryFee: orderObj.delivery_fee !== undefined ? formatPiastersMoney(orderObj.delivery_fee, "EGP") : "0.00 EGP",
          total: orderValueStr,
          payAtPickup: formatPiastersMoney(orderDetailObj.cod_pay_at_pickup ?? 0, "EGP"),
          collectAtDropoff: formatPiastersMoney(orderDetailObj.cod_collect_at_drop_off ?? 0, "EGP"),
          deliveryBags: orderObj.total_bags ?? 0
        };

        return {
          ...selectedOrder,
          orderBadges,
          statusSinceStr,
          customerUpdatedStr,
          customerName: customerInfo.name,
          customerPhone: customerInfo.phone,
          apartment: customerInfo.apartment,
          building: customerInfo.building,
          floor: customerInfo.floor,
          zipcode: customerInfo.zipcode,
          intercom: customerInfo.intercom,
          entrance: customerInfo.entrance,
          deliveryNote: customerInfo.deliveryNote,
          vendorName,
          vendorOrderNo,
          globalEntityId,
          platformName,
          vendorCode,
          orderValue: orderValueStr,
          distance: distanceStr,
          prepDurationStr,
          courierDelayStr,
          pickupAddress: pickupAddressStr,
          pickupAreaBanner,
          dropoffAddress: dropoffAddressStr,
          timeChecks,
          deliveriesList: rawDeliveries,
          structuredDeliveries,
          allEvents,
          ridersHistory,
          notes,
          orderIssues,
          items: parsedItems,
          itemsSummary,
          proofOfPickupLink: orderObj.proof_of_pickup_link || "",
          isLoadedFromApi: Boolean(liveOrderDetailDoc)
        };
      }, [selectedOrder, liveOrderDetailDoc]);

      const filteredZonesForModal = useMemo(() => {
        const q = zoneSearchQuery.trim().toLowerCase();
        return availableZones.filter((z) => {
          const nameClean = normalizeText(z.name);
          if (!nameClean || !isRealHurrierZoneId(z.id)) return false;
          if (/^(vo\s*#|hf_eg|\d{6,})/i.test(nameClean)) return false;
          if (/\b(vo\s*#|talabat\s*mart|طلبات\s*مارت)\b/i.test(nameClean)) return false;
          return !q || nameClean.toLowerCase().includes(q) || String(z.id).includes(q) || z.city.toLowerCase().includes(q);
        });
      }, [availableZones, zoneSearchQuery]);

      const effectiveTabCounts = useMemo(() => {
        const perTab = {};
        ["Active", "Queued", "Dispatched", "Actionable", "Pre-order", "Waiting for Assembly"].forEach((t) => {
          const localCount = deliveries.filter((d) => d.tab === t && matchesZoneFilter(d)).length;
          perTab[t] = localCount > 0 ? localCount : tabCounts[t] ?? 0;
        });
        return perTab;
      }, [deliveries, matchesZoneFilter, tabCounts]);

      const selectedZoneCouriers = useMemo(() => {
        if (selectedZoneIds.length === 0) return couriers;
        const idSet = new Set(selectedZoneIds.map(Number));
        const filtered = couriers.filter((c) => idSet.has(Number(c.id)));
        return filtered.length > 0 ? filtered : couriers;
      }, [couriers, selectedZoneIds]);

      const renderDashboardView = () => (

                Selected Zones Performance &amp; Rider Shifts ({selectedZoneCouriers.length} Zones)
              </span>

            </div>

                  </tr>

                  {selectedZoneCouriers.map((sp) => (

          <div className="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">

              <span className="text-xs font-bold uppercase tracking-wider text-gray-600">

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs whitespace-nowrap">

                  <tr className="border-b border-gray-200 text-gray-500 font-semibold bg-white">

                    <th className="py-3 px-3">DELAY</th>

                  </tr>

                  <div className="text-[15px] text-gray-800">
