    function isRealHurrierZoneId(id) {
      const n = Number(id);
      return Number.isInteger(n) && n >= 1 && n < 90000;
    }

    function normalizeText(v) {
      return String(v || "")
        .replace(/&#39;/g, "'")
        .replace(/&amp;/g, "&")
        .replace(/&quot;/g, '"')
        .replace(/\s+/g, " ")
        .trim();
    }

    function normalizeHurrierCity(rawCity, zonesList = []) {
      const c = normalizeText(rawCity).toLowerCase();
      if (c.includes("alex") || c.includes("إسكندر") || c.includes("اسكندر")) return "Alexandria";
      if (
        c.includes("cairo") ||
        c.includes("قاهر") ||
        c.includes("giza") ||
        c.includes("جيز") ||
        c.includes("october") ||
        c.includes("أكتوبر") ||
        c.includes("اكتوبر") ||
        c.includes("حلوان") ||
        c.includes("معادي")
      ) {
        return "Cairo";
      }
      if (Array.isArray(zonesList) && zonesList.length > 0) {
        const firstZ = normalizeText(zonesList[0]).toLowerCase();
        const found = ALL_ZONES_CATALOG.find((z) => z.name.toLowerCase() === firstZ);
        if (found?.city) return found.city;
      }
      return rawCity ? normalizeText(rawCity) : "Cairo";
    }

    function isTalabatMartVendor(vendorName) {
      const s = normalizeText(vendorName).toLowerCase();
      return s.includes("talabat mart") || s.includes("طلبات مارت") || s.includes("tmart");
    }

    function extractMartBranchLabel(vendorName) {
      const raw = normalizeText(vendorName);
      if (!raw) return "Unknown Mart";
      const cleaned = raw
        .replace(/^vo\s*#?\d+\s*-\s*/i, "")
        .replace(/^talabat\s*mart\s*,?\s*/i, "")
        .replace(/^طلبات\s*مارت\s*,?\s*/i, "")
        .replace(/^tmart\s*,?\s*/i, "")
        .trim();
      return cleaned || raw;
    }

    function isExactOrderIdPattern(q) {
      const clean = String(q || "")
        .trim()
        .replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "")
        .trim();
      return /^\d{7,14}(-\d+)?$/.test(clean);
    }

    function normalizePhoneDigits(rawStr) {
      const digits = String(rawStr || "").replace(/\D/g, "");
      if (!digits) return { rawDigits: "", core10: "" };
      let core = digits;
      if (core.startsWith("0020") && core.length >= 13) {
        core = core.slice(4);
      } else if (core.startsWith("20") && core.length === 12 && core[2] === "1") {
        core = core.slice(2);
      } else if (core.startsWith("0") && core.length === 11 && core[1] === "1") {
        core = core.slice(1);
      }
      const core10 = core.length === 10 && core.startsWith("1") ? core : "";
      return { rawDigits: digits, core10 };
    }

    function isPhoneLikeQuery(q) {
      const trimmed = String(q || "").trim();
      if (!trimmed) return false;
      const { rawDigits, core10 } = normalizePhoneDigits(trimmed);
      if (core10.length === 10) return true;
      return rawDigits.length >= 9 && /^(\+?20|0020|01)/.test(trimmed.replace(/[\s\-()]+/g, ""));
    }

    function isRiderIdLikeQuery(q) {
      const trimmed = String(q || "").trim();
      if (!trimmed || isPhoneLikeQuery(trimmed)) return false;
      if (/^\d{3,9}$/.test(trimmed)) return true;
      if (/^\d{10}$/.test(trimmed) && !trimmed.startsWith("47")) return true;
      return false;
    }

    function formatRelativeDeadline(isoDate, isPreorder = false) {
      if (!isoDate) return "-";
      const target = new Date(isoDate);
      if (Number.isNaN(target.getTime())) return "-";
      if (isPreorder) {
        return target.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      }
      const diffMins = Math.round((target.getTime() - Date.now()) / 60000);
      const absMins = Math.abs(diffMins);
      const sign = diffMins < 0 ? "-" : "";
      if (absMins >= 60) {
        const h = Math.floor(absMins / 60);
        const m = absMins % 60;
        return `${sign}${h}h ${m}min`;
      }
      return `${sign}${absMins}min`;
    }

    function formatDiffBetweenIsos(scheduledIso, estimatedIso) {
      if (!scheduledIso || !estimatedIso) return "";
      const s = new Date(scheduledIso).getTime();
      const e = new Date(estimatedIso).getTime();
      if (Number.isNaN(s) || Number.isNaN(e)) return "";
      const diffMins = Math.round((s - e) / 60000);
      return `${diffMins}min`;
    }

    function formatReadableTimestamp(isoDate) {
      if (!isoDate) return "-";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleString("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatShortTimeOnly(isoDate) {
      if (!isoDate) return "-";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatExactTimeSeconds(val) {
      if (!val) return "-";
      const d = typeof val === "number" ? new Date(val > 1e12 ? val : val * 1000) : new Date(val);
      if (Number.isNaN(d.getTime())) return String(val);
      return d.toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });
    }

    function formatShortEstTime(val) {
      if (!val) return "-";
      const d = typeof val === "number" ? new Date(val > 1e12 ? val : val * 1000) : new Date(val);
      if (Number.isNaN(d.getTime())) return String(val);
      return d.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatSinceTimestamp(isoDate) {
      if (!isoDate) return "";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "";
      const dayPart = d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
      const timePart = d
        .toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: true })
        .toLowerCase();
      return `Since ${dayPart} ${timePart}`;
    }

    function formatDurationSecondsToMin(secondsVal) {
      if (secondsVal === null || secondsVal === undefined || secondsVal === "") return "-";
      const s = Number(secondsVal);
      if (Number.isNaN(s)) return String(secondsVal);
      return `${Math.round(s / 60)}m`;
    }

    function formatCompletedTimingSeconds(secondsVal) {
      if (secondsVal === null || secondsVal === undefined || secondsVal === "") return "-";
      const totalSec = Math.round(Number(secondsVal));
      if (Number.isNaN(totalSec)) return String(secondsVal);
      const absSec = Math.abs(totalSec);
      const sign = totalSec < 0 ? "-" : "";
      if (absSec < 60) return `${sign}${absSec}s`;
      const mins = Math.floor(absSec / 60);
      const remSec = absSec % 60;
      if (mins >= 60) {
        const hrs = Math.floor(mins / 60);
        const remMin = mins % 60;
        return `${sign}${hrs}h ${remMin}m`;
      }
      return remSec > 0 ? `${sign}${mins}m ${remSec}s` : `${sign}${mins}m`;
    }

    function humanizeSnakeCase(str) {
      return String(str || "")
        .split("_")
        .map((w) => (w ? w.charAt(0).toUpperCase() + w.slice(1) : ""))
        .join(" ")
        .trim();
    }

    function formatPiastersMoney(val, currency = "EGP") {
      if (val === null || val === undefined || val === "") return "-";
      if (typeof val === "string" && /[A-Z]{3}|\$/.test(val)) return val;
      const num = Number(val);
      if (Number.isNaN(num)) return String(val);
      return `${(num / 100).toFixed(2)} ${currency}`;
    }

    function formatHurrierDollarPrice(val) {
      if (val === null || val === undefined || val === "") return "$0.00";
      if (typeof val === "string" && val.trim().startsWith("$")) return val.trim();
      const num = Number(val);
      if (Number.isNaN(num)) return String(val);
      const sign = num < 0 ? "-" : "";
      return `${sign}$${(Math.abs(num) / 100).toFixed(2)}`;
    }

    function formatMetricNumber(val) {
      const num = Number(val ?? 0);
      if (Number.isNaN(num) || num === 0) return "0";
      return String(Number(num.toFixed(3)));
    }

    function getCairoTodayDateString() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Africa/Cairo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function getCairoTimeHHMM(offsetMinutes = 0) {
      const d = new Date(Date.now() + offsetMinutes * 60000);
      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "Africa/Cairo",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(d);
    }

    function parseCairoDateTimeToMs(dateStr, timeStr) {
      if (!dateStr || !timeStr) return 0;
      const approxUtc = new Date(`${dateStr}T${timeStr}:00Z`);
      if (Number.isNaN(approxUtc.getTime())) return 0;
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Africa/Cairo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(approxUtc);
      const p = {};
      parts.forEach((pt) => {
        p[pt.type] = pt.value;
      });
      const hr = p.hour === "24" ? "00" : p.hour;
      const asUtcMs = Date.UTC(
        Number(p.year),
        Number(p.month) - 1,
        Number(p.day),
        Number(hr),
        Number(p.minute),
        Number(p.second || 0)
      );
      const offsetMs = asUtcMs - approxUtc.getTime();
      return approxUtc.getTime() - offsetMs;
    }

    function extractCompletedTimestampFromRec(rec) {
      if (rec?.__completed_at_ms && Number(rec.__completed_at_ms) > 0) {
        return Number(rec.__completed_at_ms);
      }
      const order = rec?.order || {};
      const primaryDel = rec?.primary_delivery || {};
      const timings = rec?.primary_delivery_timings || {};

      const candidates = [
        primaryDel.completed_at,
        primaryDel.delivered_at,
        primaryDel.dropped_off_at,
        primaryDel.finished_at,
        timings.completed_at,
        timings.delivered_at,
        timings.dropped_off_at,
        order.current_state_transition,
        order.completed_at,
        order.delivered_at,
        order.dropped_off_at,
        order.finished_at,
        rec?.completed_at,
        rec?.delivered_at,
        rec?.dropped_off_at
      ];

      for (const val of candidates) {
        if (val) {
          const ms = typeof val === "number" ? (val > 1e12 ? val : val * 1000) : new Date(val).getTime();
          if (!Number.isNaN(ms) && ms > 946684800000) return ms;
        }
      }

      const placedMs = order.placed_at ? new Date(order.placed_at).getTime() : 0;
      const rawTotalTimeSec = Number(timings.total_time);
      if (placedMs > 0 && !Number.isNaN(rawTotalTimeSec) && rawTotalTimeSec > 0) {
        return placedMs + rawTotalTimeSec * 1000;
      }

      if (order.updated_at) {
        const updMs = new Date(order.updated_at).getTime();
        if (!Number.isNaN(updMs) && updMs > 946684800000) return updMs;
      }
      return 0;
    }

    function mapHurrierCompletedRecord(rec) {
      const order = rec?.order || {};
      const primaryDel = rec?.primary_delivery || {};
      const timings = rec?.primary_delivery_timings || {};
      const dropoff = order.drop_off_address || order.dropoff_address || {};
      const sps = Array.isArray(dropoff.starting_points)
        ? dropoff.starting_points
        : Array.isArray(rec?.starting_points)
        ? rec.starting_points
        : [];
      const zonesList = sps
        .map((sp) => (typeof sp === "string" ? sp : sp?.name))
        .filter(Boolean);
      const zoneIdsList = sps
        .map((sp) => (sp && typeof sp === "object" && sp.id ? Number(sp.id) : 0))
        .filter((n) => n > 0);

      const codeStr = String(
        order.confirmation_number ||
          order.code ||
          String(order.order_code || "").replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "") ||
          order.id ||
          ""
      ).trim();

      const completedTimestamp = extractCompletedTimestampFromRec(rec);
      const completedAtFormatted = completedTimestamp > 0 ? formatExactTimeSeconds(completedTimestamp) : "-";
      const orderStatusLower = String(order.status || rec?.status || "completed").toLowerCase();
      const placedMs = order.placed_at ? new Date(order.placed_at).getTime() : 0;
      const computedDurationSec =
        completedTimestamp > 0 && placedMs > 0 && completedTimestamp >= placedMs
          ? Math.round((completedTimestamp - placedMs) / 1000)
          : timings.total_time;

      const distMeters = Number(primaryDel.delivery_distance ?? rec?.distance ?? 0);

      return {
        uid: `comp-${order.id || codeStr || Math.random()}`,
        id: codeStr || "-",
        orderCode: order.order_code || (codeStr ? `HF_EG${codeStr}` : ""),
        vo: String(order.vendor_order_number || "-"),
        vendor: normalizeText(order.vendor_name || order.restaurant_name || "-"),
        vendorCode: String(order.vendor_code || "-"),
        city: normalizeHurrierCity(dropoff.city || dropoff.city_name || "", zonesList),
        zone: zonesList.join(", ") || "-",
        zonesList,
        zoneIdsList,
        courier: normalizeText(primaryDel.courier_name || rec?.courier_name || "-"),
        courierId:
          primaryDel.courier_id || rec?.courier_id
            ? String(primaryDel.courier_id || rec?.courier_id)
            : "",
        distance: distMeters > 0 ? `${(distMeters / 1000).toFixed(2)} km` : "-",
        orderValue: formatPiastersMoney(order.total ?? order.order_value),
        acceptTime: formatCompletedTimingSeconds(timings.accepting_time),
        retailerLate: formatCompletedTimingSeconds(timings.vendor_late),
        courierLate: formatCompletedTimingSeconds(timings.courier_late),
        waitTime: formatCompletedTimingSeconds(timings.wait_pickup_time),
        deliveryLate: formatCompletedTimingSeconds(timings.delivery_late),
        timeInBag: formatCompletedTimingSeconds(timings.time_in_bag),
        orderDuration: formatDurationSecondsToMin(computedDurationSec),
        isPreorder: Boolean(order.is_preorder || order.is_pre_order),
        dropoffIssue: normalizeText(order.deliveries_dropoff_issues || "-") || "-",
        completedTimestamp,
        completedAtFormatted,
        orderStatus: orderStatusLower,
        status: "Completed",
        instructions: [],
        raw: rec
      };
    }

    function mapHurrierDeliveryRecord(rec, tabName, idx) {
      const order = rec?.order || {};
      const rawSps = Array.isArray(rec?.starting_points)
        ? rec.starting_points
        : Array.isArray(order?.drop_off_address?.starting_points)
        ? order.drop_off_address.starting_points
        : Array.isArray(order?.dropoff_address?.starting_points)
        ? order.dropoff_address.starting_points
        : [];

      const zonesList = rawSps
        .map((sp) => (typeof sp === "string" ? normalizeText(sp) : normalizeText(sp?.name)))
        .filter(Boolean);

      const zoneIdsList = rawSps
        .map((sp) => {
          if (sp && typeof sp === "object" && sp.id) return Number(sp.id);
          const n = normalizeText(typeof sp === "string" ? sp : sp?.name).toLowerCase();
          const noSp = n.replace(/\s+sp$/i, "").trim();
          const found = ALL_ZONES_CATALOG.find(
            (z) =>
              z.name.toLowerCase() === n ||
              z.name.toLowerCase() === `${n} sp` ||
              z.name.toLowerCase().replace(/\s+sp$/i, "").trim() === noSp
          );
          return found ? Number(found.id) : 0;
        })
        .filter((n) => n > 0);

      const code = String(
        order.code ||
          order.confirmation_number ||
          String(order.order_code || "").replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "") ||
          order.id ||
          rec?.id ||
          ""
      ).trim();

      const isPreorder = Boolean(order.is_pre_order || order.is_preorder || tabName === "Pre-order");
      const deadlineIso =
        order.scheduled_dropoff_at || order.scheduled_drop_off_at || order.scheduled_pickup_at || "";
      const parsedDeadlineMs = deadlineIso ? new Date(deadlineIso).getTime() : NaN;
      const deadlineMs = Number.isNaN(parsedDeadlineMs) ? Number.MAX_SAFE_INTEGER : parsedDeadlineMs;
      const deadline = formatRelativeDeadline(deadlineIso, isPreorder);

      const rawStatus = String(rec?.status || order.status || tabName || "").toLowerCase();
      const courierName =
        normalizeText(rec?.courier_name || "") ||
        (rawStatus === "queued" || rawStatus === "pending" || rawStatus === "scheduled"
          ? "Assigning..."
          : rawStatus === "courier_notified"
          ? "Pending Acceptance"
          : "-");

      const instructions = [];
      if (order.is_cash_collection) instructions.push("Cash");
      if (order.is_card_on_delivery) instructions.push("Card");

      const vt = String(order.vertical_type || order.vendor_vertical_type || "").toLowerCase();
      if (vt === "darkstores" || isTalabatMartVendor(order.vendor_name)) {
        instructions.push("Darkstores");
      } else if (vt === "hypermarket" || vt === "supermarket" || vt === "grocery") {
        instructions.push("Supermarket");
      } else {
        instructions.push("Restaurants");
      }

      const tags = Array.isArray(order.tags) ? order.tags : [];
      const isSplit = tags.includes("split_order") || rec?.is_primary === false;
      if (tags.includes("large_order")) instructions.push("Large Order");

      const distMeters = Number(rec?.distance || 0);
      const placedIso =
        order.placed_at ||
        order.send_to_restaurant_at ||
        order.restaurant_confirmed_at ||
        deadlineIso ||
        "";
      const placedMs = placedIso ? new Date(placedIso).getTime() : 0;

      const dropAddr = order.dropoff_address || order.drop_off_address || {};

      return {
        uid: `${tabName}-${rec?.id || code}-${idx}`,
        id: code || "-",
        orderCode: order.order_code || (code ? `HF_EG${code}` : ""),
        vo: String(order.vendor_order_number || "-"),
        vendor: normalizeText(order.vendor_name || order.restaurant_name || "-"),
        city: normalizeHurrierCity(dropAddr.city || dropAddr.city_name || "", zonesList),
        zone: zonesList.join(", ") || "-",
        zonesList,
        zoneIdsList,
        courier: courierName,
        courierId: rec?.courier_id ? String(rec.courier_id) : "",
        status: humanizeSnakeCase(rec?.status || order.status || tabName),
        deadline,
        deadlineMs,
        time_in: order.scheduled_pickup_at ? formatShortTimeOnly(order.scheduled_pickup_at) : "-",
        time_at: deadlineIso ? formatShortTimeOnly(deadlineIso) : "-",
        distance: distMeters > 0 ? `${(distMeters / 1000).toFixed(2)} km` : "-",
        orderValue: formatPiastersMoney(order.order_value ?? order.total),
        instructions,
        isSplit,
        placedMs: Number.isNaN(placedMs) ? 0 : placedMs,
        raw: rec
      };
    }

    function buildFullOrderView(orderItem, cachedEntry) {

      const rawDeliveries = Array.isArray(cachedEntry?.deliveries?.deliveries)

        : [];

      const status = humanizeSnakeCase(dOrder.status || orderItem?.status || "Active");
      const statusSinceStr = formatSinceTimestamp(dOrder.current_state_transition);
      const platformName = dOrder.platform === "TB_OT" ? "talabat" : dOrder.platform || "talabat";
      const vendorObj = dOrder.vendor || {};
      const vendorName = normalizeText(
        vendorObj.vendor_name || dOrder.restaurant_name || orderItem?.vendor || "-"
      );
      const vendorCode = String(vendorObj.vendor_code || orderItem?.vendorCode || "-");
      const vendorOrderNo = String(vendorObj.vendor_order_number || orderItem?.vo || "-");
      const orderValue = formatPiastersMoney(
        dOrder.order_value ?? dOrder.subtotal ?? orderItem?.raw?.order?.order_value
      ) !== "-"
        ? formatPiastersMoney(dOrder.order_value ?? dOrder.subtotal ?? orderItem?.raw?.order?.order_value)
        : orderItem?.orderValue || "-";

      const pickupObj = dOrder.pickup_address || orderItem?.raw?.order?.pickup_address || {};
      const pickupAddress =
        normalizeText(
          [pickupObj.street_address, pickupObj.district, pickupObj.city_name]
            .filter(Boolean)
            .join(" • ")
        ) || "-";

      const custObj = dOrder.customer || {};
      const customerName = normalizeText(
        custObj.customer_name || orderItem?.raw?.order?.customer_name || "Customer"
      );
      const customerPhone = normalizeText(custObj.customer_phone_number || "");

      const dropObj =
        dOrder.drop_off_address ||
        dOrder.dropoff_address ||
        orderItem?.raw?.order?.drop_off_address ||
        orderItem?.raw?.order?.dropoff_address ||
        {};
      const dropoffParts = [
        dropObj.street_address,
        dropObj.district,
        dropObj.building ? `عقار ${dropObj.building}` : "",
        dropObj.floor ? `دور ${dropObj.floor}` : "",
        dropObj.apartment_number ? `شقة ${dropObj.apartment_number}` : "",
        dropObj.special_instructions
      ].filter(Boolean);
      const dropoffAddress = normalizeText(dropoffParts.join(" — ")) || "-";

      const sortedDeliveries = [...rawDeliveries].sort((a, b) => {
        const aComp = String(a?.status || "").toLowerCase() === "completed" ? 0 : 1;
        const bComp = String(b?.status || "").toLowerCase() === "completed" ? 0 : 1;
        if (aComp !== bComp) return aComp - bComp;
        const aCanc = String(a?.status || "").toLowerCase().includes("cancel") ? 1 : 0;
        const bCanc = String(b?.status || "").toLowerCase().includes("cancel") ? 1 : 0;
        return aCanc - bCanc;
      });

      const structuredDeliveries =
        sortedDeliveries.length > 0
          ? sortedDeliveries.map((del, dIdx) => {
              const delStatusRaw = String(del.status || "").toLowerCase();
              const isCancelledDelivery = delStatusRaw.includes("cancel");
              const delZones = Array.isArray(del.starting_points)
                ? del.starting_points
                    .map((sp) => (typeof sp === "string" ? sp : sp?.name))
                    .filter(Boolean)
                    .join(", ")
                : orderItem?.zone || "-";
              const delCourierName = normalizeText(del.courier_name || orderItem?.courier || "-");
              const delCourierId = String(
                del.courier_id ||
                  (delCourierName !== "-" && delCourierName === normalizeText(orderItem?.courier || "")
                    ? orderItem?.courierId || ""
                    : "")
              );
              const transitions = Array.isArray(del.transitions) ? del.transitions : [];
              const events = transitions.map((tr, tIdx) => {
                const rawCreated = String(tr.created_at || "").trim();
                const timeSec = /^\d{1,2}:\d{2}(:\d{2})?\s*[AP]M$/i.test(rawCreated)
                  ? rawCreated
                  : formatExactTimeSeconds(tr.metadata?.performed_at || rawCreated);
                const toState = String(tr.to_state || "").toLowerCase();
                const isRemoved =
                  Boolean(tr.un_dispatch_type) ||
                  toState.includes("cancel") ||
                  toState.includes("undispatch");
                const subParts = [
                  tr.dispatch_type ? humanizeSnakeCase(tr.dispatch_type) : "",
                  tr.un_dispatch_type ? humanizeSnakeCase(tr.un_dispatch_type) : "",
                  tr.metadata?.split_reason || ""
                ].filter(Boolean);
                const lat = tr.courier_location?.latitude ?? tr.metadata?.courier_lat;
                const lng = tr.courier_location?.longitude ?? tr.metadata?.courier_long;
                const locUrl =
                  lat && lng ? `https://www.google.com/maps?q=${lat},${lng}` : "";

                const rawTrName = normalizeText(tr.courier_name || "");
                const fallbackDelName = tr.courier_id ? normalizeText(del.courier_name || "") : "";
                const evCourierName = rawTrName || fallbackDelName || "-";
                const evCourierId = String(
                  tr.courier_id ||
                    tr.metadata?.courier_id ||
                    (evCourierName !== "-" && evCourierName === normalizeText(del.courier_name || "")
                      ? del.courier_id || ""
                      : "")
                );

                return {
                  key: `${del.id || dIdx}-tr-${tr.id || tIdx}`,
                  timeSec,
                  eventLabel: humanizeSnakeCase(tr.to_state || "Event"),
                  subLabel: subParts.join(" • "),
                  courierName: evCourierName,
                  courierId: evCourierId,
                  isRemoved,
                  locUrl

              return {
                id: String(del.id || `del-${dIdx}`),

                zones: delZones || "-",
                courier: delCourierName,
                courierId: delCourierId,
                utilization:
                  del.utilization !== undefined && del.utilization !== null
                    ? `${del.utilization}%`

                events

          : [
              {

                status: status,
                isCancelledDelivery: status.toLowerCase().includes("cancel"),
                zones: orderItem?.zone || "-",
                courier: orderItem?.courier || "-",
                courierId: orderItem?.courierId || "",
                utilization: "-",
                events: []

      const rawItems = Array.isArray(dOrder?.detail?.order_items)
        ? dOrder.detail.order_items

      const items = rawItems.map((it, idx) => {
        const subList = Array.isArray(it.sub_items)
          ? it.sub_items
              .map((sub) => normalizeText(typeof sub === "string" ? sub : sub?.item || sub?.name || ""))
              .filter(Boolean)
          : [];
        return {
          id: String(it.id || idx),
          name: normalizeText(it.item || it.name || `Item #${idx + 1}`),
          subItems: subList,
          quantity: Number(it.quantity ?? 1),

    function unwrapCourierRecord(entry) {
      let cur = entry;
      let guard = 0;
      while (
        cur &&
        typeof cur === "object" &&
        !Array.isArray(cur) &&
        (cur.courier || cur.data) &&
        typeof (cur.courier || cur.data) === "object" &&
        guard < 4
      ) {
        cur = cur.courier || cur.data;
        guard++;
      }
      return cur && typeof cur === "object" ? cur : {};
    }

    function formatCourierUntilTime(rawVal) {
      if (!rawVal) return "";
      const s = String(rawVal).trim();
      if (!s || s.startsWith("0001-01-01")) return "";
      if (/^\d{1,2}:\d{2}(\s*[AP]M)?$/i.test(s)) return s;
      const d = typeof rawVal === "number" ? new Date(rawVal > 1e12 ? rawVal : rawVal * 1000) : new Date(s);
      if (!Number.isNaN(d.getTime()) && d.getTime() > 946684800000) {
        return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
      }
      return "";
    }

    function isFutureOrActiveTimestamp(rawVal) {
      if (!rawVal) return false;
      const s = String(rawVal).trim();
      if (!s || s.startsWith("0001-01-01")) return false;
      if (/^\d{1,2}:\d{2}(\s*[AP]M)?$/i.test(s)) return true;
      const d = typeof rawVal === "number" ? new Date(rawVal > 1e12 ? rawVal : rawVal * 1000) : new Date(s);
      return !Number.isNaN(d.getTime()) && d.getTime() > Date.now() - 60 * 1000;
    }

    function extractCourierStatusDetails(fetchedCourierEntry, knownMeta, isRefreshingLive = false) {
      if (!fetchedCourierEntry && !knownMeta?.status) {
        return {
          statusLabel: "⏳ جاري جلب الحالة الحية...",
          statusTone: "loading",
          untilFormatted: "",
          performedBy: "",
          reason: "",
          contract: "",
          balanceFormatted: ""
        };
      }

      const norm = fetchedCourierEntry?.normalized || {};
      const cObj = fetchedCourierEntry ? unwrapCourierRecord(fetchedCourierEntry) : {};
      const metaObj = cObj.status_meta_data || cObj.current_state_metadata || {};

      const rawStatusStr = String(
        norm.rawStatus ||
          (typeof cObj.status === "string" ? cObj.status : "") ||
          norm.status ||
          knownMeta?.rawStatus ||
          knownMeta?.status ||
          ""
      )
        .trim()
        .toLowerCase();

      let statusLabel = "Working";
      if (
        rawStatusStr === "break" ||
        rawStatusStr.includes("temp_not_working") ||
        rawStatusStr.includes("temporary_not_working") ||
        rawStatusStr.includes("temporary not working") ||
        rawStatusStr.includes("temp_break") ||
        rawStatusStr.includes("temp_offline")
      ) {
        statusLabel = "Temporary not working";
      } else if (rawStatusStr === "ending") {
        statusLabel = "Ending";
      } else if (rawStatusStr === "ready" || rawStatusStr === "starting") {
        statusLabel = "Starting";
      } else if (rawStatusStr === "late") {
        statusLabel = "Late";
      } else if (
        rawStatusStr === "not_working" ||
        rawStatusStr === "not working" ||
        rawStatusStr.includes("offline")
      ) {
        statusLabel = "Not working";
      } else if (rawStatusStr === "working") {
        statusLabel = "Working";
      } else if (rawStatusStr) {
        statusLabel = humanizeSnakeCase(rawStatusStr);
      }

      const isBreakOrOfflineState =
        statusLabel === "Temporary not working" || statusLabel === "Not working";

      const rawUntil = isBreakOrOfflineState
        ? norm.statusUntil || cObj.status_until || metaObj.ended_at || knownMeta?.statusUntil || ""
        : "";
      const untilFormatted = rawUntil ? formatCourierUntilTime(rawUntil) : "";

      const rawPerformedBy = isBreakOrOfflineState
        ? normalizeText(norm.performedBy || metaObj.performed_by || knownMeta?.performedBy || "")
        : "";

      const rawReason = isBreakOrOfflineState
        ? normalizeText(norm.statusReason || metaObj.reason || knownMeta?.statusReason || "")
        : "";

      const lowerFinal = statusLabel.toLowerCase();
      const statusTone =
        lowerFinal.includes("temporary")
          ? "warning"
          : lowerFinal.includes("not working") || lowerFinal === "late"
          ? "danger"
          : lowerFinal === "ending" || lowerFinal === "starting"
          ? "neutral"
          : "working";

      const rawContractType = normalizeText(
        norm.contract ||
          cObj.contract_info?.type ||
          cObj.contract_type ||
          knownMeta?.contract ||
          ""
      );
      const contract = rawContractType ? humanizeSnakeCase(rawContractType.toLowerCase()) : "";

      let balanceFormatted = "";
      const rawBal =
        fetchedCourierEntry?.balance ??
        norm.balance ??
        cObj.balance ??
        knownMeta?.balance;
      if (rawBal !== undefined && rawBal !== null && rawBal !== "") {
        const numBal = Number(rawBal);
        balanceFormatted = !Number.isNaN(numBal) ? `$ ${numBal.toFixed(2)}` : `$ ${rawBal}`;
      }

      return {
        statusLabel,
        statusTone,
        isRefreshingLive,
        untilFormatted,
        performedBy: rawPerformedBy,
        reason: rawReason,
        contract,
        balanceFormatted
      };
    }

    function buildFullCourierView(courierReq, fetchedCourierEntry, knownMeta, isRefreshingLive = false) {
      const cid = String(courierReq?.id || "");
      const norm = fetchedCourierEntry?.normalized || {};
      const cObj = fetchedCourierEntry ? unwrapCourierRecord(fetchedCourierEntry) : {};
      const name = normalizeText(
        norm.name || cObj.name || cObj.courier_name || courierReq?.name || knownMeta?.name || `Courier #${cid}`
      );
      const userId = String(
        norm.userId || cObj.user_id || cObj.userId || knownMeta?.userId || ""
      );
      const phone = normalizeText(
        norm.phone || cObj.phone_number || cObj.mobile || cObj.phone || knownMeta?.phone || ""
      );
      const vehicleObj = cObj.vehicle;
      const vehicleFromObj =
        vehicleObj && typeof vehicleObj === "object"
          ? [vehicleObj.vehicle_type_name, vehicleObj.vehicle_bag_type_name].filter(Boolean).join("-")
          : typeof vehicleObj === "string"
          ? vehicleObj
          : "";
      const vehicle = normalizeText(
        norm.vehicle || vehicleFromObj || knownMeta?.vehicle || "Bike-Standard box"
      );
      const statusMeta = extractCourierStatusDetails(fetchedCourierEntry, knownMeta, isRefreshingLive);

      return {
        id: cid,
        name,
        userId,
        phone,
        vehicle,
        ...statusMeta,
        isLoadedFromApi: Boolean(fetchedCourierEntry)
      };
    }

          const cid = String(courierId || "").trim();
          if (!cid) return null;

          if (forceRefresh) setIsCourierModalRefreshing(true);

              await new Promise((r) => setTimeout(r, 450));
              const res = await dbFetch(`/courier_details/${encodeURIComponent(cid)}`);
              if (res.ok) {
                const data = await res.json();
                const isFreshEnough =
                  !forceRefresh ||
                  (data?.requestedAt && data.requestedAt >= reqTimestamp) ||
                  (data?.updatedAt && data.updatedAt >= reqTimestamp - 1500);
                const cObj = unwrapCourierRecord(data);

      // On-demand Order Detail Fetching (Per-Order Queue + Persistent Mobile Polling & Auto-Retry)
      const requestOrderDetailsFromBridge = useCallback(
        async (orderItem, opts = {}) => {
          if (!orderItem?.id || orderItem.id === "-") return;
          const code = String(orderItem.id).trim();
          const {
            keepPollingWhileOpen = false,
            forceRefresh = false,
            isCancelled = () => false
          } = opts;

          if (!forceRefresh && orderDetailsCache[code]) return;

          const sendOrderDetailRequest = async () => {
            await dbFetch(`/config/order_detail_reqs/${encodeURIComponent(code)}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                code,
                orderCode: orderItem.orderCode || `HF_EG${code}`,
                requestedAt: Date.now()
              })
            });
          };

          try {
            if (!forceRefresh) {
              const quickRes = await dbFetch(`/order_details/${encodeURIComponent(code)}`);
              if (quickRes.ok) {
                const quickData = await quickRes.json();
                if (quickData && (quickData.detail || quickData.deliveries)) {
                  if (!isCancelled()) {
                    setOrderDetailsCache((prev) => ({ ...prev, [code]: quickData }));
                  }
                  return;
                }
              }
            }

            if (isCancelled()) return;
            await sendOrderDetailRequest();

            const maxAttempts = keepPollingWhileOpen ? 90 : 12;
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
              if (isCancelled()) return;
              await new Promise((r) => setTimeout(r, 550));
              if (isCancelled()) return;

              if (keepPollingWhileOpen && attempt > 0 && attempt % 7 === 0) {
                sendOrderDetailRequest().catch(() => {});
              }

              const res = await dbFetch(`/order_details/${encodeURIComponent(code)}`);
              if (res.ok) {
                const data = await res.json();
                if (data && (data.detail || data.deliveries)) {
                  if (!isCancelled()) {
                    setOrderDetailsCache((prev) => ({ ...prev, [code]: data }));
                  }
                  return;
                }
              }
            }
          } catch {}
        },
        [orderDetailsCache, dbFetch]
      );

        martOrders.forEach((d) => {
          const label = extractMartBranchLabel(d.vendor);
          const cur = map.get(label) || { label, count: 0, late: 0 };
          cur.count += 1;
          if (d.deadline.includes("-") || d.deadline === "Late") cur.late += 1;
          map.set(label, cur);
        });
        const branches = Array.from(map.values()).sort((a, b) => b.count - a.count);
        return { branches, totalMartCount: martOrders.length };
      }, [baseTabDeliveries]);

      const filteredDeliveries = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        const qPhone = normalizePhoneDigits(searchQuery);

        const list = baseTabDeliveries.filter((d) => {
          if (activeQuickFilter === "Delayed" && !(d.deadline.includes("-") || d.deadline === "Late")) return false;
          if (activeQuickFilter === "Cash" && !d.instructions.includes("Cash")) return false;
          if (activeQuickFilter === "Card" && !d.instructions.includes("Card")) return false;
          if (
            activeQuickFilter === "Darkstores" &&
            !(isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores"))
          ) {
            return false;
          }
          if (
            activeQuickFilter === "Darkstores" &&
            selectedMartBranch !== "ALL" &&
            normalizeText(extractMartBranchLabel(d.vendor)) !== normalizeText(selectedMartBranch)
          ) {
            return false;
          }
          if (activeQuickFilter === "Restaurants") {
            const isDs = isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores");
            if (isDs || !(d.instructions.includes("Restaurants") || d.instructions.includes("Supermarket"))) {
              return false;
            }
          }
          if (activeQuickFilter === "Split" && !d.isSplit) return false;

          if (
            activeStatusFilter !== "All" &&
            normalizeText(d.status).toLowerCase() !== normalizeText(activeStatusFilter).toLowerCase()
          ) {
            return false;
          }

          if (!q) return true;

          const cMeta = d.courierId ? knownCouriersMeta[d.courierId] : null;
          const cUserId = String(cMeta?.userId || "");
          const cPhone = normalizePhoneDigits(cMeta?.phone || "");
          const cleanDigits = q.replace(/^#/, "");
          const phoneMatched =
            (qPhone.core10 && cPhone.core10 === qPhone.core10) ||
            (qPhone.rawDigits.length >= 7 && cPhone.rawDigits.includes(qPhone.rawDigits));
          const userIdMatched =
            cleanDigits.length >= 3 && cUserId && cUserId.includes(cleanDigits);

          return (
            String(d.id || "").toLowerCase().includes(q) ||
            String(d.orderCode || "").toLowerCase().includes(q) ||
            String(d.vo || "").toLowerCase().includes(q) ||
            String(d.vendor || "").toLowerCase().includes(q) ||
            String(d.courier || "").toLowerCase().includes(q) ||
            String(d.courierId || "").toLowerCase().includes(q) ||
            String(d.zone || "").toLowerCase().includes(q) ||
            phoneMatched ||
            userIdMatched
          );
        });

        if (orderSortMode === "live_first") {
          const recentCutoff = Date.now() - 18 * 3600 * 1000;
          return [...list].sort((a, b) => {
            const aRecent = a.placedMs >= recentCutoff ? 1 : 0;
            const bRecent = b.placedMs >= recentCutoff ? 1 : 0;
            if (aRecent !== bRecent) return bRecent - aRecent;
            return (a.deadlineMs || 0) - (b.deadlineMs || 0);
          });
        }

        return list;
      }, [
        baseTabDeliveries,
        activeQuickFilter,
        activeStatusFilter,
        selectedMartBranch,
        searchQuery,
        knownCouriersMeta,
        orderSortMode
      ]);

      const effectiveTabCounts = useMemo(() => {
        const counts = {
          Queued: 0,
          Dispatched: 0,
          Active: 0
        };
        deliveries.forEach((d) => {
          if (selectedCity !== "All Cities" && d.city !== selectedCity) return;
          if (!matchesZoneFilter(d)) return;
          if (counts[d.tabName] !== undefined) {
            counts[d.tabName] += 1;
          }
        });
        if (selectedCity === "All Cities" && deliveries.length === 0 && tabCounts) {
          if (tabCounts.Queued !== undefined) counts.Queued = tabCounts.Queued;
          if (tabCounts.Dispatched !== undefined) counts.Dispatched = tabCounts.Dispatched;
          if (tabCounts.Active !== undefined) counts.Active = tabCounts.Active;
        }
        return counts;
      }, [deliveries, selectedCity, matchesZoneFilter, tabCounts]);

      useEffect(() => {
        if (completedSearchQuery.trim()) {
          if (!completedSearchAnchorRef.current) {
            completedSearchAnchorRef.current = Date.now();
          }
        } else {
          completedSearchAnchorRef.current = 0;
        }
      }, [completedSearchQuery]);

      const baseVisibleCompletedOrders = useMemo(() => {
        const sourceOrders =
          completedFilterMode === "custom" ? customRangeOrders : completedOrders;
        const windowMs = Number(completedHoursWindow || 2) * 3600 * 1000;
        const q = completedSearchQuery.trim().toLowerCase();
        const isSearching = q.length > 0;
        const anchorNow =
          isSearching && completedSearchAnchorRef.current > 0
            ? completedSearchAnchorRef.current
            : Date.now();
        const graceMs = isSearching ? 15 * 60 * 1000 : 0;
        const cutoffMs = anchorNow - windowMs - graceMs;

        const enriched = sourceOrders.map((item) => {
          const cachedDet = orderDetailsCache[item.id]?.detail?.order || orderDetailsCache[item.id]?.detail;
          const exactIso = cachedDet?.current_state_transition;
          if (exactIso) {
            const exactMs = new Date(exactIso).getTime();
            if (!Number.isNaN(exactMs) && exactMs > 946684800000 && exactMs !== item.completedTimestamp) {
              return {
                ...item,
                completedTimestamp: exactMs,
                completedAtFormatted: formatExactTimeSeconds(exactMs)
              };
            }
          }
          return item;
        });

        const filtered = enriched.filter((item) => {
          if (item.orderStatus && item.orderStatus.includes("cancel")) return false;
          if (completedFilterMode === "rolling") {
            if (!item.completedTimestamp || item.completedTimestamp < cutoffMs) return false;
          }

          if (completedCityFilter !== "All Cities" && item.city !== completedCityFilter) {
            return false;
          }

          if (completedZoneFilter === "SELECTED_ZONES") {
            if (!matchesZoneFilter(item)) return false;
          } else if (completedZoneFilter !== "ALL") {
            const targetZ = normalizeText(completedZoneFilter).toLowerCase();
            const itemZs = (item.zonesList || []).map((z) => normalizeText(z).toLowerCase());
            if (!itemZs.some((z) => z === targetZ || z.includes(targetZ))) return false;
          }

          if (!q) return true;
          return (
            String(item.id).toLowerCase().includes(q) ||
            String(item.vo).toLowerCase().includes(q) ||
            String(item.courier).toLowerCase().includes(q) ||
            String(item.vendor).toLowerCase().includes(q)
          );
        });

        return filtered.sort((a, b) =>
          completedSortAsc
            ? a.completedTimestamp - b.completedTimestamp
            : b.completedTimestamp - a.completedTimestamp
        );
      }, [
        completedFilterMode,
        customRangeOrders,
        completedOrders,
        orderDetailsCache,
        completedHoursWindow,
        completedCityFilter,
        completedZoneFilter,
        completedSearchQuery,
        completedSortAsc,
        matchesZoneFilter
      ]);

      // Instant Direct Order ID Lookup when searching for an Order ID not in local window
      useEffect(() => {
        if (activeTab !== "Completed") return;
        const rawQ = completedSearchQuery.trim();
        if (!rawQ || !isExactOrderIdPattern(rawQ)) {
          setDirectCompletedLookup({ query: "", loading: false, status: "", orderItem: null });
          return;
        }
        const cleanCode = rawQ.replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "").trim();
        if (baseVisibleCompletedOrders.some((o) => String(o.id) === cleanCode)) {
          setDirectCompletedLookup({ query: cleanCode, loading: false, status: "local", orderItem: null });
          return;
        }

        let cancelled = false;
        const timer = setTimeout(async () => {
          setDirectCompletedLookup({ query: cleanCode, loading: true, status: "", orderItem: null });
          try {
            const reqAt = Date.now();
            await dbFetch(`/config/completed_id_reqs/${encodeURIComponent(cleanCode)}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code: cleanCode, requestedAt: reqAt })
            });

            for (let attempt = 0; attempt < 15; attempt++) {
              if (cancelled) return;
              await new Promise((r) => setTimeout(r, 500));
              if (cancelled) return;
              const res = await dbFetch(`/session_bundles/comp_id_${encodeURIComponent(cleanCode)}`);
              if (res.ok) {
                const data = await res.json();
                if (data && data.code === cleanCode && Number(data.updatedAt || 0) >= reqAt - 3000) {
                  if (!data.found) {
                    setDirectCompletedLookup({
                      query: cleanCode,
                      loading: false,
                      status: "not_found",
                      orderItem: null
                    });
                  } else {
                    const mappedItem = data.record ? mapHurrierCompletedRecord(data.record) : null;
                    setDirectCompletedLookup({
                      query: cleanCode,
                      loading: false,
                      status: String(data.status || "completed"),
                      orderItem: mappedItem
                    });
                  }
                  return;
                }
              }
            }
            if (!cancelled) {
              setDirectCompletedLookup((prev) => ({ ...prev, loading: false }));
            }
          } catch {
            if (!cancelled) {
              setDirectCompletedLookup((prev) => ({ ...prev, loading: false }));
            }
          }
        }, 350);

        return () => {
          cancelled = true;
          clearTimeout(timer);
        };
      }, [activeTab, completedSearchQuery, baseVisibleCompletedOrders, dbFetch]);

      const visibleCompletedOrders = useMemo(() => {
        if (
          directCompletedLookup.orderItem &&
          directCompletedLookup.status === "completed" &&
          !baseVisibleCompletedOrders.some((o) => String(o.id) === String(directCompletedLookup.orderItem.id))
        ) {
          return [directCompletedLookup.orderItem, ...baseVisibleCompletedOrders];
        }
        return baseVisibleCompletedOrders;
      }, [baseVisibleCompletedOrders, directCompletedLookup]);

      const completedTotalPages = Math.max(1, Math.ceil(visibleCompletedOrders.length / 50));
      const paginatedCompletedOrders = useMemo(() => {
        const safeP = Math.min(completedPage, completedTotalPages);
        const start = (safeP - 1) * 50;
        return visibleCompletedOrders.slice(start, start + 50);
      }, [visibleCompletedOrders, completedPage, completedTotalPages]);

      const completedVisiblePages = useMemo(() => {
        if (completedTotalPages <= 7) return Array.from({ length: completedTotalPages }, (_, i) => i + 1);
        if (completedPage <= 4) return [1, 2, 3, 4, 5, "...", completedTotalPages];
        if (completedPage >= completedTotalPages - 3) {
          return [1, "...", completedTotalPages - 4, completedTotalPages - 3, completedTotalPages - 2, completedTotalPages - 1, completedTotalPages];
        }
        return [1, "...", completedPage - 1, completedPage, completedPage + 1, "...", completedTotalPages];
      }, [completedPage, completedTotalPages]);

      const selectedOrderFullView = useMemo(() => {
        if (!selectedOrder) return null;
        return buildFullOrderView(selectedOrder, orderDetailsCache[selectedOrder.id]);
      }, [selectedOrder, orderDetailsCache]);

      const selectedCourierFullView = useMemo(() => {
        if (!selectedCourier) return null;
        const cid = String(selectedCourier.id || "");
        const cleanSelName = normalizeText(selectedCourier.name || "").toLowerCase();
        const metaById =
          knownCouriersMeta[cid] ||
          Object.values(knownCouriersMeta).find((m) => String(m?.userId || "") === cid) ||
          (cleanSelName
            ? Object.values(knownCouriersMeta).find(
                (m) => m?.name && normalizeText(m.name).toLowerCase() === cleanSelName
              )
            : null);
        const realCid = metaById?.courierId || cid;
        return buildFullCourierView(
          { id: realCid, name: selectedCourier.name },
          courierDetailsCache[cid] || courierDetailsCache[realCid],
          metaById,
          isCourierModalRefreshing
        );
      }, [selectedCourier, courierDetailsCache, knownCouriersMeta, isCourierModalRefreshing]);

      // Instant Matched Riders in Selected Zones (Matches User ID, Courier ID, Phone, or Name across ALL statuses)
      const matchedZoneCouriers = useMemo(() => {
        const rawQ = searchQuery.trim();
        if (rawQ.length < 3) return [];
        const qLower = rawQ.toLowerCase();
        const qPhone = normalizePhoneDigits(rawQ);
        const cleanDigits = rawQ.replace(/^#/, "");

        return activeCouriersList.filter((c) => {
          if (!c.user_id && !c.phone_number && !c.status) return false;
          const uid = String(c.user_id || "");
          const cid = String(c.id || c.courier_id || "");
          const nameLower = normalizeText(c.name || c.courier_name || "").toLowerCase();
          const cPhone = normalizePhoneDigits(c.phone_number || "");

          if (uid && (uid === cleanDigits || (cleanDigits.length >= 4 && uid.includes(cleanDigits)))) {
            return true;
          }
          if (cid && cid === cleanDigits) {
            return true;
          }
          if (
            (qPhone.core10 && cPhone.core10 === qPhone.core10) ||
            (qPhone.rawDigits.length >= 7 && cPhone.rawDigits.includes(qPhone.rawDigits))
          ) {
            return true;
          }
          if (nameLower && !/^\d+$/.test(cleanDigits) && nameLower.includes(qLower)) {
            return true;
          }
          return false;
        });
      }, [searchQuery, activeCouriersList]);

      // --- RENDERERS FOR SPECIAL TABS ---
      const renderDashboardView = () => {
        const queuedCnt = effectiveTabCounts["Queued"] || 0;
        const dispCnt = effectiveTabCounts["Dispatched"] || 0;
        const activeCnt = effectiveTabCounts["Active"] || 0;
        const delayedCnt = deliveries.filter(
          (d) => matchesZoneFilter(d) && (d.deadline.includes("-") || d.deadline === "Late")
        ).length;

        const matchingZonesStats = zoneStatsSnapshot.filter((zs) => {
          const zName = normalizeText(zs.name).toLowerCase();
          return selectedZoneIds.includes(Number(zs.id)) || selectedZoneNames.includes(zName);
        });

        return (
          <div className="mt-4 space-y-5">
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div
                onClick={() => {
                  setActiveTab("Queued");
                  setActiveStatusFilter("All");
                }}
                className="p-4 rounded-xl bg-amber-50/70 border border-amber-200 cursor-pointer hover:shadow-sm"
              >
                <div className="text-xs font-bold text-amber-800 uppercase">Queued</div>
                <div className="text-2xl font-extrabold text-amber-900 mt-1">{queuedCnt}</div>
              </div>
              <div
                onClick={() => {
                  setActiveTab("Dispatched");
                  setActiveStatusFilter("All");
                }}
                className="p-4 rounded-xl bg-blue-50/70 border border-blue-200 cursor-pointer hover:shadow-sm"
              >
                <div className="text-xs font-bold text-blue-800 uppercase">Dispatched</div>
                <div className="text-2xl font-extrabold text-blue-900 mt-1">{dispCnt}</div>
              </div>
              <div
                onClick={() => {
                  setActiveTab("Active");
                  setActiveStatusFilter("All");
                }}
                className="p-4 rounded-xl bg-emerald-50/70 border border-emerald-200 cursor-pointer hover:shadow-sm"
              >
                <div className="text-xs font-bold text-emerald-800 uppercase">Active</div>
                <div className="text-2xl font-extrabold text-emerald-900 mt-1">{activeCnt}</div>
              </div>
              <div
                onClick={() => {
                  setActiveTab("Active");
                  setActiveQuickFilter("Delayed");
                  setActiveStatusFilter("All");
                }}
                className="p-4 rounded-xl bg-red-50/70 border border-red-200 cursor-pointer hover:shadow-sm"
              >
                <div className="text-xs font-bold text-red-800 uppercase">Delayed Orders</div>
                <div className="text-2xl font-extrabold text-red-900 mt-1">{delayedCnt}</div>
              </div>
            </div>

            <div className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
              <div className="px-4 py-3 bg-gray-50 border-b border-gray-200 font-bold text-sm text-gray-900">
                Zone-by-Zone Live Breakdown ({matchingZonesStats.length} Zones)
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs whitespace-nowrap">
                  <thead>
                    <tr className="border-b border-gray-200 text-gray-500 font-bold uppercase bg-gray-50/60">
                      <th className="py-3 px-4">STARTING POINT / ZONE</th>
                      <th className="py-3 px-3">QUEUED</th>
                      <th className="py-3 px-3">DISP</th>
                      <th className="py-3 px-3">ACTIVE</th>
                      <th className="py-3 px-3">WORKING RIDERS</th>
                      <th className="py-3 px-3">ENDING</th>
                      <th className="py-3 px-3">BREAK</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {matchingZonesStats.length === 0 ? (
                      <tr>
                        <td colSpan={7} className="py-8 text-center text-gray-500">
                          جاري تحميل إحصائيات الزونات المختارة...
                        </td>
                      </tr>
                    ) : (
                      matchingZonesStats.map((zs) => {
                        const st = zs.stat || {};
                        return (
                          <tr key={zs.id || zs.name} className="hover:bg-blue-50/30">
                            <td className="py-3 px-4 font-bold text-gray-900">{zs.name}</td>
                            <td className="py-3 px-3 font-mono">{st.queued_count ?? 0}</td>
                            <td className="py-3 px-3 font-mono">{st.dispatched_count ?? 0}</td>
                            <td className="py-3 px-3 font-mono font-bold text-blue-700">{st.active_count ?? 0}</td>
                            <td className="py-3 px-3 font-mono font-bold text-emerald-700">{st.couriers_in_working ?? 0}</td>
                            <td className="py-3 px-3 font-mono text-orange-700">{st.couriers_in_ending ?? 0}</td>
                            <td className="py-3 px-3 font-mono text-gray-600">{st.couriers_in_break ?? 0}</td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      };

      const renderActiveCouriersView = () => {
        const rawQ = searchQuery.trim();
        const qLower = rawQ.toLowerCase();
        const qPhone = normalizePhoneDigits(rawQ);
        const cleanDigits = rawQ.replace(/^#/, "");

        const doesCourierMatchQuery = (c) => {
          if (!rawQ) return true;
          const uid = String(c.user_id || "");
          const cid = String(c.id || c.courier_id || "");
          const name = normalizeText(c.name || c.courier_name || "").toLowerCase();
          const cPhone = normalizePhoneDigits(c.phone_number || "");
          if (uid && uid.includes(cleanDigits)) return true;
          if (cid && cid.includes(cleanDigits)) return true;
          if (
            (qPhone.core10 && cPhone.core10 === qPhone.core10) ||
            (qPhone.rawDigits.length >= 6 && cPhone.rawDigits.includes(qPhone.rawDigits))
          ) {
            return true;
          }
          if (name && name.includes(qLower)) return true;
          return false;
        };

        const idSet = new Set(selectedZoneIds.map(Number));
        const byId = new Map();

        zoneStatsSnapshot.forEach((zs) => {
          const zid = Number(zs.id);
          const zName = normalizeText(zs.name).toLowerCase();
          if (
            selectedCity !== "All Cities" &&
            zs.city &&
            normalizeHurrierCity(zs.city, [zs.name]) !== selectedCity
          ) {
            return;
          }
          if (idSet.has(zid) || selectedZoneNames.includes(zName)) {
            byId.set(zid, zs);
          }
        });

        effectiveZonesCatalog.forEach((catZ) => {
          const zid = Number(catZ.id);
          if (!idSet.has(zid) || byId.has(zid)) return;
          if (
            selectedCity !== "All Cities" &&
            catZ.city &&
            normalizeHurrierCity(catZ.city, [catZ.name]) !== selectedCity
          ) {
            return;
          }
          byId.set(zid, {
            id: zid,
            name: catZ.name,
            city: catZ.city || "Cairo",
            delay: 0,
            stat: {}
          });
        });

        const matchingZonesStats = Array.from(byId.values()).sort((a, b) => {
          const delayDiff = Number(b.delay || 0) - Number(a.delay || 0);
          if (Math.abs(delayDiff) > 0.001) return delayDiff;
          return normalizeText(a.name).localeCompare(normalizeText(b.name));
        });

        const toggleZoneExpand = (zid) => {
          setCollapsedCourierZoneIds((prev) => {
            const next = new Set(prev);
            if (next.has(zid)) next.delete(zid);
            else next.add(zid);
            return next;
          });
        };

        const vehicleOrderWeight = (vName) => {
          const vl = String(vName || "").toLowerCase();
          if (vl === "bike") return 1;
          if (vl.includes("bicycle")) return 2;
          if (vl.includes("e-bike") || vl.includes("ebike")) return 3;
          if (vl.includes("car")) return 4;
          if (vl.includes("walker")) return 5;
          return 6;
        };

        const classifyHurrierBucket = (rawSt) => {
          const s = String(rawSt || "working").toLowerCase();
          if (s === "break" || s.includes("temp") || s === "not_working") return "Break";
          if (s === "late") return "Late";
          if (s === "ending") return "Ending";
          if (s === "ready" || s === "starting") return "Starting";
          return "Working";
        };

        const STATUS_ROWS_META = [
          { key: "Break", label: "Break:", showTime: true, pillBg: "bg-[#6e6e6e] hover:bg-[#585858]" },
          { key: "Late", label: "Late:", showTime: true, pillBg: "bg-[#db4437] hover:bg-[#c5372b]" },
          { key: "Working", label: "Working:", showTime: false, pillBg: "bg-[#4caf50] hover:bg-[#3f9c43]" },
          { key: "Ending", label: "Ending:", showTime: true, pillBg: "bg-[#6e6e6e] hover:bg-[#585858]" },
          { key: "Starting", label: "Starting:", showTime: true, pillBg: "bg-[#db4437] hover:bg-[#c5372b]" }
        ];

        return (
          <div className="mt-4 space-y-4">
            <div className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm divide-y divide-gray-200">
              {matchingZonesStats.length === 0 ? (
                <div className="py-12 text-center text-gray-500 text-sm">
                  جاري تحميل حالة جميع المناديب للزونات المختارة...
                </div>
              ) : (
                matchingZonesStats.map((zs) => {
                  const st = zs.stat || {};

                  const allZoneCouriers = activeCouriersList.filter(
                    (c) => Number(c.starting_point_id) === Number(zs.id)
                  );

                  const filteredZoneCouriers = rawQ
                    ? allZoneCouriers.filter(doesCourierMatchQuery)
                    : allZoneCouriers;

                  if (rawQ && filteredZoneCouriers.length === 0) {
                    return null;
                  }

                  const activeOrdCnt = (st.active_count ?? 0) + (st.dispatched_count ?? 0);
                  const workingAndEndingCnt =
                    (st.couriers_in_working ?? 0) + (st.couriers_in_ending ?? 0);
                  const queuedOrdCnt = st.queued_count ?? 0;
                  const delayMins =
                    zs.delay !== undefined ? zs.delay : Math.round(Number(st.delay || 0) * 10) / 10;

                  const isExpanded = Boolean(rawQ) || !collapsedCourierZoneIds.has(zs.id);

                  const byVehicleMap = new Map();
                  filteredZoneCouriers.forEach((c) => {
                    const vName = normalizeText(c.vehicle_type || "Bike") || "Bike";
                    if (!byVehicleMap.has(vName)) byVehicleMap.set(vName, []);
                    byVehicleMap.get(vName).push(c);
                  });
                  const sortedVehicleGroups = Array.from(byVehicleMap.entries()).sort(
                    (a, b) => vehicleOrderWeight(a[0]) - vehicleOrderWeight(b[0])
                  );

                  return (
                    <div key={zs.id || zs.name} className="bg-white">
                      <button
                        type="button"
                        onClick={() => toggleZoneExpand(zs.id)}
                        className="w-full px-5 py-4 flex items-center justify-between hover:bg-gray-50/80 transition-colors text-left"
                      >
                        <div className="flex flex-wrap items-center gap-1.5 text-[15px]">
                          <span className="font-bold text-gray-900">{zs.name}</span>
                          <span className="font-semibold text-gray-900">
                            ({activeOrdCnt} / {workingAndEndingCnt} /{" "}
                            <span className="text-gray-400">{queuedOrdCnt}</span>)
                          </span>
                          <span className="font-bold text-[#a9382b] ml-1">{delayMins}m</span>
                        </div>
