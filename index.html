                                        <div className="text-[11px] text-gray-500 mt-0.5">{it.special_instructions}</div>
                                      )}
                                    </div>
                                    <span className="font-semibold text-gray-900">{priceText}</span>
                                  </div>
                                );
                              })
                            )}
                          </div>
                        ) : orderDetailSubTab === 'issues' ? (
                          <div className="border border-gray-200 rounded-lg divide-y divide-gray-100 text-xs">
                            {selectedOrderFullView.orderIssues.length === 0 ? (
                              <div className="py-6 text-center text-gray-500">No issues reported on this order.</div>
                            ) : (
                              selectedOrderFullView.orderIssues.map((iss, idx) => (
                                <div key={iss.id || idx} className="p-3 flex items-center justify-between">
                                  <div>
                                    <div className="font-bold text-gray-900">{iss.title || iss.type || 'Issue'}</div>
                                    <div className="text-gray-500 mt-0.5">{iss.description || iss.reason || '-'}</div>
                                  </div>
                                  <span className="px-2 py-0.5 rounded bg-amber-50 text-amber-800 border border-amber-200 font-semibold uppercase">
                                    {iss.status || 'open'}
                                  </span>
                                </div>
                              ))
                            )}
                          </div>
                        ) : orderDetailSubTab === 'routes' ? (
                          <div className="border border-gray-200 rounded-lg p-4 space-y-3 text-xs">
                            <div className="flex items-start gap-2.5">
                              <StoreIcon size={15} className="text-blue-600 mt-0.5" />
                              <div>
                                <div className="font-bold text-gray-900">1. Pickup: {selectedOrderFullView.vendorName}</div>
                                <div className="text-gray-600">{selectedOrderFullView.vendorStreet}</div>
                                {selectedOrderFullView.pickupCoords && (
                                  <div className="text-[11px] font-mono text-gray-400">{selectedOrderFullView.pickupCoords}</div>
                                )}
                              </div>
                            </div>
                            <div className="flex items-start gap-2.5 border-t border-gray-100 pt-3">
                              <HomeIcon size={15} className="text-emerald-600 mt-0.5" />
                              <div>
                                <div className="font-bold text-gray-900">2. Dropoff: {selectedOrderFullView.customerName}</div>
                                <div className="text-gray-600">{selectedOrderFullView.customerStreet}</div>
                                {selectedOrderFullView.dropoffCoords && (
                                  <div className="text-[11px] font-mono text-gray-400">{selectedOrderFullView.dropoffCoords}</div>
                                )}
                              </div>
                            </div>
                          </div>
                        ) : selectedOrderFullView.deliveries.length === 0 ? (
                          <div className="py-8 text-center text-xs text-gray-500">
                            {isLoadingOrderDetail
                              ? 'جاري تحميل خطوات التحول (Transitions Timeline) من Hurrier...'
                              : 'اضغط Refresh Details بالأعلى لجلب سجل التحولات الكامل من Hurrier.'}
                          </div>
                        ) : (
                          selectedOrderFullView.deliveries.map((del, dIdx) => {
                            const delKey = String(del.id || dIdx);
                            const isCollapsed = Boolean(collapsedDeliveryIds[delKey]);
                            const transitions = Array.isArray(del.transitions) ? del.transitions : [];

                            return (
                              <div key={delKey} className="border border-gray-200 rounded-lg overflow-hidden">
                                {/* Delivery Header Summary */}
                                <div
                                  onClick={() =>
                                    setCollapsedDeliveryIds((prev) => ({
                                      ...prev,
                                      [delKey]: !prev[delKey]
                                    }))
                                  }
                                  className="px-4 py-3 bg-gray-50/90 border-b border-gray-200 flex flex-wrap items-center justify-between gap-3 cursor-pointer hover:bg-gray-100/70 text-xs"
                                >
                                  <div className="flex items-center gap-3">
                                    {isCollapsed ? <ChevronDownIcon size={16} /> : <ChevronUpIcon size={16} />}
                                    <div>
                                      <div className="text-[10px] text-gray-400 uppercase font-semibold">ID</div>
                                      <div className="font-mono font-bold text-gray-800">{del.id}</div>
                                    </div>
                                  </div>

                                  <div>
                                    <div className="text-[10px] text-gray-400 uppercase font-semibold">Status</div>
                                    <div className="font-semibold text-gray-900 capitalize">
                                      {String(del.status || '-').replace(/_/g, ' ')}
                                    </div>
                                  </div>

                                  <div>
                                    <div className="text-[10px] text-gray-400 uppercase font-semibold">Zones</div>
                                    <div className="text-gray-700 max-w-[160px] truncate">
                                      {formatStartingPointsList(del.starting_points, selectedOrder.zone)}
                                    </div>
                                  </div>

                                  <div>
                                    <div className="text-[10px] text-gray-400 uppercase font-semibold">Courier</div>
                                    <div className="font-semibold text-blue-600 max-w-[180px] truncate">
                                      {del.courier_name || selectedOrder.courier}
                                    </div>
                                  </div>

                                  <div>
                                    <div className="text-[10px] text-gray-400 uppercase font-semibold">Utilization</div>
                                    <div className="font-semibold text-gray-800">{del.capacity ?? '-'}</div>
                                  </div>
                                </div>

                                {/* Transitions Timeline Table */}
                                {!isCollapsed && (
                                  <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs whitespace-nowrap">
                                      <thead>
                                        <tr className="border-b border-gray-200 text-gray-500 font-semibold text-[11px] bg-gray-50/40">
                                          <th className="py-2.5 px-3">TIME</th>
                                          <th className="py-2.5 px-3">EVENT</th>
                                          <th className="py-2.5 px-3">COURIER</th>
                                          <th className="py-2.5 px-2">LOC</th>
                                          <th className="py-2.5 px-2">EST.ACCEPT</th>
                                          <th className="py-2.5 px-2">EST.PU ARR</th>
                                          <th className="py-2.5 px-2">EST.PU DEP</th>
                                          <th className="py-2.5 px-2">EST.DO ARR</th>
                                          <th className="py-2.5 px-2">EST.DO DEP</th>
                                          <th className="py-2.5 px-2"></th>
                                        </tr>
                                      </thead>
                                      <tbody className="divide-y divide-gray-100">
                                        {transitions.map((tr, tIdx) => {
                                          const meta = tr.metadata || {};
                                          const evLabel = humanizeEventLabel(tr);
                                          const isAcceptedEv = String(tr.to_state || '').toLowerCase() === 'accepted';
                                          const isUndispatchEv =
                                            Boolean(tr.un_dispatch_type) ||
                                            String(tr.to_state || '').toLowerCase().includes('undispatch');
                                          const trCourier = tr.courier_name || meta.courier_name || '-';
                                          const lat = meta.courier_latitude || meta.latitude;
                                          const lng = meta.courier_longitude || meta.longitude;
                                          const rawEventTime = getTransitionRawTimestamp(tr);
                                          const isFirstRow = tIdx === 0;
                                          const isLastRow = tIdx === transitions.length - 1;

                                          return (
                                            <tr
                                              key={tr.id || tIdx}
                                              className={
                                                isAcceptedEv
                                                  ? 'bg-emerald-50/60'
                                                  : isUndispatchEv
                                                  ? 'bg-red-50/60'
                                                  : 'hover:bg-gray-50'
                                              }
                                            >
                                              <td
                                                className="py-2.5 px-3 font-mono text-gray-700"
                                                title={rawEventTime ? String(rawEventTime) : ''}
                                              >
                                                {formatShortTimeWithSec(rawEventTime)}
                                              </td>
                                              <td className="py-2.5 px-3 relative">
                                                {transitions.length > 1 && (
                                                  <span
                                                    aria-hidden="true"
                                                    className={`absolute left-[15.5px] w-[1.5px] bg-blue-300 ${
                                                      isFirstRow
                                                        ? 'top-1/2 bottom-0'
                                                        : isLastRow
                                                        ? 'top-0 bottom-1/2'
                                                        : 'top-0 bottom-0'
                                                    }`}
                                                  />
                                                )}
                                                <div className="flex items-start gap-2 relative z-10">
                                                  <span
                                                    className={`w-2 h-2 rounded-full mt-1 flex-shrink-0 ring-2 ring-white ${
                                                      isAcceptedEv
                                                        ? 'bg-emerald-600'
                                                        : isUndispatchEv
                                                        ? 'bg-red-600'
                                                        : 'bg-blue-600'
                                                    }`}
                                                  />
                                                  <div>
                                                    <div
                                                      className={`font-semibold ${
                                                        isAcceptedEv
                                                          ? 'text-emerald-700'
                                                          : isUndispatchEv
                                                          ? 'text-red-700'
                                                          : 'text-blue-600'
                                                      }`}
                                                    >
                                                      {evLabel}
                                                    </div>
                                                    {(tr.dispatch_type || tr.un_dispatch_type || meta.dispatch_type) && (
                                                      <div className="text-[11px] text-gray-500 capitalize">
                                                        {String(
                                                          tr.un_dispatch_type ||
                                                            tr.dispatch_type ||
                                                            meta.dispatch_type
                                                        ).replace(/_/g, ' ')}
                                                      </div>
                                                    )}
                                                  </div>
                                                </div>
                                              </td>
                                              <td className="py-2.5 px-3 text-blue-600 max-w-[170px] truncate">
                                                {trCourier}
                                              </td>
                                              <td className="py-2.5 px-2">
                                                {lat && lng ? (
                                                  <a
                                                    href={`https://maps.google.com/?q=${lat},${lng}`}
                                                    target="_blank"
                                                    rel="noreferrer"
                                                    className="text-blue-600 hover:text-blue-800"
                                                  >
                                                    <MapPinIcon size={14} />
                                                  </a>
                                                ) : (
                                                  <MapPinIcon size={14} className="text-blue-400" />
                                                )}
                                              </td>
                                              <td className="py-2.5 px-2 text-gray-600">
                                                {formatShortTimeNoSec(meta.estimated_accept_at)}
                                              </td>
                                              <td className="py-2.5 px-2 text-gray-600">
                                                {formatShortTimeNoSec(meta.estimated_pickup_arrival_at)}
                                              </td>
                                              <td className="py-2.5 px-2 text-gray-600">
                                                {formatShortTimeNoSec(meta.estimated_pickup_departure_at)}
                                              </td>
                                              <td className="py-2.5 px-2 text-gray-600">
                                                {formatShortTimeNoSec(meta.estimated_dropoff_arrival_at)}
                                              </td>
                                              <td className="py-2.5 px-2 text-gray-600">
                                                {formatShortTimeNoSec(meta.estimated_dropoff_departure_at)}
                                              </td>
                                              <td className="py-2.5 px-2">
                                                <button
                                                  type="button"
                                                  onClick={() =>
                                                    setActiveTransitionMeta(
                                                      activeTransitionMeta === tr ? null : tr
                                                    )
                                                  }
                                                  className="text-gray-500 hover:text-gray-900"
                                                  title="View Event Metadata"
                                                >
                                                  <InfoIcon size={14} />
                                                </button>
                                              </td>
                                            </tr>
                                          );
                                        })}
                                      </tbody>
                                    </table>

                                    {activeTransitionMeta && (
                                      <div className="p-3 bg-gray-900 text-gray-100 text-[11px] font-mono overflow-x-auto">
                                        <div className="flex justify-between items-center mb-1 text-gray-400">
                                          <span>Event Raw Details:</span>
                                          <button
                                            type="button"
                                            onClick={() => setActiveTransitionMeta(null)}
                                            className="text-white hover:underline"
                                          >
                                            Close
                                          </button>
                                        </div>
                                        <pre>{JSON.stringify(activeTransitionMeta, null, 2)}</pre>
                                      </div>
                                    )}
                                  </div>
                                )}
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>

                    {/* Right Column: Notes & Time Checks */}
                    <div className="lg:col-span-3 space-y-5">
                      {/* Notes Card */}
                      <div className="bg-[#fffdf5] border border-amber-200/80 rounded-xl p-4 shadow-sm space-y-3">
                        <div className="flex items-center justify-between">
                          <h3 className="text-base font-bold text-gray-900">Notes</h3>
                          <span className="text-xs text-gray-500">
                            {selectedOrderFullView.notes.length} notes
                          </span>
                        </div>
                        {selectedOrderFullView.notes.length === 0 ? (
                          <div className="py-6 text-center text-xs text-gray-400">
                            No dispatcher notes on this order.
                          </div>
                        ) : (
                          <div className="space-y-2 max-h-48 overflow-y-auto">
                            {selectedOrderFullView.notes.map((n, idx) => (
                              <div key={n.id || idx} className="p-2.5 rounded bg-white border border-amber-200 text-xs">
                                <div className="font-semibold text-gray-800">{n.note || n.body || n.text}</div>
                                <div className="text-[10px] text-gray-400 mt-1">
                                  {n.created_by || n.author || 'Dispatcher'} • {formatReadableTimestamp(n.created_at)}
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* Time Checks Card */}
                      <div className="bg-white border border-gray-200 rounded-xl p-4 shadow-sm space-y-3">
                        <h3 className="text-base font-bold text-gray-900 border-b border-gray-100 pb-2.5 flex items-center gap-2">
                          <ClockIcon size={16} className="text-amber-500" />
                          <span>Time Checks</span>
                        </h3>
                        <div className="space-y-2.5 text-xs">
                          <div className="flex justify-between border-b border-gray-100 pb-2">
                            <span className="text-gray-500">Ordered at</span>
                            <span className="font-semibold text-gray-800">{selectedOrderFullView.orderedAt}</span>
                          </div>
                          <div className="flex justify-between border-b border-gray-100 pb-2">
                            <span className="text-gray-500">Send to restaurant</span>
                            <span className="font-semibold text-gray-800">{selectedOrderFullView.sendToRestaurantAt}</span>
                          </div>
                          <div className="flex justify-between border-b border-gray-100 pb-2">
                            <span className="text-gray-500">Restaurant confirmed at</span>
                            <span className="font-semibold text-gray-800">{selectedOrderFullView.restaurantConfirmedAt}</span>
                          </div>
                          <div className="flex justify-between border-b border-gray-100 pb-2">
                            <span className="text-gray-500">Pickup - Committed</span>
                            <span className="font-semibold text-gray-800">{selectedOrderFullView.pickupCommittedAt}</span>
                          </div>
                          <div className="flex justify-between border-b border-gray-100 pb-2">
                            <span className="text-gray-500">Food is ready at</span>
                            <span className="font-semibold text-gray-800">{selectedOrderFullView.foodReadyAt}</span>
                          </div>
                          <div className="flex justify-between border-b border-gray-100 pb-2">
                            <span className="text-gray-500">Picked up at</span>
                            <span className="font-semibold text-gray-800">{selectedOrderFullView.pickedUpAt}</span>
                          </div>
                          <div className="flex justify-between">
                            <span className="text-gray-500">Promised delivery time</span>
                            <span className="font-semibold text-gray-900">{selectedOrderFullView.promisedDeliveryAt}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Footer */}
                <div className="px-6 py-3 bg-white border-t border-gray-200 flex items-center justify-between text-xs text-gray-500">
                  <span className="flex items-center gap-1.5">
                    <AlertCircleIcon size={14} className="text-amber-600" /> Read-Only View (Send to Vendor &amp; Cancel disabled for viewers)
                  </span>
                  <button
                    type="button"
                    onClick={() => setSelectedOrder(null)}
                    className="px-4 py-1.5 bg-gray-100 border border-gray-300 rounded font-medium text-gray-700 hover:bg-gray-200"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Firebase Live Sync Configuration Modal */}
          {isSyncModalOpen && (
            <div
              className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4"
              onClick={() => setIsSyncModalOpen(false)}
            >
              <div
                className="bg-white rounded-xl max-w-2xl w-full shadow-2xl border border-gray-200 overflow-hidden"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="px-6 py-4 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <ShieldCheckIcon size={20} className="text-emerald-600" />
                    <div>
                      <h2 className="text-base font-bold text-gray-900">
                        البث اللحظي الشامل (Firebase Realtime 2-Second Sync)
                      </h2>
                      <p className="text-xs text-gray-500">
                        تحديث جميع أقسام Hurrier وسجل الطيارين للموظفين كل ثانيتين
                      </p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setIsSyncModalOpen(false)}
                    className="p-1.5 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-200/60"
                  >
                    <XIcon size={18} />
                  </button>
                </div>

                <div className="flex border-b border-gray-200 bg-white px-6 gap-6 text-xs font-semibold">
                  <button
                    type="button"
                    onClick={() => setModalTab('firebase')}
                    className={`py-3 border-b-2 transition-colors ${
                      modalTab === 'firebase'
                        ? 'border-blue-600 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-800'
                    }`}
                  >
                    1. إعدادات البث المباشر (Firebase)
                  </button>
                  <button
                    type="button"
                    onClick={() => setModalTab('paste')}
                    className={`py-3 border-b-2 transition-colors ${
                      modalTab === 'paste'
                        ? 'border-blue-600 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-800'
                    }`}
                  >
                    2. لصق يدوي (Paste JSON)
                  </button>
                </div>

                <div className="p-6 space-y-4 text-sm max-h-[70vh] overflow-y-auto">
                  {modalTab === 'firebase' && (
                    <div className="space-y-4">
                      <div className="p-3.5 rounded-lg bg-emerald-50/70 border border-emerald-200 text-xs text-emerald-900 leading-relaxed">
                        <strong>متصل بـ Firebase Realtime Database:</strong> السكريبت التلقائي (Tampermonkey) بيرفع كل التبويبات وتفاصيل الأوردرات، والصفحة دي بتعرضها للموظفين كل <strong>ثانيتين</strong> للقراءة فقط.
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-gray-700 mb-1.5">
                          Firebase Realtime Database URL
                        </label>
                        <div className="flex gap-2">
                          <input
                            type="text"
                            value={firebaseUrl}
                            onChange={(e) => setFirebaseUrl(e.target.value)}
                            className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-xs font-mono focus:outline-none focus:border-blue-500"
                          />
                          <button
                            type="button"
                            onClick={() => setFirebaseUrl(DEFAULT_FIREBASE_URL)}
                            className="px-3 py-2 border border-gray-300 rounded-lg text-xs font-medium text-gray-600 hover:bg-gray-100 flex items-center gap-1"
                          >
                            <RotateCcwIcon size={13} /> الافتراضي
                          </button>
                        </div>
                      </div>

                      <div className="p-3 rounded-lg bg-blue-50/60 border border-blue-200 space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-blue-900 flex items-center gap-1.5">
                            <Link2Icon size={14} /> رابط الموظفين (عرض فقط)
                          </span>
                          <button
                            type="button"
                            onClick={() => handleCopyCode('shareLink', employeeShareLink)}
                            className="px-2.5 py-1 rounded bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold flex items-center gap-1"
                          >
                            {copiedSnippet === 'shareLink' ? <CheckIcon size={12} /> : <CopyIcon size={12} />}
                            {copiedSnippet === 'shareLink' ? 'تم النسخ' : 'نسخ رابط الموظفين'}
                          </button>
                        </div>
                        <div className="text-[11px] font-mono text-gray-600 bg-white px-2.5 py-1.5 rounded border border-blue-100 truncate">
                          {employeeShareLink}
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-gray-700 mb-1.5">
                            سرعة التحديث التلقائي
                          </label>
                          <select
                            value={refreshIntervalSec}
                            onChange={(e) => setRefreshIntervalSec(Number(e.target.value))}
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white"
                          >
                            <option value={2}>كل ثانيتين (2s - لحظي)</option>
                            <option value={3}>كل 3 ثواني</option>
                            <option value={5}>كل 5 ثواني</option>
                          </select>
                        </div>
                        <div className="flex items-end">
                          <button
                            type="button"
                            onClick={() => {
                              setSyncMode('live');
                              setIsAutoRefresh(true);
                              lastSyncedAtRef.current = '';
                              fetchLiveFeed();
                              setIsSyncModalOpen(false);
                            }}
                            className="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors flex items-center justify-center gap-2"
                          >
                            <WifiIcon size={16} /> تحديث الآن
                          </button>
                        </div>
                      </div>

                      {syncError && (
                        <div className="p-3 rounded bg-red-50 border border-red-200 text-xs text-red-700">
                          {syncError}
                        </div>
                      )}
                    </div>
                  )}

                  {modalTab === 'paste' && (
                    <div className="space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-semibold text-gray-700">
                          اختر القسم المستهدف للبيانات:
                        </span>
                        <select
                          value={pasteTargetTab}
                          onChange={(e) => setPasteTargetTab(e.target.value)}
                          className="px-3 py-1.5 border border-gray-300 rounded text-xs font-medium bg-white"
                        >
                          <option value="Active">Active Deliveries</option>
                          <option value="Queued">Queued Deliveries</option>
                          <option value="Dispatched">Dispatched Deliveries</option>
                          <option value="Actionable">Actionable Deliveries</option>
                          <option value="Pre-order">Pre-order Deliveries</option>
                        </select>
                      </div>

                      <textarea
                        rows={6}
                        value={rawJsonInput}
                        onChange={(e) => setRawJsonInput(e.target.value)}
                        placeholder="الصق هنا الـ JSON Response..."
                        className="w-full p-3 border border-gray-300 rounded-lg font-mono text-xs focus:outline-none focus:border-blue-500"
                      />

                      <div className="flex justify-end gap-2">
                        <button
                          type="button"
                          onClick={handleApplyPastedJson}
                          className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5"
                        >
                          <UploadIcon size={14} /> تحديث الجداول الآن
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
