                              </div>

                              <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-gray-100">
                                <div className="flex items-center gap-2">
                                  {rider.phone ? (
                                    <>
                                      <button
                                        type="button"
                                        onClick={() => copyToClipboard(`rs-ph-${rider.phone}`, rider.phone)}
                                        className="inline-flex items-center gap-1 font-mono font-bold text-gray-900 bg-gray-50 hover:bg-gray-100 px-2.5 py-1 rounded border border-gray-200"
                                      >
                                        <span>📞 {rider.phone}</span>
                                        <span className="text-blue-600">
                                          {copiedText === `rs-ph-${rider.phone}` ? "✓" : "⧉"}
                                        </span>
                                      </button>
                                      <a
                                        href={`tel:${rider.phone}`}
                                        className="px-2 py-1 rounded bg-emerald-600 hover:bg-emerald-700 text-white font-bold"
                                      >
                                        اتصال
                                      </a>
                                    </>
                                  ) : (
                                    <span className="text-gray-400">رقم الهاتف غير مسجل</span>
                                  )}
                                </div>

                                <div className="flex items-center gap-1.5">
                                  {riderActiveOrdersCount > 0 && (
                                    <button
                                      type="button"
                                      onClick={() => {
                                        setSearchQuery(rider.name);
                                        setCurrentPage(1);
                                      }}
                                      className="px-2.5 py-1 rounded bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 font-bold"
                                    >
                                      أوردراته ({riderActiveOrdersCount})
                                    </button>
                                  )}
                                  <button
                                    type="button"
                                    onClick={(e) => openCourierModal(e, rider.courierId || rider.userId, rider.name)}
                                    className="px-2.5 py-1 rounded bg-slate-900 hover:bg-slate-800 text-white font-bold"
                                  >
                                    👤 ملف الرايدر
                                  </button>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}

                {activeTab === "Dashboard"
                  ? renderDashboardView()
                  : activeTab === "Active Couriers"
                  ? renderActiveCouriersView()
                  : activeTab === "Dispatcher Dashboard"
                  ? renderDispatcherDashboardView()
                  : activeTab === "Issues"
                  ? renderIssuesView()
                  : activeTab === "Completed"
                  ? renderCompletedOrdersView()
                  : renderDeliveriesTable()}
              </div>
            </main>
          </div>

          {/* Admin Email & Role Management Modal */}
          {isAdminModalOpen && userRole === "admin" && (
            <div
              className="fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4"
              onClick={() => setIsAdminModalOpen(false)}
            >
              <div
                className="bg-white rounded-2xl w-full max-w-xl shadow-2xl border border-gray-200 overflow-hidden"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                  <div>
                    <h3 className="text-base font-bold">🛡️ إدارة إيميلات الدخول والصلاحيات</h3>
                    <p className="text-xs text-slate-300">
                      أضف أي حساب Gmail وحدد صلاحيته (موظف للعرض فقط، أو Admin لإدارة الإيميلات وتغذية الداشبورد)
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setIsAdminModalOpen(false)}
                    className="text-slate-300 hover:text-white text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                  <form onSubmit={handleAddOrUpdateAllowedEmail} className="grid grid-cols-1 sm:grid-cols-12 gap-2">
                    <input
                      type="email"
                      required
                      value={newAllowedEmail}
                      onChange={(e) => setNewAllowedEmail(e.target.value)}
                      placeholder="example@gmail.com"
                      className="sm:col-span-5 px-3 py-2 border border-gray-300 rounded-lg text-xs focus:outline-none focus:border-blue-500"
                    />
                    <input
                      type="text"
                      value={newAllowedLabel}
                      onChange={(e) => setNewAllowedLabel(e.target.value)}
                      placeholder="الاسم (اختياري)"
                      className="sm:col-span-3 px-3 py-2 border border-gray-300 rounded-lg text-xs focus:outline-none focus:border-blue-500"
                    />
                    <select
                      value={newAllowedRole}
                      onChange={(e) => setNewAllowedRole(e.target.value)}
                      className="sm:col-span-2 px-2 py-2 border border-gray-300 rounded-lg text-xs font-semibold bg-white"
                    >
                      <option value="employee">موظف</option>
                      <option value="admin">Admin</option>
                    </select>
                    <button
                      type="submit"
                      disabled={adminSaving}
                      className="sm:col-span-2 py-2 px-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs"
                    >
                      {adminSaving ? "..." : "+ إضافة"}
                    </button>
                  </form>

                  <div className="divide-y divide-gray-100 border border-gray-200 rounded-xl overflow-hidden">
                    {allowedEmailsList.map((item) => (
                      <div key={item.key} className="px-4 py-2.5 flex items-center justify-between gap-2 text-xs bg-white">
                        <div className="min-w-0">
                          <div className="font-mono font-bold text-gray-900 truncate">{item.email}</div>
                          {item.label && <div className="text-gray-500">{item.label}</div>}
                        </div>
                        <div className="flex items-center gap-2 flex-shrink-0">
                          <button
                            type="button"
                            disabled={item.email === currentUser?.email}
                            onClick={() => handleToggleEmailRole(item)}
                            className={`px-2.5 py-1 rounded-full font-bold border ${
                              item.role === "admin"
                                ? "bg-amber-50 text-amber-800 border-amber-300"
                                : "bg-gray-100 text-gray-700 border-gray-300"
                            }`}
                          >
                            {item.role === "admin" ? "🛡️ Admin" : "👤 موظف"}
                          </button>
                          {item.email !== currentUser?.email && (
                            <button
                              type="button"
                              onClick={() => handleDeleteAllowedEmail(item)}
                              className="px-2 py-1 rounded bg-red-50 hover:bg-red-100 text-red-700 font-bold"
                            >
                              حذف
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Read-Only Full Order Details Modal */}
          {selectedOrderFullView && (
            <div
              className="fixed inset-0 bg-black/45 z-50 flex items-center justify-center p-2 sm:p-4"
              onClick={() => setSelectedOrder(null)}
            >
              <div
                className="bg-[#f5f6f8] rounded-xl w-full max-w-[1400px] max-h-[94vh] shadow-2xl border border-gray-200 flex flex-col overflow-hidden"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="px-6 py-3.5 bg-white border-b border-gray-200 flex flex-wrap items-center justify-between gap-3 shadow-sm">
                  <div className="flex flex-wrap items-center gap-3">
                    <span className="text-2xl font-bold text-gray-900 tracking-tight">
                      {selectedOrderFullView.id}
                    </span>
                    <button
                      type="button"
                      onClick={() => copyToClipboard("orderCode", selectedOrderFullView.id)}
                      className="text-xs px-2 py-1 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 font-medium"
                    >
                      {copiedText === "orderCode" ? "✓ Copied" : "⧉ Copy ID"}
                    </button>
                    <span className="text-xs font-semibold text-blue-600">
                      {selectedOrderFullView.orderCode}
                    </span>

                    <div className="flex flex-wrap items-center gap-1.5">
                      {selectedOrderFullView.orderBadges.map((b, idx) => (
                        <span
                          key={idx}
                          className={`px-2.5 py-0.5 rounded-full text-xs font-semibold ${
                            b === "Cash"
                              ? "bg-emerald-50 text-emerald-700 border border-emerald-200"
                              : b === "Proof of pickup"
                              ? "bg-purple-50 text-purple-700 border border-purple-200"
                              : "bg-amber-50 text-amber-800 border border-amber-200"
                          }`}
                        >
                          {b === "Cash" ? "💵 Cash Order" : b === "Proof of pickup" ? "📷 Proof of pickup" : b}
                        </span>
                      ))}
                    </div>

                    {!selectedOrderFullView.isLoadedFromApi && (
                      <span className="text-xs font-semibold text-blue-600 animate-pulse">
                        ⚡ جاري جلب كل الأحداث والتفاصيل من Hurrier...
                      </span>
                    )}
                  </div>

                  <button
                    type="button"
                    onClick={() => setSelectedOrder(null)}
                    className="p-1.5 rounded-lg text-gray-500 hover:text-gray-800 hover:bg-gray-100 text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-4 sm:p-5 grid grid-cols-1 lg:grid-cols-12 gap-4 text-sm">
                  <div className="lg:col-span-3 space-y-4">
                    <div className="bg-white rounded-lg border border-gray-200 p-4 shadow-sm">
                      <h3 className="text-base font-bold text-gray-900 pb-3 border-b border-gray-100">
                        Important Details
                      </h3>
                      <div className="divide-y divide-gray-100 text-xs">
                        <div className="py-2.5 flex items-start justify-between gap-2">
                          <span className="text-gray-600 font-medium">Status</span>
                          <div className="text-right">
                            <div className="font-semibold text-gray-900">{selectedOrderFullView.status}</div>
                            {selectedOrderFullView.statusSinceStr && (
                              <div className="text-[11px] text-gray-400">({selectedOrderFullView.statusSinceStr})</div>
                            )}
                          </div>
                        </div>
                        <div className="py-2.5 flex items-center justify-between gap-2">
                          <span className="text-gray-600 font-medium">Platform</span>
                          <span className="font-bold text-[#ff5a00] text-sm">{selectedOrderFullView.platformName}</span>
                        </div>
                        <div className="py-2.5 flex items-center justify-between gap-2">
                          <span className="text-gray-600 font-medium">Vendor code</span>
                          <span className="font-mono text-gray-700">{selectedOrderFullView.vendorCode}</span>
                        </div>
                        <div className="py-2.5 flex items-center justify-between gap-2">
                          <span className="text-gray-600 font-medium">Vendor Order no.</span>
                          <span className="font-mono text-gray-700">{selectedOrderFullView.vendorOrderNo}</span>
                        </div>
                        <div className="py-2.5 flex items-center justify-between gap-2">
                          <span className="text-gray-600 font-medium">Order Value</span>
                          <span className="font-semibold text-gray-900">{selectedOrderFullView.orderValue}</span>
                        </div>
                        <div className="py-2.5 flex items-center justify-between gap-2">
                          <span className="text-gray-600 font-medium">Manhattan distance</span>
                          <span className="font-semibold text-gray-800">{selectedOrderFullView.distance}</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="lg:col-span-6 space-y-4">
                    <div className="bg-white rounded-lg border border-gray-200 p-4 shadow-sm space-y-3">
                      <h3 className="text-base font-bold text-gray-900">Pick up and Drop off</h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div className="p-3.5 rounded-lg border border-gray-200 bg-white space-y-2 text-xs">
                          <div className="font-bold text-gray-900 text-sm">Vendor Address</div>
                          <div className="text-blue-600 font-semibold truncate">{selectedOrderFullView.vendorName}</div>
                          <div className="text-gray-700 leading-relaxed">{selectedOrderFullView.pickupAddress}</div>
                        </div>

                        <div className="p-3.5 rounded-lg border border-gray-200 bg-white space-y-2 text-xs">
                          <div className="font-bold text-gray-900 text-sm">Customer Address</div>
                          <div className="flex flex-wrap items-center justify-between gap-1.5">
                            <span className="font-bold text-gray-900">{selectedOrderFullView.customerName}</span>
                            {selectedOrderFullView.customerPhone && (
                              <span className="font-mono font-bold text-gray-900">
                                📞 {selectedOrderFullView.customerPhone}
                              </span>
                            )}
                          </div>
                          <div className="text-gray-700 leading-relaxed">{selectedOrderFullView.dropoffAddress}</div>
                        </div>
                      </div>
                    </div>

                    <div className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
                      <div className="px-4 border-b border-gray-200 flex items-center gap-5 text-xs sm:text-sm font-semibold bg-white overflow-x-auto whitespace-nowrap">
                        {[
                          { id: "Deliveries", label: `Deliveries ${selectedOrderFullView.structuredDeliveries.length}` },
                          { id: "Order Items", label: `Order Items ${selectedOrderFullView.items.length}` }
                        ].map((t) => (
                          <button
                            key={t.id}
                            type="button"
                            onClick={() => setDetailModalTab(t.id)}
                            className={`py-3 border-b-2 transition-colors ${
                              detailModalTab === t.id
                                ? "border-blue-600 text-blue-600"
                                : "border-transparent text-gray-600 hover:text-gray-900"
                            }`}
                          >
                            {t.label}
                          </button>
                        ))}
                      </div>

                      <div className="p-4 space-y-4">
                        {detailModalTab === "Deliveries" && (
                          <div className="space-y-4">
                            {selectedOrderFullView.structuredDeliveries.map((del) => (
                              <div key={del.id} className="border border-gray-200 rounded-lg overflow-hidden">
                                <div className="px-4 py-2.5 bg-[#eef3fc] border-b border-blue-100 grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                                  <div>
                                    <div className="text-gray-500 text-[11px]">Status</div>
                                    <div className="font-bold text-gray-900">{del.status}</div>
                                  </div>
                                  <div>
                                    <div className="text-gray-500 text-[11px]">Zones</div>
                                    <div className="font-semibold text-gray-800 truncate">{del.zones}</div>
                                  </div>
                                  <div>
                                    <div className="text-gray-500 text-[11px]">Courier</div>
                                    <div className="font-semibold text-blue-600 truncate">{del.courier}</div>
                                  </div>
                                  <div>
                                    <div className="text-gray-500 text-[11px]">Utilization</div>
                                    <div className="font-bold text-gray-900">{del.utilization}</div>
                                  </div>
                                </div>

                                {del.events.length === 0 ? (
                                  <div className="p-6 text-center text-xs text-gray-500">
                                    {selectedOrderFullView.isLoadedFromApi
                                      ? "لا توجد أحداث مسجلة لهذه التوصيلة."
                                      : "⏳ جاري سحب كافة أحداث التوصيلة من Hurrier..."}
                                  </div>
                                ) : (
                                  <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs whitespace-nowrap">
                                      <thead>
                                        <tr className="border-b border-gray-200 text-gray-600 font-bold text-[10px] uppercase bg-white">
                                          <th className="py-2.5 px-3">TIME</th>
                                          <th className="py-2.5 px-3">EVENT</th>
                                          <th className="py-2.5 px-3">COURIER</th>
                                          <th className="py-2.5 px-2 text-center">LOC</th>
                                        </tr>
                                      </thead>
                                      <tbody className="divide-y divide-gray-100">
                                        {del.events.map((ev) => (
                                          <tr key={ev.key} className="hover:bg-gray-50/80">
                                            <td className="py-2.5 px-3 font-mono text-gray-800">{ev.timeSec}</td>
                                            <td className="py-2.5 px-3">
                                              <div className={`font-bold ${ev.isRemoved ? "text-red-600" : "text-blue-600"}`}>
                                                {ev.eventLabel}
                                              </div>
                                              {ev.subLabel && <div className="text-[11px] text-gray-500">{ev.subLabel}</div>}
                                            </td>
                                            <td className="py-2.5 px-3 text-gray-700">{ev.courierName}</td>
                                            <td className="py-2.5 px-2 text-center">
                                              {ev.locUrl ? (
                                                <a href={ev.locUrl} target="_blank" rel="noopener noreferrer">📍</a>
                                              ) : (
                                                "-"
                                              )}
                                            </td>
                                          </tr>
                                        ))}
                                      </tbody>
                                    </table>
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>
                        )}

                        {detailModalTab === "Order Items" && (
                          <div className="border border-gray-200 rounded-lg overflow-hidden">
                            <table className="w-full text-left text-xs">
                              <thead>
                                <tr className="bg-gray-50 border-b border-gray-200 text-gray-500 font-bold uppercase">
                                  <th className="py-2.5 px-4">ITEM</th>
                                  <th className="py-2.5 px-3 text-center">QTY</th>
                                  <th className="py-2.5 px-4 text-right">PRICE</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-gray-100">
                                {selectedOrderFullView.items.map((it) => (
                                  <tr key={it.id}>
                                    <td className="py-3 px-4 font-medium text-gray-900">{it.name}</td>
                                    <td className="py-3 px-3 text-center font-bold">{it.quantity}</td>
                                    <td className="py-3 px-4 text-right font-semibold">{it.priceFormatted}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>

                  <div className="lg:col-span-3 space-y-4">
                    <div className="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm">
                      <div className="px-4 py-3 bg-gray-50/70 border-b border-gray-200 font-bold text-sm text-gray-900">
                        🕒 Time Checks
                      </div>
                      <div className="px-4 divide-y divide-gray-100 text-xs">
                        {selectedOrderFullView.timeChecks.map((tc) => (
                          <div key={tc.label} className="py-2.5 flex items-center justify-between gap-2">
                            <span className="text-gray-700 font-medium">{tc.label}</span>
                            <span className="text-gray-500 font-semibold text-right">{tc.value}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                <div className="px-6 py-3 bg-white border-t border-gray-200 flex items-center justify-between text-xs text-gray-500">
                  <span>View-Only Mode (No actions permitted)</span>
                  <button
                    type="button"
                    onClick={() => setSelectedOrder(null)}
                    className="px-4 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 font-semibold text-gray-700"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Rider / Courier Profile Modal */}
          {selectedCourierFullView && (
            <div
              className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4"
              onClick={() => setSelectedCourier(null)}
            >
              <div
                className="bg-white rounded-xl w-full max-w-lg shadow-2xl border border-gray-200 overflow-hidden"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="px-6 pt-5 pb-4 border-b border-gray-100 flex items-start justify-between gap-3">
                  <div className="space-y-1.5 min-w-0">
                    <div className="flex items-center gap-2">
                      <h3 className="text-lg font-bold text-blue-600 leading-snug break-words">
                        {selectedCourierFullView.name}
                      </h3>
                    </div>
                    <div className="text-sm text-gray-600 font-medium">
                      User ID:{" "}
                      <strong className="font-mono text-gray-900">
                        {selectedCourierFullView.userId ? `#${selectedCourierFullView.userId}` : "جاري الجلب..."}
                      </strong>
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={() => setSelectedCourier(null)}
                    className="p-1.5 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-5 space-y-4 text-sm">
                  {selectedCourierFullView.phone && (
                    <div className="grid grid-cols-2 gap-2.5">
                      <a
                        href={`tel:${selectedCourierFullView.phone}`}
                        className="py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm"
                      >
                        📞 اتصال مباشر
                      </a>
                      <button
                        type="button"
                        onClick={() => copyToClipboard("riderPhoneTop", selectedCourierFullView.phone)}
                        className="py-2.5 px-3 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 font-bold text-xs flex items-center justify-center gap-1.5"
                      >
                        {copiedText === "riderPhoneTop" ? "✓ تم النسخ" : `⧉ نسخ ${selectedCourierFullView.phone}`}
                      </button>
                    </div>
                  )}

                  <div className="p-4 rounded-lg bg-gray-100/90 border border-gray-200 space-y-1">
                    <div className="text-xs text-gray-500 font-medium">Status</div>
                    <div className="text-base font-bold text-gray-900">{selectedCourierFullView.statusLabel}</div>
                  </div>

                  <div className="divide-y divide-gray-200 border-t border-b border-gray-200">
                    <div className="py-3 flex items-center justify-between">
                      <span className="font-semibold text-gray-900">Vehicle</span>
                      <span className="text-gray-600 font-medium">{selectedCourierFullView.vehicle}</span>
                    </div>

                    <div className="py-3 flex items-center justify-between gap-2">
                      <span className="font-semibold text-gray-900">Phone</span>
                      {selectedCourierFullView.phone ? (
                        <span className="font-mono font-bold text-gray-900">{selectedCourierFullView.phone}</span>
                      ) : !selectedCourierFullView.isLoadedFromApi ? (
                        <span className="text-xs font-semibold text-emerald-700 animate-pulse">
                          ⏳ جاري جلب رقم الموبايل من Hurrier...
                        </span>
                      ) : (
                        <span className="text-gray-400 text-xs">غير متاح</span>
                      )}
                    </div>
                  </div>
                </div>

                <div className="px-6 py-3 bg-gray-50 border-t border-gray-200 flex items-center justify-between text-xs text-gray-500">
                  <span>View-Only Rider Card</span>
                  <button
                    type="button"
                    onClick={() => setSelectedCourier(null)}
                    className="px-4 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 font-semibold text-gray-700"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
