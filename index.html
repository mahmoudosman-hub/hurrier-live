    function formatRelativeDeadline(isoDate, isPreorder = false) {
      if (!isoDate) return '-';
      const target = new Date(isoDate);
      if (Number.isNaN(target.getTime())) return '-';
      if (isPreorder) {
        return target.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      }
      const diffMins = Math.round((target.getTime() - Date.now()) / 60000);
      const absMins = Math.abs(diffMins);
      const sign = diffMins < 0 ? '-' : '';
      if (absMins >= 60) {
        const h = Math.floor(absMins / 60);
        const m = absMins % 60;
        return `${sign}${h}h ${m}min`;
      }
      return `${sign}${absMins}min`;
    }

    function parseFlexibleDate(val) {
      if (val === null || val === undefined || val === '') return null;
      if (val instanceof Date) return Number.isNaN(val.getTime()) ? null : val;
      if (typeof val === 'number') {
        const ms = val < 1e11 ? val * 1000 : val;
        const d = new Date(ms);
        return Number.isNaN(d.getTime()) ? null : d;
      }
      const str = String(val).trim();
      if (!str) return null;
      if (/^\d+(\.\d+)?$/.test(str)) {
        const num = Number(str);
        const ms = num < 1e11 ? num * 1000 : num;
        const d = new Date(ms);
        return Number.isNaN(d.getTime()) ? null : d;
      }
      let d = new Date(str);
      if (!Number.isNaN(d.getTime())) return d;
      const normalized = str
        .replace(/^(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2}:\d{2})/, '$1T$2')
        .replace(/(\.\d{3})\d+/, '$1')
        .replace(/([+-]\d{2})(\d{2})$/, '$1:$2')
        .replace(/\s+UTC$/i, 'Z');
      d = new Date(normalized);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function formatReadableTimestamp(isoDate) {
      const d = parseFlexibleDate(isoDate);
      if (!d) return '-';
      return d.toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
    }

    function getTransitionRawTimestamp(tr) {
      if (!tr || typeof tr !== 'object') return null;
      return (
        tr.created_at ||
        tr.timestamp ||
        tr.event_timestamp ||
        tr.occurred_at ||
        tr.performed_at ||
        tr.updated_at ||
        tr.time ||
        tr.metadata?.performed_at ||
        tr.metadata?.created_at ||
        tr.metadata?.timestamp ||
        tr.metadata?.event_timestamp ||
        tr.metadata?.delivery_etas_updated_at ||
        null
      );
    }

    function formatShortTimeWithSec(isoDate) {
      if (!isoDate) return '-';
      const d = parseFlexibleDate(isoDate);
      if (!d) {
        const timeMatch = String(isoDate).match(/\d{1,2}:\d{2}:\d{2}(\s*[AP]M)?/i);
        return timeMatch ? timeMatch[0] : '-';
      }
      return d.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      });
    }

    function formatShortTimeNoSec(isoDate) {
      if (!isoDate) return '-';
      const d = parseFlexibleDate(isoDate);
      if (!d) return '-';
      return d.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true

    }

    function formatDurationSeconds(sec) {
      if (sec === null || sec === undefined || Number.isNaN(Number(sec))) return '-';
      const mins = Math.round(Number(sec) / 60);
      if (mins < 60) return `${mins}m`;
      return `${Math.floor(mins / 60)}h ${mins % 60}m`;
    }

    function formatUtilization(util) {
      if (!util || util.value === undefined || util.value === null) return '-';
      if (util.type === 'price') return `${(Number(util.value) / 100).toFixed(2)} EGP (Price)`;
      if (util.type === 'volume') return `${Number(util.value).toFixed(1)} L (Volume)`;
      if (util.type === 'weight') return `${Number(util.value).toFixed(2)} kg (Weight)`;
      return `${util.value} (${util.type || 'Unit'})`;
    }

    function humanizeEventLabel(tr) {
      const state = String(tr.to_state || tr.event_type || '').toLowerCase();
      const map = {
        queued: 'Queued',
        dispatched: 'Dispatched',
        courier_notified: 'Courier Notified',
        accepted: 'Accepted',
        near_pickup: 'Near Pickup',
        picked_up: 'Picked Up',
        left_pickup: 'Left Pickup',
        near_dropoff: 'Near Dropoff',
        completed: 'Completed',
        undispatched: 'Undispatched',
        pending: 'Pending',
        scheduled: 'Scheduled'
      };
      if (map[state]) return map[state];
      return state
        .split('_')
        .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    // تحليل سجل الطيارين الذين قبلوا الأوردر أو استلموه أو تم سحبه منهم
    function extractCourierHistoryFromDeliveries(deliveriesArr, fallbackCourier, fallbackCourierId) {
      const courierMap = new Map();

      (deliveriesArr || []).forEach((del, delIdx) => {
        const transitions = Array.isArray(del.transitions) ? del.transitions : [];
        transitions.forEach((tr) => {
          const cid = tr.courier_id || tr.metadata?.courier_id;
          const cname = tr.courier_name || tr.metadata?.courier_name;
          if (!cid && !cname) return;

          const key = String(cid || cname);
          if (!courierMap.has(key)) {
            courierMap.set(key, {
              courierId: cid || '-',
              courierName: cname || `Courier #${cid}`,
              deliveryId: del.id,
              deliveryIndex: delIdx + 1,
              events: [],
              acceptedAt: null,
              dispatchedAt: null,
              notifiedAt: null,
              pickedUpAt: null,
              leftPickupAt: null,
              undispatchedAt: null,
              undispatchReason: null,
              firstSeenAt: getTransitionRawTimestamp(tr) || null,
              lastSeenAt: getTransitionRawTimestamp(tr) || null
            });
          }

          const entry = courierMap.get(key);
          const evType = String(tr.event_type || '').toLowerCase();
          const toState = String(tr.to_state || '').toLowerCase();
          const label = humanizeEventLabel(tr);
          const trTime = getTransitionRawTimestamp(tr);

          if (!entry.events.includes(label)) {
            entry.events.push(label);
          }

          if (trTime) {
            const parsedTrTime = parseFlexibleDate(trTime);
            const parsedFirst = parseFlexibleDate(entry.firstSeenAt);
            const parsedLast = parseFlexibleDate(entry.lastSeenAt);
            if (!parsedFirst || (parsedTrTime && parsedTrTime < parsedFirst)) {
              entry.firstSeenAt = trTime;
            }
            if (!parsedLast || (parsedTrTime && parsedTrTime > parsedLast)) {
              entry.lastSeenAt = trTime;
            }
          }

          if (toState === 'dispatched' || evType.includes('dispatched')) {
            entry.dispatchedAt = trTime || entry.dispatchedAt;
          }
          if (toState === 'courier_notified' || evType.includes('notified')) {
            entry.notifiedAt = trTime || entry.notifiedAt;
          }
          if (toState === 'accepted' || evType.includes('accepted')) {
            entry.acceptedAt = trTime || entry.acceptedAt;
          }
          if (toState === 'picked_up' || evType.includes('picked_up')) {
            entry.pickedUpAt = trTime || entry.pickedUpAt;
          }
          if (toState === 'left_pickup' || evType.includes('left_pickup')) {
            entry.leftPickupAt = trTime || entry.leftPickupAt;
          }
          if (tr.un_dispatch_type || tr.metadata?.undispatch_type || toState.includes('undispatch')) {
            entry.undispatchedAt = trTime || entry.undispatchedAt;
            entry.undispatchReason = tr.un_dispatch_type || tr.metadata?.undispatch_type || 'undispatched';
          }
        });

        if (del.courier_id || del.courier_name) {
          const curKey = String(del.courier_id || del.courier_name);
          if (!courierMap.has(curKey)) {
            courierMap.set(curKey, {
              courierId: del.courier_id || '-',
              courierName: del.courier_name || `Courier #${del.courier_id}`,
              deliveryId: del.id,
              deliveryIndex: delIdx + 1,
              events: [humanizeEventLabel({ to_state: del.status })],
              acceptedAt: ['accepted', 'near_pickup', 'picked_up', 'left_pickup', 'near_dropoff', 'completed'].includes(String(del.status).toLowerCase())
                ? del.event_timestamp
                : null,
              dispatchedAt: del.event_timestamp || null,
              notifiedAt: null,
              pickedUpAt: null,
              leftPickupAt: null,
              undispatchedAt: null,
              undispatchReason: null,
              firstSeenAt: del.event_timestamp || null,
              lastSeenAt: del.event_timestamp || null
            });
          } else {
            const existing = courierMap.get(curKey);
            if (
              !existing.acceptedAt &&
              ['accepted', 'near_pickup', 'picked_up', 'left_pickup', 'near_dropoff', 'completed'].includes(String(del.status).toLowerCase())
            ) {
              existing.acceptedAt = existing.pickedUpAt || existing.leftPickupAt || del.event_timestamp || existing.firstSeenAt;
            }
          }
        }
      });

      if (courierMap.size === 0 && fallbackCourier && fallbackCourier !== '-' && fallbackCourier !== 'Assigning...') {
        courierMap.set(String(fallbackCourierId || fallbackCourier), {
          courierId: fallbackCourierId || '-',
          courierName: fallbackCourier,
          deliveryId: '-',
          deliveryIndex: 1,
          events: ['Current Assigned'],
          acceptedAt: null,
          dispatchedAt: null,
          notifiedAt: null,
          pickedUpAt: null,
          leftPickupAt: null,
          undispatchedAt: null,
          undispatchReason: null,
          firstSeenAt: null,
          lastSeenAt: null
        });
      }

      return Array.from(courierMap.values());
    }

    function mapHurrierRecordToDelivery(rec, tabName, idx = 0) {

        time_in: deadlineStr.startsWith('-') ? deadlineStr : '-',
        time_at: formatReadableTimestamp(order.scheduled_dropoff_at),
        zone: allZones.length > 0 ? allZones.slice(0, 3).join(', ') : 'Cairo',
        allZones,
        city: 'Cairo',
        instructions,
        tab: tabName,
        distance: distKm,
        orderValue: valEgp,
        valueLimit: valLimit,
        capacity: rec.capacity ?? '-',
        utilizationText: formatUtilization(order.utilization_value),
        isCash: Boolean(order.is_cash_collection),
        isCard: Boolean(order.is_card_on_delivery),
        isCorporate: Boolean(order.is_corporate),
        isReviewed: order.is_order_reviewed !== false,
        isHighUtil: Boolean(order.is_high_utilization),
        isReturning: Boolean(rec.is_returning),
        isDarkstore,
        verticalType,
        restrictions,
        tags: tagsList,
        placedAt: formatReadableTimestamp(order.placed_at || order.send_to_restaurant_at),
        sentToVendorAt: formatReadableTimestamp(order.send_to_restaurant_at),
        confirmedAt: formatReadableTimestamp(order.restaurant_confirmed_at),
        scheduledPickupAt: formatReadableTimestamp(order.scheduled_pickup_at),
        originalPickupAt: formatReadableTimestamp(order.original_scheduled_pickup_at),
        scheduledDropoffAt: formatReadableTimestamp(order.scheduled_dropoff_at),
        completedAt: formatReadableTimestamp(rec.completed_at),
        cancelledAt: formatReadableTimestamp(rec.cancelled_at),
        cancellationReason: rec.cancellation_reason || '-',
        cancelledBy: rec.cancelled_by || '-',
        metrics: rec.metrics || {},
        pickupAddress: order.pickup_address?.street_address || '-',
        pickupCoords: order.pickup_address?.latitude && order.pickup_address?.longitude
          ? `${Number(order.pickup_address.latitude).toFixed(5)}, ${Number(order.pickup_address.longitude).toFixed(5)}`
          : null,

    // --- FULL HURRIER ORDER DETAIL MODAL (READ-ONLY) ---
    function OrderFullInspectionModal({ baseOrder, firebaseUrl, onClose }) {
      const [fullData, setFullData] = useState(null);

      const copyText = (key, val) => {
        if (!val) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {

        }
        setCopiedField(key);
        setTimeout(() => setCopiedField(null), 1500);

      const requestAndFetchOrderDetail = useCallback(async (forceNewRequest = false) => {
        if (!baseOrder?.id) return;
        const cleanBase = firebaseUrl.trim().replace(/\/+$/, '');
        const cleanCode = String(baseOrder.id).replace(/^HF_EG/i, '').trim();
        const fullOrderCode = baseOrder.orderCode || `HF_EG${cleanCode}`;

        setLoadingState('loading');
        try {
          const existingRes = await fetch(`${cleanBase}/hurrier_live/order_details/${encodeURIComponent(cleanCode)}.json`, { cache: 'no-store' });
          const existingJson = existingRes.ok ? await existingRes.json() : null;

          const isFresh = existingJson && existingJson.fetchedAt && (Date.now() - new Date(existingJson.fetchedAt).getTime() < 12000);
          if (existingJson && (existingJson.order || (existingJson.deliveries && existingJson.deliveries.length > 0))) {
            setFullData(existingJson);
            if (isFresh && !forceNewRequest) {
              setLoadingState('live');
              return;
            }

          await fetch(`${cleanBase}/hurrier_live/detail_requests/${encodeURIComponent(cleanCode)}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({

              code: cleanCode,

              status: 'pending',

                setLoadingState('live');
              }
            }

                                    <tr className="bg-gray-100/80 border-b border-gray-200 text-gray-600 font-bold text-[11px] uppercase">
                                      <th className="py-2.5 px-4">TIME</th>
                                      <th className="py-2.5 px-4">EVENT</th>
                                      <th className="py-2.5 px-4">COURIER</th>
                                      <th className="py-2.5 px-3 text-center">LOC</th>
                                      <th className="py-2.5 px-3">EST.ACCEPT TIME</th>
                                      <th className="py-2.5 px-3">EST.PICKUP ARRIVAL</th>
                                      <th className="py-2.5 px-3">EST.PICKUP DEPARTURE</th>
                                      <th className="py-2.5 px-3">EST.DROPOFF ARRIVAL</th>
                                      <th className="py-2.5 px-3">EST.DROPOFF DEPARTURE</th>
                                      <th className="py-2.5 px-3 text-center">INFO</th>
                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-gray-100">
                                    {transitions.map((tr, tIdx) => {
                                      const evTitle = humanizeEventLabel(tr);
                                      const rawTrTime = getTransitionRawTimestamp(tr);
                                      const isFirstRow = tIdx === 0;
                                      const isLastRow = tIdx === transitions.length - 1;
                                      const isAcceptedRow = evTitle === 'Accepted';
                                      const isUndispatchRow = Boolean(tr.un_dispatch_type || tr.metadata?.undispatch_type);
                                      const dispatchSub = tr.dispatch_type
                                        ? tr.dispatch_type.split('_').map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')
                                        : tr.un_dispatch_type
                                        ? tr.un_dispatch_type.split('_').map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')
                                        : '';
                                      const loc = tr.courier_location || (tr.metadata?.courier_lat && tr.metadata?.courier_long
                                        ? { latitude: tr.metadata.courier_lat, longitude: tr.metadata.courier_long }
                                        : null);
                                      const estAccept = tr.expected_accept_time || tr.metadata?.expected_accept_time;
                                      const estPuArr = tr.estimated_pickup_arrival_at || tr.metadata?.estimated_pickup_arrival_at;
                                      const estPuDep = tr.estimated_pickup_departure_at || tr.metadata?.estimated_pickup_departure_at;
                                      const estDoArr = tr.estimated_drop_off_arrival_at || tr.metadata?.estimated_dropoff_arrival_at || tr.metadata?.estimated_drop_off_arrival_at;
                                      const estDoDep = tr.estimated_drop_off_departure_at || tr.metadata?.estimated_dropoff_departure_at || tr.metadata?.estimated_drop_off_departure_at;

                                      return (
                                        <tr
                                          key={tr.id || tIdx}
                                          className={`hover:bg-gray-50 ${
                                            isAcceptedRow
                                              ? 'bg-emerald-50/40'
                                              : isUndispatchRow
                                              ? 'bg-red-50/40'
                                              : ''
                                          }`}
                                        >
                                          <td className="py-3 px-4 font-mono font-medium text-gray-800 whitespace-nowrap">
                                            {formatShortTimeWithSec(rawTrTime)}
                                          </td>
                                          <td className="py-3 px-4 relative">
                                            <div className="flex items-center gap-3">
                                              <div className="relative flex items-center justify-center w-3 self-stretch">
                                                {!isFirstRow && (
                                                  <span className="absolute top-0 bottom-1/2 w-[1.5px] bg-blue-300" />
                                                )}
                                                {!isLastRow && (
                                                  <span className="absolute top-1/2 bottom-0 w-[1.5px] bg-blue-300" />
                                                )}
                                                <span
                                                  className={`relative z-10 w-2.5 h-2.5 rounded-full flex-shrink-0 ${
                                                    isAcceptedRow
                                                      ? 'bg-emerald-600'
                                                      : isUndispatchRow
                                                      ? 'bg-red-600'
                                                      : 'bg-blue-600'
                                                  }`}
                                                />
                                              </div>
                                              <div>
                                                <div
                                                  className={`font-semibold ${
                                                    isAcceptedRow
                                                      ? 'text-emerald-700'
                                                      : isUndispatchRow
                                                      ? 'text-red-700'
                                                      : 'text-blue-600'
                                                  }`}
                                                >
                                                  {evTitle}
                                                </div>
                                                {dispatchSub && (
                                                  <div className="text-[11px] text-gray-500">{dispatchSub}</div>
                                                )}
                                              </div>
                                            </div>
                                          </td>
                                          <td className="py-3 px-4">
                                            {tr.courier_name ? (
                                              <span className="text-blue-600 font-medium">{tr.courier_name}</span>
                                            ) : (
                                              <span className="text-gray-400">-</span>
                                            )}
                                          </td>
                                          <td className="py-3 px-3 text-center">
                                            {loc && loc.latitude && loc.longitude ? (
                                              <a
                                                href={`https://maps.google.com/?q=${loc.latitude},${loc.longitude}`}
                                                target="_blank"
                                                rel="noreferrer"
                                                title={`Courier Location: ${loc.latitude}, ${loc.longitude}`}
                                                className="inline-flex text-blue-600 hover:text-blue-800"
                                              >
                                                <MapPinIcon size={15} />
                                              </a>
                                            ) : (
                                              <span className="text-gray-300 inline-flex">
                                                <MapPinIcon size={15} />
                                              </span>
                                            )}
                                          </td>
                                          <td className="py-3 px-3 font-mono text-gray-700">
                                            {formatShortTimeNoSec(estAccept)}
                                          </td>
                                          <td className="py-3 px-3 font-mono text-gray-700">
                                            {formatShortTimeNoSec(estPuArr)}
                                          </td>
                                          <td className="py-3 px-3 font-mono text-gray-700">
                                            {formatShortTimeNoSec(estPuDep)}
                                          </td>
                                          <td className="py-3 px-3 font-mono text-gray-700">
                                            {formatShortTimeNoSec(estDoArr)}
                                          </td>
                                          <td className="py-3 px-3 font-mono text-gray-700">
                                            {formatShortTimeNoSec(estDoDep)}
                                          </td>
                                          <td className="py-3 px-3 text-center">
                                            <button
                                              type="button"
                                              onClick={() => setSelectedTransitionInfo(tr)}
                                              className="w-5 h-5 rounded-full bg-gray-800 text-white inline-flex items-center justify-center text-[10px] font-bold hover:bg-blue-600"
                                              title="View Transition Metadata"
                                            >
                                              i
                                            </button>
                                          </td>
                                        </tr>
                                      );
                                    })}
                                  </tbody>
                                </table>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {selectedTransitionInfo && (
                <div className="bg-gray-900 text-gray-100 rounded-lg p-4 text-xs space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="font-bold text-amber-400">
                      Transition Metadata — {humanizeEventLabel(selectedTransitionInfo)} ({formatShortTimeWithSec(getTransitionRawTimestamp(selectedTransitionInfo))})
                    </span>
                    <button
                      type="button"
                      onClick={() => setSelectedTransitionInfo(null)}
                      className="text-gray-400 hover:text-white"
                    >
                      <XIcon size={15} />
                    </button>
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 font-mono text-[11px] bg-gray-800 p-3 rounded">
                    <div>Performed By: <span className="text-emerald-400">{selectedTransitionInfo.performed_by || '-'}</span></div>
                    <div>Dispatch Type: <span className="text-blue-300">{selectedTransitionInfo.dispatch_type || '-'}</span></div>
                    <div>Undispatch Type: <span className="text-red-400">{selectedTransitionInfo.un_dispatch_type || selectedTransitionInfo.metadata?.undispatch_type || '-'}</span></div>
                    <div>Previous Courier ID: <span className="text-amber-300">{selectedTransitionInfo.metadata?.redispatched_courier_id || '-'}</span></div>
                  </div>
                </div>
              )}
            </div>

            <div className="px-5 py-2.5 bg-white border-t border-gray-200 flex items-center justify-between text-xs text-gray-500">
              <span className="flex items-center gap-1.5">
                <AlertCircleIcon size={14} className="text-amber-600" />
                Read-Only Inspection Mode (Send to Vendor &amp; Cancel buttons disabled)
              </span>
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 rounded font-semibold text-gray-700"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const initialFirebaseUrl = useMemo(() => {
        const params = new URLSearchParams(window.location.search);
        return (params.get('db') || DEFAULT_FIREBASE_URL).replace(/\/+$/, '');
      }, []);

      const [activeTab, setActiveTab] = useState('Active');
      const [searchQuery, setSearchQuery] = useState('');
      const [zoneFilterState, setZoneFilterState] = useState(() => {
        try {
          const saved = localStorage.getItem('hurrier_zone_filter_v1');
          if (saved) return JSON.parse(saved);
        } catch {}
        return { mode: 'all', cities: [], zoneIds: [] };
      });
      const [citiesCatalog, setCitiesCatalog] = useState(FALLBACK_CITIES_CATALOG);
      const [isLocationMenuOpen, setIsLocationMenuOpen] = useState(false);
      const [isZonesDialogOpen, setIsZonesDialogOpen] = useState(false);
      const [isCitiesDialogOpen, setIsCitiesDialogOpen] = useState(false);
      const [zoneDialogSearch, setZoneDialogSearch] = useState('');
      const [draftZoneIds, setDraftZoneIds] = useState([]);
      const [draftCities, setDraftCities] = useState([]);
      const [syncZonesToHurrier, setSyncZonesToHurrier] = useState(true);
      const locationDropdownRef = useRef(null);

      const [quickFilter, setQuickFilter] = useState('all');
      const [issueStatusFilter, setIssueStatusFilter] = useState('all');
      const [issueTypeFilter, setIssueTypeFilter] = useState('all');
      const [expandedZoneId, setExpandedZoneId] = useState(null);
      const [selectedOrder, setSelectedOrder] = useState(null);
      const [copiedId, setCopiedId] = useState(null);
      const [lastRefreshed, setLastRefreshed] = useState('Waiting for first sync...');

      const [deliveries, setDeliveries] = useState(MOCK_DELIVERIES);
      const [zonesList, setZonesList] = useState(MOCK_ZONES);
      const [individualCouriers, setIndividualCouriers] = useState([]);
      const [issuesList, setIssuesList] = useState([]);
      const [citySummary, setCitySummary] = useState(CITY_KPI_SUMMARY);
      const [dispatcherStats, setDispatcherStats] = useState(DISPATCHER_STATS);
      const [tabCounts, setTabCounts] = useState({
        Issues: 0,
        Actionable: 23,
        'Pre-order': 6,
        'Waiting for Assembly': 0,
        Queued: 37,
        Dispatched: 78,
        Active: 458,
        Upcoming: 0,
        Cancelled: 0,
        Completed: 0
      });

      const [firebaseUrl, setFirebaseUrl] = useState(initialFirebaseUrl);
      const lastSyncedAtRef = useRef('');
      const [syncMode, setSyncMode] = useState('live');
      const [isAutoRefresh, setIsAutoRefresh] = useState(true);
      const [refreshIntervalSec, setRefreshIntervalSec] = useState(2);
      const [countdown, setCountdown] = useState(2);
      const [syncStatus, setSyncStatus] = useState('idle');
      const [syncError, setSyncError] = useState('');
      const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
      const [modalTab, setModalTab] = useState('firebase');
      const [pasteTargetTab, setPasteTargetTab] = useState('Active');
      const [rawJsonInput, setRawJsonInput] = useState('');
      const [copiedSnippet, setCopiedSnippet] = useState(null);

      useEffect(() => {
        const handleOutsideClick = (e) => {
          if (locationDropdownRef.current && !locationDropdownRef.current.contains(e.target)) {
            setIsLocationMenuOpen(false);
          }
        };
        document.addEventListener('mousedown', handleOutsideClick);
        return () => document.removeEventListener('mousedown', handleOutsideClick);
      }, []);

      const mergedCitiesCatalog = useMemo(() => {
        const cityMap = new Map();
        citiesCatalog.forEach((c) => {
          cityMap.set(c.name, {
            id: c.id,
            name: c.name,
            zones: new Map((c.zones || []).map((z) => [String(z.id), { id: Number(z.id), name: z.name }]))
          });
        });

        zonesList.forEach((z) => {
          const cName = z.city || 'Cairo';
          if (!cityMap.has(cName)) {
            cityMap.set(cName, { id: cName, name: cName, zones: new Map() });
          }
          cityMap.get(cName).zones.set(String(z.id), { id: Number(z.id), name: z.zone });
        });

        return Array.from(cityMap.values())
          .map((c) => ({
            id: c.id,
            name: c.name,
            zones: Array.from(c.zones.values()).sort((a, b) => a.name.localeCompare(b.name))
          }))
          .sort((a, b) => a.name.localeCompare(b.name));
      }, [citiesCatalog, zonesList]);

      const zoneIdToMetaMap = useMemo(() => {
        const map = new Map();
        mergedCitiesCatalog.forEach((c) => {
          c.zones.forEach((z) => {
            map.set(String(z.id), { id: z.id, name: z.name, city: c.name });
          });
        });
        return map;
      }, [mergedCitiesCatalog]);

      const zoneNameToCityMap = useMemo(() => {
        const map = new Map();
        mergedCitiesCatalog.forEach((c) => {
          c.zones.forEach((z) => {
            map.set(z.name.toLowerCase().trim(), c.name);
          });
        });
        return map;
      }, [mergedCitiesCatalog]);

      const selectedZoneNamesSet = useMemo(() => {
        if (zoneFilterState.mode !== 'multiple_zones') return new Set();
        const names = new Set();
        (zoneFilterState.zoneIds || []).forEach((id) => {
          const meta = zoneIdToMetaMap.get(String(id));
          if (meta && meta.name) names.add(meta.name.toLowerCase().trim());
        });
        return names;
      }, [zoneFilterState, zoneIdToMetaMap]);

      const applyAndSaveZoneFilter = useCallback(async (nextState, pushToHurrier = false) => {
        setZoneFilterState(nextState);
        try {
          localStorage.setItem('hurrier_zone_filter_v1', JSON.stringify(nextState));
        } catch {}

        if (pushToHurrier) {
          try {
            const cleanBaseUrl = firebaseUrl.trim().replace(/\/+$/, '');
            const isCustomZones = nextState.mode === 'multiple_zones' && Array.isArray(nextState.zoneIds) && nextState.zoneIds.length > 0;
            await fetch(`${cleanBaseUrl}/hurrier_live/zone_config.json`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                write_key: FIREBASE_WRITE_KEY,
                mode: isCustomZones ? 'custom' : 'default',
                zone_ids: isCustomZones ? nextState.zoneIds.map(String) : [],
                updatedAt: new Date().toISOString()
              })
            });
          } catch {}
        }
      }, [firebaseUrl]);

      const locationDropdownLabel = useMemo(() => {
        if (zoneFilterState.mode === 'city' && zoneFilterState.cities?.length === 1) {
          return zoneFilterState.cities[0];
        }
        if (zoneFilterState.mode === 'multiple_cities') {
          return zoneFilterState.cities?.length > 0
            ? `Multiple Cities (${zoneFilterState.cities.length})`
            : 'Multiple Cities';
        }
        if (zoneFilterState.mode === 'multiple_zones') {
          return zoneFilterState.zoneIds?.length > 0
            ? `Multiple Zones (${zoneFilterState.zoneIds.length})`
            : 'Multiple Zones';
        }
        return 'All Cities';
      }, [zoneFilterState]);

      const matchesCityAndZoneFilter = useCallback((itemCity, itemZoneNames = [], itemZoneIds = []) => {
        if (zoneFilterState.mode === 'all') return true;

        if (zoneFilterState.mode === 'city' || zoneFilterState.mode === 'multiple_cities') {
          const allowedCities = new Set((zoneFilterState.cities || []).map((c) => c.toLowerCase()));
          if (allowedCities.size === 0) return true;
          if (itemCity && allowedCities.has(String(itemCity).toLowerCase())) return true;
          return itemZoneNames.some((zn) => {
            const mappedCity = zoneNameToCityMap.get(String(zn).toLowerCase().trim());
            return mappedCity && allowedCities.has(mappedCity.toLowerCase());
          });
        }

        if (zoneFilterState.mode === 'multiple_zones') {
          const allowedIds = new Set((zoneFilterState.zoneIds || []).map((id) => String(id)));
          if (allowedIds.size === 0) return true;
          if (itemZoneIds.some((id) => allowedIds.has(String(id)))) return true;
          return itemZoneNames.some((zn) => selectedZoneNamesSet.has(String(zn).toLowerCase().trim()));
        }

        return true;
      }, [zoneFilterState, zoneNameToCityMap, selectedZoneNamesSet]);

      const sidebarItemsWithCounts = useMemo(() => {
        return SIDEBAR_ITEMS.map((item) => {
          if (!Object.prototype.hasOwnProperty.call(tabCounts, item.id)) return item;
          if (zoneFilterState.mode === 'all' || item.id === 'Issues') {
            return { ...item, count: tabCounts[item.id] };
          }
          const filteredCount = deliveries.filter((d) => {
            if (d.tab !== item.id) return false;
            const zList = Array.isArray(d.allZones) && d.allZones.length > 0
              ? d.allZones
              : String(d.zone || '').split(',').map((s) => s.trim()).filter(Boolean);
            return matchesCityAndZoneFilter(d.city, zList, []);
          }).length;
          return { ...item, count: filteredCount };
        });
      }, [tabCounts, zoneFilterState.mode, deliveries, matchesCityAndZoneFilter]);

      const applyHurrierBundle = useCallback((bundle) => {
        if (!bundle || typeof bundle !== 'object') return;

        const tabBuckets = [
          { key: 'active', tab: 'Active' },
          { key: 'queued', tab: 'Queued' },
          { key: 'dispatched', tab: 'Dispatched' },
          { key: 'actionable', tab: 'Actionable' },
          { key: 'waiting_for_assembly', tab: 'Waiting for Assembly' },
          { key: 'preorder', tab: 'Pre-order' },
          { key: 'upcoming', tab: 'Upcoming' },
          { key: 'cancelled', tab: 'Cancelled' },
          { key: 'completed', tab: 'Completed' }
        ];

        let hasAnyDelivery = false;
        const updatedMap = new Map();
        const nextCounts = {};

        tabBuckets.forEach(({ key, tab }) => {
          const payload = bundle[key];
          if (payload && Array.isArray(payload.records)) {
            hasAnyDelivery = true;
            const mapped = payload.records.map((r, idx) => mapHurrierRecordToDelivery(r, tab, idx));
            updatedMap.set(tab, mapped);
            nextCounts[tab] = payload.metadata?.total_count ?? mapped.length;
          }
        });

        if (hasAnyDelivery) {
          setDeliveries((prev) => {
            const preserved = prev.filter((d) => !updatedMap.has(d.tab));
            const incoming = Array.from(updatedMap.values()).flat();
            return [...incoming, ...preserved];
          });
          setTabCounts((prev) => ({ ...prev, ...nextCounts }));
        }

        if (bundle.stats && Array.isArray(bundle.stats.cities)) {
          const newSummaries = [];
          const newZoneRows = [];

          bundle.stats.cities.forEach((c) => {
            const s = c.stat || {};
            newSummaries.push({
              city: c.city_name,
              queued: s.queued_count ?? 0,
              queuedPct: s.queued_percent ?? 0,
              dispatched: s.dispatched_count ?? 0,
              dispatchedPct: s.dispatched_percent ?? 0,
              active: s.active_count ?? 0,
              activePct: s.active_percent ?? 0,
              delay: `${Number(s.delay || 0).toFixed(1)}m`,
              puPct: s.picked_up_percent ?? 0,
              doPct: s.drop_off_percent ?? 0,
              zeroDel: s.zero_deliveries ?? 0,
              lowDel: s.low_deliveries ?? 0,
              medDel: s.medium_deliveries ?? 0,
              highDel: s.high_deliveries ?? 0,
              starting: s.couriers_in_starting ?? 0,
              working: s.couriers_in_working ?? 0,
              ending: s.couriers_in_ending ?? 0,
              tempBreak: s.couriers_in_temp_break ?? 0,
              break: s.couriers_in_break ?? 0
            });

            (c.zones || []).forEach((z) => {
              const zDelay = `${Number(z.stat?.delay || 0).toFixed(1)}m`;
              (z.starting_points || []).forEach((sp) => {
                const st = sp.stat || {};
                newZoneRows.push({
                  id: sp.id,
                  zone: sp.name,
                  parentZone: z.zone_name || '',
                  city: c.city_name,
                  starting: st.couriers_in_starting ?? 0,
                  working: st.couriers_in_working ?? 0,
                  ending: st.couriers_in_ending ?? 0,
                  break: st.couriers_in_break ?? 0,
                  tempBreak: st.couriers_in_temp_break ?? 0,
                  delay: st.delay ? `${Number(st.delay).toFixed(1)}m` : zDelay,
                  queued: st.queued_count ?? 0,
                  dispatched: st.dispatched_count ?? 0,
                  active: st.active_count ?? 0,
                  puPercent: st.picked_up_percent ?? 0,
                  doPercent: st.drop_off_percent ?? 0,
                  zeroDel: st.zero_deliveries ?? 0,
                  lowDel: st.low_deliveries ?? 0,
                  medDel: st.medium_deliveries ?? 0,
                  highDel: st.high_deliveries ?? 0
                });
              });
            });
          });

          if (newSummaries.length > 0) setCitySummary(newSummaries);
          if (newZoneRows.length > 0) setZonesList(newZoneRows);
        }

        if (Array.isArray(bundle.couriers)) {
          setIndividualCouriers(bundle.couriers);
        }

        if (Array.isArray(bundle.issues)) {
          setIssuesList(bundle.issues);
          setTabCounts((prev) => ({ ...prev, Issues: bundle.issues.length }));
        }

        if (Array.isArray(bundle.dispatchers)) {
          setDispatcherStats(
            bundle.dispatchers.map((d) => ({
              picked_by: d.picked_by,
              picked: d.picked ?? 0,
              processing: d.processing ?? 0,
              max_picked_for: d.min_picked_at ? formatRelativeDeadline(d.min_picked_at).replace('-', '') : '-'
            }))
          );
        }

        const displayTime = bundle.syncedAt ? new Date(bundle.syncedAt) : new Date();
        setLastRefreshed(
          displayTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        );
      }, []);

      const fetchLiveFeed = useCallback(async (forceFull = false) => {
        setSyncError('');
        try {
          const cleanBaseUrl = firebaseUrl.trim().replace(/\/+$/, '');
          if (!cleanBaseUrl) throw new Error('أدخل رابط Firebase Realtime Database أولاً');

          if (forceFull) {
            fetch(`${cleanBaseUrl}/hurrier_live/cities_catalog.json`, { cache: 'no-store' })
              .then((r) => (r.ok ? r.json() : null))
              .then((cat) => {
                if (cat && Array.isArray(cat.cities) && cat.cities.length > 0) {
                  setCitiesCatalog(cat.cities);
                }
              })
              .catch(() => {});
          }

          if (!forceFull && lastSyncedAtRef.current) {
            const checkRes = await fetch(`${cleanBaseUrl}/hurrier_live/syncedAt.json`, { cache: 'no-store' });
            if (checkRes.ok) {
              const remoteSyncedAt = await checkRes.json();
              if (remoteSyncedAt && remoteSyncedAt === lastSyncedAtRef.current) {
                setSyncStatus('connected');
                return;
              }
            }
          }

          setSyncStatus('syncing');
          const res = await fetch(`${cleanBaseUrl}/hurrier_live.json`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`Firebase HTTP ${res.status}`);
          const data = await res.json();

          if (!data || Object.keys(data).length === 0) {
            throw new Error('في انتظار إرسال أول تحديث من صفحة Hurrier...');
          }

          if (data.syncedAt) {
            lastSyncedAtRef.current = data.syncedAt;
          }
          applyHurrierBundle(data);
          setSyncStatus('connected');
        } catch (err) {
          setSyncStatus('error');
          setSyncError(err?.message || 'في انتظار وصول أول تحديث من متصفح Hurrier...');
        }
      }, [firebaseUrl, applyHurrierBundle]);

      useEffect(() => {
        fetchLiveFeed(true);
      }, [fetchLiveFeed]);

      useEffect(() => {
        if (syncMode !== 'live' || !isAutoRefresh) return;
        setCountdown(refreshIntervalSec);
        const timer = setInterval(() => {
          setCountdown((prev) => {
            if (prev <= 1) {
              fetchLiveFeed(false);
              return refreshIntervalSec;
            }

                  })}
                </div>

                <div className="px-6 py-3.5 bg-gray-50 border-t border-gray-200 flex items-center justify-end gap-3">
                  <button
                    type="button"
                    onClick={() => setIsZonesDialogOpen(false)}
                    className="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-100"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      if (draftZoneIds.length === 0) {
                        applyAndSaveZoneFilter({ mode: 'all', cities: [], zoneIds: [] }, syncZonesToHurrier);
                      } else {
                        applyAndSaveZoneFilter(
                          { mode: 'multiple_zones', cities: [], zoneIds: draftZoneIds },
                          syncZonesToHurrier
                        );
                      }
                      setIsZonesDialogOpen(false);
                    }}
                    className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold shadow-sm"
                  >
                    Select
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SELECT MULTIPLE CITIES MODAL */}
          {isCitiesDialogOpen && (
            <div
              className="fixed inset-0 bg-black/45 z-50 flex items-center justify-center p-4"
              onClick={() => setIsCitiesDialogOpen(false)}
            >
              <div
                className="bg-white rounded-xl max-w-lg w-full max-h-[80vh] shadow-2xl border border-gray-200 flex flex-col overflow-hidden"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                  <h2 className="text-lg font-bold text-gray-900">Select multiple cities</h2>
                  <div className="flex items-center gap-3">
                    <button
                      type="button"
                      onClick={() =>
                        setDraftCities((prev) =>
                          prev.length > 0 ? [] : mergedCitiesCatalog.map((c) => c.name)
                        )
                      }
                      className="text-xs font-bold text-blue-600 hover:text-blue-800 uppercase"
                    >
                      {draftCities.length > 0 ? 'UNSELECT ALL' : 'SELECT ALL'}
                    </button>
                    <button
                      type="button"
                      onClick={() => setIsCitiesDialogOpen(false)}
                      className="p-1.5 rounded-lg text-gray-400 hover:text-gray-700"
                    >
                      <XIcon size={18} />
                    </button>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-6 grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  {mergedCitiesCatalog.map((c) => {
                    const checked = draftCities.includes(c.name);
                    return (
                      <label
                        key={c.id || c.name}
                        className={`flex items-center gap-2.5 p-2.5 rounded-lg border cursor-pointer text-sm ${
                          checked
                            ? 'border-blue-400 bg-blue-50/60 text-blue-900 font-medium'
                            : 'border-gray-200 hover:bg-gray-50 text-gray-800'
                        }`}
                      >
                        <input
                          type="checkbox"
                          checked={checked}
                          onChange={() =>
                            setDraftCities((prev) =>
                              prev.includes(c.name)
                                ? prev.filter((item) => item !== c.name)
                                : [...prev, c.name]
                            )
                          }
                          className="w-4 h-4 rounded border-gray-300 text-blue-600"
                        />
                        <span>{c.name}</span>
                      </label>
                    );
                  })}
                </div>

                <div className="px-6 py-3.5 bg-gray-50 border-t border-gray-200 flex items-center justify-end gap-3">
                  <button
                    type="button"
                    onClick={() => setIsCitiesDialogOpen(false)}
                    className="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-100"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      if (draftCities.length === 0) {
                        applyAndSaveZoneFilter({ mode: 'all', cities: [], zoneIds: [] }, false);
                      } else {
                        applyAndSaveZoneFilter({ mode: 'multiple_cities', cities: draftCities, zoneIds: [] }, false);
                      }
                      setIsCitiesDialogOpen(false);
                    }}
                    className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold"
                  >
                    Select
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Live Sync Configuration Modal */}
          {isSyncModalOpen && (
            <div
              className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4"
              onClick={() => setIsSyncModalOpen(false)}
            >
              <div
                className="bg-white rounded-xl max-w-2xl w-full shadow-2xl border border-gray-200 overflow-hidden"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="px-6 py-4 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <ShieldCheckIcon size={20} className="text-emerald-600" />
                    <div>
                      <h2 className="text-base font-bold text-gray-900">
                        البث الشامل اللحظي (Firebase Realtime — كل 2 ثانية)
                      </h2>
                      <p className="text-xs text-gray-500">
                        يشمل جميع تبويبات Hurrier وتفاصيل الأوردرات وسجل الطيارين
                      </p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setIsSyncModalOpen(false)}
                    className="p-1.5 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-200/60"
                  >
                    <XIcon size={18} />
                  </button>
                </div>

                <div className="flex border-b border-gray-200 bg-white px-6 gap-6 text-xs font-semibold">
                  <button
                    type="button"
                    onClick={() => setModalTab('firebase')}
                    className={`py-3 border-b-2 transition-colors ${
                      modalTab === 'firebase'
                        ? 'border-blue-600 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-800'
                    }`}
                  >
                    1. حالة الاتصال اللحظي (Firebase)
                  </button>
                  <button
                    type="button"
                    onClick={() => setModalTab('paste')}
                    className={`py-3 border-b-2 transition-colors ${
                      modalTab === 'paste'
                        ? 'border-blue-600 text-blue-600'
                        : 'border-transparent text-gray-500 hover:text-gray-800'
                    }`}
                  >
                    2. لصق يدوي (Paste JSON)
                  </button>
                </div>

                <div className="p-6 space-y-4 text-sm max-h-[70vh] overflow-y-auto">
                  {modalTab === 'firebase' && (
                    <div className="space-y-4">
                      <div className="p-3.5 rounded-lg bg-emerald-50/70 border border-emerald-200 text-xs text-emerald-900 leading-relaxed">
                        <strong>متصل ومفعّل تلقائياً:</strong> يحدّث كافة الأقسام (Dashboard, Issues, Active Couriers, Actionable, Pre-order, Assembly, Queued, Dispatched, Active, Upcoming, Cancelled, Completed) بالإضافة لتفاصيل الأوردرات وسجل الطيارين.
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-gray-700 mb-1.5">
                          Firebase Realtime Database URL
                        </label>
                        <input
                          type="text"
                          value={firebaseUrl}
                          onChange={(e) => {
                            setFirebaseUrl(e.target.value);
                            lastSyncedAtRef.current = '';
                          }}
                          className="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs font-mono focus:outline-none focus:border-blue-500"
                        />
                      </div>

                      <div className="p-3 rounded-lg bg-blue-50/60 border border-blue-200 space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-blue-900 flex items-center gap-1.5">
                            <Link2Icon size={14} /> رابط الموظفين (عرض فقط — جاهز للمشاركة مباشرة)
                          </span>
                          <button
                            type="button"
                            onClick={() => handleCopyCode('shareLink', employeeShareLink)}
                            className="px-2.5 py-1 rounded bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold flex items-center gap-1"
                          >
                            {copiedSnippet === 'shareLink' ? <CheckIcon size={12} /> : <CopyIcon size={12} />}
                            {copiedSnippet === 'shareLink' ? 'تم النسخ' : 'نسخ رابط الموظفين'}
                          </button>
                        </div>
                        <div className="text-[11px] font-mono text-gray-600 bg-white px-2.5 py-1.5 rounded border border-blue-100 truncate">
                          {employeeShareLink}
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-gray-700 mb-1.5">
                            معدل الفحص اللحظي
                          </label>
                          <select
                            value={refreshIntervalSec}
                            onChange={(e) => setRefreshIntervalSec(Number(e.target.value))}
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white"
                          >
                            <option value={2}>كل ثانيتين (2s - أقصى سرعة)</option>
                            <option value={3}>كل 3 ثواني</option>
                            <option value={5}>كل 5 ثواني</option>
                          </select>
                        </div>
                        <div className="flex items-end">
                          <button
                            type="button"
                            onClick={() => {
                              setSyncMode('live');
                              setIsAutoRefresh(true);
                              fetchLiveFeed(true);
                              setIsSyncModalOpen(false);
                            }}
                            className="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors flex items-center justify-center gap-2"
                          >
                            <WifiIcon size={16} /> تحديث فوري الآن
                          </button>
                        </div>
                      </div>

                      {syncError && (
                        <div className="p-3 rounded bg-amber-50 border border-amber-200 text-xs text-amber-800">
                          {syncError}
                        </div>
                      )}
                    </div>
                  )}

                  {modalTab === 'paste' && (
                    <div className="space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-semibold text-gray-700">
                          اختر القسم المستهدف للبيانات:
                        </span>
                        <select
                          value={pasteTargetTab}
                          onChange={(e) => setPasteTargetTab(e.target.value)}
                          className="px-3 py-1.5 border border-gray-300 rounded text-xs font-medium bg-white"
                        >
                          <option value="Active">Active Deliveries</option>
                          <option value="Queued">Queued Deliveries</option>
                          <option value="Dispatched">Dispatched Deliveries</option>
                          <option value="Actionable">Actionable Deliveries</option>
                          <option value="Pre-order">Pre-order Deliveries</option>
                        </select>
                      </div>

                      <textarea
                        rows={6}
                        value={rawJsonInput}
                        onChange={(e) => setRawJsonInput(e.target.value)}
                        placeholder="الصق هنا الـ JSON Response..."
                        className="w-full p-3 border border-gray-300 rounded-lg font-mono text-xs focus:outline-none focus:border-blue-500"
                      />

                      <div className="flex justify-end gap-2">
                        <button
                          type="button"
                          onClick={handleApplyPastedJson}
                          className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5"
                        >
                          <UploadIcon size={14} /> تحديث الجداول الآن
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
