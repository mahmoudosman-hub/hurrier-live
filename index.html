                      <div className="p-4 space-y-4">
                        {detailModalTab === "Deliveries" && (
                          <div className="space-y-4">
                            {selectedOrderFullView.structuredDeliveries.map((del) => (
                              <div key={del.id} className="border border-gray-200 rounded-lg overflow-hidden">
                                {/* Delivery Metadata Strip */}
                                <div className="px-4 py-2.5 bg-[#eef3fc] border-b border-blue-100 grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs">
                                  <div>
                                    <div className="text-gray-500 text-[11px]">ID</div>
                                    <div className="font-mono font-bold text-gray-900 truncate" title={String(del.id)}>
                                      {del.id}
                                    </div>
                                  </div>
                                  <div>
                                    <div className="text-gray-500 text-[11px]">Status</div>
                                    <div className="font-bold text-gray-900">{del.status}</div>
                                  </div>
                                  <div>
                                    <div className="text-gray-500 text-[11px]">Zones</div>
                                    <div className="font-semibold text-gray-800 truncate" title={del.zones}>
                                      {del.zones}
                                    </div>
                                  </div>
                                  <div>
                                    <div className="text-gray-500 text-[11px]">Courier</div>
                                    {del.courier && del.courier !== "-" && del.courier !== "Assigning..." ? (
                                      <button
                                        type="button"
                                        onMouseEnter={() => handleCourierHover(del.courierId, del.courier)}
                                        onClick={(e) => openCourierModal(e, del.courierId, del.courier)}
                                        className="font-semibold text-blue-600 hover:underline truncate max-w-full text-left"
                                        title="اضغط لعرض User ID ورقم موبايل الرايدر"
                                      >
                                        {del.courier}
                                      </button>
                                    ) : (
                                      <div className="font-semibold text-gray-600 truncate">{del.courier}</div>
                                    )}
                                  </div>
                                  <div>
                                    <div className="text-gray-500 text-[11px]">Utilization</div>
                                    <div className="font-bold text-gray-900">{del.utilization}</div>
                                  </div>
                                </div>

                                {/* Exact Hurrier Transitions Table */}
                                {del.events.length === 0 ? (
                                  <div className="p-6 text-center text-xs text-gray-500">
                                    {selectedOrderFullView.isLoadedFromApi
                                      ? "لا توجد أحداث مسجلة لهذه التوصيلة."
                                      : "⏳ جاري سحب كافة أحداث التوصيلة (Queued, Dispatched, Accepted, Near Pickup...) من Hurrier..."}
                                  </div>
                                ) : (
                                  <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs whitespace-nowrap">
                                      <thead>
                                        <tr className="border-b border-gray-200 text-gray-600 font-bold text-[10px] uppercase bg-white">
                                          <th className="py-2.5 px-3">TIME</th>
                                          <th className="py-2.5 px-3">EVENT</th>
                                          <th className="py-2.5 px-3">COURIER</th>
                                          <th className="py-2.5 px-2 text-center">LOC</th>
                                          <th className="py-2.5 px-2.5">EST.ACCEPT TIME</th>
                                          <th className="py-2.5 px-2.5">EST.PICKUP ARRIVAL</th>
                                          <th className="py-2.5 px-2.5">EST.PICKUP DEPARTURE</th>
                                          <th className="py-2.5 px-2.5">EST.DROPOFF ARRIVAL</th>
                                          <th className="py-2.5 px-2.5">EST.DROPOFF DEPARTURE</th>
                                        </tr>
                                      </thead>
                                      <tbody className="divide-y divide-gray-100">
                                        {del.events.map((ev) => (
                                          <tr key={ev.key} className="hover:bg-gray-50/80">
                                            <td className="py-2.5 px-3 font-mono text-gray-800">{ev.timeSec}</td>
                                            <td className="py-2.5 px-3">
                                              <div className="flex items-center gap-2">
                                                <span
                                                  className={`w-2 h-2 rounded-full flex-shrink-0 ${
                                                    ev.isRemoved
                                                      ? "bg-red-500"
                                                      : ev.isAccepted
                                                      ? "bg-emerald-500"
                                                      : "bg-blue-600"
                                                  }`}
                                                />
                                                <div>
                                                  <div
                                                    className={`font-bold ${
                                                      ev.isRemoved ? "text-red-600" : "text-blue-600"
                                                    }`}
                                                  >
                                                    {ev.eventLabel}
                                                  </div>
                                                  {ev.subLabel && (
                                                    <div className="text-[11px] text-gray-500">{ev.subLabel}</div>
                                                  )}
                                                </div>
                                              </div>
                                            </td>
                                            <td className="py-2.5 px-3 max-w-[160px] truncate">
                                              {ev.courierName && ev.courierName !== "-" && ev.courierName !== "Assigning..." ? (
                                                <button
                                                  type="button"
                                                  onMouseEnter={() => handleCourierHover(ev.courierId, ev.courierName)}
                                                  onClick={(e) => openCourierModal(e, ev.courierId, ev.courierName)}
                                                  className="text-blue-600 hover:underline font-medium truncate max-w-full text-left"
                                                  title="اضغط لعرض User ID ورقم موبايل الرايدر"
                                                >
                                                  {ev.courierName}
                                                </button>
                                              ) : (
                                                <span className="text-gray-500">{ev.courierName}</span>
                                              )}
                                            </td>
                                            <td className="py-2.5 px-2 text-center">
                                              {ev.locUrl ? (
                                                <a
                                                  href={ev.locUrl}
                                                  target="_blank"
                                                  rel="noopener noreferrer"
                                                  className="text-blue-600 hover:text-blue-800 font-bold"
                                                  title="فتح موقع الطيار على الخريطة"
                                                >
                                                  📍
                                                </a>
                                              ) : (
                                                <span className="text-gray-300">-</span>
                                              )}
                                            </td>
                                            <td className="py-2.5 px-2.5 font-mono text-gray-700">{ev.estAcceptTime}</td>
                                            <td className="py-2.5 px-2.5 font-mono text-gray-700">{ev.estPickupArrival}</td>
                                            <td className="py-2.5 px-2.5 font-mono text-gray-700">{ev.estPickupDeparture}</td>
                                            <td className="py-2.5 px-2.5 font-mono text-gray-700">{ev.estDropoffArrival}</td>
                                            <td className="py-2.5 px-2.5 font-mono text-gray-700">
                                              <div>{ev.estDropoffDeparture}</div>
                                              {ev.estDropoffDelta && ev.estDropoffDeparture !== "-" && (
                                                <div className="text-[10px] text-gray-500">({ev.estDropoffDelta})</div>
                                              )}
                                            </td>
                                          </tr>
                                        ))}
                                      </tbody>
                                    </table>
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>
                        )}

                        {detailModalTab === "Issues" && (
                          <div className="space-y-2 text-xs">
                            {selectedOrderFullView.orderIssues.length === 0 ? (
                              <div className="py-6 text-center text-gray-500">
                                لا توجد Issues مسجلة على هذا الأوردر.
                              </div>
                            ) : (
                              selectedOrderFullView.orderIssues.map((iss, i) => (
                                <div key={iss.id || i} className="p-3 rounded-lg border border-gray-200 bg-gray-50 flex items-center justify-between">
                                  <div>
                                    <div className="font-bold text-gray-900">{iss.reason || iss.type || iss.title || "Issue"}</div>
                                    <div className="text-gray-500 mt-0.5">{formatReadableTimestamp(iss.created_at)}</div>
                                  </div>
                                  <span className="px-2.5 py-0.5 rounded bg-amber-50 text-amber-800 border border-amber-200 font-semibold">
                                    {iss.status || "Open"}
                                  </span>
                                </div>
                              ))
                            )}
                          </div>
                        )}

                        {detailModalTab === "Routes" && (
                          <div className="space-y-3 text-xs">
                            <div className="p-3.5 rounded-lg border border-gray-200 bg-gray-50 space-y-2">
                              <div className="flex items-start gap-2">
                                <span className="font-bold text-blue-700">1. Pickup:</span>
                                <span className="text-gray-800">{selectedOrderFullView.pickupAddress}</span>
                              </div>
                              <div className="flex items-start gap-2">
                                <span className="font-bold text-emerald-700">2. Dropoff:</span>
                                <span className="text-gray-800">{selectedOrderFullView.dropoffAddress}</span>
                              </div>
                              <div className="pt-2 border-t border-gray-200 flex items-center gap-4 text-gray-600">
                                <span>Distance: <strong>{selectedOrderFullView.distance}</strong></span>
                                <span>Zones: <strong>{selectedOrderFullView.zone}</strong></span>
                              </div>
                            </div>
                          </div>
                        )}

                        {detailModalTab === "Order Items" && (
                          <div className="border border-gray-200 rounded-lg overflow-hidden">
                            <table className="w-full text-left text-xs">
                              <thead>
                                <tr className="bg-gray-50 border-b border-gray-200 text-gray-500 font-bold text-[11px] uppercase">
                                  <th className="py-2.5 px-4">ITEM</th>
                                  <th className="py-2.5 px-3 text-center">QUANTITY</th>
                                  <th className="py-2.5 px-3 text-center">VOLUME (L)</th>
                                  <th className="py-2.5 px-3 text-center">WEIGHT (KG)</th>
                                  <th className="py-2.5 px-4 text-right">PRICE</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-gray-100">
                                {selectedOrderFullView.items.map((it) => (
                                  <tr key={it.id} className="hover:bg-gray-50/70">
                                    <td className="py-3 px-4 text-gray-900 font-medium">{it.name}</td>
                                    <td className="py-3 px-3 text-center font-bold text-gray-800">{it.quantity}</td>
                                    <td className="py-3 px-3 text-center font-mono text-gray-600">{it.volume}</td>
                                    <td className="py-3 px-3 text-center font-mono text-gray-600">{it.weight}</td>
                                    <td className="py-3 px-4 text-right font-semibold text-gray-900">{it.priceFormatted}</td>
                                  </tr>
                                ))}

                                {/* Hurrier Totals Summary Rows */}
                                <tr className="bg-gray-50/70 font-bold text-gray-900 border-t-2 border-gray-200">
                                  <td className="py-2.5 px-4">Subtotal</td>
                                  <td className="py-2.5 px-3 text-center">{selectedOrderFullView.itemsSummary.totalQty}</td>
                                  <td className="py-2.5 px-3 text-center font-mono">{selectedOrderFullView.itemsSummary.totalVolume}</td>
                                  <td className="py-2.5 px-3 text-center font-mono">{selectedOrderFullView.itemsSummary.totalWeight}</td>
                                  <td className="py-2.5 px-4 text-right">{selectedOrderFullView.itemsSummary.subtotal}</td>
                                </tr>
                                <tr>
                                  <td colSpan={4} className="py-2.5 px-4 text-gray-700 font-medium">Delivery Fee</td>
                                  <td className="py-2.5 px-4 text-right font-semibold text-gray-800">{selectedOrderFullView.itemsSummary.deliveryFee}</td>
                                </tr>
                                <tr className="bg-gray-50/50 font-bold text-gray-900">
                                  <td colSpan={4} className="py-2.5 px-4">Total</td>
                                  <td className="py-2.5 px-4 text-right">{selectedOrderFullView.itemsSummary.total}</td>
                                </tr>
                                <tr>
                                  <td colSpan={4} className="py-2.5 px-4 text-gray-700 font-medium">Pay at Pickup</td>
                                  <td className="py-2.5 px-4 text-right font-semibold text-gray-800">{selectedOrderFullView.itemsSummary.payAtPickup}</td>
                                </tr>
                                <tr>
                                  <td colSpan={4} className="py-2.5 px-4 text-gray-700 font-medium">Collect at Drop off</td>
                                  <td className="py-2.5 px-4 text-right font-semibold text-gray-800">{selectedOrderFullView.itemsSummary.collectAtDropoff}</td>
                                </tr>
                                <tr>
                                  <td className="py-2.5 px-4 text-gray-700 font-medium">Delivery Bags</td>
                                  <td className="py-2.5 px-3 text-center font-bold text-gray-900">{selectedOrderFullView.itemsSummary.deliveryBags}</td>
                                  <td colSpan={3}></td>
                                </tr>
                              </tbody>
                            </table>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* RIGHT COLUMN: Time Checks + Yellow Notes Card */}
                  <div className="lg:col-span-3 space-y-4">
                    <div className="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm">
                      <div className="px-4 py-3 bg-gray-50/70 border-b border-gray-200 flex items-center gap-2">
                        <span className="text-amber-500">🕒</span>
                        <h3 className="text-sm font-bold text-gray-900">Time Checks</h3>
                      </div>
                      <div className="px-4 divide-y divide-gray-100 text-xs">
                        {selectedOrderFullView.timeChecks.map((tc) => (
                          <div key={tc.label} className="py-2.5 flex items-center justify-between gap-2">
                            <span className="text-gray-700 font-medium">{tc.label}</span>
                            <span className="text-gray-500 font-semibold text-right">{tc.value}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-[#fef9e7] rounded-lg border border-[#f9e79f] p-4 shadow-sm space-y-3">
                      <div className="flex items-center justify-between border-b border-[#f7dc6f] pb-2.5">
                        <div className="flex items-center gap-2">
                          <span className="text-amber-600">💬</span>
                          <h3 className="text-base font-bold text-gray-900">Notes</h3>
                        </div>
                        <span className="text-[11px] font-semibold text-amber-800">
                          {selectedOrderFullView.notes.length} note(s)
                        </span>
                      </div>

                      {selectedOrderFullView.notes.length === 0 ? (
                        <div className="text-xs text-gray-500 py-2">
                          {selectedOrderFullView.isLoadedFromApi
                            ? "لا توجد ملاحظات مسجلة على هذا الأوردر."
                            : "⏳ جاري جلب ملاحظات الديسباتشر..."}
                        </div>
                      ) : (
                        <div className="space-y-3">
                          {selectedOrderFullView.notes.map((note) => (
                            <div
                              key={note.id}
                              className="pb-3 border-b border-[#f7dc6f] last:border-b-0 last:pb-0 space-y-1 text-xs"
                            >
                              <div className="font-bold text-gray-900 break-all">{note.author}</div>
                              <div className="text-[11px] font-semibold text-gray-600">{note.createdAt}</div>
                              <p className="text-gray-800 leading-relaxed whitespace-pre-wrap pt-1">{note.text}</p>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                </div>

                {/* Modal Footer */}
                <div className="px-6 py-3 bg-white border-t border-gray-200 flex items-center justify-between text-xs text-gray-500">
                  <span>View-Only Mode (No actions permitted)</span>
                  <button
                    type="button"
                    onClick={() => setSelectedOrder(null)}
                    className="px-4 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 font-semibold text-gray-700"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Rider / Courier Profile Modal (User ID, Phone, Contract, Vehicle, Fleet ID) */}
          {selectedCourierFullView && (
            <div
              className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4"
              onClick={() => setSelectedCourier(null)}
            >
              <div
                className="bg-white rounded-xl w-full max-w-lg shadow-2xl border border-gray-200 overflow-hidden"
                onClick={(e) => e.stopPropagation()}
              >
                {/* Header */}
                <div className="px-6 pt-5 pb-4 border-b border-gray-100 flex items-start justify-between gap-3">
                  <div className="space-y-1.5 min-w-0">
                    <div className="flex items-center gap-2">
                      <h3 className="text-lg sm:text-xl font-bold text-blue-600 leading-snug break-words">
                        {selectedCourierFullView.name}
                      </h3>
                      <button
                        type="button"
                        onClick={() => copyToClipboard("riderName", selectedCourierFullView.name)}
                        className="text-blue-600 hover:text-blue-800 px-1.5 py-0.5 rounded border border-blue-200 text-xs flex-shrink-0"
                        title="نسخ اسم الرايدر"
                      >
                        {copiedText === "riderName" ? "✓" : "⧉"}
                      </button>
                    </div>

                    <div className="flex items-center gap-2 text-sm text-gray-600 font-medium">
                      <span>
                        User ID{" "}
                        <strong className="font-mono text-gray-900">
                          {selectedCourierFullView.userId ? `#${selectedCourierFullView.userId}` : "جاري الجلب..."}
                        </strong>
                      </span>
                      {selectedCourierFullView.userId && (
                        <button
                          type="button"
                          onClick={() => copyToClipboard("riderId", selectedCourierFullView.userId)}
                          className="text-blue-600 hover:text-blue-800 px-1.5 py-0.5 rounded border border-blue-200 text-xs"
                          title="نسخ User ID"
                        >
                          {copiedText === "riderId" ? "✓ Copied" : "⧉"}
                        </button>
                      )}
                      {selectedCourierFullView.courierId &&
                        selectedCourierFullView.courierId !== selectedCourierFullView.userId && (
                          <span className="text-xs text-gray-400 font-mono">
                            (Courier #{selectedCourierFullView.courierId})
                          </span>
                        )}
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={() => setSelectedCourier(null)}
                    className="p-1.5 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* Body */}
                <div className="p-6 space-y-4 text-sm">
                  {/* Status Box */}
                  <div className="p-4 rounded-lg bg-gray-100/90 border border-gray-200 space-y-1">
                    <div className="text-xs text-gray-500 font-medium">Status</div>
                    <div className="text-base font-bold text-gray-900">{selectedCourierFullView.statusLabel}</div>
                    {selectedCourierFullView.statusUntil && (
                      <div className="text-xs text-gray-500">Until {selectedCourierFullView.statusUntil}</div>
                    )}
                    {selectedCourierFullView.performedBy && (
                      <div className="text-xs text-gray-500">
                        Performed by {selectedCourierFullView.performedBy}
                      </div>
                    )}
                    {selectedCourierFullView.statusReason && (
                      <div className="text-xs text-gray-500">Reason: {selectedCourierFullView.statusReason}</div>
                    )}
                  </div>

                  {/* Balance Bar (if available) */}
                  {selectedCourierFullView.balanceStr && (
                    <div className="px-4 py-3 rounded-lg bg-[#e8effc] border border-blue-200 flex items-center justify-between">
                      <span className="font-bold text-gray-900">Balance</span>
                      <span className="font-mono font-bold text-gray-900">{selectedCourierFullView.balanceStr}</span>
                    </div>
                  )}

                  {/* Details Rows (Contract, Vehicle, Phone, Fleet ID) */}
                  <div className="divide-y divide-gray-200 border-t border-b border-gray-200">
                    <div className="py-3 flex items-center justify-between">
                      <span className="font-semibold text-gray-900">Contract</span>
                      <span className="text-gray-600 font-medium">{selectedCourierFullView.contract}</span>
                    </div>

                    <div className="py-3 flex items-center justify-between">
                      <span className="font-semibold text-gray-900">Vehicle</span>
                      <span className="text-gray-600 font-medium">{selectedCourierFullView.vehicle}</span>
                    </div>

                    <div className="py-3 flex items-center justify-between gap-2">
                      <span className="font-semibold text-gray-900">Phone</span>
                      {selectedCourierFullView.phone ? (
                        <div className="flex items-center gap-2">
                          <button
                            type="button"
                            onClick={() => copyToClipboard("riderPhone", selectedCourierFullView.phone)}
                            className="inline-flex items-center gap-1.5 text-blue-600 hover:text-blue-800 font-mono font-bold text-sm"
                            title="نسخ رقم موبايل الرايدر"
                          >
                            <span>{copiedText === "riderPhone" ? "✓" : "⧉"}</span>
                            <span className="text-gray-900">{selectedCourierFullView.phone}</span>
                          </button>
                          <a
                            href={`tel:${selectedCourierFullView.phone}`}
                            className="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold hover:bg-emerald-100"
                            title="اتصال مباشر بالرايدر"
                          >
                            📞 Call
                          </a>
                        </div>
                      ) : !selectedCourierFullView.isLoadedFromApi ? (
                        <span className="text-xs font-semibold text-emerald-700 animate-pulse">
                          ⏳ جاري جلب رقم الموبايل من Hurrier...
                        </span>
                      ) : (
                        <span className="text-gray-400 text-xs">غير متاح</span>
                      )}
                    </div>

                    <div className="py-3 flex items-center justify-between">
                      <span className="font-semibold text-gray-900">Fleet ID</span>
                      <span className="text-gray-600 font-mono">{selectedCourierFullView.fleetId}</span>
                    </div>
                  </div>
                </div>

                {/* Footer */}
                <div className="px-6 py-3 bg-gray-50 border-t border-gray-200 flex items-center justify-between text-xs text-gray-500">
                  <span>View-Only Rider Card</span>
                  <button
                    type="button"
                    onClick={() => setSelectedCourier(null)}
                    className="px-4 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 font-semibold text-gray-700"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
