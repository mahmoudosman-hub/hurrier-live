    function buildGitHubGistCollectorScript(gistId, gistToken) {
      const safeGistId = (gistId || DEFAULT_GIST_ID).trim();
      const safeToken = (gistToken || 'YOUR_GITHUB_GIST_TOKEN').trim();
      return `// شغّل الكود ده في Console تاب Hurrier المفتوح عندك (يرفع التحديثات لـ GitHub Gist بأمان)
(function startHurrierGitHubRelay() {
  const GIST_ID = "${safeGistId}";
  const GITHUB_TOKEN = "${safeToken}";
  const ZONES = "starting_point_id[]=10022&starting_point_id[]=10163&starting_point_id[]=10162&starting_point_id[]=10004&starting_point_id[]=10181&starting_point_id[]=10125&starting_point_id[]=10182&starting_point_id[]=10183&starting_point_id[]=10018&starting_point_id[]=10139&starting_point_id[]=10074";
  const BASE = "https://eg.me.logisticsbackoffice.com/api";

  async function syncToGitHub() {
    try {
      const opts = { credentials: "include", headers: { "Accept": "application/json" } };
      const [stats, active, queued, dispatched, actionable, preorder, dispatchers] = await Promise.all([
        fetch(\`\${BASE}/dispatcher-dashboard/stats?\${ZONES}\`, opts).then(r => r.json()),
        fetch(\`\${BASE}/dispatcher-dashboard/deliveries/active?\${ZONES}&page=1&per_page=100\`, opts).then(r => r.json()),
        fetch(\`\${BASE}/dispatcher-dashboard/deliveries/queued?\${ZONES}&page=1&per_page=100\`, opts).then(r => r.json()),
        fetch(\`\${BASE}/dispatcher-dashboard/deliveries/dispatched?\${ZONES}&page=1&per_page=100\`, opts).then(r => r.json()),
        fetch(\`\${BASE}/dispatcher-dashboard/deliveries/actionable?\${ZONES}&page=1&per_page=100\`, opts).then(r => r.json()),
        fetch(\`\${BASE}/dispatcher-dashboard/deliveries/preorder?\${ZONES}&page=1&per_page=100\`, opts).then(r => r.json()),
        fetch(\`\${BASE}/issue-service/dispatcher_dashboard\`, opts).then(r => r.json()).catch(() => [])
      ]);

      const payload = JSON.stringify({
        stats, active, queued, dispatched, actionable, preorder, dispatchers,
        syncedAt: new Date().toISOString()
      });

      const ghRes = await fetch(\`https://api.github.com/gists/\${GIST_ID}\`, {
        method: "PATCH",
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": \`Bearer \${GITHUB_TOKEN}\`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          files: {
            "hurrier-live.json": { content: payload }
          }
        })
      });

      if (!ghRes.ok) throw new Error("GitHub API " + ghRes.status);
      console.log("[Hurrier -> GitHub] Synced at", new Date().toLocaleTimeString());
    } catch (err) {
      console.warn("[Hurrier -> GitHub] Sync error:", err.message);
    }
  }

  syncToGitHub();
  window.__hurrierGitHubTimer && clearInterval(window.__hurrierGitHubTimer);
  window.__hurrierGitHubTimer = setInterval(syncToGitHub, 4000);
})();`;
    }

    function formatRelativeDeadline(isoDate, isPreorder = false) {
      if (!isoDate) return '-';
      const target = new Date(isoDate);
      if (Number.isNaN(target.getTime())) return '-';
      if (isPreorder) {
        return target.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      }
      const diffMins = Math.round((target.getTime() - Date.now()) / 60000);
      const absMins = Math.abs(diffMins);
      const sign = diffMins < 0 ? '-' : '';
      if (absMins >= 60) {
        const h = Math.floor(absMins / 60);
        const m = absMins % 60;
        return `${sign}${h}h ${m}min`;
      }
      return `${sign}${absMins}min`;
    }

    function formatReadableTimestamp(isoDate) {
      if (!isoDate) return '-';
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return '-';
      return d.toLocaleString('en-US', {
        month: 'long',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
    }

      const vLabel = verticalMap[order.vertical_type] || (order.vertical_type ? order.vertical_type : 'Restaurants');
      instructions.push(vLabel);

      const statusLabel = (rec.status || 'queued')
        .split('_')
        .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');

      const deadlineStr = formatRelativeDeadline(order.scheduled_dropoff_at, tabName === 'Pre-order');
      const distKm = typeof rec.distance === 'number' ? `${(rec.distance / 1000).toFixed(2)} km` : '-';
      const valEgp = typeof order.order_value === 'number' ? `${(order.order_value / 100).toFixed(2)} EGP` : '-';

      return {
        id: String(order.code || rec.id),
        orderCode: order.order_code || `HF_EG${order.code || rec.id}`,
        vendor: order.vendor_name || 'Unknown Vendor',
        vo: order.vendor_order_number || '-',
        deadline: deadlineStr,
        courier: rec.courier_name || (tabName === 'Queued' ? 'Assigning...' : '-'),
        courierId: rec.courier_id || null,
        status: statusLabel,
        time_in: deadlineStr.startsWith('-') ? deadlineStr : '-',
        time_at: formatReadableTimestamp(order.scheduled_dropoff_at),
        zone: Array.isArray(rec.starting_points) ? rec.starting_points.slice(0, 3).join(', ') : 'Cairo',
        city: 'Cairo',
        instructions,
        tab: tabName,
        distance: distKm,
        orderValue: valEgp,
        pickupAddress: order.pickup_address?.street_address || '-',
        dropoffAddress: order.dropoff_address?.street_address || '-',
        customerName: order.tags?.find((t) => t.startsWith('external_address_id:'))?.replace('external_address_id:', 'Customer #') || 'Customer',
        items: [{ name: `${order.vendor_name || 'Order'} #${order.vendor_order_number || ''}`, qty: 1, price: valEgp }],
        transitions: [
          { state: rec.status || 'queued', time: formatReadableTimestamp(order.restaurant_confirmed_at || order.send_to_restaurant_at), by: 'hurrier_live' }
        ]
      };
    }

    const InstructionPill = ({ type }) => {
      let Icon = BoxIcon;
      if (type === 'Cash') Icon = BanknoteIcon;
      if (type === 'Restaurants') Icon = UtensilsIcon;
      if (type === 'Darkstores') Icon = StoreIcon;

      return (
        <div className="inline-flex items-center gap-1.5 px-3 py-1 border border-gray-300 rounded-full text-xs font-medium text-gray-700 bg-white shadow-sm">
          <Icon size={13} className="text-gray-600" />
          <span>{type}</span>
        </div>
      );
    };

    function App() {
      const initialGistId = useMemo(() => {
        const params = new URLSearchParams(window.location.search);
        return params.get('gist') || DEFAULT_GIST_ID;
      }, []);

      const [activeTab, setActiveTab] = useState('Active');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCity, setSelectedCity] = useState('All Cities');
      const [expandedZoneId, setExpandedZoneId] = useState(null);
      const [selectedOrder, setSelectedOrder] = useState(null);
      const [copiedId, setCopiedId] = useState(null);
      const [lastRefreshed, setLastRefreshed] = useState('Waiting for first sync...');

      const [deliveries, setDeliveries] = useState(MOCK_DELIVERIES);
      const [couriers, setCouriers] = useState(MOCK_COURIERS);
      const [citySummary, setCitySummary] = useState(CITY_KPI_SUMMARY);
      const [dispatcherStats, setDispatcherStats] = useState(DISPATCHER_STATS);
      const [tabCounts, setTabCounts] = useState({
        Actionable: 23,
        'Pre-order': 6,
        'Waiting for Assembly': 0,
        Queued: 37,
        Dispatched: 78,
        Active: 458
      });

      const [gistId, setGistId] = useState(initialGistId);
      const [gistToken, setGistToken] = useState(() => {
        try { return localStorage.getItem('hurrier_gh_reader_token') || ''; } catch { return ''; }
      });
      const cachedGistRawUrlRef = useRef('');
      const lastGistEtagRef = useRef('');
      const [syncMode, setSyncMode] = useState('live');
      const [isAutoRefresh, setIsAutoRefresh] = useState(true);
      const [refreshIntervalSec, setRefreshIntervalSec] = useState(3);
      const [countdown, setCountdown] = useState(3);
      const [syncStatus, setSyncStatus] = useState('idle');
      const [syncError, setSyncError] = useState('');
      const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
      const [modalTab, setModalTab] = useState('github');
      const [pasteTargetTab, setPasteTargetTab] = useState('Active');
      const [rawJsonInput, setRawJsonInput] = useState('');
      const [copiedSnippet, setCopiedSnippet] = useState(null);

      const sidebarItemsWithCounts = useMemo(() => {
        return SIDEBAR_ITEMS.map((item) =>
          Object.prototype.hasOwnProperty.call(tabCounts, item.id)
            ? { ...item, count: tabCounts[item.id] }
            : item
        );
      }, [tabCounts]);

      const applyHurrierBundle = useCallback((bundle) => {
        if (!bundle || bundle.empty || Object.keys(bundle).length === 0) return;

        const tabBuckets = [
          { key: 'active', tab: 'Active' },
          { key: 'queued', tab: 'Queued' },
          { key: 'dispatched', tab: 'Dispatched' },
          { key: 'actionable', tab: 'Actionable' },
          { key: 'preorder', tab: 'Pre-order' }
        ];

        let hasAnyDelivery = false;
        const updatedMap = new Map();
        const nextCounts = {};

        tabBuckets.forEach(({ key, tab }) => {
          const payload = bundle[key];
          if (payload && Array.isArray(payload.records)) {
            hasAnyDelivery = true;
            const mapped = payload.records.map((r) => mapHurrierRecordToDelivery(r, tab));
            updatedMap.set(tab, mapped);
            nextCounts[tab] = payload.metadata?.total_count ?? mapped.length;
          }
        });

        if (hasAnyDelivery) {
          setDeliveries((prev) => {
            const preserved = prev.filter((d) => !updatedMap.has(d.tab));
            const incoming = Array.from(updatedMap.values()).flat();
            return [...incoming, ...preserved];
          });
          setTabCounts((prev) => ({ ...prev, ...nextCounts }));
        }

        if (bundle.stats && Array.isArray(bundle.stats.cities)) {
          const newSummaries = [];
          const newZoneRows = [];

          bundle.stats.cities.forEach((c) => {
            const s = c.stat || {};
            newSummaries.push({
              city: c.city_name,
              queued: s.queued_count ?? 0,
              queuedPct: s.queued_percent ?? 0,
              dispatched: s.dispatched_count ?? 0,
              dispatchedPct: s.dispatched_percent ?? 0,
              active: s.active_count ?? 0,
              activePct: s.active_percent ?? 0,
              delay: `${Number(s.delay || 0).toFixed(1)}m`,
              puPct: s.picked_up_percent ?? 0,
              doPct: s.drop_off_percent ?? 0,
              zeroDel: s.zero_deliveries ?? 0,
              lowDel: s.low_deliveries ?? 0,
              medDel: s.medium_deliveries ?? 0,
              highDel: s.high_deliveries ?? 0,
              starting: s.couriers_in_starting ?? 0,
              working: s.couriers_in_working ?? 0,
              ending: s.couriers_in_ending ?? 0,
              tempBreak: s.couriers_in_temp_break ?? 0,
              break: s.couriers_in_break ?? 0
            });

            (c.zones || []).forEach((z) => {
              const zDelay = `${Number(z.stat?.delay || 0).toFixed(1)}m`;
              (z.starting_points || []).forEach((sp) => {
                const st = sp.stat || {};
                newZoneRows.push({
                  id: sp.id,
                  zone: sp.name,
                  city: c.city_name,
                  starting: st.couriers_in_starting ?? 0,
                  working: st.couriers_in_working ?? 0,
                  ending: st.couriers_in_ending ?? 0,
                  break: st.couriers_in_break ?? 0,
                  tempBreak: st.couriers_in_temp_break ?? 0,
                  delay: st.delay ? `${Number(st.delay).toFixed(1)}m` : zDelay,
                  queued: st.queued_count ?? 0,
                  dispatched: st.dispatched_count ?? 0,
                  active: st.active_count ?? 0,
                  puPercent: st.picked_up_percent ?? 0,
                  doPercent: st.drop_off_percent ?? 0,
                  zeroDel: st.zero_deliveries ?? 0,
                  lowDel: st.low_deliveries ?? 0,
                  medDel: st.medium_deliveries ?? 0,
                  highDel: st.high_deliveries ?? 0
                });
              });
            });
          });

          if (newSummaries.length > 0) setCitySummary(newSummaries);
          if (newZoneRows.length > 0) setCouriers(newZoneRows);
        }

        if (Array.isArray(bundle.dispatchers) && bundle.dispatchers.length > 0) {
          setDispatcherStats(
            bundle.dispatchers.map((d) => ({
              picked_by: d.picked_by,
              picked: d.picked ?? 0,
              processing: d.processing ?? 0,
              max_picked_for: d.min_picked_at ? formatRelativeDeadline(d.min_picked_at).replace('-', '') : '-'
            }))
          );
        }

        const now = new Date();
        setLastRefreshed(now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
      }, []);

      const fetchLiveFeed = useCallback(async () => {
        setSyncStatus('syncing');
        setSyncError('');
        try {
          const cleanId = gistId.trim();
          if (!cleanId) throw new Error('أدخل Gist ID أولاً');

          const reqHeaders = { Accept: 'application/vnd.github+json' };
          if (gistToken.trim()) {
            reqHeaders['Authorization'] = `Bearer ${gistToken.trim()}`;
          }
          if (lastGistEtagRef.current) {
            reqHeaders['If-None-Match'] = lastGistEtagRef.current;
          }

          const apiRes = await fetch(`https://api.github.com/gists/${cleanId}`, {
            headers: reqHeaders,
            cache: 'no-store'
          });

          if (apiRes.status === 304) {
            setSyncStatus('connected');
            return;
          }

          let data = null;
          if (apiRes.ok) {
            const newEtag = apiRes.headers.get('ETag');
            if (newEtag) lastGistEtagRef.current = newEtag;
            const gistMeta = await apiRes.json();
            const fileEntry =
              gistMeta.files?.['hurrier-live.json'] || Object.values(gistMeta.files || {})[0];
            if (!fileEntry || !fileEntry.content) {
              throw new Error('ملف hurrier-live.json غير موجود داخل الـ Gist');
            }
            if (fileEntry.raw_url) {
              cachedGistRawUrlRef.current = fileEntry.raw_url.replace(/\/raw\/[a-f0-9]{40}\//, '/raw/');
            }
            data = JSON.parse(fileEntry.content);
          } else if (apiRes.status === 403 || apiRes.status === 429) {
            const fallbackUrl =
              cachedGistRawUrlRef.current ||
              `https://gist.githubusercontent.com/${DEFAULT_GIST_OWNER}/${cleanId}/raw/hurrier-live.json`;
            const rawRes = await fetch(`${fallbackUrl}?t=${Date.now()}`, { cache: 'no-store' });
            if (!rawRes.ok) throw new Error(`GitHub Fallback HTTP ${rawRes.status}`);
            data = await rawRes.json();
          } else {
            throw new Error(`GitHub Gist HTTP ${apiRes.status}`);
          }

          applyHurrierBundle(data);
          setSyncStatus('connected');
        } catch (err) {
          setSyncStatus('error');
          setSyncError(err?.message || 'في انتظار وصول أول تحديث من متصفح Hurrier...');
        }
      }, [gistId, gistToken, applyHurrierBundle]);

      useEffect(() => {
        fetchLiveFeed();
      }, [fetchLiveFeed]);

      useEffect(() => {
        if (syncMode !== 'live' || !isAutoRefresh) return;
        setCountdown(refreshIntervalSec);
        const timer = setInterval(() => {
          setCountdown((prev) => {
            if (prev <= 1) {
              fetchLiveFeed();
              return refreshIntervalSec;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [syncMode, isAutoRefresh, refreshIntervalSec, fetchLiveFeed]);

      const handleCopyId = (e, id) => {
        e.stopPropagation();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(id).catch(() => {});
        }
        setCopiedId(id);
        setTimeout(() => setCopiedId(null), 1500);
      };

      const handleCopyCode = (key, text) => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
        setCopiedSnippet(key);
        setTimeout(() => setCopiedSnippet(null), 1800);
      };

      const employeeShareLink = useMemo(() => {
        const base =
          window.location.origin && window.location.origin !== 'null'
            ? `${window.location.origin}${window.location.pathname}`
            : 'https://mahmoudosman-hub.github.io/hurrier-live/';
        return base;
      }, []);

      const generatedGistScript = useMemo(
        () => buildGitHubGistCollectorScript(gistId, gistToken),
        [gistId, gistToken]
      );

      const handleApplyPastedJson = () => {
        try {
          const parsed = JSON.parse(rawJsonInput);
          if (parsed.cities) {
            applyHurrierBundle({ stats: parsed });
          } else if (Array.isArray(parsed.records)) {
            applyHurrierBundle({ [pasteTargetTab.toLowerCase().replace('-', '')]: parsed });
          } else if (parsed.active || parsed.queued || parsed.stats) {
            applyHurrierBundle(parsed);
          } else if (Array.isArray(parsed)) {
            applyHurrierBundle({ dispatchers: parsed });
          }
          setRawJsonInput('');
          setIsSyncModalOpen(false);
        } catch {
          setSyncError('صيغة JSON غير صحيحة');
        }
      };

      const handleRefresh = () => {
        fetchLiveFeed();
        setCountdown(refreshIntervalSec);
      };

      const filteredCouriers = useMemo(() => {
        return couriers.filter((c) => {
          const matchesCity = selectedCity === 'All Cities' || c.city === selectedCity;
          const matchesSearch =
            !searchQuery.trim() ||
            c.zone.toLowerCase().includes(searchQuery.toLowerCase()) ||
            String(c.id).includes(searchQuery.trim());
          return matchesCity && matchesSearch;
        });
      }, [couriers, selectedCity, searchQuery]);

      const filteredDeliveries = useMemo(() => {
        return deliveries.filter((d) => {
          const matchesTab = d.tab === activeTab;
          const matchesCity = selectedCity === 'All Cities' || d.city === selectedCity;
          const q = searchQuery.trim().toLowerCase();
          const matchesSearch =
            !q ||
            d.id.toLowerCase().includes(q) ||
            d.vendor.toLowerCase().includes(q) ||
            d.courier.toLowerCase().includes(q) ||
            d.zone.toLowerCase().includes(q);
          return matchesTab && matchesCity && matchesSearch;
        });
      }, [deliveries, activeTab, selectedCity, searchQuery]);

      const renderDashboardOverview = () => {
        const visibleCities = citySummary.filter(
          (c) => selectedCity === 'All Cities' || c.city === selectedCity
        );

        return (
          <div className="mt-6 space-y-6">
            <div className="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
              <div className="px-4 py-3 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
                <span className="text-xs font-bold uppercase tracking-wider text-gray-600">
                  Region Performance &amp; Rider Shifts
                </span>
                <span className="text-xs text-gray-500">Read-Only Live View</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs whitespace-nowrap">
                  <thead>
                    <tr className="border-b border-gray-200 text-gray-500 font-semibold bg-white">
                      <th className="py-3 px-4">REGION</th>
                      <th className="py-3 px-3">QUEUED</th>
                      <th className="py-3 px-3">DISP</th>
                      <th className="py-3 px-3">ACTIVE</th>
                      <th className="py-3 px-3">DELAY</th>
                      <th className="py-3 px-3">PU / DO</th>
                      <th className="py-3 px-3">0 / 1 / 2 / 3+ DEL</th>
                      <th className="py-3 px-3">START</th>
                      <th className="py-3 px-3">WORK</th>
                      <th className="py-3 px-3">END</th>
                      <th className="py-3 px-3">TEMP</th>
                      <th className="py-3 px-3">BREAK</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100 text-sm">
                    {visibleCities.map((row) => (
                      <tr key={row.city} className="hover:bg-gray-50">
                        <td className="py-3.5 px-4 font-semibold text-gray-900">{row.city}</td>
                        <td className="py-3.5 px-3">
                          <span className="font-semibold text-gray-800">{row.queued}</span>{' '}
                          <span className="text-xs text-gray-400">({row.queuedPct}%)</span>
                        </td>
                        <td className="py-3.5 px-3">
                          <span className="font-semibold text-gray-800">{row.dispatched}</span>{' '}
                          <span className="text-xs text-gray-400">({row.dispatchedPct}%)</span>
                        </td>
                        <td className="py-3.5 px-3">
                          <span className="font-semibold text-blue-600">{row.active}</span>{' '}
                          <span className="text-xs text-gray-400">({row.activePct}%)</span>
                        </td>
                        <td className="py-3.5 px-3 font-semibold text-[#d32f2f]">{row.delay}</td>
                        <td className="py-3.5 px-3 text-gray-700">
                          {row.puPct}% / {row.doPct}%
                        </td>
                        <td className="py-3.5 px-3 text-xs text-gray-600 font-mono">
                          {row.zeroDel} / {row.lowDel} / {row.medDel} / {row.highDel}
                        </td>
                        <td className="py-3.5 px-3 text-gray-700">{row.starting}</td>
                        <td className="py-3.5 px-3 font-semibold text-emerald-700">{row.working}</td>
                        <td className="py-3.5 px-3 text-amber-700">{row.ending}</td>
                        <td className="py-3.5 px-3 text-gray-600">{row.tempBreak}</td>
                        <td className="py-3.5 px-3 text-gray-600">{row.break}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
              <div className="px-4 py-3 bg-gray-50 border-b border-gray-200">
                <span className="text-xs font-bold uppercase tracking-wider text-gray-600">
                  Starting Points Breakdown ({filteredCouriers.length} Zones)
                </span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs whitespace-nowrap">
                  <thead>
                    <tr className="border-b border-gray-200 text-gray-500 font-semibold">
                      <th className="py-3 px-4">STARTING POINT</th>
                      <th className="py-3 px-3">QUEUED</th>
                      <th className="py-3 px-3">DISP</th>
                      <th className="py-3 px-3">ACTIVE</th>
                      <th className="py-3 px-3">DELAY</th>
                      <th className="py-3 px-3">PU / DO</th>
                      <th className="py-3 px-3">WORK</th>
                      <th className="py-3 px-3">END</th>
                      <th className="py-3 px-3">BREAK</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100 text-sm">
                    {filteredCouriers.map((sp) => (
                      <tr key={sp.id} className="hover:bg-gray-50">
                        <td className="py-3 px-4 font-medium text-gray-900">{sp.zone}</td>
                        <td className="py-3 px-3">{sp.queued}</td>
                        <td className="py-3 px-3">{sp.dispatched}</td>
                        <td className="py-3 px-3 font-medium text-blue-600">{sp.active}</td>
                        <td className={`py-3 px-3 font-medium ${parseFloat(sp.delay) > 5 ? 'text-[#d32f2f]' : 'text-gray-600'}`}>
                          {sp.delay}
                        </td>
                        <td className="py-3 px-3 text-gray-600">{sp.puPercent}% / {sp.doPercent}%</td>
                        <td className="py-3 px-3 font-medium text-gray-800">{sp.working}</td>
                        <td className="py-3 px-3 text-gray-600">{sp.ending}</td>
                        <td className="py-3 px-3 text-gray-600">{sp.break}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      };

      const renderDispatcherDashboard = () => (
        <div className="mt-6 bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
          <table className="w-full text-left text-sm whitespace-nowrap">
            <thead>
              <tr className="border-b border-gray-200 text-gray-500 font-semibold text-xs bg-gray-50">
                <th className="py-3.5 px-4">EMAIL</th>
                <th className="py-3.5 px-4">ISSUES PICKED</th>
                <th className="py-3.5 px-4">PROCESSING</th>
                <th className="py-3.5 px-4">MAX PICKED FOR</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-100">
              {dispatcherStats.map((disp, idx) => (
                <tr key={idx} className="hover:bg-gray-50">
                  <td className="py-3.5 px-4 font-medium text-gray-800">{disp.picked_by}</td>
                  <td className="py-3.5 px-4">
                    <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-50 text-blue-700">
                      {disp.picked}
                    </span>
                  </td>
                  <td className="py-3.5 px-4 text-gray-600">{disp.processing}</td>
                  <td className="py-3.5 px-4 text-gray-600 font-mono text-xs">{disp.max_picked_for}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );

      const renderContent = () => {
        if (activeTab === 'Dashboard') return renderDashboardOverview();
        if (activeTab === 'Dispatcher Dashboard') return renderDispatcherDashboard();

        if (activeTab === 'Active Couriers') {
          return (
            <div className="mt-6 w-full border-t border-gray-200">
              {filteredCouriers.map((item) => {
                const isHighDelay = parseFloat(item.delay) > 5;
                const isExpanded = expandedZoneId === item.id;

                return (
                  <div key={item.id} className="border-b border-gray-200">
                    <div
                      onClick={() => setExpandedZoneId(isExpanded ? null : item.id)}
                      className="flex justify-between items-center py-4 cursor-pointer hover:bg-gray-50 px-3 transition-colors"
                    >
                      <div className="text-[15px] text-gray-800">
                        <span className="font-medium">{item.zone}</span>
                        <span className="text-gray-600 ml-1.5">
                          ({item.working} / {item.ending} / {item.break})
                        </span>
                        <span className={`ml-2 font-medium ${isHighDelay ? 'text-[#d32f2f]' : 'text-gray-600'}`}>
                          {item.delay}
                        </span>
                      </div>
                      {isExpanded ? (
                        <ChevronUpIcon size={20} className="text-gray-500" />
                      ) : (
                        <ChevronDownIcon size={20} className="text-gray-400" />
                      )}
                    </div>

                    {isExpanded && (
                      <div className="bg-gray-50/80 px-4 py-4 border-t border-gray-100 grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-4 text-xs">
                        <div className="bg-white p-3 rounded border border-gray-200">
                          <div className="text-gray-400 uppercase font-semibold">Working</div>
                          <div className="text-lg font-bold text-emerald-600 mt-0.5">{item.working}</div>
                        </div>
                        <div className="bg-white p-3 rounded border border-gray-200">
                          <div className="text-gray-400 uppercase font-semibold">Ending Shift</div>
                          <div className="text-lg font-bold text-amber-600 mt-0.5">{item.ending}</div>
                        </div>
                        <div className="bg-white p-3 rounded border border-gray-200">
                          <div className="text-gray-400 uppercase font-semibold">On Break / Temp</div>
                          <div className="text-lg font-bold text-gray-700 mt-0.5">
                            {item.break} <span className="text-xs font-normal text-gray-400">/ {item.tempBreak}</span>
                          </div>
                        </div>

                          value={pasteTargetTab}
                          onChange={(e) => setPasteTargetTab(e.target.value)}
                          className="px-3 py-1.5 border border-gray-300 rounded text-xs font-medium bg-white"
                        >
                          <option value="Active">Active Deliveries</option>
                          <option value="Queued">Queued Deliveries</option>
                          <option value="Dispatched">Dispatched Deliveries</option>
                          <option value="Actionable">Actionable Deliveries</option>
                          <option value="Pre-order">Pre-order Deliveries</option>
                        </select>
                      </div>

                      <textarea
                        rows={6}
                        value={rawJsonInput}
                        onChange={(e) => setRawJsonInput(e.target.value)}
                        placeholder='الصق هنا الـ JSON Response القادم من /deliveries/active أو /stats ...'
                        className="w-full p-3 border border-gray-300 rounded-lg font-mono text-xs focus:outline-none focus:border-blue-500"
                      />

                      <div className="flex justify-end">
                        <button
                          type="button"
                          onClick={handleApplyPastedJson}
                          className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5"
                        >
                          <UploadIcon size={14} /> تحديث الجداول الآن
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
