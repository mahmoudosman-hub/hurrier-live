    function normalizeVendorText(str) {
      return String(str || '').trim().replace(/\s+/g, ' ');
    }

    function formatRelativeDeadline(isoDate, isPreorder = false) {
      if (!isoDate) return '-';
      const target = new Date(isoDate);
      if (Number.isNaN(target.getTime())) return '-';
      if (isPreorder) {
        return target.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      }
      const diffMins = Math.round((target.getTime() - Date.now()) / 60000);
      const absMins = Math.abs(diffMins);
      const sign = diffMins < 0 ? '-' : '';
      if (absMins >= 60) {
        const h = Math.floor(absMins / 60);
        const m = absMins % 60;
        return `${sign}${h}h ${m}min`;
      }
      return `${sign}${absMins}min`;
    }

    function parseFlexibleDate(val) {
      if (val === null || val === undefined || val === '') return null;
      if (val instanceof Date) return Number.isNaN(val.getTime()) ? null : val;
      if (typeof val === 'number') {
        const ms = val < 1e11 ? val * 1000 : val;
        const d = new Date(ms);
        return Number.isNaN(d.getTime()) ? null : d;
      }
      const str = String(val).trim();
      if (!str) return null;
      if (/^\d+(\.\d+)?$/.test(str)) {
        const num = Number(str);
        const ms = num < 1e11 ? num * 1000 : num;
        const d = new Date(ms);
        return Number.isNaN(d.getTime()) ? null : d;
      }
      let d = new Date(str);
      if (!Number.isNaN(d.getTime())) return d;
      const normalized = str
        .replace(/^(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2}:\d{2})/, '$1T$2')
        .replace(/(\.\d{3})\d+/, '$1')
        .replace(/([+-]\d{2})(\d{2})$/, '$1:$2')
        .replace(/\s+UTC$/i, 'Z');
      d = new Date(normalized);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function formatReadableTimestamp(isoDate) {
      const d = parseFlexibleDate(isoDate);
      if (!d) return '-';
      return d.toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
    }

    function getTransitionRawTimestamp(tr) {
      if (!tr || typeof tr !== 'object') return null;
      return (
        tr.created_at ||
        tr.timestamp ||
        tr.event_timestamp ||
        tr.occurred_at ||
        tr.performed_at ||
        tr.updated_at ||
        tr.time ||
        tr.metadata?.performed_at ||
        tr.metadata?.created_at ||
        tr.metadata?.timestamp ||
        tr.metadata?.event_timestamp ||
        tr.metadata?.delivery_etas_updated_at ||
        null
      );
    }

    function formatShortTimeWithSec(isoDate) {
      if (!isoDate) return '-';
      const d = parseFlexibleDate(isoDate);
      if (!d) {
        const timeMatch = String(isoDate).match(/\d{1,2}:\d{2}:\d{2}(\s*[AP]M)?/i);
        return timeMatch ? timeMatch[0] : '-';
      }
      return d.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      });
    }

    function formatShortTimeNoSec(isoDate) {
      if (!isoDate) return '-';
      const d = parseFlexibleDate(isoDate);
      if (!d) return '-';
      return d.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });
    }

    function formatDurationSeconds(sec) {
      if (sec === null || sec === undefined || Number.isNaN(Number(sec))) return '-';
      const mins = Math.round(Number(sec) / 60);
      if (mins < 60) return `${mins}m`;
      return `${Math.floor(mins / 60)}h ${mins % 60}m`;
    }

    function formatUtilization(util) {
      if (!util || util.value === undefined || util.value === null) return '-';
      if (util.type === 'price') return `${(Number(util.value) / 100).toFixed(2)} EGP (Price)`;
      if (util.type === 'volume') return `${Number(util.value).toFixed(1)} L (Volume)`;
      if (util.type === 'weight') return `${Number(util.value).toFixed(2)} kg (Weight)`;
      return `${util.value} (${util.type || 'Unit'})`;
    }

    function formatStartingPointsList(spList, fallback = '-') {
      if (!Array.isArray(spList) || spList.length === 0) return fallback;
      const names = spList
        .map((sp) => {
          if (typeof sp === 'string') return sp;
          if (sp && typeof sp === 'object') return sp.name || sp.zone_name || sp.title || '';
          return '';
        })
        .filter(Boolean);
      return names.length > 0 ? names.slice(0, 2).join(', ') : fallback;
    }

    function humanizeEventLabel(tr) {
      const state = String(tr.to_state || tr.event_type || '').toLowerCase();
      const map = {
        queued: 'Queued',
        dispatched: 'Dispatched',
        courier_notified: 'Courier Notified',
        accepted: 'Accepted',
        near_pickup: 'Near Pickup',
        picked_up: 'Picked Up',
        left_pickup: 'Left Pickup',
        near_dropoff: 'Near Dropoff',
        completed: 'Completed',
        undispatched: 'Undispatched',
        pending: 'Pending',
        scheduled: 'Scheduled'
      };
      if (map[state]) return map[state];
      return state
        .split('_')
        .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    function extractCourierHistoryFromDeliveries(deliveriesArr, fallbackCourier, fallbackCourierId) {
      const courierMap = new Map();

      (deliveriesArr || []).forEach((del, delIdx) => {
        const transitions = Array.isArray(del.transitions) ? del.transitions : [];
        transitions.forEach((tr) => {
          const cid = tr.courier_id || tr.metadata?.courier_id;
          const cname = tr.courier_name || tr.metadata?.courier_name;
          if (!cid && !cname) return;

          const key = String(cid || cname);
          if (!courierMap.has(key)) {
            courierMap.set(key, {
              courierId: cid || '-',
              courierName: cname || `Courier #${cid}`,
              deliveryId: del.id,
              deliveryIndex: delIdx + 1,
              events: [],
              acceptedAt: null,
              dispatchedAt: null,
              notifiedAt: null,
              pickedUpAt: null,
              leftPickupAt: null,
              undispatchedAt: null,
              undispatchReason: null,
              firstSeenAt: getTransitionRawTimestamp(tr) || null,
              lastSeenAt: getTransitionRawTimestamp(tr) || null
            });
          }

          const entry = courierMap.get(key);
          const evType = String(tr.event_type || '').toLowerCase();
          const toState = String(tr.to_state || '').toLowerCase();
          const label = humanizeEventLabel(tr);
          const trTime = getTransitionRawTimestamp(tr);

          if (!entry.events.includes(label)) {
            entry.events.push(label);
          }

          if (trTime) {
            const parsedTrTime = parseFlexibleDate(trTime);
            const parsedFirst = parseFlexibleDate(entry.firstSeenAt);
            const parsedLast = parseFlexibleDate(entry.lastSeenAt);
            if (!parsedFirst || (parsedTrTime && parsedTrTime < parsedFirst)) {
              entry.firstSeenAt = trTime;
            }
            if (!parsedLast || (parsedTrTime && parsedTrTime > parsedLast)) {
              entry.lastSeenAt = trTime;
            }
          }

          if (toState === 'dispatched' || evType.includes('dispatched')) {
            entry.dispatchedAt = trTime || entry.dispatchedAt;
          }
          if (toState === 'courier_notified' || evType.includes('notified')) {
            entry.notifiedAt = trTime || entry.notifiedAt;
          }
          if (toState === 'accepted' || evType.includes('accepted')) {
            entry.acceptedAt = trTime || entry.acceptedAt;
          }
          if (toState === 'picked_up' || evType.includes('picked_up')) {
            entry.pickedUpAt = trTime || entry.pickedUpAt;
          }
          if (toState === 'left_pickup' || evType.includes('left_pickup')) {
            entry.leftPickupAt = trTime || entry.leftPickupAt;
          }
          if (tr.un_dispatch_type || tr.metadata?.undispatch_type || toState.includes('undispatch')) {
            entry.undispatchedAt = trTime || entry.undispatchedAt;
            entry.undispatchReason = tr.un_dispatch_type || tr.metadata?.undispatch_type || 'undispatched';
          }
        });

        if (del.courier_id || del.courier_name) {
          const curKey = String(del.courier_id || del.courier_name);
          if (!courierMap.has(curKey)) {
            courierMap.set(curKey, {
              courierId: del.courier_id || '-',
              courierName: del.courier_name || `Courier #${del.courier_id}`,
              deliveryId: del.id,
              deliveryIndex: delIdx + 1,
              events: [humanizeEventLabel({ to_state: del.status })],
              acceptedAt: ['accepted', 'near_pickup', 'picked_up', 'left_pickup', 'near_dropoff', 'completed'].includes(String(del.status).toLowerCase())
                ? del.event_timestamp
                : null,
              dispatchedAt: del.event_timestamp || null,
              notifiedAt: null,
              pickedUpAt: null,
              leftPickupAt: null,
              undispatchedAt: null,
              undispatchReason: null,
              firstSeenAt: del.event_timestamp || null,
              lastSeenAt: del.event_timestamp || null
            });
          } else {
            const existing = courierMap.get(curKey);
            if (
              !existing.acceptedAt &&
              ['accepted', 'near_pickup', 'picked_up', 'left_pickup', 'near_dropoff', 'completed'].includes(String(del.status).toLowerCase())
            ) {
              existing.acceptedAt = existing.pickedUpAt || existing.leftPickupAt || del.event_timestamp || existing.firstSeenAt;
            }
          }
        }
      });

      if (courierMap.size === 0 && fallbackCourier && fallbackCourier !== '-' && fallbackCourier !== 'Assigning...') {
        courierMap.set(String(fallbackCourierId || fallbackCourier), {
          courierId: fallbackCourierId || '-',
          courierName: fallbackCourier,
          deliveryId: '-',
          deliveryIndex: 1,
          events: ['Current Assigned'],
          acceptedAt: null,
          dispatchedAt: null,
          notifiedAt: null,
          pickedUpAt: null,
          leftPickupAt: null,
          undispatchedAt: null,
          undispatchReason: null,
          firstSeenAt: null,
          lastSeenAt: null
        });
      }

      return Array.from(courierMap.values());
    }

    function mapHurrierRecordToDelivery(rec, tabName, idx = 0) {
      const order = rec.order || {};
      const verticalType = String(order.vertical_type || 'restaurants').toLowerCase().trim();
      const vendorName = normalizeVendorText(order.vendor_name || 'Unknown Vendor');
      const vendorLower = vendorName.toLowerCase();
      const tagsList = Array.isArray(order.tags) ? order.tags : [];

      const isTalabatMart =
        vendorLower.includes('talabat mart') ||
        vendorLower.includes('talabat_mart') ||
        vendorName.includes('طلبات مارت') ||
        verticalType === 'darkstores';

      const verticalMap = {
        restaurants: 'Restaurants',
        darkstores: 'Darkstores',
        supermarket: 'Supermarket',
        dairy_products: 'Dairy Products',
        convenience: 'Convenience',
        courier_business: 'Courier Business'
      };

      const instructions = [];
      if (order.is_cash_collection) instructions.push('Cash');
      if (order.is_card_on_delivery) instructions.push('Card');
      if (order.is_corporate) instructions.push('Corporate');
      const vLabel = isTalabatMart
        ? 'Darkstores'
        : verticalMap[verticalType] || (verticalType ? verticalType : 'Restaurants');
      instructions.push(vLabel);

      const statusLabel = (rec.status || 'queued')
        .split('_')
        .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');

      const deadlineStr = formatRelativeDeadline(order.scheduled_dropoff_at, tabName === 'Pre-order');
      const isLate = deadlineStr.startsWith('-');
      const distKm = typeof rec.distance === 'number' ? `${(rec.distance / 1000).toFixed(2)} km` : '-';
      const valEgp = typeof order.order_value === 'number' ? `${(order.order_value / 100).toFixed(2)} EGP` : '-';
      const limitEgp = typeof order.value_limit === 'number' ? `${(order.value_limit / 100).toFixed(2)} EGP` : '-';
      const allZones = Array.isArray(rec.starting_points) ? rec.starting_points : [];
      const uniqueUid = `${tabName}_${rec.id || order.code || 'row'}_${rec.courier_id || 'unassigned'}_${idx}`;

      return {
        uid: uniqueUid,
        deliveryRecordId: rec.id || null,
        id: String(order.code || rec.id),
        orderCode: order.order_code || `HF_EG${order.code || rec.id}`,
        isPrimary: rec.is_primary !== false,
        vendor: vendorName,
        vo: order.vendor_order_number || '-',
        deadline: deadlineStr,
        isLate,
        courier: rec.courier_name || (tabName === 'Queued' ? 'Assigning...' : '-'),
        courierId: rec.courier_id || null,
        status: statusLabel,
        time_in: isLate ? deadlineStr : '-',
        time_at: formatReadableTimestamp(order.scheduled_dropoff_at),
        zone: allZones.length > 0 ? allZones.slice(0, 3).join(', ') : 'Cairo',
        allZones,
        city: 'Cairo',
        instructions,
        tab: tabName,
        distance: distKm,
        orderValue: valEgp,
        valueLimit: limitEgp,
        capacity: rec.capacity ?? '-',
        utilizationText: formatUtilization(order.utilization_value),
        isCash: Boolean(order.is_cash_collection),
        isCard: Boolean(order.is_card_on_delivery),
        isCorporate: Boolean(order.is_corporate),
        isReviewed: order.is_order_reviewed !== false,
        isHighUtil: Boolean(order.is_high_utilization),
        isReturning: Boolean(rec.is_returning),
        isDarkstore: isTalabatMart,
        verticalType,
        restrictions: rec.business_restricted_vehicles ? [rec.business_restricted_vehicles] : [],
        tags: tagsList,
        sentToVendorAt: formatReadableTimestamp(order.send_to_restaurant_at),
        confirmedAt: formatReadableTimestamp(order.restaurant_confirmed_at),
        scheduledPickupAt: formatReadableTimestamp(order.scheduled_pickup_at),
        scheduledDropoffAt: formatReadableTimestamp(order.scheduled_dropoff_at),
        cancellationReason: rec.cancellation_reason || '-',
        cancelledBy: rec.cancelled_by || '-',
        cancelledAt: formatReadableTimestamp(rec.cancelled_at),
        completedAt: formatReadableTimestamp(rec.completed_at),
        metrics: rec.metrics || null,
        pickupAddress: order.pickup_address?.street_address || '-',
        pickupCoords:
          order.pickup_address?.latitude && order.pickup_address?.longitude
            ? `${order.pickup_address.latitude}, ${order.pickup_address.longitude}`
            : null,
        dropoffAddress: order.dropoff_address?.street_address || '-',
        dropoffCoords:
          order.dropoff_address?.latitude && order.dropoff_address?.longitude
            ? `${order.dropoff_address.latitude}, ${order.dropoff_address.longitude}`
            : null,
        customerName:
          tagsList.find((t) => String(t).startsWith('external_address_id:'))?.replace('external_address_id:', 'Customer #') ||
          'Customer',
        items: [{ name: `${vendorName} #${order.vendor_order_number || ''}`, qty: 1, price: valEgp }],
        transitions: [
          {
            state: rec.status || 'queued',
            time: formatReadableTimestamp(order.restaurant_confirmed_at || order.send_to_restaurant_at || order.placed_at),
            by: 'hurrier_live'
          }
        ]
      };
    }

    const InstructionPill = ({ type }) => {

      let pillStyle = 'border-gray-300 text-gray-700 bg-white';
      if (type === 'Cash') {

      } else if (type === 'Restaurants') {

      return (

    function App() {

      const [activeTab, setActiveTab] = useState('Active');

      const [expandedZoneId, setExpandedZoneId] = useState(null);

      });

      // Firebase Realtime Sync States (2 seconds default)

      const [syncMode, setSyncMode] = useState('live');
      const [isAutoRefresh, setIsAutoRefresh] = useState(true);

      const sidebarItemsWithCounts = useMemo(() => {

      // Map all zones across citiesCatalog & zoneStatsList
      const allAvailableZones = useMemo(() => {

        return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));

      const selectedZoneObjects = useMemo(() => {

      const selectedZoneNameSetLower = useMemo(() => {

      const regionButtonLabel = useMemo(() => {

        if (regionFilterMode === 'multi_zones' && selectedMultiZoneIds.length > 0) {

            : `Multiple Zones (${selectedMultiZoneIds.length})`;

        return 'All Cities';
      }, [regionFilterMode, selectedCity, selectedMultiCities, selectedMultiZoneIds, selectedZoneObjects]);

      // Fetch cities catalog once on load
      useEffect(() => {
        const cleanFb = firebaseUrl.trim().replace(/\/+$/, '');
        if (!cleanFb) return;
        fetch(`${cleanFb}/hurrier_live/cities_catalog.json`, { cache: 'no-store' })
          .then((r) => (r.ok ? r.json() : null))
          .then((cat) => {
            if (cat && Array.isArray(cat.cities) && cat.cities.length > 0) {
              setCitiesCatalog(cat.cities);
            }
          })
          .catch(() => {});
      }, [firebaseUrl]);

      // Push custom zones to Firebase so Tampermonkey syncs them from Hurrier
      const applySelectedZonesToSystem = async (zoneIdsArray) => {
        const cleanIds = (zoneIdsArray || []).map(String).filter(Boolean);
        setSelectedMultiZoneIds(cleanIds);
        setRegionFilterMode(cleanIds.length > 0 ? 'multi_zones' : 'all');
        setIsMultiZonesModalOpen(false);
        setIsRegionDropdownOpen(false);

        if (!syncZonesToCollector) return;
        const cleanFb = firebaseUrl.trim().replace(/\/+$/, '');
        if (!cleanFb) return;

        setIsUpdatingRemoteZones(true);
        try {
          await fetch(`${cleanFb}/hurrier_live/zone_config.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              write_key: FIREBASE_WRITE_KEY,
              mode: cleanIds.length > 0 ? 'custom' : 'default',
              zone_ids: cleanIds,
              updatedAt: new Date().toISOString()
            })
          });
          lastSyncedAtRef.current = '';
        } catch {
          // Ignore network write errors
        } finally {
          setIsUpdatingRemoteZones(false);
        }
      };

      const requestOrderDetailsFromBridge = useCallback(
        async (orderItem, forceRefresh = false) => {
          if (!orderItem || !orderItem.id) return;
          const cleanCode = String(orderItem.id).replace(/^HF_EG/i, '').trim();
          const fullOrderCode = orderItem.orderCode || `HF_EG${cleanCode}`;
          const cleanFb = firebaseUrl.trim().replace(/\/+$/, '');
          if (!cleanFb) return;

          setIsLoadingOrderDetail(true);
          try {
            if (!forceRefresh && orderDetailsCacheRef.current[cleanCode]) {
              setIsLoadingOrderDetail(false);
              return;
            }

            const existingRes = await fetch(
              `${cleanFb}/hurrier_live/order_details/${encodeURIComponent(cleanCode)}.json`,
              { cache: 'no-store' }
            );
            if (existingRes.ok) {
              const existingData = await existingRes.json();
              if (existingData && (existingData.order || existingData.deliveries)) {
                setOrderDetailsCache((prev) => ({ ...prev, [cleanCode]: existingData }));
                if (!forceRefresh) {
                  setIsLoadingOrderDetail(false);
                  return;
                }
              }
            }

            if (!requestedDetailsRef.current.has(cleanCode) || forceRefresh) {
              requestedDetailsRef.current.add(cleanCode);
              await fetch(
                `${cleanFb}/hurrier_live/detail_requests/${encodeURIComponent(cleanCode)}.json`,
                {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    write_key: FIREBASE_WRITE_KEY,
                    code: cleanCode,
                    order_code: fullOrderCode,
                    status: 'pending',
                    requestedAt: new Date().toISOString()
                  })
                }
              );
            }
          } catch {
            // Ignore transient errors
          }

      // Poll order_details node while drawer is open
      useEffect(() => {
        if (!selectedOrder) {
          setIsLoadingOrderDetail(false);
          return;
        }
        const cleanCode = String(selectedOrder.id).replace(/^HF_EG/i, '').trim();
        requestOrderDetailsFromBridge(selectedOrder, false);

        const cleanFb = firebaseUrl.trim().replace(/\/+$/, '');
        if (!cleanFb) return;

        const pollTimer = setInterval(async () => {
          try {
            const res = await fetch(
              `${cleanFb}/hurrier_live/order_details/${encodeURIComponent(cleanCode)}.json`,
              { cache: 'no-store' }
            );
            if (res.ok) {
              const detailData = await res.json();
              if (detailData && (detailData.order || detailData.deliveries)) {
                setOrderDetailsCache((prev) => ({ ...prev, [cleanCode]: detailData }));
                setIsLoadingOrderDetail(false);
              }
            }
          } catch {
            // Ignore
          }
        }, 1200);

        return () => clearInterval(pollTimer);
      }, [selectedOrder, firebaseUrl, requestOrderDetailsFromBridge]);

      const applyHurrierBundle = useCallback((bundle) => {
        if (!bundle || bundle.empty) return;

        const tabBuckets = [
          { key: 'active', tab: 'Active' },
          { key: 'queued', tab: 'Queued' },
          { key: 'dispatched', tab: 'Dispatched' },
          { key: 'actionable', tab: 'Actionable' },
          { key: 'waiting_for_assembly', tab: 'Waiting for Assembly' },
          { key: 'preorder', tab: 'Pre-order' },
          { key: 'upcoming', tab: 'Upcoming' },
          { key: 'cancelled', tab: 'Cancelled' },
          { key: 'completed', tab: 'Completed' }
        ];

        let hasAnyDelivery = false;
        const updatedMap = new Map();
        const nextCounts = {};

        tabBuckets.forEach(({ key, tab }) => {
          const payload = bundle[key];
          if (payload && Array.isArray(payload.records)) {
            hasAnyDelivery = true;
            const mapped = payload.records.map((r, i) => mapHurrierRecordToDelivery(r, tab, i));
            updatedMap.set(tab, mapped);
            nextCounts[tab] = payload.metadata?.total_count ?? mapped.length;
          }
        });

        if (hasAnyDelivery) {
          setDeliveries((prev) => {
            const preserved = prev.filter((d) => !updatedMap.has(d.tab));
            const incoming = Array.from(updatedMap.values()).flat();
            return [...incoming, ...preserved];
          });
          setTabCounts((prev) => ({ ...prev, ...nextCounts }));
        }

        if (bundle.order_details && typeof bundle.order_details === 'object') {
          setOrderDetailsCache((prev) => ({ ...prev, ...bundle.order_details }));
        }

        if (Array.isArray(bundle.couriers)) {
          setActiveCouriersList(bundle.couriers);
        }

        if (Array.isArray(bundle.issues)) {
          setIssuesList(bundle.issues);
          setTabCounts((prev) => ({ ...prev, Issues: bundle.issues.length }));
        }

        if (bundle.stats && Array.isArray(bundle.stats.cities)) {
          const newSummaries = [];
          const newZoneRows = [];

          bundle.stats.cities.forEach((c) => {
            const s = c.stat || {};
            newSummaries.push({
              city: c.city_name,
              queued: s.queued_count ?? 0,
              queuedPct: s.queued_percent ?? 0,
              dispatched: s.dispatched_count ?? 0,
              dispatchedPct: s.dispatched_percent ?? 0,
              active: s.active_count ?? 0,
              activePct: s.active_percent ?? 0,
              delay: `${Number(s.delay || 0).toFixed(1)}m`,
              puPct: s.picked_up_percent ?? 0,
              doPct: s.drop_off_percent ?? 0,
              zeroDel: s.zero_deliveries ?? 0,
              lowDel: s.low_deliveries ?? 0,
              medDel: s.medium_deliveries ?? 0,
              highDel: s.high_deliveries ?? 0,
              starting: s.couriers_in_starting ?? 0,
              working: s.couriers_in_working ?? 0,
              ending: s.couriers_in_ending ?? 0,
              tempBreak: s.couriers_in_temp_break ?? 0,
              break: s.couriers_in_break ?? 0
            });

            (c.zones || []).forEach((z) => {
              const zDelay = `${Number(z.stat?.delay || 0).toFixed(1)}m`;
              (z.starting_points || []).forEach((sp) => {
                const st = sp.stat || {};
                newZoneRows.push({
                  id: sp.id,
                  zone: sp.name,
                  parentZone: z.zone_name || z.name || '',
                  city: c.city_name,
                  starting: st.couriers_in_starting ?? 0,
                  working: st.couriers_in_working ?? 0,
                  ending: st.couriers_in_ending ?? 0,
                  break: st.couriers_in_break ?? 0,
                  tempBreak: st.couriers_in_temp_break ?? 0,
                  delay: st.delay ? `${Number(st.delay).toFixed(1)}m` : zDelay,
                  queued: st.queued_count ?? 0,
                  dispatched: st.dispatched_count ?? 0,
                  active: st.active_count ?? 0,
                  puPercent: st.picked_up_percent ?? 0,
                  doPercent: st.drop_off_percent ?? 0,
                  zeroDel: st.zero_deliveries ?? 0,
                  lowDel: st.low_deliveries ?? 0,
                  medDel: st.medium_deliveries ?? 0,
                  highDel: st.high_deliveries ?? 0
                });
              });
            });
          });

          if (newSummaries.length > 0) setCitySummary(newSummaries);
          if (newZoneRows.length > 0) setZoneStatsList(newZoneRows);
        }

        if (Array.isArray(bundle.dispatchers) && bundle.dispatchers.length > 0) {
          setDispatcherStats(
            bundle.dispatchers.map((d) => ({
              picked_by: d.picked_by,
              picked: d.picked ?? 0,
              processing: d.processing ?? 0,
              max_picked_for: d.min_picked_at ? formatRelativeDeadline(d.min_picked_at).replace('-', '') : '-'
            }))
          );
        }

        const syncTime = bundle.syncedAt ? new Date(bundle.syncedAt) : new Date();
        setLastRefreshed(
          syncTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        );
      }, []);

      const fetchLiveFeed = useCallback(async () => {
        if (isFetchingRef.current) return;
        const cleanFb = firebaseUrl.trim().replace(/\/+$/, '');
        if (!cleanFb) return;

        isFetchingRef.current = true;
        setSyncStatus('syncing');
        setSyncError('');
        try {
          const response = await fetch(`${cleanFb}/hurrier_live.json`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`Firebase HTTP ${response.status}`);
          const data = await response.json();
          if (data && typeof data === 'object') {
            if (data.syncedAt && data.syncedAt === lastSyncedAtRef.current) {
              setSyncStatus('connected');
              return;
            }
            if (data.syncedAt) lastSyncedAtRef.current = data.syncedAt;
            applyHurrierBundle(data);
            setSyncStatus('connected');
          } else {
            setSyncStatus('connected');
          }
        } catch (err) {
          setSyncStatus('error');
          setSyncError(err?.message || 'تعذر الاتصال بـ Firebase');
        } finally {
          isFetchingRef.current = false;
        }
      }, [firebaseUrl, applyHurrierBundle]);

      useEffect(() => {
        fetchLiveFeed();
      }, [fetchLiveFeed]);

      useEffect(() => {
        if (syncMode !== 'live' || !isAutoRefresh) return;
        setCountdown(refreshIntervalSec);
        const timer = setInterval(() => {
          setCountdown((prev) => {
            if (prev <= 1) {
              fetchLiveFeed();
              return refreshIntervalSec;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [syncMode, isAutoRefresh, refreshIntervalSec, fetchLiveFeed]);

      const handleCopyId = (e, id) => {
        e.stopPropagation();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(id).catch(() => {});
        }
        setCopiedId(id);
        setTimeout(() => setCopiedId(null), 1500);
      };

      const handleCopyCode = (key, text) => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
        setCopiedSnippet(key);
        setTimeout(() => setCopiedSnippet(null), 1800);
      };

      const employeeShareLink = useMemo(() => {
        const base =
          typeof window !== 'undefined' && window.location.origin && window.location.origin !== 'null'
            ? `${window.location.origin}${window.location.pathname}`
            : 'https://mahmoudosman-hub.github.io/hurrier-live/';
        const cleanFb = firebaseUrl.trim().replace(/\/+$/, '');
        if (!cleanFb || cleanFb === DEFAULT_FIREBASE_URL) return base;
        return `${base}?fb=${encodeURIComponent(cleanFb)}`;
      }, [firebaseUrl]);

      const handleApplyPastedJson = () => {
        try {
          const parsed = JSON.parse(rawJsonInput);
          if (parsed.cities) {
            applyHurrierBundle({ stats: parsed });
          } else if (Array.isArray(parsed.records)) {
            applyHurrierBundle({ [pasteTargetTab.toLowerCase().replace(/[^a-z]/g, '')]: parsed });
          } else if (parsed.active || parsed.queued || parsed.stats) {
            applyHurrierBundle(parsed);
          } else if (Array.isArray(parsed)) {
            applyHurrierBundle({ dispatchers: parsed });
          }
          setRawJsonInput('');
          setIsSyncModalOpen(false);
        } catch {
          setSyncError('صيغة JSON غير صحيحة');
        }
      };

      const handleRefresh = () => {
        if (syncMode === 'live') {
          lastSyncedAtRef.current = '';
          fetchLiveFeed();
          setCountdown(refreshIntervalSec);
        } else {
          const now = new Date();
          setLastRefreshed(now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        }
      };

      // Helper to check if an item matches the current region/city/zones filter
      const matchesCityAndZoneFilter = useCallback(
        (itemCity, itemZoneNames = [], itemZoneIds = []) => {
          if (regionFilterMode === 'city' && selectedCity !== 'All Cities') {
            return String(itemCity || 'Cairo').toLowerCase() === selectedCity.toLowerCase();
          }
          if (regionFilterMode === 'multi_cities' && selectedMultiCities.length > 0) {
            const setLower = new Set(selectedMultiCities.map((c) => c.toLowerCase()));
            return setLower.has(String(itemCity || 'Cairo').toLowerCase());
          }
          if (regionFilterMode === 'multi_zones' && selectedMultiZoneIds.length > 0) {
            const idSet = new Set(selectedMultiZoneIds.map(String));
            if (itemZoneIds.some((zid) => zid !== null && zid !== undefined && idSet.has(String(zid)))) {
              return true;
            }
            if (itemZoneNames.some((zn) => zn && selectedZoneNameSetLower.has(String(zn).toLowerCase().trim()))) {
              return true;
            }
            return false;
          }
          return true;
        },
        [regionFilterMode, selectedCity, selectedMultiCities, selectedMultiZoneIds, selectedZoneNameSetLower]
      );

      // Filtered zones for Dashboard & Active Couriers
      const filteredZoneStats = useMemo(() => {
        return zoneStatsList.filter((z) => {
          const matchesRegion = matchesCityAndZoneFilter(z.city, [z.zone], [z.id]);
          const q = searchQuery.trim().toLowerCase();
          const matchesSearch =
            !q ||
            z.zone.toLowerCase().includes(q) ||
            String(z.id).includes(q);
          return matchesRegion && matchesSearch;
        });
      }, [zoneStatsList, matchesCityAndZoneFilter, searchQuery]);

      // Extract all Talabat Mart branches in the selected zones/cities
      const availableMartBranches = useMemo(() => {
        const martBranchesMap = new Map();

        deliveries.forEach((d) => {
          if (!d.isDarkstore) return;
          const zList = Array.isArray(d.allZones) && d.allZones.length > 0 ? d.allZones : [d.zone];
          if (!matchesCityAndZoneFilter(d.city, zList, [])) return;

          const vKey = normalizeVendorText(d.vendor || 'Talabat Mart');
          if (!martBranchesMap.has(vKey)) {
            const cleanedBranchName = vKey
              .replace(/^talabat\s*mart\s*[-،,]?\s*/i, '')
              .replace(/^طلبات\s*مارت\s*[-،,]?\s*/i, '')
              .trim();
            martBranchesMap.set(vKey, {
              fullVendorName: vKey,
              shortName: cleanedBranchName || vKey,
              currentTabCount: 0,
              lateCount: 0
            });
          }

          if (d.tab === activeTab) {
            const entry = martBranchesMap.get(vKey);
            entry.currentTabCount += 1;
            if (d.isLate) entry.lateCount += 1;
          }
        });

        return Array.from(martBranchesMap.values()).sort(
          (a, b) => b.currentTabCount - a.currentTabCount || a.shortName.localeCompare(b.shortName)
        );
      }, [deliveries, activeTab, matchesCityAndZoneFilter]);

      // Reset selected mart branch if it disappears after zone change
      useEffect(() => {
        if (
          selectedMartVendor !== 'all' &&
          !availableMartBranches.some((b) => b.fullVendorName === selectedMartVendor)
        ) {
          setSelectedMartVendor('all');
        }
      }, [availableMartBranches, selectedMartVendor]);

      // Filtered deliveries by active tab, region/zones, quick filter, mart branch, and search
      const filteredDeliveries = useMemo(() => {
        return deliveries.filter((d) => {
          if (d.tab !== activeTab) return false;
          const zList = Array.isArray(d.allZones) && d.allZones.length > 0 ? d.allZones : [d.zone];
          if (!matchesCityAndZoneFilter(d.city, zList, [])) return false;

          let matchesQuick = true;
          if (quickFilter === 'delayed') matchesQuick = d.isLate;
          else if (quickFilter === 'cash') matchesQuick = d.isCash;
          else if (quickFilter === 'card') matchesQuick = d.isCard;
          else if (quickFilter === 'restaurants') matchesQuick = d.verticalType === 'restaurants' && !d.isDarkstore;
          else if (quickFilter === 'darkstores') {
            const normalizedVendor = normalizeVendorText(d.vendor || 'Talabat Mart');
            matchesQuick =
              d.isDarkstore &&
              (selectedMartVendor === 'all' || normalizedVendor === normalizeVendorText(selectedMartVendor));
          }
          else if (quickFilter === 'supermarket') matchesQuick = d.verticalType === 'supermarket';
          else if (quickFilter === 'bc_hybrid') {
            const cLower = String(d.courier || '').toLowerCase();
            const hasHybridZone = zList.some((z) => String(z).toLowerCase().includes('hybrid'));
            matchesQuick = cLower.includes('_bc') || cLower.includes('hybrid') || hasHybridZone;
          }
          else if (quickFilter === 'high_util') matchesQuick = d.isHighUtil;
          else if (quickFilter === 'returning') matchesQuick = d.isReturning;
          else if (quickFilter === 'not_reviewed') matchesQuick = !d.isReviewed;
          if (!matchesQuick) return false;

          const q = searchQuery.trim().toLowerCase();
          if (!q) return true;
          return (
            d.id.toLowerCase().includes(q) ||
            d.vendor.toLowerCase().includes(q) ||
            d.courier.toLowerCase().includes(q) ||
            d.zone.toLowerCase().includes(q) ||
            (Array.isArray(d.allZones) && d.allZones.some((z) => z.toLowerCase().includes(q)))
          );
        });
      }, [deliveries, activeTab, matchesCityAndZoneFilter, quickFilter, selectedMartVendor, searchQuery]);

      const tabDeliveriesStats = useMemo(() => {
        const currentTabItems = deliveries.filter((d) => {
          if (d.tab !== activeTab) return false;
          const zList = Array.isArray(d.allZones) && d.allZones.length > 0 ? d.allZones : [d.zone];
          return matchesCityAndZoneFilter(d.city, zList, []);
        });
        return {
          total: currentTabItems.length,
          late: currentTabItems.filter((d) => d.isLate).length,
          cash: currentTabItems.filter((d) => d.isCash).length,
          darkstores: currentTabItems.filter((d) => d.isDarkstore).length,
          supermarket: currentTabItems.filter((d) => d.verticalType === 'supermarket').length,
          restaurants: currentTabItems.filter((d) => d.verticalType === 'restaurants' && !d.isDarkstore).length
        };
      }, [deliveries, activeTab, matchesCityAndZoneFilter]);

      const filteredIssues = useMemo(() => {
        return issuesList.filter((iss) => {
          const matchesStatus =
            issueStatusFilter === 'all' || String(iss.status || '').toLowerCase() === issueStatusFilter;
          const matchesCat =
            issueCategoryFilter === 'all' ||
            String(iss.type || '').toLowerCase().includes(issueCategoryFilter);
          const q = searchQuery.trim().toLowerCase();
          const matchesSearch =
            !q ||
            String(iss.order_code || '').toLowerCase().includes(q) ||
            String(iss.courier_name || '').toLowerCase().includes(q) ||
            String(iss.title || '').toLowerCase().includes(q);
          return matchesStatus && matchesCat && matchesSearch;
        });
      }, [issuesList, issueStatusFilter, issueCategoryFilter, searchQuery]);

      // --- RENDERERS ---

      const renderDashboardOverview = () => {
        const visibleCities = citySummary.filter((c) => {
          if (regionFilterMode === 'city' && selectedCity !== 'All Cities') {
            return c.city.toLowerCase() === selectedCity.toLowerCase();
          }
          if (regionFilterMode === 'multi_cities' && selectedMultiCities.length > 0) {
            return selectedMultiCities.some((sc) => sc.toLowerCase() === c.city.toLowerCase());
          }
          return true;
        });

        return (
          <div className="mt-6 space-y-6">
            <div className="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
              <div className="px-4 py-3 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
                <span className="text-xs font-bold uppercase tracking-wider text-gray-600">
                  Region Performance &amp; Rider Shifts
                </span>
                <span className="text-xs text-gray-500">Live Operations Metrics</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs whitespace-nowrap">
                  <thead>
                    <tr className="border-b border-gray-200 text-gray-500 font-semibold bg-white">
                      <th className="py-3 px-4">REGION</th>
                      <th className="py-3 px-3">QUEUED</th>
                      <th className="py-3 px-3">DISP</th>
                      <th className="py-3 px-3">ACTIVE</th>
                      <th className="py-3 px-3">DELAY</th>
                      <th className="py-3 px-3">PU / DO</th>
                      <th className="py-3 px-3">0 / 1 / 2 / 3+ DEL</th>
                      <th className="py-3 px-3">START</th>
                      <th className="py-3 px-3">WORK</th>
                      <th className="py-3 px-3">END</th>
                      <th className="py-3 px-3">TEMP</th>
                      <th className="py-3 px-3">BREAK</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100 text-sm">
                    {visibleCities.map((row) => (
                      <tr key={row.city} className="hover:bg-gray-50">
                        <td className="py-3.5 px-4 font-semibold text-gray-900">{row.city}</td>
                        <td className="py-3.5 px-3">
                          <span className="font-semibold text-gray-800">{row.queued}</span>{' '}
                          <span className="text-xs text-gray-400">({row.queuedPct}%)</span>
                        </td>
                        <td className="py-3.5 px-3">
                          <span className="font-semibold text-gray-800">{row.dispatched}</span>{' '}
                          <span className="text-xs text-gray-400">({row.dispatchedPct}%)</span>
                        </td>
                        <td className="py-3.5 px-3">
                          <span className="font-semibold text-blue-600">{row.active}</span>{' '}
                          <span className="text-xs text-gray-400">({row.activePct}%)</span>
                        </td>
                        <td className="py-3.5 px-3 font-semibold text-[#d32f2f]">{row.delay}</td>
                        <td className="py-3.5 px-3 text-gray-700">
                          {row.puPct}% / {row.doPct}%
                        </td>
                        <td className="py-3.5 px-3 text-xs text-gray-600 font-mono">
                          {row.zeroDel} / {row.lowDel} / {row.medDel} / {row.highDel}
                        </td>
                        <td className="py-3.5 px-3 text-gray-700">{row.starting}</td>
                        <td className="py-3.5 px-3 font-semibold text-emerald-700">{row.working}</td>
                        <td className="py-3.5 px-3 text-amber-700">{row.ending}</td>
                        <td className="py-3.5 px-3 text-gray-600">{row.tempBreak}</td>
                        <td className="py-3.5 px-3 text-gray-600">{row.break}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
              <div className="px-4 py-3 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
                <span className="text-xs font-bold uppercase tracking-wider text-gray-600">
                  Starting Points Breakdown ({filteredZoneStats.length} Zones)
                </span>
                {regionFilterMode === 'multi_zones' && (
                  <span className="text-xs font-medium text-blue-600">
                    Filtered by {selectedMultiZoneIds.length} Selected Zones
                  </span>
                )}
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs whitespace-nowrap">
                  <thead>
                    <tr className="border-b border-gray-200 text-gray-500 font-semibold">
                      <th className="py-3 px-4">STARTING POINT</th>
                      <th className="py-3 px-3">QUEUED</th>
                      <th className="py-3 px-3">DISP</th>
                      <th className="py-3 px-3">ACTIVE</th>
                      <th className="py-3 px-3">DELAY</th>
                      <th className="py-3 px-3">PU / DO</th>
                      <th className="py-3 px-3">0/1/2/3+</th>
                      <th className="py-3 px-3">WORK</th>
                      <th className="py-3 px-3">END</th>
                      <th className="py-3 px-3">BREAK</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100 text-sm">
                    {filteredZoneStats.map((sp) => (
                      <tr key={sp.id} className="hover:bg-gray-50">
                        <td className="py-3 px-4 font-medium text-gray-900">
                          {sp.zone}
                          {sp.parentZone && (
                            <span className="ml-2 text-xs text-gray-400">({sp.parentZone})</span>
                          )}
                        </td>
                        <td className="py-3 px-3">{sp.queued}</td>
                        <td className="py-3 px-3">{sp.dispatched}</td>
                        <td className="py-3 px-3 font-medium text-blue-600">{sp.active}</td>
                        <td className={`py-3 px-3 font-medium ${parseFloat(sp.delay) > 5 ? 'text-[#d32f2f]' : 'text-gray-600'}`}>
                          {sp.delay}
                        </td>
                        <td className="py-3 px-3 text-gray-600">{sp.puPercent}% / {sp.doPercent}%</td>
                        <td className="py-3 px-3 text-xs font-mono text-gray-500">
                          {sp.zeroDel}/{sp.lowDel}/{sp.medDel}/{sp.highDel}
                        </td>
                        <td className="py-3 px-3 font-medium text-emerald-700">{sp.working}</td>
                        <td className="py-3 px-3 text-amber-700">{sp.ending}</td>
                        <td className="py-3 px-3 text-gray-600">{sp.break}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      };

      const renderIssuesWatchlist = () => (
        <div className="mt-6 space-y-4">
          <div className="flex flex-wrap items-center justify-between gap-3 bg-gray-50 p-3 rounded-lg border border-gray-200">
            <div className="flex items-center gap-2 flex-wrap">
              {[
                { id: 'all', label: `All Issues (${issuesList.length})` },
                { id: 'open', label: 'Open' },
                { id: 'picked', label: 'Picked' }
              ].map((st) => (
                <button
                  key={st.id}
                  type="button"
                  onClick={() => setIssueStatusFilter(st.id)}
                  className={`px-3 py-1.5 rounded text-xs font-semibold transition-colors ${
                    issueStatusFilter === st.id
                      ? 'bg-blue-600 text-white'
                      : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-100'
                  }`}
                >
                  {st.label}
                </button>
              ))}
            </div>
            <div className="flex items-center gap-2 flex-wrap text-xs">
              {['all', 'pickup', 'dropoff', 'dispatch', 'courier'].map((cat) => (
                <button
                  key={cat}
                  type="button"
                  onClick={() => setIssueCategoryFilter(cat)}
                  className={`px-2.5 py-1 rounded border capitalize ${
                    issueCategoryFilter === cat
                      ? 'bg-gray-900 text-white border-gray-900'
                      : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-100'
                  }`}
                >
                  {cat === 'all' ? 'All Types' : cat}
                </button>
              ))}
            </div>
          </div>

          <div className="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
            <table className="w-full text-left text-sm whitespace-nowrap">
              <thead>
                <tr className="border-b border-gray-200 text-gray-500 font-semibold text-xs bg-gray-50">
                  <th className="py-3 px-4">ISSUE / TYPE</th>
                  <th className="py-3 px-4">ORDER</th>
                  <th className="py-3 px-4">COURIER</th>
                  <th className="py-3 px-4">STATUS</th>
                  <th className="py-3 px-4">PICKED BY</th>
                  <th className="py-3 px-4">CREATED</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-100">
                {filteredIssues.length === 0 ? (
                  <tr>
                    <td colSpan={6} className="py-12 text-center text-gray-500">
                      No active issues matching your filters.
                    </td>
                  </tr>
                ) : (
                  filteredIssues.map((iss, idx) => (
                    <tr key={iss.id || idx} className="hover:bg-gray-50">
                      <td className="py-3.5 px-4">
                        <div className="font-semibold text-gray-900">{iss.title}</div>
                        <span className="text-[11px] uppercase px-2 py-0.5 rounded bg-amber-50 text-amber-800 border border-amber-200 font-medium">
                          {iss.type}
                        </span>
                      </td>
                      <td className="py-3.5 px-4 font-mono text-blue-600 font-medium">{iss.order_code}</td>
                      <td className="py-3.5 px-4 text-gray-700">{iss.courier_name}</td>

        const richOrder =
          rich?.order ||
          (rich && (rich.code || rich.order_code || rich.pickup_address || rich.dropoff_address) ? rich : {});

          .split('_')

          .join(' ');

        const pickupAddrObj = richOrder.pickup_address || {};
        const dropoffAddrObj = richOrder.dropoff_address || {};
        const customerObj = richOrder.customer || {};

        const resolvedCustomerName =
          dropoffAddrObj.name ||
          dropoffAddrObj.recipient_name ||
          dropoffAddrObj.full_name ||
          [dropoffAddrObj.first_name, dropoffAddrObj.last_name].filter(Boolean).join(' ') ||
          richOrder.customer_name ||
          customerObj.name ||
          [customerObj.first_name, customerObj.last_name].filter(Boolean).join(' ') ||
          selectedOrder.customerName ||
          'Customer';

          dropoffAddrObj.phone_number ||
          dropoffAddrObj.phone ||
          dropoffAddrObj.mobile ||
          dropoffAddrObj.mobile_number ||
          dropoffAddrObj.contact_number ||
          richOrder.customer_phone ||
          customerObj.phone_number ||
          customerObj.phone ||
          customerObj.mobile ||
          '-';

        const riderHistory = extractCourierHistoryFromDeliveries(
          richDeliveries,
          selectedOrder.courier,
          selectedOrder.courierId

        const pickedUpTransitionTime = (() => {
          for (const d of richDeliveries) {
            const tr = (d.transitions || []).find(
              (t) => String(t.to_state || '').toLowerCase() === 'picked_up'
            );
            const rawTs = getTransitionRawTimestamp(tr);
            if (rawTs) return formatShortTimeWithSec(rawTs);

          return '-';
        })();

        const rawItems = Array.isArray(richOrder.items)
          ? richOrder.items
          : Array.isArray(richOrder.order_items)
          ? richOrder.order_items
          : Array.isArray(richOrder.line_items)
          ? richOrder.line_items
          : selectedOrder.items || [];

        const rawOrderIssues = Array.isArray(richOrder.issues) ? richOrder.issues : [];

        return {
          cleanCode,
          orderCode: richOrder.order_code || selectedOrder.orderCode || `HF_EG${cleanCode}`,
          status: formattedStatus,
          statusSince: formatReadableTimestamp(richOrder.created_at || richOrder.placed_at),
          platform: richOrder.platform || 'talabat',
          globalEntityId: richOrder.global_entity_id || 'HF_EG',
          vendorCode: richOrder.vendor_code || '-',
          vendorOrderNo: richOrder.vendor_order_number || selectedOrder.vo || '-',
          orderValue:

          cashAtDropoff:
