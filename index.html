    // =========================================================================
    // 2) FORMATTING & NORMALIZATION HELPERS
    // =========================================================================
    function sanitizeEmailKey(email) {
      return String(email || "").trim().toLowerCase().replace(/\./g, ",");
    }

    function normalizeText(val) {
      return String(val ?? "").replace(/\s+/g, " ").trim();
    }

    function formatStatusLabel(raw) {
      const s = normalizeText(raw).replace(/_/g, " ");
      if (!s) return "Unknown";
      return s
        .split(" ")
        .map((w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
        .join(" ");
    }

    function isTalabatMartVendor(vendorName) {
      const v = String(vendorName || "").toLowerCase();
      return v.includes("talabat mart") || v.includes("طلبات مارت") || v.includes("tmart");
    }

    function extractMartBranchLabel(vendorName) {
      const clean = normalizeText(vendorName);
      if (!clean) return "Talabat Mart";
      const parts = clean.split(/[,،-]/).map((p) => p.trim()).filter(Boolean);
      return parts.length > 1 ? parts.slice(1).join(" - ") : clean;
    }

    function formatCairoTime12h(isoOrMs) {
      if (!isoOrMs) return "--:--";
      const d = typeof isoOrMs === "number" ? new Date(isoOrMs) : new Date(isoOrMs);
      if (Number.isNaN(d.getTime())) return "--:--";
      return new Intl.DateTimeFormat("en-US", {
        timeZone: "Africa/Cairo",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      }).format(d);
    }

    function formatDurationMinutes(diffMs) {
      const totalMins = Math.round(diffMs / 60000);
      const absMins = Math.abs(totalMins);
      const sign = totalMins < 0 ? "-" : "";
      if (absMins < 60) return `${sign}${absMins}min`;
      const hrs = Math.floor(absMins / 60);
      const mins = absMins % 60;
      return `${sign}${hrs}h ${mins}min`;
    }

    function formatSecondsDuration(secVal) {
      const s = Number(secVal);
      if (secVal === null || secVal === undefined || Number.isNaN(s) || s <= 0) return "-";
      if (s < 60) return `${Math.round(s)}s`;
      const m = Math.floor(s / 60);
      const rem = Math.round(s % 60);
      return rem > 0 ? `${m}m ${rem}s` : `${m}m`;
    }

    function getTodayCairoDateInput() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Africa/Cairo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function normalizeDeliveryRecord(rec, indexHint = 0) {
      const ord = rec?.order || {};
      const rawCode = String(
        ord.code ||
          ord.confirmation_number ||
          String(ord.order_code || "").replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "") ||
          rec?.id ||
          ""
      ).trim();

      const tags = Array.isArray(ord.tags) ? ord.tags.map((t) => String(t).toLowerCase()) : [];
      const verticalRaw = String(ord.vertical_type || ord.vendor_vertical_type || "restaurants").toLowerCase();
      let verticalLabel = "Restaurants";
      if (verticalRaw.includes("darkstore") || tags.includes("tmart_dedicated")) {
        verticalLabel = "Darkstores";
      } else if (verticalRaw.includes("supermarket") || verticalRaw.includes("hypermarket") || verticalRaw.includes("grocery")) {
        verticalLabel = "Supermarket";
      } else if (verticalRaw.includes("pharmac")) {
        verticalLabel = "Pharmacies";
      } else if (verticalRaw && verticalRaw !== "restaurants") {
        verticalLabel = formatStatusLabel(verticalRaw);
      }

      const paymentLabel = ord.is_cash_collection
        ? "Cash"
        : ord.is_card_on_delivery
        ? "Card"
        : "Online";

      const isSplit =
        tags.includes("split_order") ||
        rec?.is_primary === false ||
        (rec?.id && ord?.id && String(rec.id) !== String(ord.id));

      const sps = Array.isArray(rec?.starting_points)
        ? rec.starting_points.map((sp) => (typeof sp === "string" ? sp : sp?.name || "")).filter(Boolean)
        : [];

      const schedDropMs = ord.scheduled_dropoff_at ? new Date(ord.scheduled_dropoff_at).getTime() : 0;
      const deadlineStr = schedDropMs > 0 ? formatDurationMinutes(schedDropMs - Date.now()) : "-";

      const rawPrice = Number(ord.order_value ?? ord.total ?? 0);
      const priceEgp = rawPrice > 0 ? (rawPrice / 100).toFixed(2) : "0.00";
      const distKm = Number(rec?.distance || 0) > 0 ? (Number(rec.distance) / 1000).toFixed(2) : "0.00";

      const statusFormatted = formatStatusLabel(rec?.status || ord.status || "Active");
      const statusTimeAt = formatCairoTime12h(ord.scheduled_dropoff_at);
      const statusTimeIn = formatCairoTime12h(ord.send_to_restaurant_at || ord.placed_at);

      return {
        uid: `${rec?.id || rawCode}_${indexHint}`,
        deliveryId: String(rec?.id || ""),
        orderId: String(ord.id || ""),
        code: rawCode,
        orderCode: String(ord.order_code || `HF_EG${rawCode}`),
        vendor: normalizeText(ord.vendor_name || "Unknown Vendor"),
        vendorOrderNum: String(ord.vendor_order_number || ""),
        courierId: String(rec?.courier_id || ""),
        courier: normalizeText(rec?.courier_name || "Unassigned"),
        status: statusFormatted,
        statusTimeIn,
        statusTimeAt,
        deadline: deadlineStr,
        deadlineDiffMs: schedDropMs > 0 ? schedDropMs - Date.now() : 999999999,
        zones: sps,
        distanceKm: distKm,
        priceEgp,
        paymentLabel,
        verticalLabel,
        instructions: [paymentLabel, verticalLabel, isSplit ? "Split" : ""].filter(Boolean),
        isSplit,
        raw: rec
      };
    }

    function normalizeCompletedRecord(rec, idx = 0) {
      const ord = rec?.order || rec || {};
      const prim = rec?.primary_delivery || {};
      const timings = rec?.primary_delivery_timings || {};
      const rawCode = String(
        ord.confirmation_number ||
          ord.code ||
          String(ord.order_code || "").replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "") ||
          ""
      ).trim();

      const completedMs =
        Number(rec?.__completed_at_ms || 0) ||
        (prim.completed_at ? new Date(prim.completed_at).getTime() : 0) ||
        (ord.current_state_transition ? new Date(ord.current_state_transition).getTime() : 0) ||
        (ord.placed_at ? new Date(ord.placed_at).getTime() + Number(timings.total_time || 0) * 1000 : 0);

      const dropAddr = ord.drop_off_address || ord.dropoff_address || {};
      const rawSps = Array.isArray(rec?.starting_points)
        ? rec.starting_points
        : Array.isArray(dropAddr.starting_points)
        ? dropAddr.starting_points
        : [];
      const zoneNames = rawSps
        .map((sp) => (typeof sp === "string" ? sp : sp?.name || ""))
        .filter(Boolean);

      const distMeters = Number(prim.delivery_distance ?? rec?.distance ?? 0);

      return {
        uid: `comp_${rawCode}_${idx}`,
        code: rawCode,
        orderCode: String(ord.order_code || `HF_EG${rawCode}`),
        completedMs,
        completedAtFormatted: completedMs > 0 ? formatCairoTime12h(completedMs) : "--:--",
        city: normalizeText(dropAddr.city || "Cairo"),
        zones: zoneNames,
        courierId: String(prim.courier_id || rec?.courier_id || ""),
        courier: normalizeText(prim.courier_name || rec?.courier_name || "-"),
        business: normalizeText(ord.vendor_name || "-"),
        km: distMeters > 0 ? (distMeters / 1000).toFixed(2) : "0.00",
        acceptTime: formatSecondsDuration(timings.accepting_time),
        retailerLate: formatSecondsDuration(timings.vendor_late),
        courierLate: formatSecondsDuration(timings.courier_late),
        waitTime: formatSecondsDuration(timings.wait_pickup_time),
        deliveryLate: formatSecondsDuration(timings.delivery_late),
        timeInBag: formatSecondsDuration(timings.time_in_bag),
        orderDuration: formatSecondsDuration(timings.total_time),
        preorder: ord.is_preorder ? "Yes" : "No",
        dropoffIssue: normalizeText(ord.deliveries_dropoff_issues || "-"),
        raw: rec
      };
    }

    // =========================================================================
    // 3) MAIN DASHBOARD APPLICATION
    // =========================================================================
    function App() {
      const [authUser, setAuthUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [userAccess, setUserAccess] = useState(null); // { role: 'admin'|'employee', name }
      const [accessChecked, setAccessChecked] = useState(false);

      const sessionIdRef = useRef(`sess_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`);

      // Zones & Modals
      const [zonesCatalog, setZonesCatalog] = useState(DEFAULT_ZONES_CATALOG);
      const [selectedZoneIds, setSelectedZoneIds] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(SELECTED_ZONES_STORAGE_KEY) || "null");
          if (Array.isArray(saved) && saved.length > 0) return saved.map(Number);
        } catch {}
        return ZONE_PRESETS.flatMap((p) => p.ids);
      });
      const [isZoneModalOpen, setIsZoneModalOpen] = useState(false);
      const [draftZoneIds, setDraftZoneIds] = useState([]);
      const [zoneModalSearch, setZoneModalSearch] = useState("");

      const [isEmailsModalOpen, setIsEmailsModalOpen] = useState(false);
      const [allowedEmailsMap, setAllowedEmailsMap] = useState({});
      const [newEmailInput, setNewEmailInput] = useState("");
      const [newNameInput, setNewNameInput] = useState("");
      const [newRoleInput, setNewRoleInput] = useState("employee");

      const [isViewersModalOpen, setIsViewersModalOpen] = useState(false);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      // Navigation & Filters
      const [activeTab, setActiveTab] = useState("Active");
      const [selectedZoneFilter, setSelectedZoneFilter] = useState("ALL");
      const [selectedCity, setSelectedCity] = useState("All Cities");
      const [searchQuery, setSearchQuery] = useState("");
      const [activeQuickFilter, setActiveQuickFilter] = useState("All");
      const [selectedStatusFilter, setSelectedStatusFilter] = useState("ALL");
      const [selectedMartBranch, setSelectedMartBranch] = useState("ALL");
      const [orderSortMode, setOrderSortMode] = useState("hurrier_order");
      const [currentPage, setCurrentPage] = useState(1);
      const [selectedRowUids, setSelectedRowUids] = useState(new Set());
      const [toastMsg, setToastMsg] = useState("");

      // Completed Orders Filter States
      const [completedFilterMode, setCompletedFilterMode] = useState("rolling"); // 'rolling' | 'custom'
      const [completedHoursWindow, setCompletedHoursWindow] = useState(2);
      const [customDateStr, setCustomDateStr] = useState(getTodayCairoDateInput);
      const [customFromTime, setCustomFromTime] = useState("10:00");
      const [customToTime, setCustomToTime] = useState("12:00");
      const [customRangeRecords, setCustomRangeRecords] = useState(null);
      const [customRangeLoading, setCustomRangeLoading] = useState(false);
      const [directCompletedLookup, setDirectCompletedLookup] = useState(null);

      // Live Bundle State from Firebase
      const [bundleData, setBundleData] = useState({
        updatedAt: 0,
        tabRecords: { Queued: [], Dispatched: [], Active: [] },
        completedRecords: [],
        completedSyncing: false,
        completedLastSweepAt: 0,
        couriers: [],
        zoneStats: [],
        counts: { Queued: 0, Dispatched: 0, Active: 0 },
        activeViewers: []
      });

      // Detail Modals
      const [orderModalState, setOrderModalState] = useState(null);
      const [courierModalState, setCourierModalState] = useState(null);
      const [expandedCourierZoneId, setExpandedCourierZoneId] = useState(null);

      const showToast = useCallback((msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 2800);
      }, []);

      // Mirror Firebase Auth Token for Tampermonkey Bridge
      const mirrorAuthToStorage = useCallback(async (user) => {
        if (!user) return;
        try {
          const idToken = await user.getIdToken(false);
          const payload = {
            idToken,
            refreshToken: user.refreshToken || "",
            apiKey: FIREBASE_CONFIG.apiKey,
            email: user.email || "",
            updatedAt: Date.now()
          };
          localStorage.setItem(AUTH_BRIDGE_STORAGE_KEY, JSON.stringify(payload));
        } catch {}
      }, []);

      useEffect(() => {
        const unsub = auth.onAuthStateChanged(async (u) => {
          setAuthUser(u);
          setAuthLoading(false);
          if (u) {
            await mirrorAuthToStorage(u);
          } else {
            localStorage.removeItem(AUTH_BRIDGE_STORAGE_KEY);
            setUserAccess(null);
            setAccessChecked(true);
          }
        });
        return () => unsub();
      }, [mirrorAuthToStorage]);

      useEffect(() => {
        if (!authUser) return;
        const iv = setInterval(() => mirrorAuthToStorage(authUser), 15 * 60 * 1000);
        return () => clearInterval(iv);
      }, [authUser, mirrorAuthToStorage]);

      // Verify Email in /allowed_emails
      useEffect(() => {
        if (!authUser?.email) return;
        const emailKey = sanitizeEmailKey(authUser.email);
        const ref = db.ref("/allowed_emails");
        const handler = async (snap) => {
          const val = snap.val();
          if (!val) {
            const firstAdmin = {
              email: authUser.email,
              name: authUser.displayName || authUser.email.split("@")[0],
              role: "admin",
              addedAt: Date.now()
            };
            await db.ref(`/allowed_emails/${emailKey}`).set(firstAdmin).catch(() => {});
            setAllowedEmailsMap({ [emailKey]: firstAdmin });
            setUserAccess(firstAdmin);
            setAccessChecked(true);
            return;
          }
          setAllowedEmailsMap(val);
          const entry = val[emailKey];
          setUserAccess(entry || null);
          setAccessChecked(true);
        };
        ref.on("value", handler);
        return () => ref.off("value", handler);
      }, [authUser]);

      // Load Dynamic Zones Catalog
      useEffect(() => {
        if (!userAccess) return;
        const ref = db.ref("/config/dynamic_zones_catalog");
        const handler = (snap) => {
          const list = snap.val();
          if (Array.isArray(list) && list.length > 0) {
            const merged = new Map();
            DEFAULT_ZONES_CATALOG.forEach((z) => merged.set(Number(z.id), z));
            list.forEach((z) => {
              if (z?.id && z?.name) {
                merged.set(Number(z.id), {
                  id: Number(z.id),
                  name: String(z.name).trim(),
                  city: z.city || "Cairo"
                });
              }
            });
            setZonesCatalog(Array.from(merged.values()));
          }
        };
        ref.on("value", handler);
        return () => ref.off("value", handler);
      }, [userAccess]);

      // Session Heartbeat & Real-Time Bundle Subscription
      useEffect(() => {
        if (!userAccess || !authUser?.email) return;
        const sid = sessionIdRef.current;
        const sessRef = db.ref(`/active_sessions/${sid}`);
        const bundleRef = db.ref(`/session_bundles/${sid}`);

        const sendHeartbeat = () => {
          sessRef
            .set({
              email: authUser.email,
              employeeName: userAccess.name || authUser.displayName || authUser.email,
              role: userAccess.role || "employee",
              zoneIds: selectedZoneIds,
              activeTab,
              lastSeen: Date.now()
            })
            .catch(() => {});
        };

        sendHeartbeat();
        const hbInterval = setInterval(sendHeartbeat, 5000);

        const onBundle = (snap) => {
          const val = snap.val();
          if (val && typeof val === "object") {
            setBundleData((prev) => ({
              ...prev,
              ...val,
              tabRecords: {
                Queued: Array.isArray(val.tabRecords?.Queued) ? val.tabRecords.Queued : [],
                Dispatched: Array.isArray(val.tabRecords?.Dispatched) ? val.tabRecords.Dispatched : [],
                Active: Array.isArray(val.tabRecords?.Active) ? val.tabRecords.Active : []
              },
              completedRecords: Array.isArray(val.completedRecords) ? val.completedRecords : [],
              couriers: Array.isArray(val.couriers) ? val.couriers : [],
              zoneStats: Array.isArray(val.zoneStats) ? val.zoneStats : [],
              counts: val.counts || { Queued: 0, Dispatched: 0, Active: 0 },
              activeViewers: Array.isArray(val.activeViewers) ? val.activeViewers : []
            }));
          }
        };
        bundleRef.on("value", onBundle);

        const cleanup = () => {
          sessRef.remove().catch(() => {});
          bundleRef.remove().catch(() => {});
        };
        window.addEventListener("beforeunload", cleanup);

        return () => {
          clearInterval(hbInterval);
          bundleRef.off("value", onBundle);
          window.removeEventListener("beforeunload", cleanup);
          cleanup();
        };
      }, [userAccess, authUser, selectedZoneIds, activeTab]);

      // =========================================================================
      // 4) DERIVED DATA & FILTERING
      // =========================================================================
      const effectiveZonesCatalog = useMemo(() => {
        const idSet = new Set(selectedZoneIds.map(Number));
        return zonesCatalog.filter((z) => idSet.has(Number(z.id)));
      }, [zonesCatalog, selectedZoneIds]);

      const knownCouriersMeta = useMemo(() => {
        const map = new Map();
        (bundleData.couriers || []).forEach((c) => {
          if (c?.id) map.set(String(c.id), c);
        });
        return map;
      }, [bundleData.couriers]);

      const baseTabDeliveries = useMemo(() => {
        const rawList =
          activeTab === "Queued"
            ? bundleData.tabRecords.Queued
            : activeTab === "Dispatched"
            ? bundleData.tabRecords.Dispatched
            : activeTab === "Active"
            ? bundleData.tabRecords.Active
            : [];

        const normalized = rawList.map((r, idx) => normalizeDeliveryRecord(r, idx));
        if (selectedZoneFilter === "ALL") return normalized;
        const targetZoneLower = selectedZoneFilter.toLowerCase();
        return normalized.filter((d) =>
          d.zones.some((z) => z.toLowerCase() === targetZoneLower)
        );
      }, [activeTab, bundleData.tabRecords, selectedZoneFilter]);

      const filteredDeliveries = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        let list = baseTabDeliveries.filter((d) => {
          if (activeQuickFilter === "Delayed" && !(d.deadline.includes("-") || d.deadline === "Late")) {
            return false;
          }
          if (activeQuickFilter === "Cash" && !d.instructions.includes("Cash")) return false;
          if (activeQuickFilter === "Card" && !d.instructions.includes("Card")) return false;
          if (
            activeQuickFilter === "Darkstores" &&
            !(isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores"))
          ) {
            return false;
          }
          if (
            activeQuickFilter === "Darkstores" &&
            selectedMartBranch !== "ALL" &&
            normalizeText(extractMartBranchLabel(d.vendor)) !== normalizeText(selectedMartBranch)
          ) {
            return false;
          }
          if (activeQuickFilter === "Restaurants") {
            const isDs = isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores");
            if (isDs || !(d.instructions.includes("Restaurants") || d.instructions.includes("Supermarket"))) {
              return false;
            }
          }
          if (activeQuickFilter === "Split" && !d.isSplit) return false;
          if (
            selectedStatusFilter !== "ALL" &&
            normalizeText(d.status).toLowerCase() !== normalizeText(selectedStatusFilter).toLowerCase()
          ) {
            return false;
          }

          if (!q) return true;
          const cMeta = knownCouriersMeta.get(d.courierId);
          return (
            d.code.toLowerCase().includes(q) ||
            d.orderCode.toLowerCase().includes(q) ||
            d.vendor.toLowerCase().includes(q) ||
            d.vendorOrderNum.toLowerCase().includes(q) ||
            d.courier.toLowerCase().includes(q) ||
            d.zones.some((z) => z.toLowerCase().includes(q)) ||
            (cMeta &&
              (String(cMeta.phone_number || "").toLowerCase().includes(q) ||
                String(cMeta.user_id || "").toLowerCase().includes(q)))
          );
        });

        if (orderSortMode === "deadline_asc") {
          list = [...list].sort((a, b) => a.deadlineDiffMs - b.deadlineDiffMs);
        } else if (orderSortMode === "distance_desc") {
          list = [...list].sort((a, b) => Number(b.distanceKm) - Number(a.distanceKm));
        }
        return list;
      }, [
        baseTabDeliveries,
        activeQuickFilter,
        selectedStatusFilter,
        selectedMartBranch,
        searchQuery,
        knownCouriersMeta,
        orderSortMode
      ]);

      const effectiveTabCounts = useMemo(() => {
        return {
          Queued: bundleData.tabRecords.Queued.length,
          Dispatched: bundleData.tabRecords.Dispatched.length,
          Active: bundleData.tabRecords.Active.length
        };
      }, [bundleData.tabRecords]);

      // Completed Orders Filtering & Direct Lookup
      useEffect(() => {
        if (activeTab !== "Completed") return;
        const clean = searchQuery.trim().replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "");
        if (!/^\d{6,22}$/.test(clean)) {
          setDirectCompletedLookup(null);
          return;
        }
        let cancelled = false;
        const timer = setTimeout(async () => {
          try {
            await db.ref(`/config/completed_id_reqs/${clean}`).set({
              code: clean,
              requestedAt: Date.now()
            });
            const resRef = db.ref(`/session_bundles/comp_id_${clean}`);
            const onRes = (snap) => {
              const val = snap.val();
              if (!cancelled && val && val.found && val.record) {
                setDirectCompletedLookup(normalizeCompletedRecord(val.record, 0));
              }
            };
            resRef.on("value", onRes);
            setTimeout(() => resRef.off("value", onRes), 12000);
          } catch {}
        }, 400);
        return () => {
          cancelled = true;
          clearTimeout(timer);
        };
      }, [activeTab, searchQuery]);

      const filteredCompletedOrders = useMemo(() => {
        const sourceRaw =
          completedFilterMode === "custom" && Array.isArray(customRangeRecords)
            ? customRangeRecords
            : bundleData.completedRecords;

        const now = Date.now();
        const windowCutoff = now - completedHoursWindow * 3600 * 1000;
        const q = searchQuery.trim().toLowerCase();

        const mapByCode = new Map();
        sourceRaw.forEach((r, idx) => {
          const item = normalizeCompletedRecord(r, idx);
          if (item.code) mapByCode.set(item.code, item);
        });
        if (directCompletedLookup && directCompletedLookup.code) {
          mapByCode.set(directCompletedLookup.code, directCompletedLookup);
        }

        return Array.from(mapByCode.values())
          .filter((item) => {
            if (!q && completedFilterMode === "rolling" && item.completedMs > 0) {
              if (item.completedMs < windowCutoff) return false;
            }
            if (selectedCity !== "All Cities" && item.city.toLowerCase() !== selectedCity.toLowerCase()) {
              return false;
            }
            if (selectedZoneFilter !== "ALL") {
              if (!item.zones.some((z) => z.toLowerCase() === selectedZoneFilter.toLowerCase())) {
                return false;
              }
            }
            if (!q) return true;
            return (
              item.code.toLowerCase().includes(q) ||
              item.orderCode.toLowerCase().includes(q) ||
              item.courier.toLowerCase().includes(q) ||
              item.business.toLowerCase().includes(q)
            );
          })
          .sort((a, b) => b.completedMs - a.completedMs);
      }, [
        bundleData.completedRecords,
        completedFilterMode,
        customRangeRecords,
        completedHoursWindow,
        searchQuery,
        selectedCity,
        selectedZoneFilter,
        directCompletedLookup
      ]);

          loading: true,

          orderCode: orderItem.orderCode || `HF_EG${code}`,
          summary: orderItem,
          payload: null
        });

        try {
          await db.ref(`/config/order_detail_reqs/${code}`).set({
            code,
            orderCode: orderItem.orderCode || `HF_EG${code}`,
            requestedAt: Date.now()
          });
          const detRef = db.ref(`/order_details/${code}`);
          const onDet = (snap) => {
            const val = snap.val();
            if (val) {
              setOrderModalState((prev) =>
                prev && prev.code === code ? { ...prev, loading: false, payload: val } : prev

            }
          };
          detRef.on("value", onDet);

          setOrderModalState((prev) => (prev ? { ...prev, loading: false } : null));

        const fromMs = new Date(fromIso).getTime();
        const toMs = new Date(toIso).getTime();
        if (Number.isNaN(fromMs) || Number.isNaN(toMs) || fromMs > toMs) {
          showToast("تأكد من اختيار وقت بداية ونهاية صحيح");
          return;
        }
        const reqId = `rng_${Date.now()}`;
        setCustomRangeLoading(true);
        try {
          await db.ref(`/config/completed_range_reqs/${sid}`).set({
            reqId,
            sessionId: sid,
            dateStr: customDateStr,
            fromMs,
            toMs
          });
          const resRef = db.ref(`/session_bundles/comp_range_${sid}`);

              resRef.off("value", onRes);

          resRef.on("value", onRes);

          );

        );

                    <th className="px-3 py-3 text-left">TIME IN BAG</th>

                    <th className="px-3 py-3 text-left">PREORDER</th>
                    <th className="px-3 py-3 text-left">DROPOFF ISSUE</th>

                </thead>
                <tbody className="divide-y divide-gray-100">
                  {pageSlice.length === 0 ? (
                    <tr>
                      <td colSpan={16} className="px-6 py-12 text-center text-gray-400 text-sm">
                        {bundleData.completedSyncing
                          ? "جاري تجميع الأوردرات المكتملة من السيرفر..."
                          : `لا توجد أوردرات مكتملة (Completed Orders) مطابقة للبحث في آخر ${completedHoursWindow} ساعة.`}
                      </td>
                    </tr>
                  ) : (
                    pageSlice.map((item) => (
                      <tr key={item.uid} className="hover:bg-blue-50/30">
                        <td className="px-3 py-2.5 font-semibold text-gray-800 whitespace-nowrap">
                          {item.completedAtFormatted}

                        <td className="px-3 py-2.5 whitespace-nowrap">
                          <button

                            onClick={() => openOrderDetailModal(item)}
                            className="font-bold text-blue-600 hover:underline"
                          >
                            {item.code}
                          </button>
                        </td>
                        <td className="px-3 py-2.5 text-gray-700">{item.city}</td>
                        <td className="px-3 py-2.5 text-blue-700 max-w-[160px] truncate">
                          {item.zones.slice(0, 2).join(", ") || "-"}
                        </td>
                        <td className="px-3 py-2.5">
                          <button
                            type="button"
                            onClick={() => openCourierDetailModal(item.courierId, item.courier)}
                            className="text-blue-600 hover:underline font-medium text-left"
                          >
                            {item.courier}
                          </button>
                        </td>
                        <td className="px-3 py-2.5 text-gray-800 max-w-[180px] truncate">{item.business}</td>
                        <td className="px-3 py-2.5 text-gray-700">{item.km}</td>
                        <td className="px-3 py-2.5 text-gray-700">{item.acceptTime}</td>
                        <td className="px-3 py-2.5 text-gray-700">{item.retailerLate}</td>
                        <td className="px-3 py-2.5 text-gray-700">{item.courierLate}</td>
                        <td className="px-3 py-2.5 text-gray-700">{item.waitTime}</td>
                        <td className="px-3 py-2.5 text-gray-700">{item.deliveryLate}</td>
                        <td className="px-3 py-2.5 text-gray-700">{item.timeInBag}</td>
                        <td className="px-3 py-2.5 text-gray-700">{item.orderDuration}</td>
                        <td className="px-3 py-2.5 text-gray-700">{item.preorder}</td>
                        <td className="px-3 py-2.5 text-gray-700">{item.dropoffIssue}</td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      const renderDeliveriesTableView = () => {
        const tabExactTotal = baseTabDeliveries.length;
        const lateCount = baseTabDeliveries.filter(
          (d) => d.deadline.includes("-") || d.deadline === "Late"
        ).length;
        const cashCount = baseTabDeliveries.filter((d) => d.instructions.includes("Cash")).length;
        const cardCount = baseTabDeliveries.filter((d) => d.instructions.includes("Card")).length;
        const darkstoreCount = baseTabDeliveries.filter(
          (d) => isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores")
        ).length;
        const restaurantCount = baseTabDeliveries.filter((d) => {
          const isDs = isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores");
          return !isDs && (d.instructions.includes("Restaurants") || d.instructions.includes("Supermarket"));
        }).length;
        const splitCount = baseTabDeliveries.filter((d) => d.isSplit).length;

        const quickFilters = [
          { id: "All", label: `All (${tabExactTotal})` },
          { id: "Delayed", label: `Delayed (${lateCount})` },
          { id: "Cash", label: `Cash (${cashCount})` },
          { id: "Card", label: `Card (${cardCount})` },
          { id: "Restaurants", label: `Restaurants (${restaurantCount})` },
          { id: "Darkstores", label: `Darkstores - Talabat Mart (${darkstoreCount})` },
          { id: "Split", label: `Split Orders (${splitCount})` }
        ];

        // =====================================================================
        // PROPOSAL 1: LIVE STATUS PILLS FILTER BAR (Active Deliveries & Multi-Status)
        // =====================================================================
        const quickFilteredBaseDeliveries = baseTabDeliveries.filter((d) => {
          if (activeQuickFilter === "Delayed" && !(d.deadline.includes("-") || d.deadline === "Late")) return false;
          if (activeQuickFilter === "Cash" && !d.instructions.includes("Cash")) return false;
          if (activeQuickFilter === "Card" && !d.instructions.includes("Card")) return false;
          if (
            activeQuickFilter === "Darkstores" &&
            !(isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores"))
          ) {
            return false;
          }
          if (
            activeQuickFilter === "Darkstores" &&
            selectedMartBranch !== "ALL" &&
            normalizeText(extractMartBranchLabel(d.vendor)) !== normalizeText(selectedMartBranch)
          ) {
            return false;
          }
          if (activeQuickFilter === "Restaurants") {
            const isDs = isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores");
            if (isDs || !(d.instructions.includes("Restaurants") || d.instructions.includes("Supermarket"))) {
              return false;
            }
          }
          if (activeQuickFilter === "Split" && !d.isSplit) return false;
          return true;
        });

        const STATUS_ORDER_PRIORITY = [
          "Accepted",
          "Near Pickup",
          "Picked Up",
          "Left Pickup",
          "Near Dropoff",
          "Courier Notified",
          "Dispatched",
          "Queued",
          "Returning"
        ];
        const statusCountsMap = new Map();
        quickFilteredBaseDeliveries.forEach((d) => {
          const stLabel = normalizeText(d.status);
          if (!stLabel) return;
          statusCountsMap.set(stLabel, (statusCountsMap.get(stLabel) || 0) + 1);
        });
        if (
          selectedStatusFilter !== "ALL" &&
          !Array.from(statusCountsMap.keys()).some(
            (k) => k.toLowerCase() === normalizeText(selectedStatusFilter).toLowerCase()
          )
        ) {
          statusCountsMap.set(selectedStatusFilter, 0);
        }
        const statusPillsList = Array.from(statusCountsMap.entries())
          .map(([label, count]) => ({ label, count }))
          .sort((a, b) => {
            const idxA = STATUS_ORDER_PRIORITY.findIndex((s) => s.toLowerCase() === a.label.toLowerCase());
            const idxB = STATUS_ORDER_PRIORITY.findIndex((s) => s.toLowerCase() === b.label.toLowerCase());
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
            return a.label.localeCompare(b.label);
          });

        const getStatusDotColor = (stLabel) => {
          const low = stLabel.toLowerCase();
          if (low.includes("left pickup")) return "bg-teal-500";
          if (low.includes("picked up")) return "bg-indigo-500";
          if (low.includes("near pickup")) return "bg-amber-500";
          if (low.includes("near dropoff")) return "bg-emerald-500";
          if (low.includes("accepted")) return "bg-sky-500";
          return "bg-slate-400";
        };

        const martBranches = Array.from(
          new Set(
            baseTabDeliveries
              .filter((d) => isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores"))
              .map((d) => extractMartBranchLabel(d.vendor))
          )
        ).sort();

        const totalItemsForPagination = filteredDeliveries.length;
        const totalPages = Math.max(1, Math.ceil(totalItemsForPagination / PAGE_SIZE));
        const safePage = Math.min(currentPage, totalPages);
        const paginatedDeliveries = filteredDeliveries.slice(
          (safePage - 1) * PAGE_SIZE,
          safePage * PAGE_SIZE
        );

        const copyDelayedOrders = () => {
          const delayedRows = baseTabDeliveries.filter(
            (d) => d.deadline.includes("-") || d.deadline === "Late"
          );
          if (delayedRows.length === 0) {
            showToast("لا توجد أوردرات متأخرة حالياً");
            return;
          }
          const text = delayedRows
            .map((d) => `${d.code} | ${d.deadline} | ${d.status} | ${d.courier} | ${d.vendor}`)
            .join("\n");
          copyTextToClipboard(text, `تم نسخ ${delayedRows.length} أوردر متأخر`);
        };

        return (
          <div className="mt-4 space-y-3">
            {/* Row 1: Quick Filter Pills + Delayed Copy + Sort + Pagination */}
            <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-gray-100">
              <div className="flex flex-wrap items-center gap-1.5">
                {quickFilters.map((qf) => {
                  const isActive = activeQuickFilter === qf.id;
                  return (
                    <button
                      key={qf.id}
                      type="button"
                      onClick={() => {
                        setActiveQuickFilter(qf.id);
                        setSelectedMartBranch("ALL");
                        setCurrentPage(1);
                      }}
                      className={`px-3.5 py-1.5 rounded-full text-xs font-semibold border transition-colors ${
                        isActive
                          ? "bg-blue-600 text-white border-blue-600 shadow-sm"
                          : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"
                      }`}
                    >
                      {qf.label}
                    </button>
                  );
                })}
              </div>

              <div className="flex flex-wrap items-center gap-2 text-xs text-gray-500">
                {lateCount > 0 && (
                  <button
                    type="button"
                    onClick={copyDelayedOrders}
                    className="px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-white font-bold shadow-sm transition-colors"
                  >
                    📋 نسخ كل المتأخرات ({lateCount})
                  </button>
                )}
                <button
                  type="button"
                  onClick={() =>
                    setOrderSortMode((prev) =>
                      prev === "hurrier_order"
                        ? "deadline_asc"
                        : prev === "deadline_asc"
                        ? "distance_desc"
                        : "hurrier_order"
                    )
                  }
                  className="px-3 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-50 text-gray-700 font-semibold"
                >
                  Order:{" "}
                  {orderSortMode === "hurrier_order"
                    ? "Hurrier Default"
                    : orderSortMode === "deadline_asc"
                    ? "Most Delayed"
                    : "Longest Distance"}
                </button>
                <div>
                  Page <strong className="text-gray-800">{safePage}</strong> of{" "}
                  <strong className="text-gray-800">{totalPages}</strong>{" "}
                  <span className="text-gray-400">
                    ({paginatedDeliveries.length} rows • Total {totalItemsForPagination})
                  </span>
                </div>
              </div>
            </div>

            {/* Row 2 (Proposal 1): Status Filter Pills Bar */}
            {(activeTab === "Active" || statusPillsList.length > 1) && statusPillsList.length > 0 && (
              <div className="flex flex-wrap items-center gap-1.5 py-2 px-3 rounded-xl bg-slate-50/90 border border-slate-200/80">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 mr-1">
                  Status:
                </span>
                <button
                  type="button"
                  onClick={() => {
                    setSelectedStatusFilter("ALL");
                    setCurrentPage(1);
                  }}
                  className={`px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors ${
                    selectedStatusFilter === "ALL"
                      ? "bg-slate-800 text-white border-slate-800 shadow-sm"
                      : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"
                  }`}
                >
                  All Statuses ({quickFilteredBaseDeliveries.length})
                </button>
                {statusPillsList.map((st) => {
                  const isStActive =
                    selectedStatusFilter !== "ALL" &&
                    normalizeText(selectedStatusFilter).toLowerCase() === st.label.toLowerCase();
                  return (
                    <button
                      key={st.label}
                      type="button"
                      onClick={() => {
                        setSelectedStatusFilter((prev) =>
                          normalizeText(prev).toLowerCase() === st.label.toLowerCase() ? "ALL" : st.label
                        );
                        setCurrentPage(1);
                      }}
                      className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors ${
                        isStActive
                          ? "bg-slate-800 text-white border-slate-800 shadow-sm"
                          : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"
                      }`}
                    >
                      <span
                        className={`w-2 h-2 rounded-full flex-shrink-0 ${
                          isStActive ? "bg-emerald-400" : getStatusDotColor(st.label)
                        }`}
                      />
                      <span>{st.label}</span>
                      <span
                        className={`px-1.5 py-0.2 rounded-full text-[11px] font-bold ${
                          isStActive ? "bg-white/20 text-white" : "bg-slate-100 text-slate-700"
                        }`}
                      >
                        {st.count}
                      </span>
                    </button>
                  );
                })}
                {selectedStatusFilter !== "ALL" && (
                  <button
                    type="button"
                    onClick={() => {
                      setSelectedStatusFilter("ALL");
                      setCurrentPage(1);
                    }}
                    className="px-2 py-1 rounded-full text-[11px] font-bold text-red-600 hover:bg-red-50 border border-red-200 bg-white transition-colors"
                    title="إلغاء فلتر الحالة"
                  >
                    ✕ مسح الحالة
                  </button>
                )}
              </div>
            )}

            {/* Optional Talabat Mart Branches Sub-Bar */}
            {activeQuickFilter === "Darkstores" && martBranches.length > 1 && (
              <div className="flex flex-wrap items-center gap-1.5 py-2 px-3 rounded-xl bg-blue-50/60 border border-blue-200/70">
                <span className="text-[11px] font-bold text-blue-800 mr-1">فروع طلبات مارت:</span>
                <button
                  type="button"
                  onClick={() => {
                    setSelectedMartBranch("ALL");
                    setCurrentPage(1);
                  }}
                  className={`px-2.5 py-1 rounded-full text-xs font-semibold border ${
                    selectedMartBranch === "ALL"
                      ? "bg-blue-600 text-white border-blue-600"
                      : "bg-white text-gray-700 border-gray-300"
                  }`}
                >
                  All Branches
                </button>
                {martBranches.map((br) => (
                  <button
                    key={br}
                    type="button"
                    onClick={() => {
                      setSelectedMartBranch(br);
                      setCurrentPage(1);
                    }}
                    className={`px-2.5 py-1 rounded-full text-xs font-semibold border ${
                      selectedMartBranch === br
                        ? "bg-blue-600 text-white border-blue-600"
                        : "bg-white text-gray-700 border-gray-300"
                    }`}
                  >
                    {br}
                  </button>
                ))}
              </div>
            )}

            {/* Search & Zone Filter Bar */}
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="flex flex-wrap items-center gap-2 flex-1 min-w-[260px]">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => {
                    setSearchQuery(e.target.value);
                    setCurrentPage(1);
                  }}
                  placeholder="Search Order ID, Vendor, Courier, Phone, or User ID..."
                  className="px-3.5 py-2 rounded-lg border border-gray-300 text-xs w-full sm:w-80 bg-white focus:outline-none focus:border-blue-500"
                />
                <select
                  value={selectedZoneFilter}
                  onChange={(e) => {
                    setSelectedZoneFilter(e.target.value);
                    setCurrentPage(1);
                  }}
                  className="px-3 py-2 rounded-lg border border-gray-300 text-xs bg-white text-gray-700 font-semibold"
                >
                  <option value="ALL">All Selected Zones ({effectiveZonesCatalog.length})</option>
                  {effectiveZonesCatalog.map((z) => (
                    <option key={z.id} value={z.name}>
                      {z.name}
                    </option>
                  ))}
                </select>
                {searchQuery.trim() && (
                  <button
                    type="button"
                    onClick={() => handleJumpToCompletedOrderSearch(searchQuery)}
                    className="px-3 py-2 rounded-lg bg-slate-800 text-white text-xs font-bold hover:bg-slate-900"
                  >
                    ابحث في Completed Orders ↗
                  </button>
                )}
              </div>

              {selectedRowUids.size > 0 && (
                <button
                  type="button"
                  onClick={() => {
                    const rowsToCopy = paginatedDeliveries.filter((d) => selectedRowUids.has(d.uid));
                    const txt = rowsToCopy
                      .map((d) => `${d.code} | ${d.status} | ${d.courier} | ${d.vendor}`)
                      .join("\n");
                    copyTextToClipboard(txt, `تم نسخ ${rowsToCopy.length} صف محدد`);
                  }}
                  className="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-bold"
                >
                  نسخ المحدد ({selectedRowUids.size})
                </button>
              )}
            </div>

            {/* Main Deliveries Table */}
            <div className="bg-white rounded-xl border border-gray-200 overflow-x-auto custom-scrollbar">
              <table className="min-w-full divide-y divide-gray-200 text-xs">
                <thead className="bg-gray-50 text-gray-500 font-bold uppercase text-[11px]">
                  <tr>
                    <th className="px-3 py-3 text-left w-8">
                      <input
                        type="checkbox"
                        checked={
                          paginatedDeliveries.length > 0 &&
                          paginatedDeliveries.every((d) => selectedRowUids.has(d.uid))
                        }
                        onChange={(e) => {
                          if (e.target.checked) {
                            setSelectedRowUids(new Set(paginatedDeliveries.map((d) => d.uid)));
                          } else {
                            setSelectedRowUids(new Set());
                          }
                        }}
                      />
                    </th>
                    <th className="px-3 py-3 text-left">ORDER</th>
                    <th className="px-3 py-3 text-left">DEADLINE</th>
                    <th className="px-3 py-3 text-left">COURIER</th>
                    <th className="px-3 py-3 text-left">STATUS</th>
                    <th className="px-3 py-3 text-left">ZONE / DISTANCE</th>
                    <th className="px-3 py-3 text-left">DELIVERY INSTRUCTION</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {paginatedDeliveries.length === 0 ? (
                    <tr>
                      <td colSpan={7} className="px-6 py-12 text-center text-gray-400 text-sm">
                        لا توجد أوردرات مطابقة للفلاتر الحالية.
                      </td>
                    </tr>
                  ) : (
                    paginatedDeliveries.map((d) => {
                      const isLate = d.deadline.includes("-") || d.deadline === "Late";
                      return (
                        <tr key={d.uid} className="hover:bg-blue-50/20">
                          <td className="px-3 py-3">
                            <input
                              type="checkbox"
                              checked={selectedRowUids.has(d.uid)}
                              onChange={(e) => {
                                const next = new Set(selectedRowUids);
                                if (e.target.checked) next.add(d.uid);
                                else next.delete(d.uid);
                                setSelectedRowUids(next);
                              }}
                            />
                          </td>
                          <td className="px-3 py-3">
                            <div className="flex items-center gap-1.5">
                              <button
                                type="button"
                                onClick={() => openOrderDetailModal(d)}
                                className="text-sm font-bold text-blue-600 hover:underline"
                              >
                                {d.code}
                              </button>
                              <button
                                type="button"
                                onClick={() => copyTextToClipboard(d.code, `تم نسخ ${d.code}`)}
                                className="text-gray-400 hover:text-gray-700"
                                title="Copy Order ID"
                              >
                                ❐
                              </button>
                              <button
                                type="button"
                                onClick={() => openOrderDetailModal(d)}
                                className="px-1.5 py-0.5 rounded border border-amber-200 bg-amber-50 text-amber-700 text-[11px]"
                                title="Notes & Details"
                              >
                                📋
                              </button>
                            </div>
                            <div className="text-gray-500 text-[11px] mt-0.5 truncate max-w-[240px]">
                              {d.vendor} {d.vendorOrderNum ? `#VO #${d.vendorOrderNum}` : ""}
                            </div>
                          </td>
                          <td className="px-3 py-3 whitespace-nowrap">
                            <span
                              className={`px-2.5 py-1 rounded-full font-extrabold text-xs ${
                                isLate
                                  ? "bg-red-600 text-white"
                                  : "bg-emerald-50 text-emerald-700 border border-emerald-200"
                              }`}
                            >
                              {d.deadline}
                            </span>
                          </td>
                          <td className="px-3 py-3">
                            {d.courierId ? (
                              <button
                                type="button"
                                onClick={() => openCourierDetailModal(d.courierId, d.courier)}
                                className="text-blue-600 hover:underline font-medium text-left max-w-[200px] leading-snug"
                              >
                                {d.courier}
                              </button>
                            ) : (
                              <span className="text-gray-400 italic">Unassigned</span>
                            )}
                          </td>
                          <td className="px-3 py-3 whitespace-nowrap">
                            <div className="font-bold text-gray-900">{d.status}</div>
                            <div className="text-[11px] text-gray-400 mt-0.5">
                              In: {d.statusTimeIn} • At: {d.statusTimeAt}
                            </div>
                          </td>
                          <td className="px-3 py-3">
                            <div className="flex items-center gap-1.5">
                              <span className="text-blue-600 font-medium truncate max-w-[180px]">
                                {d.zones.slice(0, 2).join(", ") || "-"}
                              </span>
                              {d.zones.length > 2 && (

                  <button
                    type="button"
                    onClick={() => setIsViewersModalOpen(false)}
                    className="px-2.5 py-1 rounded bg-gray-100 text-xs font-bold"
                  >
                    ✕
                  </button>
                </div>
                <div className="divide-y divide-gray-100">
                  {bundleData.activeViewers.map((v) => (
                    <div key={v.sessionId} className="py-2.5 flex items-center justify-between text-xs">
                      <div>
                        <div className="font-bold text-gray-900">{v.employeeName}</div>
                        <div className="text-gray-500">{v.email}</div>
                      </div>
                      <span className="px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700 font-bold">
                        {v.activeTab} • {v.zoneCount} Zones
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
