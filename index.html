    function isRealHurrierZoneId(id) {
      const n = Number(id);
      return Number.isInteger(n) && n >= 10000 && n < 90000;
    }

    function normalizeText(v) {
      return String(v || "")
        .replace(/&#39;/g, "'")
        .replace(/&amp;/g, "&")
        .replace(/&quot;/g, '"')
        .replace(/\s+/g, " ")
        .trim();
    }

    function isTalabatMartVendor(vendorName) {
      const s = normalizeText(vendorName).toLowerCase();
      return s.includes("talabat mart") || s.includes("طلبات مارت") || s.includes("tmart");
    }

    function extractMartBranchLabel(vendorName) {
      const raw = normalizeText(vendorName);
      if (!raw) return "Unknown Mart";
      const cleaned = raw
        .replace(/^vo\s*#?\d+\s*-\s*/i, "")
        .replace(/^talabat\s*mart\s*,?\s*/i, "")
        .replace(/^طلبات\s*مارت\s*,?\s*/i, "")
        .replace(/^tmart\s*,?\s*/i, "")
        .trim();
      return cleaned || raw;
    }

    function isExactOrderIdPattern(q) {
      const clean = String(q || "")
        .trim()
        .replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "")
        .trim();
      return /^\d{7,14}(-\d+)?$/.test(clean);
    }

    function normalizePhoneDigits(rawStr) {
      const digits = String(rawStr || "").replace(/\D/g, "");
      if (!digits) return { rawDigits: "", core10: "" };
      let core = digits;
      if (core.startsWith("0020") && core.length >= 13) {
        core = core.slice(4);
      } else if (core.startsWith("20") && core.length === 12 && core[2] === "1") {
        core = core.slice(2);
      } else if (core.startsWith("0") && core.length === 11 && core[1] === "1") {
        core = core.slice(1);
      }
      const core10 = core.length === 10 && core.startsWith("1") ? core : "";
      return { rawDigits: digits, core10 };
    }

    function isPhoneLikeQuery(q) {
      const trimmed = String(q || "").trim();
      if (!trimmed) return false;
      const { rawDigits, core10 } = normalizePhoneDigits(trimmed);
      if (core10.length === 10) return true;
      return rawDigits.length >= 9 && /^(\+?20|0020|01)/.test(trimmed.replace(/[\s\-()]+/g, ""));
    }

    function isRiderIdLikeQuery(q) {
      const trimmed = String(q || "").trim();
      if (!trimmed || isPhoneLikeQuery(trimmed)) return false;
      // Hurrier Rider User IDs & Courier IDs are 3 to 9 digits, or 10 digits not starting with Order prefix 47
      if (/^\d{3,9}$/.test(trimmed)) return true;
      if (/^\d{10}$/.test(trimmed) && !trimmed.startsWith("47")) return true;
      return false;
    }

    function formatRelativeDeadline(isoDate, isPreorder = false) {
      if (!isoDate) return "-";
      const target = new Date(isoDate);
      if (Number.isNaN(target.getTime())) return "-";
      if (isPreorder) {
        return target.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      }
      const diffMins = Math.round((target.getTime() - Date.now()) / 60000);
      const absMins = Math.abs(diffMins);
      const sign = diffMins < 0 ? "-" : "";
      if (absMins >= 60) {
        const h = Math.floor(absMins / 60);
        const m = absMins % 60;
        return `${sign}${h}h ${m}min`;
      }
      return `${sign}${absMins}min`;
    }

    function formatDiffBetweenIsos(scheduledIso, estimatedIso) {
      if (!scheduledIso || !estimatedIso) return "";
      const s = new Date(scheduledIso).getTime();
      const e = new Date(estimatedIso).getTime();
      if (Number.isNaN(s) || Number.isNaN(e)) return "";
      const diffMins = Math.round((s - e) / 60000);
      return `${diffMins}min`;
    }

    function formatReadableTimestamp(isoDate) {
      if (!isoDate) return "-";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleString("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatShortTimeOnly(isoDate) {
      if (!isoDate) return "-";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatExactTimeSeconds(val) {
      if (!val) return "-";
      const d = typeof val === "number" ? new Date(val > 1e12 ? val : val * 1000) : new Date(val);
      if (Number.isNaN(d.getTime())) return String(val);
      return d.toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });
    }

    function formatShortEstTime(val) {
      if (!val) return "-";
      const d = typeof val === "number" ? new Date(val > 1e12 ? val : val * 1000) : new Date(val);
      if (Number.isNaN(d.getTime())) return String(val);
      return d.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatSinceTimestamp(isoDate) {
      if (!isoDate) return "";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "";
      const dayPart = d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
      const timePart = d
        .toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: true })
        .toLowerCase();
      return `Since ${dayPart} ${timePart}`;
    }

    function formatDurationSecondsToMin(secondsVal) {
      if (secondsVal === null || secondsVal === undefined || secondsVal === "") return "-";
      const s = Number(secondsVal);
      if (Number.isNaN(s)) return String(secondsVal);
      return `${Math.round(s / 60)}m`;
    }

    function formatCompletedTimingSeconds(secondsVal) {
      if (secondsVal === null || secondsVal === undefined || secondsVal === "") return "-";
      const totalSec = Math.round(Number(secondsVal));
      if (Number.isNaN(totalSec)) return String(secondsVal);
      const absSec = Math.abs(totalSec);
      const sign = totalSec < 0 ? "-" : "";
      if (absSec < 60) return `${sign}${absSec}s`;
      const mins = Math.floor(absSec / 60);
      const remSec = absSec % 60;
      if (mins >= 60) {
        const hrs = Math.floor(mins / 60);
        const remMin = mins % 60;
        return `${sign}${hrs}h ${remMin}m`;
      }
      return remSec > 0 ? `${sign}${mins}m ${remSec}s` : `${sign}${mins}m`;
    }

    function getTodayCairoDateInput() {
      try {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "Africa/Cairo",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(new Date());
      } catch {
        return new Date().toISOString().slice(0, 10);
      }
    }

    function humanizeSnakeCase(str) {
      return String(str || "")
        .split("_")
        .map((w) => (w ? w.charAt(0).toUpperCase() + w.slice(1) : ""))
        .join(" ")
        .trim();
    }

    function formatPiastersMoney(val, currency = "EGP") {
      if (val === null || val === undefined || val === "") return "-";
      if (typeof val === "string" && /[A-Z]{3}|\$/.test(val)) return val;
      const num = Number(val);
      if (Number.isNaN(num)) return String(val);
      return `${(num / 100).toFixed(2)} ${currency}`;
    }

    function extractCompletedTimestampFromRec(rec) {
      if (rec?.__completed_at_ms && Number(rec.__completed_at_ms) > 0) {
        return Number(rec.__completed_at_ms);
      }
      const order = rec?.order || {};
      const primaryDel = rec?.primary_delivery || {};
      const timings = rec?.primary_delivery_timings || {};

      const candidates = [
        primaryDel.completed_at,
        primaryDel.delivered_at,
        primaryDel.dropped_off_at,
        primaryDel.finished_at,
        timings.completed_at,
        timings.delivered_at,
        timings.dropped_off_at,
        order.completed_at,
        order.delivered_at,
        order.dropped_off_at,
        order.finished_at,
        rec?.completed_at,
        rec?.delivered_at,
        rec?.dropped_off_at
      ];

      for (const val of candidates) {
        if (val) {
          const ms = typeof val === "number" ? (val > 1e12 ? val : val * 1000) : new Date(val).getTime();
          if (!Number.isNaN(ms) && ms > 0) return ms;
        }
      }

      const placedMs = order.placed_at ? new Date(order.placed_at).getTime() : 0;
      const totalSec = Number(timings.total_time);
      if (placedMs > 0 && !Number.isNaN(totalSec) && totalSec > 0) {
        return placedMs + totalSec * 1000;
      }

      if (order.updated_at) {
        const updMs = new Date(order.updated_at).getTime();
        if (!Number.isNaN(updMs) && updMs > 0) return updMs;
      }
      return 0;
    }

    function mapHurrierCompletedRecord(rec) {
      const order = rec?.order || {};
      const primaryDel = rec?.primary_delivery || {};
      const timings = rec?.primary_delivery_timings || {};
      const dropAddr = order.drop_off_address || {};
      const pickAddr = order.pickup_address || {};

      const codeStr = String(
        order.confirmation_number ||
          String(order.order_code || "").replace(/^(HF_[A-Z]{2}|ODR_[A-Z]{2})/i, "") ||
          order.id ||
          ""
      ).trim();

      const rawSps = Array.isArray(dropAddr.starting_points) ? dropAddr.starting_points : [];
      const zoneObjects = [];
      const zonesList = [];
      rawSps.forEach((sp) => {
        if (sp && typeof sp === "object") {
          const nm = normalizeText(sp.name);
          const id = Number(sp.id);
          if (nm) zonesList.push(nm);
          if (nm || id) zoneObjects.push({ id, name: nm });
        } else if (sp) {
          const nm = normalizeText(sp);
          if (nm) zonesList.push(nm);
        }
      });

      const distMeters = Number(primaryDel.delivery_distance);
      const distanceKm =
        !Number.isNaN(distMeters) && distMeters > 0 ? `${(distMeters / 1000).toFixed(2)} km` : "-";

      const totalVal = typeof order.total === "number" ? `${(order.total / 100).toFixed(2)} EGP` : "-";
      const instructions = [];
      if (order.is_cash_collection) instructions.push("Cash");
      if (order.is_card_on_delivery) instructions.push("Card");
      const vType = order.vendor_vertical_type || order.featured_business?.vertical_type || "restaurants";
      instructions.push(humanizeSnakeCase(vType));

      const placedTimestamp = order.placed_at ? new Date(order.placed_at).getTime() : 0;
      const completedTimestamp = extractCompletedTimestampFromRec(rec);
      const completedAtFormatted =
        completedTimestamp > 0
          ? formatExactTimeSeconds(completedTimestamp)
          : "-";

      return {
        uid: `Completed-${order.id || codeStr}`,
        id: codeStr,
        orderCode: order.order_code || `HF_EG${codeStr}`,
        placedAtFormatted: formatExactTimeSeconds(order.placed_at),
        placedTimestamp: Number.isNaN(placedTimestamp) ? 0 : placedTimestamp,
        completedAtFormatted,
        completedTimestamp: Number.isNaN(completedTimestamp) ? 0 : completedTimestamp,
        vo: order.vendor_order_number || "-",
        city: normalizeText(dropAddr.city) || "Cairo",
        zone: zonesList.join(", ") || "-",
        zonesList,
        zoneObjects,
        courier: normalizeText(primaryDel.courier_name) || "-",
        courierId: primaryDel.courier_id || null,
        vendor: normalizeText(order.vendor_name || order.featured_business?.name) || "Unknown Vendor",
        distance: distanceKm,
        acceptTime: formatCompletedTimingSeconds(timings.accepting_time),
        retailerLate: formatCompletedTimingSeconds(timings.vendor_late),
        courierLate: formatCompletedTimingSeconds(timings.courier_late),
        waitTime: formatCompletedTimingSeconds(timings.wait_pickup_time),
        deliveryLate: formatCompletedTimingSeconds(timings.delivery_late),
        timeInBag: formatCompletedTimingSeconds(timings.time_in_bag),
        orderDuration: formatCompletedTimingSeconds(timings.total_time),
        isPreorder: Boolean(order.is_preorder),
        dropoffIssue: normalizeText(order.deliveries_dropoff_issues) || "-",
        status: humanizeSnakeCase(order.status || "completed"),
        deadline: humanizeSnakeCase(order.status || "Completed"),
        orderValue: totalVal,
        instructions,
        tab: "Completed",
        rawRecord: {
          id: order.id,
          status: order.status || "completed",
          distance: primaryDel.delivery_distance,
          courier_id: primaryDel.courier_id,
          courier_name: primaryDel.courier_name,
          starting_points: rawSps,
          order: {
            ...order,
            code: codeStr,
            order_value: order.total,
            dropoff_address: dropAddr,
            pickup_address: pickAddr
          }
        }
      };
    }

    function extractCourierProfileFromDoc(courierStub, doc) {

      // Authenticated Firebase Fetch Helper (attaches fresh Google ID Token automatically)
      const fbAuthFetch = useCallback(
        async (path, options = {}) => {
          const cleanPath = String(path || "").replace(/^\/+/, "");
          let idToken = "";
          if (firebaseUserRef.current && typeof firebaseUserRef.current.getIdToken === "function") {
            try {
              idToken = await firebaseUserRef.current.getIdToken();
            } catch {}
          }
          const authQuery = idToken ? `?auth=${encodeURIComponent(idToken)}` : "";
          return fetch(`${FIREBASE_DB_URL}/${cleanPath}.json${authQuery}`, options);
        },
        []
      );

      // Initialize Firebase Auth & Listen to Google Sign-In State
      useEffect(() => {
        if (!firebaseApiKey) {
          setAuthState("needs_api_key");
          return;
        }

        try {
          if (window.firebase && (!window.firebase.apps || window.firebase.apps.length === 0)) {
            window.firebase.initializeApp({
              apiKey: firebaseApiKey,
              authDomain: FIREBASE_AUTH_DOMAIN,
              databaseURL: FIREBASE_DB_URL,
              projectId: FIREBASE_PROJECT_ID
            });
          }
        } catch (err) {
          setAuthErrorMsg(err?.message || "Firebase init error");
          setAuthState("needs_api_key");
          return;
        }

        const auth = window.firebase.auth();
        const unsubscribe = auth.onAuthStateChanged(async (user) => {
          firebaseUserRef.current = user;
          if (!user) {
            setCurrentUser(null);
            setUserRole("employee");
            setAuthState("signed_out");
            try {
              window.localStorage.removeItem(AUTH_BRIDGE_STORAGE_KEY);
            } catch {}
            return;
          }

          setAuthState("checking");
          setAuthErrorMsg("");
          const emailLower = String(user.email || "").trim().toLowerCase();
          const emailKey = emailToFirebaseKey(emailLower);

          try {
            const idToken = await user.getIdToken();
            const res = await fetch(
              `${FIREBASE_DB_URL}/allowed_emails.json?auth=${encodeURIComponent(idToken)}`,
              { cache: "no-store" }
            );

            if (!res.ok) {
              throw new Error(`Firebase Auth HTTP ${res.status}`);
            }

            const allowedMap = await res.json();

            // Bootstrap: If allowed_emails is empty (first ever login), register this Google account as Owner Admin
            if (!allowedMap || typeof allowedMap !== "object" || Object.keys(allowedMap).length === 0) {
              const firstAdminRecord = {
                email: emailLower,
                role: "admin",
                label: user.displayName || "Primary Admin",
                added_by: "system_bootstrap",
                created_at: new Date().toISOString()
              };
              const initRes = await fetch(
                `${FIREBASE_DB_URL}/allowed_emails/${encodeURIComponent(emailKey)}.json?auth=${encodeURIComponent(idToken)}`,
                {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(firstAdminRecord)
                }
              );
              if (!initRes.ok) {
                throw new Error("تعذر تهيئة حساب الأدمن الأول");
              }
              setCurrentUser({
                email: emailLower,
                displayName: user.displayName || emailLower,
                photoURL: user.photoURL || ""
              });
              setUserRole("admin");
              if (!employeeName) setEmployeeName(user.displayName || emailLower.split("@")[0]);
              setAuthState("authorized");
              try {
                window.localStorage.setItem(
                  AUTH_BRIDGE_STORAGE_KEY,
                  JSON.stringify({
                    apiKey: firebaseApiKey,
                    email: emailLower,
                    role: "admin",
                    idToken,
                    refreshToken: user.refreshToken,
                    expiresAt: Date.now() + 55 * 60 * 1000
                  })
                );
              } catch {}
              return;
            }

            const entry = allowedMap[emailKey];
            if (!entry || typeof entry !== "object") {
              setCurrentUser({
                email: emailLower,
                displayName: user.displayName || emailLower,
                photoURL: user.photoURL || ""
              });
              setAuthState("unauthorized");
              try {
                window.localStorage.removeItem(AUTH_BRIDGE_STORAGE_KEY);
              } catch {}
              return;
            }

            const resolvedRole = entry.role === "admin" ? "admin" : "employee";
            setCurrentUser({
              email: emailLower,
              displayName: user.displayName || entry.label || emailLower,
              photoURL: user.photoURL || ""
            });
            setUserRole(resolvedRole);
            if (!employeeName) setEmployeeName(user.displayName || entry.label || emailLower.split("@")[0]);
            setAuthState("authorized");

            if (resolvedRole === "admin") {

                window.localStorage.setItem(

                    apiKey: firebaseApiKey,
                    email: emailLower,
                    role: resolvedRole,
                    idToken,
                    refreshToken: user.refreshToken,
                    expiresAt: Date.now() + 55 * 60 * 1000

            setAuthErrorMsg(err?.message || "حدث خطأ أثناء التحقق من الصلاحيات");
            setAuthState("signed_out");

        });

        return () => unsubscribe();

      const resolveCourierPhonesForItems = useCallback(
        async (itemsList) => {
          const assignedItems = (Array.isArray(itemsList) ? itemsList : []).filter(hasValidAssignedRider);
          if (assignedItems.length === 0) return new Map();

          const resolvedMap = new Map();
          const missingItems = [];

          const getKeysForItem = (it) =>
            Array.from(
              new Set(
                [
                  it.courierId ? sanitizeCourierKey(it.courierId) : "",
                  it.courier ? sanitizeCourierKey(normalizeText(it.courier).toLowerCase()) : ""
                ].filter(Boolean)
              )
            );

          for (const it of assignedItems) {
            const keys = getKeysForItem(it);
            const cachedPhone = keys.map((k) => courierPhoneCacheRef.current.get(k)).find(Boolean);
            if (cachedPhone) {
              resolvedMap.set(it.uid, cachedPhone);
            } else {
              missingItems.push(it);
            }
          }

          if (missingItems.length === 0) return resolvedMap;

          const stillMissing = [];
          await Promise.all(
            missingItems.map(async (it) => {
              const keys = getKeysForItem(it);
              for (const k of keys) {
                try {
                  const res = await fbAuthFetch(`courier_details/${k}`, { cache: "no-store" });
                  if (res.ok) {
                    const doc = await res.json();
                    const ph = normalizeText(doc?.courier?.phone_number || doc?.courier?.phone || doc?.courier?.mobile || "");
                    if (ph) {
                      keys.forEach((ck) => courierPhoneCacheRef.current.set(ck, ph));
                      resolvedMap.set(it.uid, ph);
                      if (it.courierId) {
                        const uId = String(doc?.user_id || doc?.courier?.user_id || doc?.userId || "");
                        setKnownCouriersMeta((prev) => ({
                          ...prev,
                          [String(it.courierId)]: {
                            ...(prev[String(it.courierId)] || {}),
                            userId: uId || prev[String(it.courierId)]?.userId || "",
                            phone: ph,
                            name: normalizeText(doc?.courierName || doc?.courier?.name || it.courier || "")
                          }
                        }));
                      }
                      return;
                    }
                  }
                } catch {}
              }
              stillMissing.push(it);
            })
          );

          if (stillMissing.length === 0) return resolvedMap;

          try {
            const tokens = Array.from(
              new Set(
                stillMissing.map((it) => `${it.courierId ? String(it.courierId).trim() : ""}|${normalizeText(it.courier)}`)
              )
            );
            const curRes = await fbAuthFetch("config/requested_courier_details", { cache: "no-store" });
            const curList = curRes.ok ? await curRes.json() : [];
            const nextList = Array.from(
              new Set([...tokens, ...(Array.isArray(curList) ? curList.map(String) : [])])
            ).slice(0, 30);
            await fbAuthFetch("config/requested_courier_details", {
              method: "PUT",
              body: JSON.stringify(nextList)
            });
          } catch {}

          for (let attempt = 0; attempt < 9; attempt++) {
            await new Promise((r) => setTimeout(r, 380));
            const remaining = stillMissing.filter((it) => !resolvedMap.has(it.uid));
            if (remaining.length === 0) break;

            await Promise.all(
              remaining.map(async (it) => {
                const keys = getKeysForItem(it);
                for (const k of keys) {
                  try {
                    const res = await fbAuthFetch(`courier_details/${k}`, { cache: "no-store" });
                    if (res.ok) {
                      const doc = await res.json();
                      const ph = normalizeText(doc?.courier?.phone_number || doc?.courier?.phone || doc?.courier?.mobile || "");
                      if (ph) {
                        keys.forEach((ck) => courierPhoneCacheRef.current.set(ck, ph));
                        resolvedMap.set(it.uid, ph);
                        return;
                      }
                    }
                  } catch {}
                }
              })
            );
          }

          return resolvedMap;
        },
        [fbAuthFetch]
      );

                    >

                        <div className="font-bold text-emerald-700 font-mono">{item.completedAtFormatted}</div>
                      </td>
                      <td className="py-3.5 px-4 align-top">
                        <div className="flex items-center gap-1.5">
                          <span className="text-indigo-600 hover:underline font-semibold">{item.id}</span>
                          <button
                            type="button"
                            onClick={(e) => {
                              e.stopPropagation();

                            }}
                            className="text-gray-400 hover:text-gray-700 text-xs px-1"

                        <div className="text-[11px] text-gray-500 mt-0.5">VO #{item.vo}</div>
                      </td>
                      <td className="py-3.5 px-3 align-top text-gray-800">{item.city}</td>
                      <td className="py-3.5 px-3 align-top max-w-[260px] truncate text-gray-700" title={item.zone}>
                        {item.zone}
                      </td>
                      <td className="py-3.5 px-3 align-top max-w-[210px] truncate">
                        {item.courier && item.courier !== "-" ? (
                          <button
                            type="button"
                            onMouseEnter={() => handleCourierHover(item.courierId, item.courier)}
                            onClick={(e) => openCourierModal(e, item.courierId, item.courier)}
                            className="text-blue-600 hover:underline font-medium truncate max-w-full text-left"
                            title="اضغط لعرض User ID ورقم موبايل الرايدر"

                        ) : (

                      <td className="py-3.5 px-3 align-top max-w-[220px] truncate text-gray-800 font-medium" title={item.vendor}>
                        {item.vendor}

                      <td className="py-3.5 px-3 align-top font-mono text-gray-700">{item.distance}</td>
                      <td className="py-3.5 px-3 align-top font-mono text-gray-700">{item.acceptTime}</td>
                      <td className="py-3.5 px-3 align-top font-mono text-gray-700">{item.retailerLate}</td>
                      <td className="py-3.5 px-3 align-top font-mono text-gray-700">{item.courierLate}</td>
                      <td className="py-3.5 px-3 align-top font-mono text-gray-700">{item.waitTime}</td>
                      <td className="py-3.5 px-3 align-top font-mono text-gray-700">{item.deliveryLate}</td>
                      <td className="py-3.5 px-3 align-top font-mono text-gray-700">{item.timeInBag}</td>
                      <td className="py-3.5 px-3 align-top font-mono font-semibold text-gray-800">{item.orderDuration}</td>
                      <td className="py-3.5 px-3 align-top text-gray-700">{item.isPreorder ? "Yes" : "No"}</td>
                      <td className="py-3.5 px-4 align-top text-gray-600">{item.dropoffIssue}</td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>

          <div className="pt-2 pb-6 flex flex-wrap items-center justify-between gap-3">
            <div className="text-xs text-gray-500">
              Showing <strong>{(completedPage - 1) * 50 + (paginatedCompletedOrders.length > 0 ? 1 : 0)}</strong>–
              <strong>{(completedPage - 1) * 50 + paginatedCompletedOrders.length}</strong> of{" "}
              <strong>{visibleCompletedOrders.length}</strong>
            </div>

            <div className="flex items-center gap-1 select-none">
              <button
                type="button"
                disabled={completedPage <= 1}
                onClick={() => {
                  setCompletedPage((p) => Math.max(1, p - 1));
                  if (mainContainerRef.current) mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
                }}
                className={`w-9 h-9 flex items-center justify-center rounded text-base font-bold transition-colors ${
                  completedPage <= 1 ? "text-gray-300 cursor-not-allowed" : "text-gray-600 hover:bg-gray-100"
                }`}
              >
                ‹
              </button>

              {completedVisiblePages.map((p, idx) =>
                p === "..." ? (
                  <span key={`comp-dots-${idx}`} className="px-2 text-gray-400 text-sm">
                    ...
                  </span>
                ) : (
                  <button
                    key={p}
                    type="button"
                    onClick={() => {
                      setCompletedPage(Number(p));
                      if (mainContainerRef.current) mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
                    }}
                    className={`min-w-[36px] h-9 px-2.5 flex items-center justify-center text-sm transition-colors ${
                      Number(completedPage) === Number(p)
                        ? "border-b-2 border-blue-600 text-blue-600 font-bold"
                        : "text-gray-700 hover:bg-gray-100 rounded font-medium"
                    }`}
                  >
                    {p}
                  </button>
                )
              )}

              <button
                type="button"
                disabled={completedPage >= completedTotalPages}
                onClick={() => {
                  setCompletedPage((p) => Math.min(completedTotalPages, p + 1));
                  if (mainContainerRef.current) mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
                }}
                className={`w-9 h-9 flex items-center justify-center rounded text-base font-bold transition-colors ${
                  completedPage >= completedTotalPages
                    ? "text-gray-300 cursor-not-allowed"
                    : "text-gray-600 hover:bg-gray-100"
                }`}
              >
                ›
              </button>
            </div>

            <form
              onSubmit={(e) => {
                e.preventDefault();
                const num = Number(completedJumpPage);
                if (num >= 1) {
                  setCompletedPage(num);
                  setCompletedJumpPage("");
                  if (mainContainerRef.current) mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
                }
              }}
              className="flex items-center gap-1.5 text-xs"
            >
              <span className="text-gray-500">Go to:</span>
              <input
                type="number"
                min={1}
                value={completedJumpPage}
                onChange={(e) => setCompletedJumpPage(e.target.value)}
                placeholder="Page"
                className="w-16 px-2 py-1 border border-gray-300 rounded text-xs focus:outline-none focus:border-blue-500"
              />
              <button
                type="submit"
                className="px-2.5 py-1 rounded border border-gray-300 bg-white hover:bg-gray-50 font-semibold text-gray-700"
              >
                Go
              </button>
            </form>
          </div>
        </div>
      );

      const totalItemsForPagination = filteredDeliveries.length;
      const totalPages = Math.max(1, Math.ceil(totalItemsForPagination / PAGE_SIZE));

      const paginatedDeliveries = useMemo(() => {
        const safePage = Math.min(currentPage, totalPages);
        const startIdx = (safePage - 1) * PAGE_SIZE;
        return filteredDeliveries.slice(startIdx, startIdx + PAGE_SIZE);
      }, [currentPage, totalPages, filteredDeliveries]);

      const handlePageChange = useCallback(
        (nextPage) => {
          const clamped = Math.max(1, Math.min(totalPages, Number(nextPage) || 1));
          setCurrentPage(clamped);
          if (mainContainerRef.current) {
            mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
          }
        },
        [totalPages]
      );

      const visiblePageNumbers = useMemo(() => {
        if (totalPages <= 7) {
          return Array.from({ length: totalPages }, (_, i) => i + 1);
        }
        if (currentPage <= 4) {
          return [1, 2, 3, 4, 5, "...", totalPages];
        }
        if (currentPage >= totalPages - 3) {
          return [1, "...", totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
        }
        return [1, "...", currentPage - 1, currentPage, currentPage + 1, "...", totalPages];
      }, [currentPage, totalPages]);

      const renderDeliveriesTable = () => {
        const lateCount = baseTabDeliveries.filter((d) => d.deadline.includes("-") || d.deadline === "Late").length;
        const cashCount = baseTabDeliveries.filter((d) => d.instructions.includes("Cash")).length;
        const cardCount = baseTabDeliveries.filter((d) => d.instructions.includes("Card")).length;
        const darkstoreCount = baseTabDeliveries.filter(
          (d) => isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores")
        ).length;
        const restaurantCount = baseTabDeliveries.filter((d) => {
          const isDs = isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores");
          return !isDs && (d.instructions.includes("Restaurants") || d.instructions.includes("Supermarket"));
        }).length;
        const splitCount = baseTabDeliveries.filter((d) => d.isSplit).length;
        const tabExactTotal = effectiveTabCounts[activeTab] ?? baseTabDeliveries.length;

        const delayedWithRiderList = filteredDeliveries.filter(
          (d) => (d.deadline.includes("-") || d.deadline === "Late") && hasValidAssignedRider(d)
        );
        const selectedWithRiderList = filteredDeliveries.filter(
          (d) => selectedOrderUids.has(d.uid) && hasValidAssignedRider(d)
        );
        const pageSelectableItems = paginatedDeliveries.filter(hasValidAssignedRider);
        const allPageSelected =
          pageSelectableItems.length > 0 && pageSelectableItems.every((d) => selectedOrderUids.has(d.uid));

        const quickFilters = [
          { id: "All", label: `All (${tabExactTotal})` },
          { id: "Delayed", label: `Delayed (${lateCount})` },
          { id: "Cash", label: `Cash (${cashCount})` },
          { id: "Card", label: `Card (${cardCount})` },
          { id: "Restaurants", label: `Restaurants (${restaurantCount})` },
          { id: "Darkstores", label: `Darkstores - Talabat Mart (${darkstoreCount})` },
          { id: "Split", label: `Split Orders (${splitCount})` }
        ];

        return (
          <div className="mt-4 space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-gray-100">
              <div className="flex flex-wrap items-center gap-1.5">
                {quickFilters.map((qf) => {
                  const active = activeQuickFilter === qf.id;
                  return (
                    <button
                      key={qf.id}
                      type="button"
                      onClick={() => {
                        setActiveQuickFilter(qf.id);
                        setCurrentPage(1);
                        if (qf.id !== "Darkstores") setSelectedMartBranch("ALL");
                      }}
                      className={`px-3 py-1 rounded-full text-xs font-semibold border transition-colors ${
                        active
                          ? "bg-blue-600 text-white border-blue-600"
                          : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"
                      }`}
                    >
                      {qf.label}
                    </button>
                  );
                })}
              </div>

              <div className="flex flex-wrap items-center gap-2 text-xs text-gray-500">
                {selectedWithRiderList.length > 0 && (
                  <div className="inline-flex items-center gap-1">
                    <button
                      type="button"
                      disabled={copyingFollowupState === "loading:selected"}
                      onClick={() => handleCopyBulkFollowup("selected", selectedWithRiderList)}
                      className="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-sm transition-colors flex items-center gap-1.5"
                      title="نسخ كليشة متابعة الرايدر للأوردرات المحددة فقط"
                    >
                      {copyingFollowupState === "loading:selected"
                        ? "⏳ جاري سحب أرقام الموبايل..."
                        : copyingFollowupState?.startsWith("done:selected:")
                        ? `✓ تم نسخ (${selectedWithRiderList.length}) أوردر`
                        : `📋 نسخ المحدد (${selectedWithRiderList.length})`}
                    </button>
                    <button
                      type="button"
                      onClick={() => setSelectedOrderUids(new Set())}
                      className="px-2 py-1 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 text-gray-600 font-semibold"
                      title="إلغاء تحديد الأوردرات"
                    >
                      ✕
                    </button>
                  </div>
                )}

                {delayedWithRiderList.length > 0 && (
                  <button
                    type="button"
                    disabled={copyingFollowupState === "loading:delayed"}
                    onClick={() => handleCopyBulkFollowup("delayed", delayedWithRiderList)}
                    className="px-3 py-1 rounded-lg bg-red-600 hover:bg-red-700 text-white font-bold shadow-sm transition-colors flex items-center gap-1.5"
                    title="نسخ كليشة متابعة الرايدر لكل الأوردرات المتأخرة المعروضة (يستبعد الأوردرات بدون رايدر تلقائياً)"
                  >
                    {copyingFollowupState === "loading:delayed"
                      ? "⏳ جاري سحب الأرقام..."
                      : copyingFollowupState?.startsWith("done:delayed:")
                      ? `✓ تم نسخ المتأخرات (${delayedWithRiderList.length})`
                      : `📋 نسخ كل المتأخرات (${delayedWithRiderList.length})`}
                  </button>
                )}

                <button
                  type="button"
                  onClick={() =>
                    setOrderSortMode((prev) => (prev === "hurrier_order" ? "live_first" : "hurrier_order"))
                  }
                  className="px-2.5 py-1 rounded border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 font-semibold"
                  title="تبديل الترتيب بين ترتيب صفحات Hurrier الأصلية أو إظهار أوردرات النهاردة أولاً"
                >
                  {orderSortMode === "hurrier_order" ? "Order: Hurrier Default" : "Order: Live Today First"}
                </button>
                <button
                  type="button"
                  onClick={() => setMobileViewMode((prev) => (prev === "cards" ? "table" : "cards"))}
                  className="md:hidden px-2.5 py-1 rounded border border-gray-300 bg-white text-gray-700 font-bold"
                >
                  {mobileViewMode === "cards" ? "📊 جدول" : "📱 بطاقات"}
                </button>
                <div>
                  Page <strong className="text-gray-800">{currentPage}</strong> of{" "}
                  <strong className="text-gray-800">{totalPages}</strong>{" "}
                  <span className="text-gray-400">
                    ({paginatedDeliveries.length} rows • Total {totalItemsForPagination})
                  </span>
                </div>
              </div>
            </div>

            {activeQuickFilter === "Darkstores" && (
              <div className="flex flex-wrap items-center gap-2 p-2.5 rounded-lg bg-amber-50/70 border border-amber-200 text-xs">
                <span className="font-bold text-amber-900 px-2 py-1 rounded bg-amber-100 border border-amber-300">
                  🏪 فروع مارت في الزون ({martBranchesSummary.branches.length})
                </span>
                <button
                  type="button"
                  onClick={() => setSelectedMartBranch("ALL")}
                  className={`px-3 py-1 rounded-full font-semibold border transition-colors ${
                    selectedMartBranch === "ALL"
                      ? "bg-gray-900 text-white border-gray-900"
                      : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"
                  }`}
                >
                  All Marts ({martBranchesSummary.totalMartCount})
                </button>
                {martBranchesSummary.branches.map((br) => {
                  const isSelected = normalizeText(selectedMartBranch) === normalizeText(br.label);
                  return (
                    <button
                      key={br.label}
                      type="button"
                      onClick={() => setSelectedMartBranch(br.label)}
                      className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full font-semibold border transition-colors ${
                        isSelected
                          ? "bg-amber-600 text-white border-amber-600"
                          : "bg-white text-gray-800 border-amber-300 hover:bg-amber-100/60"
                      }`}
                    >
                      <span>🏪 {br.label}</span>
                      <span
                        className={`px-1.5 py-0.2 rounded text-[11px] font-bold ${
                          isSelected ? "bg-white/20 text-white" : "bg-gray-100 text-gray-800"
                        }`}
                      >
                        {br.count}
                      </span>
                      {br.late > 0 && (
                        <span className="px-1.5 py-0.2 rounded text-[10px] font-bold bg-red-600 text-white">
                          {br.late} late
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            )}

            {/* Mobile Smart Order Cards (< 768px) */}
            <div className={`${mobileViewMode === "cards" ? "block md:hidden" : "hidden"} space-y-2.5`}>
              {paginatedDeliveries.length === 0 ? (
                <div className="p-8 text-center bg-white border border-gray-200 rounded-xl text-gray-500 text-xs space-y-2.5">
                  {connectionStatus === "connecting" || connectionStatus === "waiting" ? (
                    <span className="text-blue-600 font-semibold">
                      جاري سحب أوردرات الزونات المختارة من Hurrier...
                    </span>
                  ) : (
                    <>
                      <div>
                        لا توجد أوردرات في قسم <span className="font-semibold">{activeTab}</span> للزونات المختارة حالياً.
                      </div>
                      {searchQuery.trim() && (
                        <button
                          type="button"
                          onClick={() => handleJumpToCompletedOrderSearch(searchQuery)}
                          className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-indigo-600 text-white text-xs font-bold shadow-sm"
                        >
                          ⚡ بحث سريع عن "{searchQuery.trim()}" في Completed Orders
                        </button>
                      )}
                    </>
                  )}
                </div>
              ) : (
                paginatedDeliveries.map((item) => {
                  const isNegative = item.deadline.includes("-") || item.deadline === "Late";
                  const posMinsMatch = !isNegative ? /^(\d+)min$/.exec(item.deadline) : null;
                  const posMins = posMinsMatch ? Number(posMinsMatch[1]) : 0;
                  const deadlineColor = isNegative
                    ? "bg-[#e53935] text-white"
                    : posMins > 5 && posMins <= 20
                    ? "bg-[#f59e0b] text-white"
                    : "bg-gray-100 text-gray-800";

                  const prioritizedZones = [...(item.zonesList || [])].sort((a, b) => {
                    const aMatch = selectedZoneNames.some((s) => normalizeText(a).toLowerCase().includes(s));
                    const bMatch = selectedZoneNames.some((s) => normalizeText(b).toLowerCase().includes(s));
                    if (aMatch === bMatch) return 0;
                    return aMatch ? -1 : 1;
                  });
                  const shownZones = prioritizedZones.slice(0, 2);
                  const extraZonesCount = Math.max(0, prioritizedZones.length - shownZones.length);
                  const canCopyFollowup = hasValidAssignedRider(item);
                  const isRowSelected = selectedOrderUids.has(item.uid);

                  return (
                    <div
                      key={`m-card-${item.uid}`}
                      onClick={() => setSelectedOrder(item)}
                      className={`p-3.5 rounded-xl border transition-all shadow-sm space-y-2.5 text-xs ${
                        isRowSelected
                          ? "bg-blue-50/80 border-blue-400"
                          : "bg-white border-gray-200 active:bg-gray-50"
                      }`}
                    >
                      {/* Row 1: Checkbox + Order ID + Copy Buttons | Deadline + Status */}
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-2 min-w-0">
                          {canCopyFollowup && (
                            <input
                              type="checkbox"
                              checked={isRowSelected}
                              onClick={(e) => e.stopPropagation()}
                              onChange={(e) => toggleOrderSelection(e, item)}
                              className="w-4 h-4 rounded text-blue-600 flex-shrink-0"
                            />
                          )}
                          <span className="text-blue-600 font-bold text-[15px] tracking-tight">
                            {item.id}
                          </span>
                          <button
                            type="button"
                            onClick={(e) => {
                              e.stopPropagation();

                      <div className="pt-2 border-t border-gray-100 flex flex-wrap items-center justify-between gap-2">
                        <div className="min-w-0 flex-1">

                        <div className="flex items-center gap-1 flex-wrap flex-shrink-0">

            </div>

            {/* Sticky Bottom Bulk-Copy Bar on Mobile (< 768px) */}
            {selectedWithRiderList.length > 0 && (
              <div className="fixed bottom-0 inset-x-0 z-40 md:hidden bg-slate-900/95 backdrop-blur border-t border-slate-700 px-4 py-3 flex items-center justify-between gap-2 shadow-2xl">
                <button
                  type="button"
                  disabled={copyingFollowupState === "loading:selected"}
                  onClick={() => handleCopyBulkFollowup("selected", selectedWithRiderList)}
                  className="flex-1 py-2.5 px-4 rounded-xl bg-emerald-600 active:bg-emerald-700 text-white font-bold text-xs shadow-sm flex items-center justify-center gap-2"
                >
                  {copyingFollowupState === "loading:selected"
                    ? "⏳ جاري سحب أرقام الموبايل..."

                <button
                  type="button"

                  ✕ إلغاء
                </button>
              </div>
            )}

            <div className={`${mobileViewMode === "cards" ? "hidden md:block" : "block"} w-full overflow-x-auto bg-white border border-gray-200 rounded-lg shadow-sm`}>
              <table className="w-full text-left text-sm whitespace-nowrap">
                <thead>
                  <tr className="border-b border-gray-200 text-gray-500 font-semibold tracking-wide text-xs bg-gray-50/70">
                    <th className="py-3 pl-3 pr-1 w-8 text-center">
                      <input
                        type="checkbox"
                        checked={allPageSelected}
                        disabled={pageSelectableItems.length === 0}
                        onChange={() => {
                          setSelectedOrderUids((prev) => {
                            const next = new Set(prev);
                            if (allPageSelected) {
                              pageSelectableItems.forEach((d) => next.delete(d.uid));
                            } else {
                              pageSelectableItems.forEach((d) => next.add(d.uid));
                            }
                            return next;
                          });

                        className="w-4 h-4 rounded text-blue-600 cursor-pointer"

                    <th className="py-3 px-3">STATUS</th>
                    <th className="py-3 px-3">ZONE / DISTANCE</th>
                    <th className="py-3 px-4">DELIVERY INSTRUCTION</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {paginatedDeliveries.length === 0 ? (
                    <tr>
                      <td colSpan={7} className="py-12 text-center text-gray-500">

                          <span className="text-blue-600 font-semibold">

                              <button
                                type="button"
                                onClick={() => handleJumpToCompletedOrderSearch(searchQuery)}

                            )}

                    </tr>
                  ) : (
                    paginatedDeliveries.map((item) => {
                      const isNegative = item.deadline.includes("-") || item.deadline === "Late";
                      const posMinsMatch = !isNegative ? /^(\d+)min$/.exec(item.deadline) : null;
                      const posMins = posMinsMatch ? Number(posMinsMatch[1]) : 0;
                      const deadlineColor = isNegative
                        ? "bg-[#e53935] text-white"
                        : posMins > 5 && posMins <= 20
                        ? "bg-[#f59e0b] text-white"
                        : "bg-gray-100 text-gray-800";

                      const prioritizedZones = [...(item.zonesList || [])].sort((a, b) => {

                        const bMatch = selectedZoneNames.some((s) => normalizeText(b).toLowerCase().includes(s));
                        if (aMatch === bMatch) return 0;
                        return aMatch ? -1 : 1;

                      const shownZones = prioritizedZones.slice(0, 2);
                      const extraZonesCount = Math.max(0, prioritizedZones.length - shownZones.length);

                      const isRowSelected = selectedOrderUids.has(item.uid);

                                </span>
                                <button
                                  type="button"
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    copyToClipboard(item.id, item.id);
                                  }}
                                  className="text-gray-400 hover:text-gray-700 px-1 py-0.5 rounded text-xs"
                                  title="نسخ رقم الأوردر فقط"
                                >
                                  {copiedText === item.id ? "✓" : "⧉"}
                                </button>
                                {canCopyFollowup && (
                                  <button
                                    type="button"
                                    onClick={(e) => handleCopySingleFollowup(e, item)}
                                    className={`px-1.5 py-0.5 rounded text-xs font-semibold border transition-colors ${
                                      copiedText === `followup:${item.uid}`
                                        ? "bg-emerald-50 text-emerald-700 border-emerald-300"
                                        : "bg-gray-50 hover:bg-blue-50 text-gray-600 hover:text-blue-700 border-gray-200"
                                    }`}
                                    title="نسخ كليشة متابعة الرايدر (Order ID + Vendor + Rider + Mob + Delay + Status)"
                                  >
                                    {copyingFollowupState === `single:${item.uid}`
                                      ? "⏳"
                                      : copiedText === `followup:${item.uid}`
                                      ? "✓ Copied"
                                      : "📋"}
                                  </button>
                                )}
                              </div>
                              <span
                                className="text-xs text-gray-500 truncate max-w-[260px]"
                                title={`VO #${item.vo} - ${item.vendor}`}
                              >
                                VO #{item.vo} - {item.vendor}
                              </span>
                            </div>
                          </td>

                          <td className="py-3.5 px-3 align-top">
                            <span className={`inline-flex px-2.5 py-1 rounded-md text-xs font-bold ${deadlineColor}`}>
                              {item.deadline}
                            </span>
                          </td>

                          <td className="py-3.5 px-3 align-top text-[14px] max-w-[240px] whitespace-normal">
                            {item.courier === "-" ||
                            item.courier === "Assigning..." ||
                            item.courier === "Pending Acceptance" ? (
                              <span className="text-gray-500">{item.courier}</span>
                            ) : (
                              <button
                                type="button"
                                onMouseEnter={() => handleCourierHover(item.courierId, item.courier)}
                                onClick={(e) => openCourierModal(e, item.courierId, item.courier)}
                                className="text-left text-blue-600 hover:text-blue-800 hover:underline font-medium leading-snug block"
                                title="اضغط لعرض User ID ورقم موبايل الرايدر"
                              >
                                {item.courier}
                              </button>
                            )}
                          </td>

                          <td className="py-3.5 px-3 align-top">
                            <div className="font-semibold text-gray-900 text-[14px]">{item.status}</div>
                            {item.time_in !== "-" && (
                              <div className="text-xs text-gray-500 mt-0.5">In: {item.time_in}</div>
                            )}

                          </td>

                          <td className="py-3.5 px-3 align-top max-w-[230px]" title={item.zone}>
                            <div className="flex items-center gap-1.5">
                              <span className="truncate text-xs font-semibold text-blue-700">
                                {shownZones.join(", ") || item.zone}
                              </span>
                              {extraZonesCount > 0 && (
                                <span className="px-1.5 py-0.5 rounded bg-gray-100 border border-gray-200 text-[11px] font-semibold text-gray-600 flex-shrink-0">
                                  +{extraZonesCount}
                                </span>
                              )}
                            </div>
                            <div className="text-xs text-gray-400 mt-0.5">
                              {item.distance} • {item.orderValue}
                            </div>
                          </td>

                          <td className="py-3.5 px-4 align-top">
                            <div className="flex gap-1.5 flex-wrap">
                              {item.instructions.map((inst, idx) => (
                                <span
                                  key={idx}
                                  className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium border ${
                                    inst === "Cash"
                                      ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                                      : inst === "Card"
                                      ? "bg-indigo-50 text-indigo-700 border-indigo-200"
                                      : "bg-white text-gray-700 border-gray-300"
                                  }`}
                                >
                                  {inst}
                                </span>
                              ))}
                              {item.isSplit && (
                                <span className="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-purple-50 text-purple-700 border border-purple-200">
                                  Split
                                </span>
                              )}
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>

            {totalPages > 1 && (
              <div className="pt-3 pb-6 flex flex-wrap items-center justify-between gap-3">
                <div className="text-xs text-gray-500">
                  Showing <strong>{(currentPage - 1) * PAGE_SIZE + (paginatedDeliveries.length > 0 ? 1 : 0)}</strong>–
                  <strong>{(currentPage - 1) * PAGE_SIZE + paginatedDeliveries.length}</strong> of{" "}
                  <strong>{totalItemsForPagination}</strong>
                </div>

                <div className="flex items-center gap-1 select-none">
                  <button
                    type="button"
                    disabled={currentPage <= 1}
                    onClick={() => handlePageChange(currentPage - 1)}
                    className={`w-9 h-9 flex items-center justify-center rounded text-base font-bold transition-colors ${
                      currentPage <= 1 ? "text-gray-300 cursor-not-allowed" : "text-gray-600 hover:bg-gray-100"
                    }`}
                  >
                    ‹
                  </button>

                  {visiblePageNumbers.map((p, idx) =>
                    p === "..." ? (
                      <span key={`dots-${idx}`} className="px-2 text-gray-400 text-sm">
                        ...

                      <button
                        key={p}
                        type="button"
                        onClick={() => handlePageChange(p)}
                        className={`min-w-[36px] h-9 px-2.5 flex items-center justify-center text-sm transition-colors ${
                          Number(currentPage) === Number(p)
                            ? "border-b-2 border-blue-600 text-blue-600 font-bold"
                            : "text-gray-700 hover:bg-gray-100 rounded font-medium"
                        }`}
                      >
                        {p}
                      </button>
                    )

                  <button
                    type="button"
                    disabled={currentPage >= totalPages}
                    onClick={() => handlePageChange(currentPage + 1)}
                    className={`w-9 h-9 flex items-center justify-center rounded text-base font-bold transition-colors ${
                      currentPage >= totalPages ? "text-gray-300 cursor-not-allowed" : "text-gray-600 hover:bg-gray-100"
                    }`}
                  >
                    ›
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const num = Number(jumpPageInput);
                    if (num >= 1 && num <= totalPages) {
                      handlePageChange(num);
                      setJumpPageInput("");

                  }}
                  className="flex items-center gap-1.5 text-xs"
                >
                  <span className="text-gray-500">Go to:</span>
                  <input
                    type="number"
                    min={1}
                    max={totalPages}
                    value={jumpPageInput}
                    onChange={(e) => setJumpPageInput(e.target.value)}
                    placeholder={`1-${totalPages}`}
                    className="w-16 px-2 py-1 border border-gray-300 rounded text-xs focus:outline-none focus:border-blue-500"
                  />
                  <button
                    type="submit"
                    className="px-2.5 py-1 rounded border border-gray-300 bg-white hover:bg-gray-50 font-semibold text-gray-700"
                  >
                    Go
                  </button>
                </form>
              </div>
            )}
          </div>
        );
      };

      const activeHeaderCount = effectiveTabCounts[activeTab];

      const combinedRiderSearchResults = useMemo(() => {
        if (!riderSearchReq || !riderSearchReq.query) return [];
        const rawQ = String(riderSearchReq.query).trim();
        const qLower = rawQ.toLowerCase();
        const qPhone = normalizePhoneDigits(rawQ);

        const mergedMap = new Map();
        const addRider = (rObj) => {
          if (!rObj) return;
          const key = String(rObj.courierId || rObj.userId || rObj.name || "").toLowerCase();
          if (!key) return;
          if (!mergedMap.has(key)) {
            mergedMap.set(key, rObj);
          }
        };

        (Array.isArray(riderSearchResults) ? riderSearchResults : []).forEach(addRider);

        Object.entries(knownCouriersMeta || {}).forEach(([cid, meta]) => {
          if (!meta) return;
          const mPhone = normalizePhoneDigits(meta.phone || "");
          const phoneMatch =
            (qPhone.core10 && mPhone.core10 === qPhone.core10) ||
            (qPhone.rawDigits.length >= 7 && mPhone.rawDigits.includes(qPhone.rawDigits));
          const idMatch =
            String(cid) === rawQ || (meta.userId && String(meta.userId) === rawQ);
          const nameMatch = meta.name && meta.name.toLowerCase().includes(qLower);

          if (phoneMatch || idMatch || nameMatch) {
            addRider({
              courierId: String(cid),
              userId: String(meta.userId || cid),
              name: meta.name || `Courier #${cid}`,
              phone: meta.phone || "",
              status: "Working"
            });
          }
        });

        return Array.from(mergedMap.values());
      }, [riderSearchReq, riderSearchResults, knownCouriersMeta]);

      // --- 0) GOOGLE SIGN-IN & GMAIL WHITELIST GATE ---
      if (authState !== "authorized") {
        return (
          <div className="min-h-screen w-full bg-slate-50 flex flex-col items-center justify-center p-4 text-gray-800">
            <div className="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
              <div className="px-6 py-5 bg-gradient-to-r from-slate-900 to-slate-800 text-white flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">🚴‍♂️</span>
                  <div>
                    <h1 className="text-lg font-bold tracking-tight">Hurrier Live Operations</h1>
                    <p className="text-xs text-slate-300">v7.9 • Secured Google Access</p>
                  </div>
                </div>
                <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-200 border border-emerald-400/30">
                  Protected
                </span>
              </div>

              <div className="p-6 space-y-5">
                {authState === "needs_api_key" && (
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      const clean = apiKeyDraft.trim();
                      if (!clean) return;
                      try {
                        window.localStorage.setItem("hurrier_firebase_web_api_key", clean);
                      } catch {}
                      setFirebaseApiKey(clean);
                    }}
                    className="space-y-3"
                  >
                    <div className="p-3 rounded-lg bg-amber-50 border border-amber-200 text-xs text-amber-900 leading-relaxed">
                      <strong>إعداد لمرة واحدة:</strong> أدخل <strong>Firebase Web API Key</strong> الخاص بمشروع{" "}
                      <code className="bg-white px-1 rounded">hurrier-live</code>.
                    </div>
                    <input
                      type="text"
                      value={apiKeyDraft}
                      onChange={(e) => setApiKeyDraft(e.target.value)}
                      placeholder="AIzaSy..."
                      className="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm font-mono focus:outline-none focus:border-blue-500"
                    />
                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm"
                    >
                      حفظ وتفعيل تسجيل الدخول ←
                    </button>
                  </form>
                )}

                {authState === "checking" && (
                  <div className="py-8 text-center space-y-2">
                    <div className="text-blue-600 font-bold text-sm animate-pulse">
                      ⏳ جاري التحقق من صلاحية الحساب...
                    </div>
                  </div>
                )}

                {authState === "signed_out" && (
                  <div className="space-y-4 text-center">
                    <div className="space-y-1">
                      <h2 className="text-base font-bold text-gray-900">تسجيل الدخول للمتابعة</h2>
                      <p className="text-xs text-gray-500">
                        الدخول مقتصر على حسابات Gmail المصرح لها فقط
                      </p>
                    </div>

                    <button
                      type="button"
                      disabled={isSigningIn}
                      onClick={handleGoogleSignIn}
                      className={`w-full py-3 px-4 rounded-xl border border-gray-300 font-bold text-sm shadow-sm flex items-center justify-center gap-3 transition-all ${
                        isSigningIn
                          ? "bg-gray-100 text-gray-500 cursor-wait"
                          : "bg-white hover:bg-gray-50 text-gray-800"
                      }`}
                    >
                      <svg className="w-5 h-5" viewBox="0 0 24 24">
                        <path
                          fill="#EA4335"
                          d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"
                        />
                        <path
                          fill="#4285F4"
                          d="M23.5 12.3c0-.8-.1-1.7-.2-2.5H12v4.8h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"
                        />

                      </button>
                    </div>

                    <div className="flex items-center gap-2 text-sm text-gray-600 font-medium">
                      <span>
                        User ID{" "}
                        <strong className="font-mono text-gray-900">
                          {selectedCourierFullView.userId ? `#${selectedCourierFullView.userId}` : "جاري الجلب..."}
                        </strong>
                      </span>
                      {selectedCourierFullView.userId && (
                        <button
                          type="button"
                          onClick={() => copyToClipboard("riderId", selectedCourierFullView.userId)}
                          className="text-blue-600 hover:text-blue-800 px-1.5 py-0.5 rounded border border-blue-200 text-xs"
                          title="نسخ User ID"
                        >
                          {copiedText === "riderId" ? "✓ Copied" : "⧉"}
                        </button>
                      )}
                      {selectedCourierFullView.courierId &&
                        selectedCourierFullView.courierId !== selectedCourierFullView.userId && (
                          <span className="text-xs text-gray-500 font-mono">
                            (Courier ID: #{selectedCourierFullView.courierId})
                          </span>
                        )}
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={() => setSelectedCourier(null)}
                    className="p-1.5 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-4 sm:p-6 space-y-4 text-sm">
                  {selectedCourierFullView.phone && (
                    <div className="grid grid-cols-2 gap-2.5">
                      <a
                        href={`tel:${selectedCourierFullView.phone}`}
                        className="py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm"
                      >
                        📞 اتصال مباشر
                      </a>
                      <button
                        type="button"
                        onClick={() => copyToClipboard("riderPhoneTop", selectedCourierFullView.phone)}
                        className="py-2.5 px-3 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 font-bold text-xs flex items-center justify-center gap-1.5"
                      >
                        {copiedText === "riderPhoneTop" ? "✓ تم النسخ" : `⧉ نسخ ${selectedCourierFullView.phone}`}
                      </button>
                    </div>
                  )}

                  <div className="p-4 rounded-lg bg-gray-100/90 border border-gray-200 space-y-1">
                    <div className="text-xs text-gray-500 font-medium">Status</div>
                    <div className="text-base font-bold text-gray-900">{selectedCourierFullView.statusLabel}</div>
                    {selectedCourierFullView.statusUntil && (
                      <div className="text-xs text-gray-500">Until {selectedCourierFullView.statusUntil}</div>
                    )}
                    {selectedCourierFullView.performedBy && (
                      <div className="text-xs text-gray-500">
                        Performed by {selectedCourierFullView.performedBy}
                      </div>
                    )}
                    {selectedCourierFullView.statusReason && (
                      <div className="text-xs text-gray-500">Reason: {selectedCourierFullView.statusReason}</div>
                    )}
                  </div>

                  {selectedCourierFullView.balanceStr && (
                    <div className="px-4 py-3 rounded-lg bg-[#e8effc] border border-blue-200 flex items-center justify-between">
                      <span className="font-bold text-gray-900">Balance</span>
                      <span className="font-mono font-bold text-gray-900">{selectedCourierFullView.balanceStr}</span>
                    </div>
                  )}

                  <div className="divide-y divide-gray-200 border-t border-b border-gray-200">
                    <div className="py-3 flex items-center justify-between">
                      <span className="font-semibold text-gray-900">Contract</span>
                      <span className="text-gray-600 font-medium">{selectedCourierFullView.contract}</span>
                    </div>

                    <div className="py-3 flex items-center justify-between">
                      <span className="font-semibold text-gray-900">Vehicle</span>
                      <span className="text-gray-600 font-medium">{selectedCourierFullView.vehicle}</span>
                    </div>

                    <div className="py-3 flex items-center justify-between gap-2">
                      <span className="font-semibold text-gray-900">Phone</span>
                      {selectedCourierFullView.phone ? (
                        <div className="flex items-center gap-2">
                          <button
                            type="button"
                            onClick={() => copyToClipboard("riderPhone", selectedCourierFullView.phone)}
                            className="inline-flex items-center gap-1.5 text-blue-600 hover:text-blue-800 font-mono font-bold text-sm"
                            title="نسخ رقم موبايل الرايدر"
                          >
                            <span>{copiedText === "riderPhone" ? "✓" : "⧉"}</span>
                            <span className="text-gray-900">{selectedCourierFullView.phone}</span>
                          </button>
                          <a
                            href={`tel:${selectedCourierFullView.phone}`}
                            className="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold hover:bg-emerald-100"
                            title="اتصال مباشر بالرايدر"
                          >
                            📞 Call
                          </a>
                        </div>
                      ) : !selectedCourierFullView.isLoadedFromApi ? (
                        <span className="text-xs font-semibold text-emerald-700 animate-pulse">
                          ⏳ جاري جلب رقم الموبايل من Hurrier...
                        </span>
                      ) : (
                        <span className="text-gray-400 text-xs">غير متاح</span>
                      )}
                    </div>

                    <div className="py-3 flex items-center justify-between">
                      <span className="font-semibold text-gray-900">Fleet ID</span>
                      <span className="text-gray-600 font-mono">{selectedCourierFullView.fleetId}</span>
                    </div>
                  </div>
                </div>

                <div className="px-6 py-3 bg-gray-50 border-t border-gray-200 flex items-center justify-between text-xs text-gray-500">
                  <span>View-Only Rider Card</span>
                  <button
                    type="button"
                    onClick={() => setSelectedCourier(null)}
                    className="px-4 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 font-semibold text-gray-700"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
