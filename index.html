                            fill="#3b82f6"
                          />
                          <circle cx="56" cy="23" r="4" fill="#ffffff" stroke="#334155" strokeWidth="1.5" />
                          <path d="M52 23L49 24L52 25" stroke="#334155" strokeWidth="1.4" />
                          <circle cx="55" cy="22.5" r="0.8" fill="#1e293b" />
                        </svg>
                      </div>
                    ) : (
                      <div className="pt-3 space-y-2.5">
                        {selectedOrderFullView.dispatcherNotes.map((n) => (
                          <div
                            key={n.id}
                            className="p-3 rounded-lg bg-white/90 border border-[#ebd995] shadow-sm space-y-1.5"
                          >
                            <div
                              dir="auto"
                              className="text-sm font-semibold text-gray-900 whitespace-pre-wrap break-words"
                            >
                              {n.note}
                            </div>
                            <div className="flex flex-wrap items-center justify-between gap-2 text-[11px] text-gray-500">
                              <div className="flex flex-wrap items-center gap-2">
                                {n.email && <span className="font-mono font-medium text-gray-700">{n.email}</span>}
                                {n.source && (
                                  <span className="px-2 py-0.5 rounded-full bg-amber-100 text-amber-900 font-bold uppercase text-[10px]">
                                    {n.source}
                                  </span>
                                )}
                              </div>
                              {(n.createdAt || n.createdTimeSec) && (
                                <span className="font-mono text-gray-600">
                                  {n.createdAt} {n.createdTimeSec ? `• ${n.createdTimeSec}` : ""}
                                </span>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="lg:col-span-8 space-y-5">
                    <div className="bg-white rounded-xl border border-gray-200 p-4 sm:p-5 shadow-sm space-y-4">
                      <div className="flex items-center justify-between">
                        <h3 className="text-base font-bold text-gray-900">Pick up and Drop off</h3>
                        <span className="text-xs font-mono text-gray-500">
                          {selectedOrderFullView.distance} • {selectedOrderFullView.orderValue}
                        </span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="p-4 rounded-xl border border-gray-200 bg-gray-50/40 space-y-1.5">
                          <div className="text-xs font-bold text-gray-500 uppercase">Vendor Address</div>
                          <div className="text-sm font-bold text-blue-600">
                            {selectedOrderFullView.vendorName}
                          </div>
                          <div className="text-xs text-gray-500">
                            VO #{selectedOrderFullView.vendorOrderNo} • Code #{selectedOrderFullView.vendorCode}
                          </div>
                          <p className="text-xs text-gray-700 leading-relaxed pt-1">
                            {selectedOrderFullView.pickupAddress}
                          </p>
                        </div>

                        <div className="p-4 rounded-xl border border-gray-200 bg-gray-50/40 space-y-1.5">
                          <div className="text-xs font-bold text-gray-500 uppercase">Customer Address</div>
                          <div className="flex flex-wrap items-center justify-between gap-2">
                            <span className="text-sm font-bold text-gray-900">
                              {selectedOrderFullView.customerName}
                            </span>
                            {selectedOrderFullView.customerPhone && (
                              <div className="flex items-center gap-1.5">
                                <a
                                  href={`tel:${selectedOrderFullView.customerPhone}`}
                                  className="text-xs font-mono font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200"
                                >
                                  📞 {selectedOrderFullView.customerPhone}
                                </a>
                                <button
                                  type="button"
                                  onClick={() => copyToClipboard("custPhone", selectedOrderFullView.customerPhone)}
                                  className="text-xs px-1.5 py-0.5 rounded border border-gray-200 text-gray-600 hover:bg-gray-100"
                                >
                                  {copiedText === "custPhone" ? "✓" : "⧉"}
                                </button>
                              </div>
                            )}
                          </div>
                          <p className="text-xs text-gray-700 leading-relaxed pt-1">
                            {selectedOrderFullView.dropoffAddress}
                          </p>
                        </div>
                      </div>
                    </div>

                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                      <div className="px-5 pt-3 border-b border-gray-200 flex items-center gap-6">
                        <button
                          type="button"
                          onClick={() => setDetailModalTab("Deliveries")}
                          className={`pb-3 text-sm font-bold border-b-2 transition-colors ${
                            detailModalTab === "Deliveries"
                              ? "border-blue-600 text-blue-600"
                              : "border-transparent text-gray-600 hover:text-gray-900"
                          }`}
                        >
                          Deliveries {selectedOrderFullView.structuredDeliveries.length}
                        </button>
                        <button
                          type="button"
                          onClick={() => setDetailModalTab("Order Items")}
                          className={`pb-3 text-sm font-bold border-b-2 transition-colors ${
                            detailModalTab === "Order Items"
                              ? "border-blue-600 text-blue-600"
                              : "border-transparent text-gray-600 hover:text-gray-900"
                          }`}
                        >
                          Order Items {selectedOrderFullView.items.length}
                        </button>
                      </div>

                      {detailModalTab === "Deliveries" ? (
                        <div className="p-4 sm:p-5 space-y-5">
                          {selectedOrderFullView.structuredDeliveries.map((del) => (
                            <div key={del.id} className="border border-gray-200 rounded-xl overflow-hidden">
                              <div className="px-4 py-3 bg-[#f1f5fb] border-b border-gray-200 grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                                <div>
                                  <div className="text-gray-500">Status</div>
                                  <div
                                    className={`font-bold text-sm mt-0.5 ${
                                      del.isCancelledDelivery ? "text-red-700" : "text-gray-900"
                                    }`}
                                  >
                                    {del.status}
                                  </div>
                                </div>
                                <div>
                                  <div className="text-gray-500">Zones</div>
                                  <div className="font-semibold text-gray-800 truncate mt-0.5" title={del.zones}>
                                    {del.zones}
                                  </div>
                                </div>
                                <div>
                                  <div className="text-gray-500">Courier</div>
                                  {del.courier && del.courier !== "-" && del.courier !== "Assigning..." ? (
                                    <button
                                      type="button"
                                      onMouseEnter={() => handleCourierHover(del.courierId, del.courier)}
                                      onClick={(e) => openCourierModal(e, del.courierId, del.courier)}
                                      className="font-bold text-blue-600 hover:underline truncate max-w-full text-left mt-0.5 block"
                                    >
                                      {del.courier}
                                    </button>
                                  ) : (
                                    <div className="font-semibold text-gray-700 mt-0.5">{del.courier}</div>
                                  )}
                                </div>
                                <div>
                                  <div className="text-gray-500">Utilization</div>
                                  <div className="font-bold text-gray-900 mt-0.5">{del.utilization}</div>
                                </div>
                              </div>

                              <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs">
                                  <thead>
                                    <tr className="border-b border-gray-200 text-gray-500 font-bold uppercase bg-gray-50/60">
                                      <th className="py-2.5 px-4">TIME</th>
                                      <th className="py-2.5 px-4">EVENT</th>
                                      <th className="py-2.5 px-4">COURIER</th>
                                      <th className="py-2.5 px-3 text-center">LOC</th>
                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-gray-100">
                                    {del.events.length === 0 ? (
                                      <tr>
                                        <td colSpan={4} className="py-6 text-center text-gray-500">
                                          {selectedOrderFullView.isLoadedFromApi
                                            ? "لا توجد حركات مسجلة لهذه التوصيلة."
                                            : "⏳ جاري تحميل سجل الحركات الكامل..."}
                                        </td>
                                      </tr>
                                    ) : (
                                      del.events.map((ev) => (
                                        <tr key={ev.key} className="hover:bg-gray-50/70">
                                          <td className="py-2.5 px-4 font-mono text-gray-700 whitespace-nowrap">
                                            {ev.timeSec}
                                          </td>
                                          <td className="py-2.5 px-4">
                                            <div
                                              className={`font-bold ${
                                                ev.isRemoved ? "text-red-600" : "text-blue-600"
                                              }`}
                                            >
                                              {ev.eventLabel}
                                            </div>
                                            {ev.subLabel && (
                                              <div className="text-[11px] text-gray-500 mt-0.5">{ev.subLabel}</div>
                                            )}
                                          </td>
                                          <td className="py-2.5 px-4">
                                            {ev.courierName && ev.courierName !== "-" ? (
                                              <button
                                                type="button"
                                                onMouseEnter={() => handleCourierHover(ev.courierId, ev.courierName)}
                                                onClick={(e) => openCourierModal(e, ev.courierId, ev.courierName)}
                                                className="text-blue-600 hover:underline font-medium text-left"
                                              >
                                                {ev.courierName}
                                              </button>
                                            ) : (
                                              <span className="text-gray-400">-</span>
                                            )}
                                          </td>
                                          <td className="py-2.5 px-3 text-center">
                                            {ev.locUrl ? (
                                              <a
                                                href={ev.locUrl}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="text-red-600 hover:underline font-bold"
                                                title="Open Location on Map"
                                              >
                                                📍
                                              </a>
                                            ) : (
                                              <span className="text-gray-300">-</span>
                                            )}
                                          </td>
                                        </tr>
                                      ))
                                    )}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="p-4 sm:p-5 overflow-x-auto">
                          <table className="w-full text-left text-xs">
                            <thead>
                              <tr className="border-b border-gray-200 text-gray-500 font-bold uppercase">
                                <th className="py-2.5 px-3">ITEM</th>
                                <th className="py-2.5 px-3 text-right">QUANTITY</th>
                                <th className="py-2.5 px-3 text-right">VOLUME (L)</th>
                                <th className="py-2.5 px-3 text-right">WEIGHT (KG)</th>
                                <th className="py-2.5 px-3 text-right">PRICE</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100 text-[13px]">
                              {selectedOrderFullView.items.map((it) => (
                                <tr key={it.id}>
                                  <td className="py-3 px-3 text-gray-900 font-medium">
                                    <div>{it.name}</div>
                                    {it.subItems.length > 0 && (
                                      <div className="text-xs text-gray-500 mt-0.5">
                                        {it.subItems.join(", ")}
                                      </div>
                                    )}
                                  </td>
                                  <td className="py-3 px-3 text-right font-mono">{it.quantity}</td>
                                  <td className="py-3 px-3 text-right font-mono">{it.volumeFormatted}</td>
                                  <td className="py-3 px-3 text-right font-mono">{it.weightFormatted}</td>
                                  <td className="py-3 px-3 text-right font-mono">{it.priceFormatted}</td>
                                </tr>
                              ))}
                              <tr className="font-semibold text-gray-900">
                                <td className="py-3 px-3">Subtotal</td>
                                <td className="py-3 px-3 text-right font-mono">
                                  {selectedOrderFullView.itemsSummary.totalQuantity}
                                </td>
                                <td className="py-3 px-3 text-right font-mono">
                                  {selectedOrderFullView.itemsSummary.totalVolume}
                                </td>
                                <td className="py-3 px-3 text-right font-mono">
                                  {selectedOrderFullView.itemsSummary.totalWeight}
                                </td>
                                <td className="py-3 px-3 text-right font-mono">
                                  {selectedOrderFullView.itemsSummary.subtotalFormatted}
                                </td>
                              </tr>
                              <tr>
                                <td colSpan={4} className="py-3 px-3 text-gray-800">Delivery Fee</td>
                                <td className="py-3 px-3 text-right font-mono">
                                  {selectedOrderFullView.itemsSummary.deliveryFeeFormatted}
                                </td>
                              </tr>
                              <tr className="font-bold text-gray-900">
                                <td colSpan={4} className="py-3 px-3">Total</td>
                                <td className="py-3 px-3 text-right font-mono">
                                  {selectedOrderFullView.itemsSummary.totalFormatted}
                                </td>
                              </tr>
                              <tr>
                                <td colSpan={4} className="py-3 px-3 text-gray-800">Pay at Pickup</td>
                                <td className="py-3 px-3 text-right font-mono">
                                  {selectedOrderFullView.itemsSummary.payAtPickupFormatted}
                                </td>
                              </tr>
                              <tr className="font-semibold text-gray-900">
                                <td colSpan={4} className="py-3 px-3">Collect at Drop off</td>
                                <td className="py-3 px-3 text-right font-mono">
                                  {selectedOrderFullView.itemsSummary.collectAtDropoffFormatted}
                                </td>
                              </tr>
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="lg:col-span-4 space-y-4">
                    <div className="bg-white rounded-xl border border-gray-200 p-4 sm:p-5 shadow-sm space-y-3">
                      <div className="flex items-center justify-between">
                        <h3 className="text-sm font-bold text-gray-900">🕒 Time Checks</h3>
                        <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200">
                          {selectedOrderFullView.status}
                        </span>
                      </div>
                      <div className="divide-y divide-gray-100 text-xs">
                        {selectedOrderFullView.timeChecks.map((tc) => (
                          <div key={tc.label} className="py-2.5 flex items-center justify-between gap-2">
                            <span className="text-gray-500 font-medium">{tc.label}</span>
                            <span className="font-mono font-bold text-gray-900">{tc.value}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                <div className="px-6 py-3 bg-white border-t border-gray-200 flex items-center justify-between text-xs text-gray-500">
                  <span>View-Only Mode (No actions permitted)</span>
                  <button
                    type="button"
                    onClick={() => setSelectedOrder(null)}
                    className="px-4 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 font-semibold text-gray-700"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Rider / Courier Profile Modal */}
          {selectedCourierFullView && (
            <div
              className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4"
              onClick={() => setSelectedCourier(null)}
            >
              <div
                className="bg-white rounded-xl w-full max-w-lg shadow-2xl border border-gray-200 overflow-hidden"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="px-6 pt-5 pb-4 border-b border-gray-100 flex items-start justify-between gap-3">
                  <div className="space-y-1.5 min-w-0">
                    <div className="flex items-center gap-2">
                      <h3 className="text-lg font-bold text-blue-600 leading-snug break-words">
                        {selectedCourierFullView.name}
                      </h3>
                      <button
                        type="button"
                        onClick={() => copyToClipboard("riderNameModal", selectedCourierFullView.name)}
                        className="text-gray-400 hover:text-blue-600 text-xs px-1.5 py-0.5 rounded border border-gray-200 flex-shrink-0"
                        title="نسخ اسم الرايدر"
                      >
                        {copiedText === "riderNameModal" ? "✓" : "⧉"}
                      </button>
                    </div>
                    <div className="flex items-center gap-2 text-sm text-gray-600 font-medium">
                      <span>
                        User ID{" "}
                        <strong className="font-mono text-gray-900">
                          {selectedCourierFullView.userId ? `#${selectedCourierFullView.userId}` : "جاري الجلب..."}
                        </strong>
                      </span>
                      {selectedCourierFullView.userId && (
                        <button
                          type="button"
                          onClick={() => copyToClipboard("riderUidModal", selectedCourierFullView.userId)}
                          className="text-gray-400 hover:text-blue-600 text-xs px-1.5 py-0.5 rounded border border-gray-200"
                          title="نسخ User ID"
                        >
                          {copiedText === "riderUidModal" ? "✓" : "⧉"}
                        </button>
                      )}
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={() => setSelectedCourier(null)}
                    className="p-1.5 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-5 space-y-4 text-sm">
                  {selectedCourierFullView.phone && (
                    <div className="grid grid-cols-2 gap-2.5">
                      <a
                        href={`tel:${selectedCourierFullView.phone}`}
                        className="py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm"
                      >
                        📞 اتصال مباشر
                      </a>
                      <button
                        type="button"
                        onClick={() => copyToClipboard("riderPhoneTop", selectedCourierFullView.phone)}
                        className="py-2.5 px-3 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 font-bold text-xs flex items-center justify-center gap-1.5"
                      >
                        {copiedText === "riderPhoneTop" ? "✓ تم النسخ" : `⧉ نسخ ${selectedCourierFullView.phone}`}
                      </button>
                    </div>
                  )}

                  <div
                    className={`p-4 rounded-lg border space-y-1 ${
                      selectedCourierFullView.statusTone === "warning"
                        ? "bg-amber-50/90 border-amber-200"
                        : selectedCourierFullView.statusTone === "danger"
                        ? "bg-red-50/90 border-red-200"
                        : "bg-gray-100/90 border-gray-200"
                    }`}
                  >
                    <div className="flex items-center justify-between">
                      <span className="text-xs text-gray-500 font-medium">Status</span>
                      {selectedCourierFullView.isRefreshingLive && (
                        <span className="text-[11px] text-blue-600 font-semibold animate-pulse">
                          ⟳ تحديث حي...
                        </span>
                      )}
                    </div>
                    <div
                      className={`text-base font-bold ${
                        selectedCourierFullView.statusTone === "warning"
                          ? "text-amber-900"
                          : selectedCourierFullView.statusTone === "danger"
                          ? "text-red-800"
                          : "text-gray-900"
                      }`}
                    >
                      {selectedCourierFullView.statusLabel}
                    </div>
                    {selectedCourierFullView.untilFormatted && (
                      <div className="text-xs text-gray-600 pt-0.5">
                        Until {selectedCourierFullView.untilFormatted}
                      </div>
                    )}
                    {selectedCourierFullView.performedBy && (
                      <div className="text-xs text-gray-600">
                        Performed by {selectedCourierFullView.performedBy}
                      </div>
                    )}
                    {selectedCourierFullView.reason && (
                      <div className="text-xs text-gray-700 font-medium">
                        Reason: {selectedCourierFullView.reason}
                      </div>
                    )}
                  </div>

                  {selectedCourierFullView.balanceFormatted && (
                    <div className="px-4 py-3 rounded-lg bg-[#eef3fc] border border-blue-100 flex items-center justify-between">
                      <span className="font-bold text-gray-900">Balance</span>
                      <span className="font-mono font-bold text-gray-900">
                        {selectedCourierFullView.balanceFormatted}
                      </span>
                    </div>
                  )}

                  <div className="divide-y divide-gray-200 border-t border-b border-gray-200">
                    {selectedCourierFullView.contract && (
                      <div className="py-3 flex items-center justify-between">
                        <span className="font-semibold text-gray-900">Contract</span>
                        <span className="text-gray-600 font-medium">{selectedCourierFullView.contract}</span>
                      </div>
                    )}

                    <div className="py-3 flex items-center justify-between">
                      <span className="font-semibold text-gray-900">Vehicle</span>
                      <span className="text-gray-600 font-medium">{selectedCourierFullView.vehicle}</span>
                    </div>

                    <div className="py-3 flex items-center justify-between gap-2">
                      <span className="font-semibold text-gray-900">Phone</span>
                      {selectedCourierFullView.phone ? (
                        <span className="font-mono font-bold text-gray-900">{selectedCourierFullView.phone}</span>
                      ) : !selectedCourierFullView.isLoadedFromApi ? (
                        <span className="text-xs font-semibold text-emerald-700 animate-pulse">
                          ⏳ جاري جلب بيانات الرايدر من Hurrier...
                        </span>
                      ) : (
                        <span className="text-gray-400 text-xs">غير متاح</span>
                      )}
                    </div>
                  </div>
                </div>

                <div className="px-6 py-3 bg-gray-50 border-t border-gray-200 flex items-center justify-between text-xs text-gray-500">
                  <span>View-Only Rider Card (Live Synced)</span>
                  <button
                    type="button"
                    onClick={() => setSelectedCourier(null)}
                    className="px-4 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 font-semibold text-gray-700"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
