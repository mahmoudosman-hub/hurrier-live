            </div>

            <div className="pt-2 pb-6 flex flex-wrap items-center justify-between gap-3">
              <div className="text-xs text-gray-500">
                Showing <strong>{(completedPage - 1) * 50 + (paginatedCompletedOrders.length > 0 ? 1 : 0)}</strong>–
                <strong>{(completedPage - 1) * 50 + paginatedCompletedOrders.length}</strong> of{" "}
                <strong>{visibleCompletedOrders.length}</strong>
              </div>

              <div className="flex items-center gap-1 select-none">
                <button
                  type="button"
                  disabled={completedPage <= 1}
                  onClick={() => {
                    setCompletedPage((p) => Math.max(1, p - 1));
                    if (mainContainerRef.current) mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
                  }}
                  className={`w-9 h-9 flex items-center justify-center rounded text-base font-bold transition-colors ${
                    completedPage <= 1 ? "text-gray-300 cursor-not-allowed" : "text-gray-600 hover:bg-gray-100"
                  }`}
                >
                  ‹
                </button>

                {completedVisiblePages.map((p, idx) =>
                  p === "..." ? (
                    <span key={`comp-dots-${idx}`} className="px-2 text-gray-400 text-sm">
                      ...
                    </span>
                  ) : (
                    <button
                      key={p}
                      type="button"
                      onClick={() => {
                        setCompletedPage(Number(p));
                        if (mainContainerRef.current) mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
                      }}
                      className={`min-w-[36px] h-9 px-2.5 flex items-center justify-center text-sm transition-colors ${
                        Number(completedPage) === Number(p)
                          ? "border-b-2 border-blue-600 text-blue-600 font-bold"
                          : "text-gray-700 hover:bg-gray-100 rounded font-medium"
                      }`}
                    >
                      {p}
                    </button>
                  )
                )}

                <button
                  type="button"
                  disabled={completedPage >= completedTotalPages}
                  onClick={() => {
                    setCompletedPage((p) => Math.min(completedTotalPages, p + 1));
                    if (mainContainerRef.current) mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
                  }}
                  className={`w-9 h-9 flex items-center justify-center rounded text-base font-bold transition-colors ${
                    completedPage >= completedTotalPages
                      ? "text-gray-300 cursor-not-allowed"
                      : "text-gray-600 hover:bg-gray-100"
                  }`}
                >
                  ›
                </button>
              </div>

              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  const num = Number(completedJumpPage);
                  if (num >= 1) {
                    setCompletedPage(Math.min(completedTotalPages, num));
                    setCompletedJumpPage("");
                    if (mainContainerRef.current) mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
                  }
                }}
                className="flex items-center gap-1.5 text-xs"
              >
                <span className="text-gray-500">Go to:</span>
                <input
                  type="number"
                  min={1}
                  max={completedTotalPages}
                  value={completedJumpPage}
                  onChange={(e) => setCompletedJumpPage(e.target.value)}
                  placeholder="Page"
                  className="w-16 px-2 py-1 border border-gray-300 rounded text-xs focus:outline-none focus:border-blue-500"
                />
                <button
                  type="submit"
                  className="px-2.5 py-1 rounded border border-gray-300 bg-white hover:bg-gray-50 font-semibold text-gray-700"
                >
                  Go
                </button>
              </form>
            </div>
          </div>
        );
      };

      const totalItemsForPagination = filteredDeliveries.length;
      const totalPages = Math.max(1, Math.ceil(totalItemsForPagination / PAGE_SIZE));

      const paginatedDeliveries = useMemo(() => {
        const safePage = Math.min(currentPage, totalPages);
        const startIdx = (safePage - 1) * PAGE_SIZE;
        return filteredDeliveries.slice(startIdx, startIdx + PAGE_SIZE);
      }, [currentPage, totalPages, filteredDeliveries]);

      const handlePageChange = useCallback(
        (nextPage) => {
          const clamped = Math.max(1, Math.min(totalPages, Number(nextPage) || 1));
          setCurrentPage(clamped);
          if (mainContainerRef.current) {
            mainContainerRef.current.scrollTo({ top: 0, behavior: "smooth" });
          }
        },
        [totalPages]
      );

      const visiblePageNumbers = useMemo(() => {
        if (totalPages <= 7) {
          return Array.from({ length: totalPages }, (_, i) => i + 1);
        }
        if (currentPage <= 4) {
          return [1, 2, 3, 4, 5, "...", totalPages];
        }
        if (currentPage >= totalPages - 3) {
          return [1, "...", totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
        }
        return [1, "...", currentPage - 1, currentPage, currentPage + 1, "...", totalPages];
      }, [currentPage, totalPages]);

      const renderDeliveriesTable = () => {
        const lateCount = baseTabDeliveries.filter((d) => d.deadline.includes("-") || d.deadline === "Late").length;
        const cashCount = baseTabDeliveries.filter((d) => d.instructions.includes("Cash")).length;
        const cardCount = baseTabDeliveries.filter((d) => d.instructions.includes("Card")).length;
        const darkstoreCount = baseTabDeliveries.filter(
          (d) => isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores")
        ).length;
        const restaurantCount = baseTabDeliveries.filter((d) => {
          const isDs = isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores");
          return !isDs && (d.instructions.includes("Restaurants") || d.instructions.includes("Supermarket"));
        }).length;
        const splitCount = baseTabDeliveries.filter((d) => d.isSplit).length;
        const tabExactTotal = effectiveTabCounts[activeTab] ?? baseTabDeliveries.length;

        const delayedWithRiderList = filteredDeliveries.filter(
          (d) => (d.deadline.includes("-") || d.deadline === "Late") && hasValidAssignedRider(d)
        );
        const selectedWithRiderList = filteredDeliveries.filter(
          (d) => selectedOrderUids.has(d.uid) && hasValidAssignedRider(d)
        );
        const pageSelectableItems = paginatedDeliveries.filter(hasValidAssignedRider);
        const allPageSelected =
          pageSelectableItems.length > 0 && pageSelectableItems.every((d) => selectedOrderUids.has(d.uid));

        const quickFilters = [
          { id: "All", label: `All (${tabExactTotal})` },
          { id: "Delayed", label: `Delayed (${lateCount})` },
          { id: "Cash", label: `Cash (${cashCount})` },
          { id: "Card", label: `Card (${cardCount})` },
          { id: "Restaurants", label: `Restaurants (${restaurantCount})` },
          { id: "Darkstores", label: `Darkstores - Talabat Mart (${darkstoreCount})` },
          { id: "Split", label: `Split Orders (${splitCount})` }
        ];

        return (
          <div className="mt-4 space-y-3">
            {/* Row 1: Primary Category Filters */}
            <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-gray-100">
              <div className="flex flex-wrap items-center gap-1.5">
                {quickFilters.map((qf) => {
                  const active = activeQuickFilter === qf.id;
                  return (
                    <button
                      key={qf.id}
                      type="button"
                      onClick={() => {
                        setActiveQuickFilter(qf.id);
                        setCurrentPage(1);
                        if (qf.id !== "Darkstores") setSelectedMartBranch("ALL");
                      }}
                      className={`px-3 py-1 rounded-full text-xs font-semibold border transition-colors ${
                        active
                          ? "bg-blue-600 text-white border-blue-600"
                          : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"
                      }`}
                    >
                      {qf.label}
                    </button>
                  );
                })}
              </div>

              <div className="flex flex-wrap items-center gap-2 text-xs text-gray-500">
                {selectedWithRiderList.length > 0 && (
                  <div className="inline-flex items-center gap-1">
                    <button
                      type="button"
                      disabled={copyingFollowupState === "loading:selected"}
                      onClick={() => handleCopyBulkFollowup("selected", selectedWithRiderList)}
                      className="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-sm transition-colors flex items-center gap-1.5"
                      title="نسخ كليشة متابعة الرايدر للأوردرات المحددة فقط"
                    >
                      {copyingFollowupState === "loading:selected"
                        ? "⏳ جاري سحب أرقام الموبايل..."
                        : copyingFollowupState?.startsWith("done:selected:")
                        ? `✓ تم نسخ (${selectedWithRiderList.length}) أوردر`
                        : `📋 نسخ المحدد (${selectedWithRiderList.length})`}
                    </button>
                    <button
                      type="button"
                      onClick={() => setSelectedOrderUids(new Set())}
                      className="px-2 py-1 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 text-gray-600 font-semibold"
                      title="إلغاء تحديد الأوردرات"
                    >
                      ✕
                    </button>
                  </div>
                )}

                {delayedWithRiderList.length > 0 && (
                  <button
                    type="button"
                    disabled={copyingFollowupState === "loading:delayed"}
                    onClick={() => handleCopyBulkFollowup("delayed", delayedWithRiderList)}
                    className="px-3 py-1 rounded-lg bg-red-600 hover:bg-red-700 text-white font-bold shadow-sm transition-colors flex items-center gap-1.5"
                    title="نسخ كليشة متابعة الرايدر لكل الأوردرات المتأخرة المعروضة"
                  >
                    {copyingFollowupState === "loading:delayed"
                      ? "⏳ جاري سحب الأرقام..."
                      : copyingFollowupState?.startsWith("done:delayed:")
                      ? `✓ تم نسخ المتأخرات (${delayedWithRiderList.length})`
                      : `📋 نسخ كل المتأخرات (${delayedWithRiderList.length})`}
                  </button>
                )}

                <button
                  type="button"
                  onClick={() =>
                    setOrderSortMode((prev) => (prev === "hurrier_order" ? "live_first" : "hurrier_order"))
                  }
                  className="px-2.5 py-1 rounded border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 font-semibold"
                >
                  {orderSortMode === "hurrier_order" ? "Order: Hurrier Default" : "Order: Live Today First"}
                </button>
                <button
                  type="button"
                  onClick={() => setMobileViewMode((prev) => (prev === "cards" ? "table" : "cards"))}
                  className="md:hidden px-2.5 py-1 rounded border border-gray-300 bg-white text-gray-700 font-bold"
                >
                  {mobileViewMode === "cards" ? "📊 جدول" : "📱 بطاقات"}
                </button>
                <div>
                  Page <strong className="text-gray-800">{currentPage}</strong> of{" "}
                  <strong className="text-gray-800">{totalPages}</strong>{" "}
                  <span className="text-gray-400">
                    ({paginatedDeliveries.length} rows • Total {totalItemsForPagination})
                  </span>
                </div>
              </div>
            </div>

            {/* Row 2: Live Status Filter Pills Bar (Accepted / Near Pickup / Picked Up / Left Pickup / Near Dropoff) */}
            {tabStatusSummary.orderedStatuses.length > 0 && (
              <div className="flex flex-wrap items-center justify-between gap-2 px-3 py-2 rounded-xl bg-slate-50/90 border border-gray-200">
                <div className="flex flex-wrap items-center gap-1.5">
                  <span className="text-[11px] font-extrabold uppercase tracking-wider text-gray-400 mr-1">
                    STATUS:
                  </span>
                  <button
                    type="button"
                    onClick={() => {
                      setActiveStatusFilter("All");
                      setCurrentPage(1);
                    }}
                    className={`px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors ${
                      activeStatusFilter === "All"
                        ? "bg-slate-900 text-white border-slate-900 shadow-sm"
                        : "bg-white text-gray-700 border-gray-300 hover:bg-gray-100"
                    }`}
                  >
                    All Statuses ({baseTabDeliveries.length})
                  </button>

                  {tabStatusSummary.orderedStatuses.map((stLabel) => {
                    const stStyle = DELIVERY_STATUS_PILL_STYLES[stLabel] || {
                      dot: "bg-slate-400",
                      active: "bg-blue-600 text-white border-blue-600",
                      idle: "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"
                    };
                    const isStActive = activeStatusFilter === stLabel;
                    const cnt = tabStatusSummary.counts[stLabel] || 0;
                    return (
                      <button
                        key={stLabel}
                        type="button"
                        onClick={() => {
                          setActiveStatusFilter((prev) => (prev === stLabel ? "All" : stLabel));
                          setCurrentPage(1);
                        }}
                        className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border transition-colors ${
                          isStActive ? `${stStyle.active} shadow-sm` : stStyle.idle
                        }`}
                      >
                        <span
                          className={`w-2 h-2 rounded-full ${
                            isStActive ? "bg-white" : stStyle.dot
                          }`}
                        />
                        <span>
                          {stLabel} ({cnt})
                        </span>
                      </button>
                    );
                  })}
                </div>

                {activeStatusFilter !== "All" && (
                  <div className="flex items-center gap-1.5">
                    <button
                      type="button"
                      onClick={() =>
                        copyToClipboard(
                          `status-ids-${activeStatusFilter}`,
                          filteredDeliveries.map((d) => d.id).join("\n")
                        )
                      }
                      className="px-2.5 py-1 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-bold transition-colors"
                    >
                      {copiedText === `status-ids-${activeStatusFilter}`
                        ? `✓ تم نسخ (${filteredDeliveries.length})`
                        : `📋 نسخ الأوردرات (${filteredDeliveries.length})`}
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setActiveStatusFilter("All");
                        setCurrentPage(1);
                      }}
                      className="px-2.5 py-1 rounded-lg bg-white hover:bg-red-50 text-red-600 border border-gray-300 hover:border-red-200 text-xs font-bold transition-colors"
                    >
                      ✕ مسح الحالة
                    </button>
                  </div>
                )}
              </div>
            )}

            {activeQuickFilter === "Darkstores" && (
              <div className="flex flex-wrap items-center gap-2 p-2.5 rounded-lg bg-amber-50/70 border border-amber-200 text-xs">
                <span className="font-bold text-amber-900 px-2 py-1 rounded bg-amber-100 border border-amber-300">
                  🏪 فروع مارت في الزون ({martBranchesSummary.branches.length})
                </span>
                <button
                  type="button"
                  onClick={() => setSelectedMartBranch("ALL")}
                  className={`px-3 py-1 rounded-full font-semibold border transition-colors ${
                    selectedMartBranch === "ALL"
                      ? "bg-gray-900 text-white border-gray-900"
                      : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"
                  }`}
                >
                  All Marts ({martBranchesSummary.totalMartCount})
                </button>
                {martBranchesSummary.branches.map((br) => {
                  const isSelected = normalizeText(selectedMartBranch) === normalizeText(br.label);
                  return (
                    <button
                      key={br.label}
                      type="button"
                      onClick={() => setSelectedMartBranch(br.label)}
                      className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full font-semibold border transition-colors ${
                        isSelected
                          ? "bg-amber-600 text-white border-amber-600"
                          : "bg-white text-gray-800 border-amber-300 hover:bg-amber-100/60"
                      }`}
                    >
                      <span>🏪 {br.label}</span>
                      <span
                        className={`px-1.5 py-0.2 rounded text-[11px] font-bold ${
                          isSelected ? "bg-white/20 text-white" : "bg-gray-100 text-gray-800"
                        }`}
                      >
                        {br.count}
                      </span>
                      {br.late > 0 && (
                        <span className="px-1.5 py-0.2 rounded text-[10px] font-bold bg-red-600 text-white">
                          {br.late} late
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            )}

            {/* Mobile Smart Order Cards (< 768px) */}
            <div className={`${mobileViewMode === "cards" ? "block md:hidden" : "hidden"} space-y-2.5`}>
              {paginatedDeliveries.length === 0 ? (
                <div className="p-8 text-center bg-white border border-gray-200 rounded-xl text-gray-500 text-xs space-y-2.5">
                  {connectionStatus === "connecting" || connectionStatus === "waiting" ? (
                    <span className="text-blue-600 font-semibold">
                      جاري سحب أوردرات الزونات المختارة من Hurrier...
                    </span>
                  ) : (
                    <>
                      <div>
                        لا توجد أوردرات في قسم <span className="font-semibold">{activeTab}</span> للزونات والفلاتر المختارة حالياً.
                      </div>
                      {searchQuery.trim() && (
                        <button
                          type="button"
                          onClick={() => handleJumpToCompletedOrderSearch(searchQuery)}
                          className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-indigo-600 text-white text-xs font-bold shadow-sm"
                        >
                          ⚡ بحث سريع عن "{searchQuery.trim()}" في Completed Orders
                        </button>
                      )}
                    </>
                  )}
                </div>
              ) : (
                paginatedDeliveries.map((item) => {
                  const isNegative = item.deadline.includes("-") || item.deadline === "Late";
                  const posMinsMatch = !isNegative ? /^(\d+)min$/.exec(item.deadline) : null;
                  const posMins = posMinsMatch ? Number(posMinsMatch[1]) : 0;
                  const deadlineColor = isNegative
                    ? "bg-[#e53935] text-white"
                    : posMins > 5 && posMins <= 20
                    ? "bg-[#f59e0b] text-white"
                    : "bg-gray-100 text-gray-800";

                  const prioritizedZones = [...(item.zonesList || [])].sort((a, b) => {
                    const aMatch = selectedZoneNames.some((s) => normalizeText(a).toLowerCase().includes(s));
                    const bMatch = selectedZoneNames.some((s) => normalizeText(b).toLowerCase().includes(s));
                    if (aMatch === bMatch) return 0;
                    return aMatch ? -1 : 1;
                  });
                  const shownZones = prioritizedZones.slice(0, 2);
                  const extraZonesCount = Math.max(0, prioritizedZones.length - shownZones.length);
                  const canCopyFollowup = hasValidAssignedRider(item);
                  const isRowSelected = selectedOrderUids.has(item.uid);

                  return (
                    <div
                      key={`m-card-${item.uid}`}
                      onClick={() => setSelectedOrder(item)}
                      className={`p-3.5 rounded-xl border transition-all shadow-sm space-y-2.5 text-xs ${
                        isRowSelected
                          ? "bg-blue-50/80 border-blue-400"
                          : "bg-white border-gray-200 active:bg-gray-50"
                      }`}
                    >
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-2 min-w-0">
                          {canCopyFollowup && (
                            <input
                              type="checkbox"
                              checked={isRowSelected}
                              onClick={(e) => e.stopPropagation()}
                              onChange={(e) => toggleOrderSelection(e, item)}
                              className="w-4 h-4 rounded text-blue-600 flex-shrink-0"
                            />
                          )}
                          <span className="text-blue-600 font-bold text-[15px] tracking-tight">
                            {item.id}
                          </span>
                          <button
                            type="button"
                            onClick={(e) => {
                              e.stopPropagation();
                              copyToClipboard(item.id, item.id);
                            }}
                            className="px-1.5 py-1 rounded bg-gray-100 text-gray-700 font-semibold"
                          >
                            {copiedText === item.id ? "✓" : "⧉"}
                          </button>
                          {canCopyFollowup && (
                            <button
                              type="button"
                              onClick={(e) => handleCopySingleFollowup(e, item)}
                              className={`px-2 py-1 rounded font-bold border ${
                                copiedText === `followup:${item.uid}`
                                  ? "bg-emerald-50 text-emerald-700 border-emerald-300"
                                  : "bg-blue-50 text-blue-700 border-blue-200"
                              }`}
                            >
                              {copyingFollowupState === `single:${item.uid}`
                                ? "⏳"
                                : copiedText === `followup:${item.uid}`
                                ? "✓ تم"
                                : "📋 متابعة"}
                            </button>
                          )}
                        </div>

                        <div className="flex flex-col items-end gap-1 flex-shrink-0">
                          <span className={`px-2.5 py-0.5 rounded-md text-xs font-bold ${deadlineColor}`}>
                            {item.deadline}
                          </span>
                          <span className="font-bold text-gray-900 text-[11px]">{item.status}</span>
                        </div>
                      </div>

                      <div className="space-y-1">
                        <div className="text-gray-800 font-semibold leading-snug">
                          🏪 {item.vendor}{" "}
                          <span className="text-gray-400 font-normal">(VO #{item.vo})</span>
                        </div>
                        <div className="flex items-center justify-between gap-2 text-[11px]">
                          <span className="text-blue-700 font-semibold truncate">
                            📍 {shownZones.join(", ") || item.zone}
                            {extraZonesCount > 0 ? ` (+${extraZonesCount})` : ""}
                          </span>
                          <span className="text-gray-500 font-mono flex-shrink-0">
                            {item.distance} • {item.orderValue}
                          </span>
                        </div>
                      </div>

                      <div className="pt-2 border-t border-gray-100 flex flex-wrap items-center justify-between gap-2">
                        <div className="min-w-0 flex-1">
                          {item.courier === "-" ||
                          item.courier === "Assigning..." ||
                          item.courier === "Pending Acceptance" ? (
                            <span className="text-gray-500 font-medium">🚴‍♂️ {item.courier}</span>
                          ) : (
                            <button
                              type="button"
                              onClick={(e) => openCourierModal(e, item.courierId, item.courier)}
                              className="text-left text-blue-600 font-bold underline decoration-blue-300 leading-snug break-words"
                            >
                              🚴‍♂️ {item.courier}
                            </button>
                          )}
                        </div>

                        <div className="flex items-center gap-1 flex-wrap flex-shrink-0">
                          {item.instructions.map((inst, idx) => (
                            <span
                              key={idx}
                              className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${
                                inst === "Cash"
                                  ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                                  : inst === "Card"
                                  ? "bg-indigo-50 text-indigo-700 border-indigo-200"
                                  : "bg-gray-50 text-gray-700 border-gray-200"
                              }`}
                            >
                              {inst}
                            </span>
                          ))}
                          {item.isSplit && (
                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-purple-50 text-purple-700 border border-purple-200">
                              Split
                            </span>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            {selectedWithRiderList.length > 0 && (
              <div className="fixed bottom-0 inset-x-0 z-40 md:hidden bg-slate-900/95 backdrop-blur border-t border-slate-700 px-4 py-3 flex items-center justify-between gap-2 shadow-2xl">
                <button
                  type="button"
                  disabled={copyingFollowupState === "loading:selected"}
                  onClick={() => handleCopyBulkFollowup("selected", selectedWithRiderList)}
                  className="flex-1 py-2.5 px-4 rounded-xl bg-emerald-600 active:bg-emerald-700 text-white font-bold text-xs shadow-sm flex items-center justify-center gap-2"
                >
                  {copyingFollowupState === "loading:selected"
                    ? "⏳ جاري سحب أرقام الموبايل..."
                    : copyingFollowupState?.startsWith("done:selected:")
                    ? `✓ تم نسخ (${selectedWithRiderList.length}) أوردر`
                    : `📋 نسخ المحدد (${selectedWithRiderList.length})`}
                </button>
                <button
                  type="button"
                  onClick={() => setSelectedOrderUids(new Set())}
                  className="py-2.5 px-3.5 rounded-xl bg-slate-800 text-slate-200 font-bold text-xs border border-slate-600"
                >
                  ✕ إلغاء
                </button>
              </div>
            )}

            <div className={`${mobileViewMode === "cards" ? "hidden md:block" : "block"} w-full overflow-x-auto bg-white border border-gray-200 rounded-lg shadow-sm`}>
              <table className="w-full text-left text-sm whitespace-nowrap">
                <thead>
                  <tr className="border-b border-gray-200 text-gray-500 font-semibold tracking-wide text-xs bg-gray-50/70">
                    <th className="py-3 pl-3 pr-1 w-8 text-center">
                      <input
                        type="checkbox"
                        checked={allPageSelected}
                        disabled={pageSelectableItems.length === 0}
                        onChange={() => {
                          setSelectedOrderUids((prev) => {
                            const next = new Set(prev);
                            if (allPageSelected) {
                              pageSelectableItems.forEach((d) => next.delete(d.uid));
                            } else {
                              pageSelectableItems.forEach((d) => next.add(d.uid));
                            }
                            return next;
                          });
                        }}
                        className="w-4 h-4 rounded text-blue-600 cursor-pointer"
                      />
                    </th>
                    <th className="py-3 px-4 w-1/4">ORDER</th>
                    <th className="py-3 px-3">DEADLINE</th>
                    <th className="py-3 px-3 w-1/4">COURIER</th>
                    <th className="py-3 px-3">STATUS</th>
                    <th className="py-3 px-3">ZONE / DISTANCE</th>
                    <th className="py-3 px-4">DELIVERY INSTRUCTION</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {paginatedDeliveries.length === 0 ? (
                    <tr>
                      <td colSpan={7} className="py-12 text-center text-gray-500">
                        {connectionStatus === "connecting" || connectionStatus === "waiting" ? (
                          <span className="text-blue-600 font-semibold">
                            جاري سحب أوردرات الزونات المختارة من Hurrier...
                          </span>
                        ) : (
                          <div className="space-y-2.5">
                            <div>
                              لا توجد أوردرات في قسم <span className="font-semibold">{activeTab}</span> للزونات والفلاتر المختارة حالياً.
                            </div>
                            {searchQuery.trim() && (
                              <button
                                type="button"
                                onClick={() => handleJumpToCompletedOrderSearch(searchQuery)}
                                className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-sm transition-colors"
                              >
                                ⚡ بحث سريع عن "{searchQuery.trim()}" في Completed Orders
                              </button>
                            )}
                          </div>
                        )}
                      </td>
                    </tr>
                  ) : (
                    paginatedDeliveries.map((item) => {
                      const isNegative = item.deadline.includes("-") || item.deadline === "Late";
                      const posMinsMatch = !isNegative ? /^(\d+)min$/.exec(item.deadline) : null;
                      const posMins = posMinsMatch ? Number(posMinsMatch[1]) : 0;
                      const deadlineColor = isNegative
                        ? "bg-[#e53935] text-white"
                        : posMins > 5 && posMins <= 20
                        ? "bg-[#f59e0b] text-white"
                        : "bg-gray-100 text-gray-800";

                      const prioritizedZones = [...(item.zonesList || [])].sort((a, b) => {
                        const aMatch = selectedZoneNames.some((s) => normalizeText(a).toLowerCase().includes(s));
                        const bMatch = selectedZoneNames.some((s) => normalizeText(b).toLowerCase().includes(s));
                        if (aMatch === bMatch) return 0;
                        return aMatch ? -1 : 1;
                      });
                      const shownZones = prioritizedZones.slice(0, 2);
                      const extraZonesCount = Math.max(0, prioritizedZones.length - shownZones.length);
                      const canCopyFollowup = hasValidAssignedRider(item);
                      const isRowSelected = selectedOrderUids.has(item.uid);

                      return (
                        <tr
                          key={item.uid}
                          onMouseEnter={() => handleOrderRowHover(item)}
                          onClick={() => setSelectedOrder(item)}
                          className={`transition-colors cursor-pointer ${
                            isRowSelected ? "bg-blue-50/70" : "hover:bg-blue-50/30"
                          }`}
                        >
                          <td
                            className="py-3.5 pl-3 pr-1 align-top text-center"
                            onClick={(e) => e.stopPropagation()}
                          >
                            <input
                              type="checkbox"
                              checked={isRowSelected}
                              disabled={!canCopyFollowup}
                              onChange={(e) => toggleOrderSelection(e, item)}
                              className={`w-4 h-4 rounded text-blue-600 mt-1 ${
                                canCopyFollowup ? "cursor-pointer" : "opacity-30 cursor-not-allowed"
                              }`}
                            />
                          </td>

                          <td className="py-3.5 px-4 align-top">
                            <div className="flex flex-col gap-0.5">
                              <div className="flex items-center gap-1.5">
                                <span className="text-blue-600 hover:underline font-semibold text-[15px]">
                                  {item.id}
                                </span>
                                <button
                                  type="button"
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    copyToClipboard(item.id, item.id);
                                  }}
                                  className="text-gray-400 hover:text-gray-700 px-1 py-0.5 rounded text-xs"
                                >
                                  {copiedText === item.id ? "✓" : "⧉"}
                                </button>
                                {canCopyFollowup && (
                                  <button
                                    type="button"
                                    onClick={(e) => handleCopySingleFollowup(e, item)}
                                    className={`px-1.5 py-0.5 rounded text-xs font-semibold border transition-colors ${
                                      copiedText === `followup:${item.uid}`
                                        ? "bg-emerald-50 text-emerald-700 border-emerald-300"
                                        : "bg-gray-50 hover:bg-blue-50 text-gray-600 hover:text-blue-700 border-gray-200"
                                    }`}
                                  >
                                    {copyingFollowupState === `single:${item.uid}`
                                      ? "⏳"
                                      : copiedText === `followup:${item.uid}`
                                      ? "✓ Copied"
                                      : "📋"}
                                  </button>
                                )}
                              </div>
                              <span
                                className="text-xs text-gray-500 truncate max-w-[260px]"
                                title={`VO #${item.vo} - ${item.vendor}`}
                              >
                                VO #{item.vo} - {item.vendor}
                              </span>
                            </div>
                          </td>

                          <td className="py-3.5 px-3 align-top">
                            <span className={`inline-flex px-2.5 py-1 rounded-md text-xs font-bold ${deadlineColor}`}>
                              {item.deadline}
                            </span>
                          </td>

                          <td className="py-3.5 px-3 align-top text-[14px] max-w-[240px] whitespace-normal">
                            {item.courier === "-" ||
                            item.courier === "Assigning..." ||
                            item.courier === "Pending Acceptance" ? (
                              <span className="text-gray-500">{item.courier}</span>
                            ) : (
                              <button
                                type="button"
                                onMouseEnter={() => handleCourierHover(item.courierId, item.courier)}
                                onClick={(e) => openCourierModal(e, item.courierId, item.courier)}
                                className="text-left text-blue-600 hover:text-blue-800 hover:underline font-medium leading-snug block"
                              >
                                {item.courier}
                              </button>
                            )}
                          </td>

                          <td className="py-3.5 px-3 align-top">
                            <div className="font-semibold text-gray-900 text-[14px]">{item.status}</div>
                            {item.time_in !== "-" && (
                              <div className="text-xs text-gray-500 mt-0.5">In: {item.time_in}</div>
                            )}
                            {item.time_at !== "-" && <div className="text-xs text-gray-500">At: {item.time_at}</div>}
                          </td>

                          <td className="py-3.5 px-3 align-top max-w-[230px]" title={item.zone}>
                            <div className="flex items-center gap-1.5">
                              <span className="truncate text-xs font-semibold text-blue-700">
                                {shownZones.join(", ") || item.zone}
                              </span>
                              {extraZonesCount > 0 && (
                                <span className="px-1.5 py-0.5 rounded bg-gray-100 border border-gray-200 text-[11px] font-semibold text-gray-600 flex-shrink-0">
                                  +{extraZonesCount}
                                </span>
                              )}
                            </div>
                            <div className="text-xs text-gray-400 mt-0.5">
                              {item.distance} • {item.orderValue}
                            </div>
                          </td>

                          <td className="py-3.5 px-4 align-top">
                            <div className="flex gap-1.5 flex-wrap">
                              {item.instructions.map((inst, idx) => (
                                <span
                                  key={idx}
                                  className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium border ${
                                    inst === "Cash"
                                      ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                                      : inst === "Card"
                                      ? "bg-indigo-50 text-indigo-700 border-indigo-200"
                                      : "bg-white text-gray-700 border-gray-300"
                                  }`}
                                >
                                  {inst}
                                </span>
                              ))}
                              {item.isSplit && (
                                <span className="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-purple-50 text-purple-700 border border-purple-200">
                                  Split
                                </span>
                              )}
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>

            {totalPages > 1 && (
              <div className="pt-3 pb-6 flex flex-wrap items-center justify-between gap-3">
                <div className="text-xs text-gray-500">
                  Showing <strong>{(currentPage - 1) * PAGE_SIZE + (paginatedDeliveries.length > 0 ? 1 : 0)}</strong>–
                  <strong>{(currentPage - 1) * PAGE_SIZE + paginatedDeliveries.length}</strong> of{" "}
                  <strong>{totalItemsForPagination}</strong>
                </div>

                <div className="flex items-center gap-1 select-none">
                  <button
                    type="button"
                    disabled={currentPage <= 1}
                    onClick={() => handlePageChange(currentPage - 1)}
                    className={`w-9 h-9 flex items-center justify-center rounded text-base font-bold transition-colors ${
                      currentPage <= 1 ? "text-gray-300 cursor-not-allowed" : "text-gray-600 hover:bg-gray-100"
                    }`}
                  >
                    ‹
                  </button>

                  {visiblePageNumbers.map((p, idx) =>
                    p === "..." ? (
                      <span key={`dots-${idx}`} className="px-2 text-gray-400 text-sm">
                        ...
                      </span>

                      <button
                        key={p}
                        type="button"
                        onClick={() => handlePageChange(p)}
                        className={`min-w-[36px] h-9 px-2.5 flex items-center justify-center text-sm transition-colors ${
                          Number(currentPage) === Number(p)
                            ? "border-b-2 border-blue-600 text-blue-600 font-bold"
                            : "text-gray-700 hover:bg-gray-100 rounded font-medium"

                      >
                        {p}
                      </button>
                    )

                  <button
                    type="button"
                    disabled={currentPage >= totalPages}
                    onClick={() => handlePageChange(currentPage + 1)}
                    className={`w-9 h-9 flex items-center justify-center rounded text-base font-bold transition-colors ${
                      currentPage >= totalPages ? "text-gray-300 cursor-not-allowed" : "text-gray-600 hover:bg-gray-100"
                    }`}
                  >
                    ›
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const num = Number(jumpPageInput);
                    if (num >= 1 && num <= totalPages) {
                      handlePageChange(num);
                      setJumpPageInput("");
                    }
                  }}
                  className="flex items-center gap-1.5 text-xs"
                >
                  <span className="text-gray-500">Go to:</span>
                  <input
                    type="number"
                    min={1}
                    max={totalPages}
                    value={jumpPageInput}
                    onChange={(e) => setJumpPageInput(e.target.value)}
                    placeholder={`1-${totalPages}`}
                    className="w-16 px-2 py-1 border border-gray-300 rounded text-xs focus:outline-none focus:border-blue-500"
                  />
                  <button
                    type="submit"
                    className="px-2.5 py-1 rounded border border-gray-300 bg-white hover:bg-gray-50 font-semibold text-gray-700"
                  >
                    Go
                  </button>
                </form>
              </div>
            )}
          </div>
        );
      };

      const activeHeaderCount = effectiveTabCounts[activeTab];

      const combinedRiderSearchResults = useMemo(() => {
        if (!riderSearchReq || !riderSearchReq.query) return [];
        const rawQ = String(riderSearchReq.query).trim();
        const qLower = rawQ.toLowerCase();
        const qPhone = normalizePhoneDigits(rawQ);
        const cleanDigits = rawQ.replace(/^#/, "");

        const mergedMap = new Map();
        const mapRawStatusLabel = (rawSt) => {
          const s = String(rawSt || "").toLowerCase();
          if (s === "break" || s.includes("temp")) return "Temporary not working";
          if (s === "ending") return "Ending";
          if (s === "ready" || s === "starting") return "Starting";
          if (s === "late") return "Late";
          if (s === "not_working" || s === "offline") return "Not working";
          if (s === "working") return "Working";
          return rawSt || "Working";
        };

        const addRider = (rObj) => {
          if (!rObj) return;
          const key = String(rObj.courierId || rObj.userId || rObj.name || "").toLowerCase();
          if (!key) return;
          if (!mergedMap.has(key)) {
            mergedMap.set(key, rObj);
          }
        };

        (Array.isArray(riderSearchResults) ? riderSearchResults : []).forEach(addRider);

        activeCouriersList.forEach((c) => {
          const cid = String(c.id || c.courier_id || "");
          const uid = String(c.user_id || "");
          const name = normalizeText(c.name || c.courier_name || "");
          const cPhone = normalizePhoneDigits(c.phone_number || "");

          const phoneMatch =
            (qPhone.core10 && cPhone.core10 === qPhone.core10) ||
            (qPhone.rawDigits.length >= 7 && cPhone.rawDigits.includes(qPhone.rawDigits));
          const idMatch =
            (uid && (uid === cleanDigits || (cleanDigits.length >= 5 && uid.includes(cleanDigits)))) ||
            (cid && cid === cleanDigits);
          const nameMatch = name && !/^\d+$/.test(cleanDigits) && name.toLowerCase().includes(qLower);

          if (phoneMatch || idMatch || nameMatch) {
            addRider({
              courierId: cid,
              userId: uid || cid,
              name: name || `Courier #${cid}`,
              phone: c.phone_number || "",
              status: mapRawStatusLabel(c.status),
              statusUntil: c.status_until || "",
              statusReason: c.status_reason || ""
            });
          }
        });

        Object.entries(knownCouriersMeta || {}).forEach(([cid, meta]) => {
          if (!meta) return;
          const mPhone = normalizePhoneDigits(meta.phone || "");
          const phoneMatch =
            (qPhone.core10 && mPhone.core10 === qPhone.core10) ||
            (qPhone.rawDigits.length >= 7 && mPhone.rawDigits.includes(qPhone.rawDigits));
          const idMatch =
            String(cid) === cleanDigits || (meta.userId && String(meta.userId) === cleanDigits);
          const nameMatch = meta.name && !/^\d+$/.test(cleanDigits) && meta.name.toLowerCase().includes(qLower);

          if (phoneMatch || idMatch || nameMatch) {
            addRider({
              courierId: String(cid),
              userId: String(meta.userId || ""),
              name: meta.name || `Courier #${cid}`,
              phone: meta.phone || "",
              status: mapRawStatusLabel(meta.rawStatus || meta.status),
              statusUntil: meta.statusUntil || "",
              statusReason: meta.statusReason || ""
            });
          }
        });

        return Array.from(mergedMap.values());
      }, [riderSearchReq, riderSearchResults, activeCouriersList, knownCouriersMeta]);

      // --- 0) GOOGLE SIGN-IN & GMAIL WHITELIST GATE ---
      if (authState !== "authorized") {
        return (
          <div className="min-h-screen w-full bg-slate-50 flex flex-col items-center justify-center p-4 text-gray-800">
            <div className="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
              <div className="px-6 py-5 bg-gradient-to-r from-slate-900 to-slate-800 text-white flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">🚴‍♂️</span>
                  <div>
                    <h1 className="text-lg font-bold tracking-tight">Hurrier Live Operations</h1>
                    <p className="text-xs text-slate-300">v{APP_VERSION} • Secured Google Access</p>
                  </div>
                </div>
                <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-200 border border-emerald-400/30">
                  Protected
                </span>
              </div>

              <div className="p-6 space-y-5">
                {authState === "needs_api_key" && (
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      const clean = apiKeyDraft.trim();
                      if (!clean) return;
                      try {
                        window.localStorage.setItem("hurrier_firebase_web_api_key", clean);
                      } catch {}
                      setFirebaseApiKey(clean);
                    }}
                    className="space-y-3"
                  >
                    <div className="p-3 rounded-lg bg-amber-50 border border-amber-200 text-xs text-amber-900 leading-relaxed">
                      <strong>إعداد لمرة واحدة:</strong> أدخل <strong>Firebase Web API Key</strong> الخاص بمشروع{" "}
                      <code className="bg-white px-1 rounded">hurrier-live</code>.
                    </div>
                    <input
                      type="text"
                      value={apiKeyDraft}
                      onChange={(e) => setApiKeyDraft(e.target.value)}
                      placeholder="AIzaSy..."
                      className="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm font-mono focus:outline-none focus:border-blue-500"
                    />
                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm"
                    >
                      حفظ وتفعيل تسجيل الدخول ←
                    </button>
                  </form>
                )}

                {authState === "checking" && (
                  <div className="py-8 text-center space-y-2">
                    <div className="text-blue-600 font-bold text-sm animate-pulse">
                      ⏳ جاري التحقق من صلاحية الحساب...
                    </div>
                  </div>
                )}

                {authState === "signed_out" && (
                  <div className="space-y-4 text-center">
                    <div className="space-y-1">
                      <h2 className="text-base font-bold text-gray-900">تسجيل الدخول للمتابعة</h2>
                      <p className="text-xs text-gray-500">
                        الدخول مقتصر على حسابات Gmail المصرح لها فقط
                      </p>
                    </div>

                    <button
                      type="button"
                      disabled={isSigningIn}
                      onClick={handleGoogleSignIn}
                      className={`w-full py-3 px-4 rounded-xl border border-gray-300 font-bold text-sm shadow-sm flex items-center justify-center gap-3 transition-all ${
                        isSigningIn
                          ? "bg-gray-100 text-gray-500 cursor-wait"
                          : "bg-white hover:bg-gray-50 text-gray-800"
                      }`}
                    >
                      <svg className="w-5 h-5" viewBox="0 0 24 24">
                        <path
                          fill="#EA4335"
                          d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"
                        />
                        <path
                          fill="#4285F4"
                          d="M23.5 12.3c0-.8-.1-1.7-.2-2.5H12v4.8h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"
                        />
                        <path
                          fill="#FBBC05"
                          d="M5.3 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.6 7.4C.6 9.4 0 11.6 0 14s.6 4.6 1.6 6.6l3.7-2.8z"
                        />
                        <path
                          fill="#34A853"
                          d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 21.4 7.4 24 12 24z"
                        />
                      </svg>
                      <span>{isSigningIn ? "⏳ جاري فتح نافذة Google..." : "Sign in with Google"}</span>
                    </button>

                    {authErrorMsg && (
                      <div className="p-3 rounded-lg bg-red-50 border border-red-200 text-xs text-red-700">
                        {authErrorMsg}
                      </div>
                    )}
                  </div>
                )}

                {authState === "unauthorized" && (
                  <div className="space-y-4 text-center">
                    <div className="p-4 rounded-xl bg-red-50 border border-red-200 space-y-1.5">
                      <div className="text-red-700 font-bold text-sm">⛔ هذا الإيميل غير مصرح له بالدخول</div>
                      <div className="text-xs font-mono text-gray-700">{currentUser?.email}</div>
                      <p className="text-xs text-gray-600 pt-1">
                        تواصل مع الأدمن لإضافة إيميلك في قائمة المسموح لهم ثم أعد المحاولة.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={handleGoogleSignOut}
                      className="w-full py-2.5 rounded-xl bg-gray-900 hover:bg-gray-800 text-white font-bold text-xs"
                    >
                      تبديل حساب Google (Switch Account)
                    </button>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // --- 1) MANDATORY ZONE SELECTION GATE SCREEN ---
      if (!isZoneSetupConfirmed) {
        return (
          <div className="min-h-screen w-full bg-slate-50 flex flex-col items-center justify-start md:justify-center p-2.5 sm:p-6 text-gray-800">
            <div className="w-full max-w-4xl bg-white rounded-2xl shadow-xl border border-gray-200 flex flex-col md:overflow-hidden md:max-h-[92vh]">
              <div
                dir="rtl"
                className="px-4 py-3.5 sm:px-6 sm:py-5 bg-gradient-to-r from-slate-900 to-slate-800 text-white flex flex-wrap items-center justify-between gap-2.5 rounded-t-2xl"
              >
                <div className="flex items-center gap-2.5 min-w-0">
                  <span className="text-xl sm:text-2xl flex-shrink-0">🚴‍♂️</span>
                  <div className="min-w-0">
                    <div className="flex flex-wrap items-center gap-1.5 sm:gap-2">
                      <h1 className="text-sm sm:text-xl font-bold tracking-tight leading-snug">
                        تحديد الزونات قبل بدء المتابعة
                      </h1>
                      <span className="text-[10px] sm:text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-400/20 text-emerald-200 border border-emerald-300/40">
                        ★ v{APP_VERSION} • {userRole === "admin" ? "Admin" : "Employee"}
                      </span>
                    </div>
                    <p className="text-[11px] sm:text-xs text-slate-300 mt-0.5 truncate">
                      مسجل الدخول بـ: <strong className="text-white">{currentUser?.email}</strong>
                    </p>
                  </div>
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  {userRole === "admin" && (
                    <button
                      type="button"
                      onClick={() => setIsAdminModalOpen(true)}
                      className="px-2.5 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs transition-colors"
                    >
                      🛡️ إدارة الإيميلات
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={handleGoogleSignOut}
                    className="px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white font-semibold text-xs transition-colors"
