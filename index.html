    function isRealHurrierZoneId(id) {
      const n = Number(id);
      return Number.isInteger(n) && n >= 10000 && n < 90000;
    }

    function normalizeText(v) {
      return String(v || "").replace(/\s+/g, " ").trim();
    }

    function isTalabatMartVendor(vendorName) {
      const s = normalizeText(vendorName).toLowerCase();
      return s.includes("talabat mart") || s.includes("طلبات مارت") || s.includes("tmart");
    }

    function extractMartBranchLabel(vendorName) {
      const raw = normalizeText(vendorName);
      if (!raw) return "Unknown Mart";
      const cleaned = raw
        .replace(/^vo\s*#?\d+\s*-\s*/i, "")
        .replace(/^talabat\s*mart\s*,?\s*/i, "")
        .replace(/^طلبات\s*مارت\s*,?\s*/i, "")
        .replace(/^tmart\s*,?\s*/i, "")
        .trim();
      return cleaned || raw;
    }

    function formatRelativeDeadline(isoDate, isPreorder = false) {
      if (!isoDate) return "-";
      const target = new Date(isoDate);
      if (Number.isNaN(target.getTime())) return "-";
      if (isPreorder) {
        return target.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      }
      const diffMins = Math.round((target.getTime() - Date.now()) / 60000);
      const absMins = Math.abs(diffMins);
      const sign = diffMins < 0 ? "-" : "";
      if (absMins >= 60) {
        const h = Math.floor(absMins / 60);
        const m = absMins % 60;
        return `${sign}${h}h ${m}min`;
      }
      return `${sign}${absMins}min`;
    }

    function formatReadableTimestamp(isoDate) {
      if (!isoDate) return "-";
      const d = new Date(isoDate);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleString("en-US", {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatExactTimeSeconds(val) {
      if (!val) return "-";
      const d = typeof val === "number" ? new Date(val > 1e12 ? val : val * 1000) : new Date(val);
      if (Number.isNaN(d.getTime())) return String(val);
      return d.toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });
    }

    function formatDurationMinutes(minutes) {
      if (minutes === null || minutes === undefined || Number.isNaN(Number(minutes))) return "-";
      const m = Math.round(Number(minutes));
      if (Math.abs(m) >= 60) {
        const h = Math.floor(Math.abs(m) / 60);
        const rem = Math.abs(m) % 60;
        return `${m < 0 ? "-" : ""}${h}h ${rem}m`;
      }
      return `${m}m`;
    }

    function formatMoney(amount, currency = "EGP") {
      if (amount === null || amount === undefined || amount === "") return "-";
      const num = Number(amount);
      if (Number.isNaN(num)) return String(amount);
      const val = Math.abs(num) > 5000 && Number.isInteger(num) ? num / 100 : num;
      return `${val.toFixed(2)} ${currency}`;
    }

    function isValidPhoneCandidate(str) {
      const s = normalizeText(str);
      if (!s) return false;
      const digitsOnly = s.replace(/[^\d+]/g, "");
      if (digitsOnly.length < 8 || digitsOnly.length > 16) return false;
      if (/^(010|011|012|015|\+2010|\+2011|\+2012|\+2015|2010|2011|2012|2015)\d{7,8}$/.test(digitsOnly)) {
        return true;
      }
      return /^\+?\d{9,15}$/.test(digitsOnly);
    }

    function extractPhoneFromAnyText(text) {
      const s = String(text || "");
      if (!s) return "";
      const telMatch = s.match(/tel:\s*([+\d][\d\s\-().]{7,18})/i);
      if (telMatch && isValidPhoneCandidate(telMatch[1])) {
        return normalizeText(telMatch[1]);
      }
      const egMobileMatch = s.match(/(?:\+?20)?0?1[0125]\d{8}/);
      if (egMobileMatch) {
        const raw = egMobileMatch[0];
        if (raw.startsWith("+")) return raw;
        if (raw.startsWith("201")) return `+${raw}`;
        return raw.startsWith("0") ? raw : `0${raw}`;
      }
      return "";
    }

    function extractCustomerInfoFromOrder(orderObj, detailRawObj) {
      const sources = [
        detailRawObj?.customerExtra,
        detailRawObj?.customerExtra2,
        detailRawObj?.detail?.customer,
        detailRawObj?.detail?.customer_details,
        detailRawObj?.detail?.recipient,
        detailRawObj?.detail?.order?.customer,
        detailRawObj?.detail?.order?.customer_details,
        detailRawObj?.detail?.order?.recipient,
        detailRawObj?.detailFull?.customer,
        detailRawObj?.detailFull?.order?.customer,
        detailRawObj?.detailShort?.customer,
        detailRawObj?.detailShort?.order?.customer,
        orderObj?.customer,
        orderObj?.customer_details,
        orderObj?.recipient,
        orderObj
      ].filter((x) => x && typeof x === "object");

      const addrSources = [
        orderObj?.dropoff_address,
        orderObj?.delivery_address,
        orderObj?.customer_address,
        detailRawObj?.detail?.dropoff_address,
        detailRawObj?.detail?.delivery_address,
        detailRawObj?.detail?.order?.dropoff_address,
        detailRawObj?.detail?.order?.delivery_address,
        detailRawObj?.detailFull?.dropoff_address,
        detailRawObj?.detailFull?.order?.dropoff_address,
        detailRawObj?.customerExtra?.dropoff_address,
        detailRawObj?.customerExtra?.delivery_address,
        detailRawObj?.customerExtra?.address,
        ...sources.map((s) => s.address || s.default_address || s.delivery_address || s.dropoff_address)
      ].filter((x) => x && typeof x === "object");

      let name = "";
      for (const src of sources) {
        const first = normalizeText(src.first_name || src.firstName);
        const last = normalizeText(src.last_name || src.lastName);
        const full = normalizeText(
          src.customer_name ||
            src.customerName ||
            src.full_name ||
            src.fullName ||
            src.recipient_name ||
            src.contact_name ||
            src.name ||
            (first || last ? `${first} ${last}` : "")
        );
        if (full && !/^customer\s*#?\d*$/i.test(full)) {
          name = full;
          break;
        }
      }

      if (!name) {
        for (const aSrc of addrSources) {
          const rName = normalizeText(aSrc.recipient_name || aSrc.contact_name || aSrc.name);
          if (rName && !/^customer\s*#?\d*$/i.test(rName)) {
            name = rName;
            break;
          }
        }
      }

      if (!name) {
        const tagCust =
          (Array.isArray(orderObj.tags) ? orderObj.tags : [])
            .map((t) => String(t || ""))
            .find((t) => /customer|address_id|external/i.test(t)) || "";
        const numMatch = tagCust.match(/\d{5,}/);
        name = numMatch ? `Customer #${numMatch[0]}` : "Customer";
      }

      let phone = "";
      const phoneKeys = [
        "phone",
        "mobile",
        "mobile_number",
        "phone_number",
        "customer_phone",
        "recipient_phone",
        "contact_phone",
        "contact_number",
        "tel"
      ];

      for (const src of [...sources, ...addrSources]) {
        for (const k of phoneKeys) {
          const val = src[k];
          if (!val) continue;
          if (typeof val === "object") {
            const nestedPhone = normalizeText(
              val.number || val.phone || val.mobile || val.raw || val.formatted || ""
            );
            if (isValidPhoneCandidate(nestedPhone)) {
              phone = nestedPhone;
              break;
            }
            const extractedNested = extractPhoneFromAnyText(JSON.stringify(val));
            if (extractedNested) {
              phone = extractedNested;
              break;
            }
          } else {
            const candidate = normalizeText(val);
            if (isValidPhoneCandidate(candidate)) {
              phone = candidate;
              break;
            }
            const extracted = extractPhoneFromAnyText(candidate);
            if (extracted) {
              phone = extracted;
              break;
            }
          }
        }
        if (phone) break;
      }

      if (!phone && detailRawObj) {
        try {
          const serialized = JSON.stringify(detailRawObj);
          const foundInJson = extractPhoneFromAnyText(serialized);
          if (foundInJson) phone = foundInJson;
        } catch {
          // تجاهل
        }
      }

      const pickField = (keys) => {
        for (const src of [...addrSources, ...sources]) {
          for (const k of keys) {
            const v = src[k];
            if (v !== undefined && v !== null && normalizeText(v) !== "") {
              return normalizeText(v);
            }
          }
        }
        return "NA";
      };

      const apartment = pickField(["apartment", "apartment_number", "apt", "flat", "unit"]);
      const building = pickField(["building", "building_number", "building_name", "house_number"]);
      const floor = pickField(["floor", "floor_number", "level"]);
      const zipcode = pickField(["zipcode", "zip_code", "postal_code"]);
      const intercom = pickField(["intercom", "buzzer"]);
      const entrance = pickField(["entrance", "door", "gate"]);
      const deliveryNote = pickField(["instructions", "delivery_instructions", "delivery_note", "note", "comment", "address_line_2"]);

      let streetAddress = "";
      for (const aSrc of addrSources) {
        const s = normalizeText(
          aSrc.street_address ||
            aSrc.formatted_address ||
            aSrc.full_address ||
            aSrc.address_line_1 ||
            aSrc.street ||
            aSrc.address
        );
        if (s) {
          streetAddress = s;
          break;
        }
      }

      return { name, phone, apartment, building, floor, zipcode, intercom, entrance, deliveryNote, streetAddress };
    }

    function mapHurrierRecordToDelivery(rec, tabName) {
      const order = rec.order || rec;
      const instructions = [];
      if (order.is_cash_collection || rec.is_cash_collection) instructions.push("Cash");
      if (order.is_card_on_delivery) instructions.push("Card");

      const vRaw = String(order.vertical_type || order.vertical || rec.vertical_type || "").toLowerCase();
      if (isTalabatMartVendor(order.vendor_name || rec.vendor_name)) {
        instructions.push("Darkstores");
      } else if (vRaw.includes("darkstore")) {
        instructions.push("Darkstores");
      } else if (vRaw.includes("supermarket") || vRaw.includes("grocery")) {
        instructions.push("Supermarket");
      } else if (vRaw.includes("restaurant")) {
        instructions.push("Restaurants");
      } else if (vRaw) {
        instructions.push(vRaw.replace(/_/g, " "));
      } else {
        instructions.push("Restaurants");
      }

      const statusRaw = rec.status || order.status || (tabName === "Queued" ? "queued" : "active");
      const statusLabel = String(statusRaw)
        .split("_")
        .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
        .join(" ");

      const scheduledDropoff = order.scheduled_dropoff_at || rec.scheduled_dropoff_at || order.promised_delivery_at;
      const deadlineStr = formatRelativeDeadline(scheduledDropoff, tabName === "Pre-order");
      const distKm = typeof rec.distance === "number" ? `${(rec.distance / 1000).toFixed(2)} km` : "-";
      const rawOrderVal = order.order_value ?? order.total_amount ?? rec.order_value;
      const valEgp = rawOrderVal !== undefined ? formatMoney(rawOrderVal, "EGP") : "-";

      const rawZones = Array.isArray(rec.starting_points)
        ? rec.starting_points.map((sp) => (typeof sp === "object" ? sp?.name || sp?.id : sp)).filter(Boolean)
        : Array.isArray(order.starting_points)
        ? order.starting_points.map((sp) => (typeof sp === "object" ? sp?.name || sp?.id : sp)).filter(Boolean)
        : ["Cairo"];

      const rawZoneObjects = Array.isArray(rec.starting_points)
        ? rec.starting_points
            .filter((sp) => sp && typeof sp === "object" && (sp.id || sp.starting_point_id) && (sp.name || sp.starting_point_name))
            .map((sp) => ({
              id: Number(sp.id || sp.starting_point_id),
              name: normalizeText(sp.name || sp.starting_point_name),
              city: rec.city_name || order.city_name || "Cairo"
            }))
        : [];

      const orderIdNum = String(rec.display_id || order.code || rec.order_id || rec.id || "");
      const courierName = rec.courier_name || order.courier_name || (tabName === "Queued" ? "Assigning..." : "-");
      const isSplit = Boolean(
        orderIdNum.includes("-") ||
          rec.is_split ||
          order.is_split ||
          (Array.isArray(order.deliveries) && order.deliveries.length > 1)
      );

      return {
        uid: `${tabName}-${orderIdNum}-${rec.id || courierName}-${Math.random().toString(36).slice(2, 6)}`,
        id: orderIdNum,
        orderCode: order.order_code || `HF_EG${orderIdNum.split("-")[0]}`,
        vendor: order.vendor_name || rec.vendor_name || "Unknown Vendor",
        vo: order.vendor_order_number || order.vo || "-",
        deadline: deadlineStr,
        courier: courierName,
        courierId: rec.courier_id || order.courier_id || null,
        status: statusLabel,
        time_in: deadlineStr.startsWith("-") ? deadlineStr : "-",
        time_at: formatReadableTimestamp(scheduledDropoff),
        zone: rawZones.join(", "),
        zonesList: rawZones,
        zoneObjects: rawZoneObjects,
        city: rec.city_name || order.city_name || "Cairo",
        instructions,
        tab: tabName,
        distance: distKm,
        orderValue: valEgp,
        isSplit,
        rawRecord: rec
      };
    }

    function getOrCreateEmployeeSessionId() {
      try {
        const key = "hurrier_emp_session_id";
        let existing = sessionStorage.getItem(key);
        if (!existing) {
          existing = `emp_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
          sessionStorage.setItem(key, existing);
        }
        return existing;
      } catch {
        return `emp_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
      }
    }

      const copyToClipboard = useCallback((label, text) => {

      const registerSessionInFirebase = useCallback(

      const handleResetToZoneSelection = useCallback(async () => {

      // Persist active tab across refreshes
      useEffect(() => {
        try {

      // Register session immediately on mount/refresh & send heartbeat every 15s while monitoring
      useEffect(() => {
        if (!isZoneSetupConfirmed || selectedZoneIds.length === 0) return;

        const hbTimer = setInterval(() => {
          fetch(`${FIREBASE_DB_URL}/active_sessions/${sessionId}/heartbeat_at.json`, {
            method: "PUT",
            body: JSON.stringify(Date.now())
          }).catch(() => {});
        }, 15000);

        const handleUnload = () => {

            unregisterSessionFromFirebase(true);

        };

        window.addEventListener("beforeunload", handleUnload);
        return () => {
          clearInterval(hbTimer);
          window.removeEventListener("beforeunload", handleUnload);

      }, [isZoneSetupConfirmed, selectedZoneIds, sessionId, employeeName, registerSessionInFirebase, unregisterSessionFromFirebase]);

      const requestOrderDetailsFromHurrier = useCallback(async (orderId) => {
        if (!orderId) return;
        const cleanId = String(orderId).replace(/^HF_[A-Z]{2}/i, "").trim();
        if (!cleanId) return;
        try {
          const curRes = await fetch(`${FIREBASE_DB_URL}/config/requested_order_details.json`, { cache: "no-store" });
          const curList = curRes.ok ? await curRes.json() : [];
          const nextList = Array.from(
            new Set([cleanId, ...(Array.isArray(curList) ? curList.map(String) : [])])
          ).slice(0, 10);
          await fetch(`${FIREBASE_DB_URL}/config/requested_order_details.json`, {
            method: "PUT",
            body: JSON.stringify(nextList)
          });
        } catch {
          // تجاهل
        }
      }, []);

      const handleOrderRowHover = useCallback(
        (orderId) => {
          if (!orderId) return;
          const cleanId = String(orderId).replace(/^HF_[A-Z]{2}/i, "").trim();
          if (!cleanId || prewarmedOrderIdsRef.current.has(cleanId)) return;
          if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
          hoverTimerRef.current = setTimeout(() => {
            prewarmedOrderIdsRef.current.add(cleanId);
            requestOrderDetailsFromHurrier(cleanId);
          }, 220);
        },
        [requestOrderDetailsFromHurrier]
      );

      const fetchSingleOrderDetailDoc = useCallback(async (orderId) => {
        if (!orderId) return;
        const cleanId = String(orderId).replace(/^HF_[A-Z]{2}/i, "").trim();
        if (!cleanId) return;
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/order_details/${cleanId}.json`, { cache: "no-store" });
          if (res.ok) {
            const doc = await res.json();
            if (doc && typeof doc === "object") {
              setLiveOrderDetailDoc(doc);
            }
          }
        } catch {
          // تجاهل
        }
      }, []);

      useEffect(() => {
        if (!selectedOrder) {
          setLiveOrderDetailDoc(null);

        }
        setDetailModalTab("Deliveries");
        setLiveOrderDetailDoc(null);
        fetchSingleOrderDetailDoc(selectedOrder.id);
        requestOrderDetailsFromHurrier(selectedOrder.id);

        const pollTimer = setInterval(() => {
          if (selectedOrderRef.current?.id) {
            fetchSingleOrderDetailDoc(selectedOrderRef.current.id);
          }
        }, 600);

        return () => clearInterval(pollTimer);
      }, [selectedOrder, fetchSingleOrderDetailDoc, requestOrderDetailsFromHurrier]);

      const applySessionBundle = useCallback((bundle) => {
        if (!bundle || typeof bundle !== "object") return;

        const bucketMap = [
          { key: "active", tab: "Active" },
          { key: "queued", tab: "Queued" },
          { key: "dispatched", tab: "Dispatched" },
          { key: "actionable", tab: "Actionable" },
          { key: "preorder", tab: "Pre-order" },
          { key: "waitingAssembly", tab: "Waiting for Assembly" }
        ];

        const nextDeliveries = [];
        const nextCounts = {};

        bucketMap.forEach(({ key, tab }) => {
          const payload = bundle[key];
          const recs = Array.isArray(payload?.records)
            ? payload.records
            : Array.isArray(payload)
            ? payload
            : [];
          recs.forEach((r) => nextDeliveries.push(mapHurrierRecordToDelivery(r, tab)));
          nextCounts[tab] = payload?.metadata?.total_count ?? recs.length;
        });

        setDeliveries(nextDeliveries);
        setTabCounts(nextCounts);

        if (bundle.stats && Array.isArray(bundle.stats.cities)) {
          const summaries = [];
          const zones = [];

          bundle.stats.cities.forEach((c) => {
            const s = c.stat || {};
            summaries.push({
              city: c.city_name,
              queued: s.queued_count ?? 0,
              queuedPct: s.queued_percent ?? 0,
              dispatched: s.dispatched_count ?? 0,
              dispatchedPct: s.dispatched_percent ?? 0,
              active: s.active_count ?? 0,
              activePct: s.active_percent ?? 0,
              delay: `${Number(s.delay || 0).toFixed(1)}m`,
              puPct: s.picked_up_percent ?? 0,
              doPct: s.drop_off_percent ?? 0,
              zeroDel: s.zero_deliveries ?? 0,
              lowDel: s.low_deliveries ?? 0,
              medDel: s.medium_deliveries ?? 0,
              highDel: s.high_deliveries ?? 0,
              starting: s.couriers_in_starting ?? 0,
              working: s.couriers_in_working ?? 0,
              ending: s.couriers_in_ending ?? 0,
              tempBreak: s.couriers_in_temp_break ?? 0,
              break: s.couriers_in_break ?? 0
            });

            (c.zones || []).forEach((z) => {
              const zDelay = `${Number(z.stat?.delay || 0).toFixed(1)}m`;
              (z.starting_points || []).forEach((sp) => {
                const st = sp.stat || {};
                zones.push({
                  id: sp.id,
                  zone: sp.name,
                  city: c.city_name,
                  starting: st.couriers_in_starting ?? 0,
                  working: st.couriers_in_working ?? 0,
                  ending: st.couriers_in_ending ?? 0,
                  break: st.couriers_in_break ?? 0,
                  tempBreak: st.couriers_in_temp_break ?? 0,
                  delay: st.delay ? `${Number(st.delay).toFixed(1)}m` : zDelay,
                  queued: st.queued_count ?? 0,
                  dispatched: st.dispatched_count ?? 0,
                  active: st.active_count ?? 0,
                  puPercent: st.picked_up_percent ?? 0,
                  doPercent: st.drop_off_percent ?? 0,
                  zeroDel: st.zero_deliveries ?? 0,
                  lowDel: st.low_deliveries ?? 0,
                  medDel: st.medium_deliveries ?? 0,
                  highDel: st.high_deliveries ?? 0
                });
              });
            });
          });

          if (summaries.length > 0) setCitySummary(summaries);
          if (zones.length > 0) setCouriers(zones);
        }

        if (Array.isArray(bundle.discoveredZonesList) && bundle.discoveredZonesList.length > 0) {
          setDiscoveredZonesFromBundle(bundle.discoveredZonesList);
        }

        if (Array.isArray(bundle.dispatchers)) {
          setDispatcherStats(
            bundle.dispatchers.map((d) => ({
              picked_by: d.picked_by || d.email || "Dispatcher",
              picked: d.picked ?? 0,
              processing: d.processing ?? 0,
              max_picked_for: d.min_picked_at ? formatRelativeDeadline(d.min_picked_at).replace("-", "") : "-"
            }))
          );
        }

        const rawIssues = Array.isArray(bundle.issues?.issues)
          ? bundle.issues.issues
          : Array.isArray(bundle.issues?.records)
          ? bundle.issues.records
          : Array.isArray(bundle.issues)
          ? bundle.issues
          : [];
        setIssuesList(rawIssues);

        if (bundle.syncedAt) {
          const d = new Date(bundle.syncedAt);
          if (!Number.isNaN(d.getTime())) {
            setLastSyncTime(d.toLocaleTimeString("en-US", { hour12: true }));

        setConnectionStatus("live");

      const fetchMySessionBundleFromFirebase = useCallback(async () => {
        if (!isZoneSetupConfirmed) return;
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/session_bundles/${sessionId}.json`, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (data) {
            applySessionBundle(data);
          } else {
            setConnectionStatus("waiting");
          }
        } catch {
          setConnectionStatus("error");
        }
      }, [applySessionBundle, isZoneSetupConfirmed, sessionId]);

      useEffect(() => {
        if (!isZoneSetupConfirmed) return;
        fetchMySessionBundleFromFirebase();
        const interval = setInterval(fetchMySessionBundleFromFirebase, 2000);
        return () => clearInterval(interval);
      }, [fetchMySessionBundleFromFirebase, isZoneSetupConfirmed]);

      const availableZones = useMemo(() => {
        const map = new Map();
        ALL_ZONES_CATALOG.forEach((z) => {
          const numId = Number(z.id);
          if (!isRealHurrierZoneId(numId)) return;
          const key = normalizeText(z.name).toLowerCase();
          map.set(key, { ...z, id: numId });
        });
        discoveredZonesFromBundle.forEach((z) => {
          const numId = Number(z?.id);
          if (z && z.name && isRealHurrierZoneId(numId)) {
            const key = normalizeText(z.name).toLowerCase();
            const existing = map.get(key);
            map.set(key, {
              id: existing ? existing.id : numId,
              name: normalizeText(z.name),
              city: z.city || existing?.city || "Cairo"
            });
          }
        });
        return Array.from(map.values())
          .filter((z) => selectedCity === "All Cities" || z.city === selectedCity)
          .sort((a, b) => String(a.name).localeCompare(String(b.name)));
      }, [discoveredZonesFromBundle, selectedCity]);

      const selectedZoneNames = useMemo(() => {
        if (!Array.isArray(selectedZoneIds) || selectedZoneIds.length === 0) return [];
        const idSet = new Set(selectedZoneIds.map(Number));
        return availableZones
          .filter((z) => idSet.has(Number(z.id)))
          .map((z) => normalizeText(z.name).toLowerCase())
          .filter(Boolean);
      }, [availableZones, selectedZoneIds]);

      const matchesZoneFilter = useCallback(
        (delivery) => {
          if (selectedZoneIds.length === 0) return false;
          const recZoneIds = (delivery.zoneObjects || [])
            .map((zo) => Number(zo.id))
            .filter((n) => !Number.isNaN(n) && n > 0);
          if (recZoneIds.some((zid) => selectedZoneIds.map(Number).includes(zid))) return true;

          const recNames = [
            ...(delivery.zonesList || []),
            ...(delivery.zoneObjects || []).map((zo) => zo.name),
            delivery.zone
          ]
            .map((n) => normalizeText(n).toLowerCase())
            .filter(Boolean);

          return selectedZoneNames.some((selName) =>
            recNames.some((rn) => rn === selName || rn.includes(selName) || selName.includes(rn))
          );
        },
        [selectedZoneIds, selectedZoneNames]
      );

      const baseTabDeliveries = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return deliveries.filter((d) => {
          const matchesTab = d.tab === activeTab;
          const matchesZone = matchesZoneFilter(d);
          const matchesSearch =
            !q ||
            d.id.toLowerCase().includes(q) ||
            d.vendor.toLowerCase().includes(q) ||
            d.courier.toLowerCase().includes(q) ||
            d.zone.toLowerCase().includes(q);
          return matchesTab && matchesZone && matchesSearch;
        });
      }, [deliveries, activeTab, matchesZoneFilter, searchQuery]);

      const martBranchesSummary = useMemo(() => {
        const martOrders = baseTabDeliveries.filter((d) => isTalabatMartVendor(d.vendor));
        const branchMap = new Map();
        martOrders.forEach((d) => {
          const label = extractMartBranchLabel(d.vendor);
          const isLate = d.deadline.includes("-") || d.deadline === "Late";
          const current = branchMap.get(label) || { label, count: 0, late: 0 };
          current.count += 1;
          if (isLate) current.late += 1;
          branchMap.set(label, current);
        });

        return {
          totalMartCount: martOrders.length,
          branches: Array.from(branchMap.values()).sort((a, b) => b.count - a.count)
        };
      }, [baseTabDeliveries]);

      const filteredDeliveries = useMemo(() => {
        const list = baseTabDeliveries.filter((d) => {
          const isLate = d.deadline.includes("-") || d.deadline === "Late";
          const hasCash = d.instructions.includes("Cash");
          const hasCard = d.instructions.includes("Card");
          const isMart = isTalabatMartVendor(d.vendor);
          const isDarkstore = isMart || d.instructions.includes("Darkstores");
          const isRestaurant =
            !isDarkstore && (d.instructions.includes("Restaurants") || d.instructions.includes("Supermarket"));

          if (activeQuickFilter === "Delayed" && !isLate) return false;
          if (activeQuickFilter === "Cash" && !hasCash) return false;
          if (activeQuickFilter === "Card" && !hasCard) return false;
          if (activeQuickFilter === "Restaurants" && !isRestaurant) return false;
          if (activeQuickFilter === "Darkstores") {
            if (!isDarkstore) return false;
            if (selectedMartBranch !== "ALL") {
              const branchLabel = extractMartBranchLabel(d.vendor);
              if (normalizeText(branchLabel) !== normalizeText(selectedMartBranch)) return false;
            }
          }
          if (activeQuickFilter === "Split" && !d.isSplit) return false;

          return true;
        });

        const getDeadlineMinutes = (d) => {
          const iso =
            d.rawRecord?.order?.scheduled_dropoff_at ||
            d.rawRecord?.scheduled_dropoff_at ||
            d.rawRecord?.order?.promised_delivery_at;
          if (!iso) return 0;
          const t = new Date(iso).getTime();
          if (Number.isNaN(t)) return 0;
          return Math.round((t - Date.now()) / 60000);
        };

        return [...list].sort((a, b) => {
          if (orderSortMode === "hurrier_order") return 0;
          const ma = getDeadlineMinutes(a);
          const mb = getDeadlineMinutes(b);
          if (orderSortMode === "live_first") {
            const aIsRecent = ma > -1440;
            const bIsRecent = mb > -1440;
            if (aIsRecent !== bIsRecent) return aIsRecent ? -1 : 1;

          }
          return ma - mb;

        const lateCount = baseTabDeliveries.filter((d) => d.deadline.includes("-") || d.deadline === "Late").length;
        const cashCount = baseTabDeliveries.filter((d) => d.instructions.includes("Cash")).length;
        const cardCount = baseTabDeliveries.filter((d) => d.instructions.includes("Card")).length;
        const darkstoreCount = baseTabDeliveries.filter(
          (d) => isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores")
        ).length;
        const restaurantCount = baseTabDeliveries.filter((d) => {
          const isDs = isTalabatMartVendor(d.vendor) || d.instructions.includes("Darkstores");
          return !isDs && (d.instructions.includes("Restaurants") || d.instructions.includes("Supermarket"));
        }).length;
        const splitCount = baseTabDeliveries.filter((d) => d.isSplit).length;
        const tabExactTotal = effectiveTabCounts[activeTab] ?? baseTabDeliveries.length;

        const quickFilters = [
          { id: "All", label: `All (${tabExactTotal})` },
          { id: "Delayed", label: `Delayed (${lateCount})` },
          { id: "Cash", label: `Cash (${cashCount})` },
          { id: "Card", label: `Card (${cardCount})` },
          { id: "Restaurants", label: `Restaurants (${restaurantCount})` },
          { id: "Darkstores", label: `Darkstores - Talabat Mart (${darkstoreCount})` },
          { id: "Split", label: `Split Orders (${splitCount})` }

        return (
          <div className="mt-4 space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-gray-100">
              <div className="flex flex-wrap items-center gap-1.5">
                {quickFilters.map((qf) => {
                  const active = activeQuickFilter === qf.id;
                  return (
                    <button
                      key={qf.id}
                      type="button"
                      onClick={() => {
                        setActiveQuickFilter(qf.id);
                        setCurrentPage(1);

                      className={`px-3 py-1 rounded-full text-xs font-semibold border transition-colors ${
                        active
                          ? "bg-blue-600 text-white border-blue-600"
                          : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"

                    >
                      {qf.label}
                    </button>

              </div>

              <div className="flex items-center gap-2.5 text-xs text-gray-500">

                  type="button"

                  title="تبديل الترتيب بين ترتيب صفحات Hurrier الأصلية أو إظهار أوردرات النهاردة أولاً"
                >
                  {orderSortMode === "hurrier_order" ? "Order: Hurrier Default" : "Order: Live Today First"}

                <div>

                  type="button"

                      : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"
                  }`}
                >

                    <th className="py-3 px-3">ZONE / DISTANCE</th>

                          <td className="py-3.5 px-3 align-top">

                              {extraZonesCount > 0 && (

                                  +{extraZonesCount}
                                </span>
                              )}
                            </div>
                            <div className="text-xs text-gray-400 mt-0.5">
                              {item.distance} • {item.orderValue}
                            </div>
                          </td>

                          <td className="py-3.5 px-4 align-top">
                            <div className="flex gap-1.5 flex-wrap">
                              {item.instructions.map((inst, idx) => (
                                <span
                                  key={idx}
                                  className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium border ${
                                    inst === "Cash"
                                      ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                                      : inst === "Card"
                                      ? "bg-indigo-50 text-indigo-700 border-indigo-200"
                                      : "bg-white text-gray-700 border-gray-300"
                                  }`}
                                >
                                  {inst}
                                </span>
                              ))}
                              {item.isSplit && (
                                <span className="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-purple-50 text-purple-700 border border-purple-200">
                                  Split
                                </span>
                              )}
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>

            {totalPages > 1 && (
              <div className="pt-3 pb-6 flex flex-wrap items-center justify-between gap-3">
                <div className="text-xs text-gray-500">
                  Showing <strong>{(currentPage - 1) * PAGE_SIZE + (paginatedDeliveries.length > 0 ? 1 : 0)}</strong>–
                  <strong>{(currentPage - 1) * PAGE_SIZE + paginatedDeliveries.length}</strong> of{" "}
                  <strong>{totalItemsForPagination}</strong>
                </div>

                <div className="flex items-center gap-1 select-none">
                  <button
                    type="button"
                    disabled={currentPage <= 1}
                    onClick={() => handlePageChange(currentPage - 1)}
                    className={`w-9 h-9 flex items-center justify-center rounded text-base font-bold transition-colors ${
                      currentPage <= 1 ? "text-gray-300 cursor-not-allowed" : "text-gray-600 hover:bg-gray-100"
                    }`}
                  >
                    ‹
                  </button>

                  {visiblePageNumbers.map((p, idx) =>
                    p === "..." ? (
                      <span key={`dots-${idx}`} className="px-2 text-gray-400 text-sm">
                        ...
                      </span>
                    ) : (
                      <button
                        key={p}
                        type="button"
                        onClick={() => handlePageChange(p)}
                        className={`min-w-[36px] h-9 px-2.5 flex items-center justify-center text-sm transition-colors ${
                          Number(currentPage) === Number(p)
                            ? "border-b-2 border-blue-600 text-blue-600 font-bold"
                            : "text-gray-700 hover:bg-gray-100 rounded font-medium"
                        }`}
                      >
                        {p}
                      </button>
                    )
                  )}

                  <button
                    type="button"
                    disabled={currentPage >= totalPages}
                    onClick={() => handlePageChange(currentPage + 1)}
                    className={`w-9 h-9 flex items-center justify-center rounded text-base font-bold transition-colors ${
                      currentPage >= totalPages ? "text-gray-300 cursor-not-allowed" : "text-gray-600 hover:bg-gray-100"
                    }`}
                  >
                    ›
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const num = Number(jumpPageInput);
                    if (num >= 1 && num <= totalPages) {
                      handlePageChange(num);
                      setJumpPageInput("");
                    }
                  }}
                  className="flex items-center gap-1.5 text-xs"
                >
                  <span className="text-gray-500">Go to:</span>
                  <input
                    type="number"
                    min={1}
                    max={totalPages}
                    value={jumpPageInput}
                    onChange={(e) => setJumpPageInput(e.target.value)}
                    placeholder={`1-${totalPages}`}
                    className="w-16 px-2 py-1 border border-gray-300 rounded text-xs focus:outline-none focus:border-blue-500"
                  />
                  <button
                    type="submit"
                    className="px-2.5 py-1 rounded border border-gray-300 bg-white hover:bg-gray-50 font-semibold text-gray-700"
                  >
                    Go
                  </button>
                </form>
              </div>
            )}
          </div>
        );
      };

      const activeHeaderCount = effectiveTabCounts[activeTab];

      const selectedZonesDisplayList = useMemo(() => {
        const idSet = new Set(selectedZoneIds.map(Number));
        return ALL_ZONES_CATALOG.filter((z) => idSet.has(Number(z.id)));
      }, [selectedZoneIds]);

      // --- 1) MANDATORY ZONE SELECTION GATE SCREEN ---
      if (!isZoneSetupConfirmed) {
        return (
          <div className="min-h-screen w-full bg-slate-50 flex flex-col items-center justify-center p-4 sm:p-6 text-gray-800">
            <div className="w-full max-w-4xl bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden flex flex-col max-h-[92vh]">
              {/* Gate Header */}
              <div className="px-6 py-5 bg-gradient-to-r from-slate-900 to-slate-800 text-white flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">🚴‍♂️</span>
                  <div>
                    <div className="flex flex-wrap items-center gap-2">
                      <h1 className="text-lg sm:text-xl font-bold tracking-tight">
                        تحديد زونات الموظف قبل بدء السحب (Independent Zone Gate)
                      </h1>
                      <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-amber-400/20 text-amber-200 border border-amber-300/40">
                        ★ التجربة الناجحة رقم 1
                      </span>
                    </div>
                    <p className="text-xs text-slate-300 mt-0.5">
                      كل موظف يختار زوناته المستقلة — يتم سحب وعرض أوردرات زوناتك فقط لتخفيف الحمل وتسريع الداشبورد
                    </p>
                  </div>
                </div>
                <span className="text-[11px] font-mono px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-200 border border-emerald-400/30">
                  Session: {sessionId.slice(-6)}
                </span>
              </div>

              {/* Employee Name / Desk Input */}
              <div className="px-6 py-3.5 bg-blue-50/50 border-b border-blue-100 flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-2 text-xs font-bold text-blue-900">
                  <span>👤 اسم الموظف / رقم المكتب (اختياري):</span>
                </div>
                <input
                  type="text"
                  value={employeeName}
                  onChange={(e) => setEmployeeName(e.target.value)}
                  placeholder="مثال: Ahmed - Desk 3"
                  className="flex-1 min-w-[220px] max-w-sm px-3.5 py-1.5 border border-blue-200 bg-white rounded-lg text-sm focus:outline-none focus:border-blue-500"
                />
              </div>

              {/* Quick Area Presets */}
              <div className="px-6 py-3.5 bg-gray-50 border-b border-gray-200 space-y-2">
                <div className="text-xs font-bold text-gray-600">
                  اختيار سريع لمناطق القاهرة (Quick Presets):
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {ZONE_QUICK_PRESETS.map((preset) => {
                    const allIn = preset.ids.every((id) => selectedZoneIds.includes(id));
                    return (
                      <button
                        key={preset.label}
                        type="button"
                        onClick={() => {
                          setSelectedZoneIds((prev) => {
                            if (allIn) {
                              return prev.filter((id) => !preset.ids.includes(id));

                        className={`px-3 py-1 rounded-full text-xs font-semibold border transition-colors ${
                          allIn
                            ? "bg-blue-600 text-white border-blue-600"
                            : "bg-white text-gray-700 border-gray-300 hover:bg-blue-50 hover:border-blue-300"

                      >
                        {allIn ? "✓ " : "+ "}

                    type="text"
                    value={zoneSearchQuery}
                    onChange={(e) => setZoneSearchQuery(e.target.value)}

                    className={`flex items-center justify-between px-5 py-2.5 text-sm font-medium w-full text-left transition-colors ${
                      isActive
                        ? "border-l-4 border-blue-600 text-blue-600 bg-blue-50/60 font-semibold"
                        : "border-l-4 border-transparent text-gray-700 hover:bg-gray-50"
                    } ${item.className || ""}`}
                  >
                    <span>
                      {item.label} {badgeCount !== undefined && `(${badgeCount})`}
                    </span>
                  </button>
                );
              })}
            </nav>

            <div className="p-3 border-t border-gray-200 bg-gray-50 text-xs space-y-1">
              <div className="font-bold text-gray-800 truncate">
                👤 {normalizeText(employeeName) || `Session ${sessionId.slice(-5)}`}
              </div>
              <div className="text-[11px] text-gray-500">
                Active Zones: <strong className="text-blue-600">{selectedZoneIds.length}</strong>
              </div>
            </div>
          </aside>

          {/* Main Content Area */}
          <div className="flex-1 flex flex-col min-w-0 bg-white">
            {/* Top Header */}
            <header className="h-14 flex items-center justify-between px-6 border-b border-gray-200 bg-white gap-3">
              <div className="flex items-center gap-3 text-xs">
                <span
                  className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full font-semibold border ${
                    connectionStatus === "live"
                      ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                      : connectionStatus === "error"
                      ? "bg-red-50 text-red-700 border-red-200"
                      : "bg-amber-50 text-amber-700 border-amber-200"
                  }`}
                >
                  <span
                    className={`w-2 h-2 rounded-full ${
                      connectionStatus === "live"
                        ? "bg-emerald-500 animate-pulse"
                        : connectionStatus === "error"
                        ? "bg-red-500"
                        : "bg-amber-500"
                    }`}
                  />
                  {connectionStatus === "live"
                    ? "LIVE (2s)"
                    : connectionStatus === "error"
                    ? "Sync Error"
                    : "Syncing Zones..."}
                </span>

                <span className="text-gray-500 hidden md:inline">Last Sync: {lastSyncTime}</span>

                <button
                  type="button"
                  onClick={handleResetToZoneSelection}
                  className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold shadow-sm transition-colors"
                  title="العودة لاختيار زونات جديدة"
                >
                  <span>🔄 تغيير الزونات ({selectedZoneIds.length})</span>
                </button>
              </div>

              <div className="flex items-center gap-3">
                <div className="relative flex items-center">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => {
                      setSearchQuery(e.target.value);
                      setCurrentPage(1);
                    }}
                    placeholder="Search Order ID, Courier, Vendor..."
                    className="pl-3.5 pr-8 py-1.5 border border-gray-300 rounded-lg text-sm w-56 sm:w-64 focus:outline-none focus:border-blue-500"
                  />
                  {searchQuery && (
                    <button
                      type="button"
                      onClick={() => setSearchQuery("")}
                      className="absolute right-2.5 text-gray-400 hover:text-gray-700 text-xs"
                    >
                      ✕
                    </button>
                  )}
                </div>

                <button
                  type="button"
                  onClick={fetchMySessionBundleFromFirebase}
                  className="px-3 py-1.5 border border-gray-300 rounded-lg text-xs font-semibold text-gray-700 hover:bg-gray-50"
                >
                  ↻ Refresh
                </button>
              </div>
            </header>

            {/* Selected Zones Pill Strip */}
            <div className="px-6 py-2 bg-slate-50 border-b border-gray-200 flex items-center gap-2 overflow-x-auto text-xs">
              <span className="font-bold text-gray-600 flex-shrink-0">الزونات النشطة:</span>
              {selectedZonesDisplayList.map((z) => (
                <span
                  key={z.id}
                  className="px-2.5 py-0.5 rounded-full bg-white border border-blue-200 text-blue-800 font-semibold flex-shrink-0"
                >
                  {z.name} <span className="text-gray-400 font-mono">({z.id})</span>
                </span>
              ))}
            </div>

            {/* Dynamic Main View */}
            <main ref={mainContainerRef} className="flex-1 overflow-auto p-6">
              <div className="max-w-[1440px] mx-auto">
                <div className="flex items-center justify-between">
                  <h1 className="text-2xl font-bold text-gray-900 tracking-tight">
                    {activeTab === "Active Couriers"
                      ? "Active Couriers"
                      : activeTab === "Dashboard" || activeTab === "Dispatcher Dashboard" || activeTab === "Issues"
                      ? activeTab
                      : `${activeTab} Deliveries ${activeHeaderCount !== undefined ? `(${activeHeaderCount})` : ""}`}
                  </h1>
                </div>

                {activeTab === "Dashboard"
                  ? renderDashboardView()
                  : activeTab === "Active Couriers"
                  ? renderActiveCouriersView()
                  : activeTab === "Dispatcher Dashboard"
                  ? renderDispatcherDashboardView()
                  : activeTab === "Issues"
                  ? renderIssuesView()
                  : renderDeliveriesTable()}
              </div>
            </main>
          </div>

          {/* Read-Only Full Order & Customer Details Modal */}
          {selectedOrderFullView && (
            <div
              className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-3 sm:p-6"
              onClick={() => setSelectedOrder(null)}
            >
              <div
                className="bg-white rounded-2xl w-full max-w-4xl max-h-[92vh] shadow-2xl border border-gray-200 flex flex-col overflow-hidden"
                onClick={(e) => e.stopPropagation()}
              >
                {/* Modal Top Header */}
                <div className="px-6 py-4 bg-white border-b border-gray-200 flex flex-wrap items-center justify-between gap-3">
                  <div className="flex flex-wrap items-center gap-2.5">
                    <span className="text-xl font-bold text-gray-900">{selectedOrderFullView.orderCode}</span>
                    <button
                      type="button"
                      onClick={() => copyToClipboard("orderCode", selectedOrderFullView.orderCode)}
                      className="text-xs px-2 py-0.5 rounded border border-gray-300 text-gray-600 hover:bg-gray-100"
                    >
                      {copiedText === "orderCode" ? "✓ Copied" : "⧉ Copy"}
                    </button>
                    <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200">
                      {selectedOrderFullView.status}
                    </span>
                    <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-50 text-red-700 border border-red-200">
                      Deadline: {selectedOrderFullView.deadline}
                    </span>
                    {!selectedOrderFullView.isLoadedFromApi && (
                      <span className="text-xs font-semibold text-blue-600 animate-pulse">
                        ⚡ جاري تحديث البيانات الحية...
                      </span>
                    )}
                  </div>

                  <button
                    type="button"
                    onClick={() => setSelectedOrder(null)}
                    className="p-1.5 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* Modal Sub-Tabs */}
                <div className="px-6 border-b border-gray-200 flex items-center gap-6 text-sm font-semibold bg-white">
                  {["Deliveries", "Customer & Address", "Order Items"].map((t) => (
                    <button
                      key={t}
                      type="button"
                      onClick={() => setDetailModalTab(t)}
                      className={`py-3 border-b-2 transition-colors ${
                        detailModalTab === t
                          ? "border-blue-600 text-blue-600"
                          : "border-transparent text-gray-500 hover:text-gray-800"
                      }`}
                    >
                      {t}
                    </button>
                  ))}
                </div>

                {/* Modal Scrollable Body */}
                <div className="flex-1 overflow-y-auto p-6 space-y-5 bg-white text-sm">
                  {detailModalTab === "Deliveries" && (
                    <div className="space-y-5">
                      {/* Accepted & Assigned Couriers Summary */}
                      <div className="p-4 rounded-xl border border-gray-200 bg-gray-50/70 space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold uppercase tracking-wider text-gray-700">
                            سجل الطيارين على الأوردر (Riders Assignment &amp; Acceptance)
                          </span>
                          <span className="text-xs text-gray-500">
                            الطيار الحالي: <strong className="text-blue-700">{selectedOrderFullView.courier}</strong>
                          </span>
                        </div>

                        {selectedOrderFullView.ridersHistory.length === 0 ? (
                          <div className="text-xs text-gray-500">
                            {selectedOrderFullView.isLoadedFromApi
                              ? "لا يوجد سجل تبديل طيارين إضافي لهذا الأوردر."
                              : "⏳ جاري تحميل سجل الطيارين وحركات التوصيل..."}
                          </div>
                        ) : (
                          <div className="overflow-x-auto bg-white rounded-lg border border-gray-200">
                            <table className="w-full text-left text-xs">
                              <thead>
                                <tr className="border-b border-gray-200 text-gray-500 bg-gray-50">
                                  <th className="py-2 px-3">COURIER</th>
                                  <th className="py-2 px-3">STATUS</th>
                                  <th className="py-2 px-3">DISPATCHED</th>
                                  <th className="py-2 px-3">ACCEPTED</th>
                                  <th className="py-2 px-3">PICKED UP</th>
                                  <th className="py-2 px-3">REMOVED</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-gray-100">
                                {selectedOrderFullView.ridersHistory.map((r, i) => (
                                  <tr key={i}>
                                    <td className="py-2 px-3 font-semibold text-gray-800">{r.courierName}</td>
                                    <td className="py-2 px-3">
                                      {r.accepted ? (
                                        <span className="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold">
                                          Accepted
                                        </span>
                                      ) : (
                                        <span className="px-2 py-0.5 rounded bg-gray-100 text-gray-600 border border-gray-200 font-semibold">
                                          Assigned Only
                                        </span>
                                      )}
                                    </td>
                                    <td className="py-2 px-3 font-mono">{r.dispatchedAt}</td>
                                    <td className="py-2 px-3 font-mono text-emerald-700 font-semibold">{r.acceptedAt}</td>
                                    <td className="py-2 px-3 font-mono">{r.pickedUpAt}</td>
                                    <td className="py-2 px-3 font-mono text-red-600">{r.removedAt}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        )}
                      </div>

                      {/* Chronological Transitions Timeline */}
                      <div className="p-4 rounded-xl border border-gray-200 bg-white space-y-3">
                        <div className="text-xs font-bold uppercase tracking-wider text-gray-700">
                          حركات التوصيل بالثواني (Delivery Transitions Timeline)
                        </div>
                        {selectedOrderFullView.allEvents.length === 0 ? (
                          <div className="text-xs text-gray-500 py-4 text-center">
                            {selectedOrderFullView.isLoadedFromApi
                              ? "لا توجد حركات مسجلة لهذا الأوردر."
                              : "⏳ جاري سحب الحركات من Hurrier..."}
                          </div>
                        ) : (
                          <div className="space-y-2.5">
                            {selectedOrderFullView.allEvents.map((ev) => (
                              <div key={ev.key} className="timeline-row flex items-start gap-3">
                                <div className="timeline-line pt-1">
                                  <span
                                    className={`block w-3 h-3 rounded-full ${
                                      ev.isAccepted
                                        ? "bg-emerald-500"
                                        : ev.isRemoved
                                        ? "bg-red-500"
                                        : "bg-blue-500"
                                    }`}
                                  />
                                </div>
                                <div className="flex-1 flex flex-wrap items-center justify-between gap-2 bg-gray-50 px-3 py-2 rounded-lg border border-gray-200 text-xs">
                                  <div>
                                    <span className="font-bold text-gray-900">{ev.eventLabel}</span>
                                    {ev.courierName && ev.courierName !== "-" && (
                                      <span className="ml-2 text-blue-700 font-medium">({ev.courierName})</span>
                                    )}
                                    {ev.subLabel && <span className="ml-2 text-gray-500">• {ev.subLabel}</span>}
                                  </div>
                                  <span className="font-mono font-semibold text-gray-700">{ev.timeSec}</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {detailModalTab === "Customer & Address" && (
                    <div className="space-y-5">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {/* Customer Card */}
                        <div className="p-4 rounded-xl border border-blue-200 bg-blue-50/20 space-y-2.5">
                          <div className="text-xs font-bold text-blue-700">
                            بيانات العميل (CUSTOMER DETAILS)
                          </div>
                          <div className="grid grid-cols-2 gap-2 text-xs">
                            <div>
                              <span className="text-gray-500">الاسم: </span>
                              <strong className="text-gray-900">{selectedOrderFullView.customerName}</strong>
                            </div>
                            <div className="flex items-center gap-1.5">
                              <span className="text-gray-500">الهاتف: </span>
                              {selectedOrderFullView.customerPhone ? (
                                <>
                                  <strong className="text-emerald-700 font-mono">
                                    {selectedOrderFullView.customerPhone}
                                  </strong>
                                  <button
                                    type="button"
                                    onClick={() => copyToClipboard("phone", selectedOrderFullView.customerPhone)}
                                    className="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[11px] font-bold hover:bg-emerald-200"
                                  >
                                    {copiedText === "phone" ? "✓" : "نسخ"}
                                  </button>
                                </>
                              ) : !selectedOrderFullView.isLoadedFromApi ? (
                                <span className="text-emerald-700 font-semibold animate-pulse">
                                  ⏳ جاري الجلب...
                                </span>
                              ) : (
                                <span className="text-gray-500 font-medium">غير متاح من Hurrier</span>
                              )}
                            </div>
                            <div>
                              <span className="text-gray-500">العمارة: </span>
                              <strong className="text-gray-900">{selectedOrderFullView.building}</strong>
                            </div>
                            <div>
                              <span className="text-gray-500">الدور: </span>
                              <strong className="text-gray-900">{selectedOrderFullView.floor}</strong>
                            </div>
                            <div>
                              <span className="text-gray-500">الشقة: </span>
                              <strong className="text-gray-900">{selectedOrderFullView.apartment}</strong>
                            </div>
                            <div>
                              <span className="text-gray-500">Intercom / المدخل: </span>
                              <strong className="text-gray-900">
                                {selectedOrderFullView.intercom} / {selectedOrderFullView.entrance}
                              </strong>
                            </div>
                          </div>
                          <div className="pt-2 border-t border-blue-100 text-xs space-y-1">
                            <div>
                              <span className="text-gray-500">العنوان: </span>
                              <strong className="text-gray-900">{selectedOrderFullView.dropoffAddress}</strong>
                            </div>
                            {selectedOrderFullView.deliveryNote && selectedOrderFullView.deliveryNote !== "NA" && (
                              <div>
                                <span className="text-gray-500">ملاحظات العنوان: </span>
                                <span className="text-amber-800 font-medium">{selectedOrderFullView.deliveryNote}</span>
                              </div>
                            )}
                          </div>
                        </div>

                        {/* Vendor & Value Card */}
                        <div className="p-4 rounded-xl border border-gray-200 bg-white space-y-2.5 text-xs">
                          <div className="text-xs font-bold text-gray-800">
                            بيانات المطعم / الفرع (VENDOR &amp; VALUE)
                          </div>
                          <div>
                            <span className="text-gray-500">الفرع: </span>
                            <strong className="text-gray-900">
                              {selectedOrderFullView.vendorName} (VO #{selectedOrderFullView.vendorOrderNo})
                            </strong>
                          </div>
                          <div>
                            <span className="text-gray-500">قيمة الأوردر: </span>
                            <strong className="text-gray-900">{selectedOrderFullView.orderValue}</strong>
                            <span className="mx-2 text-gray-300">•</span>
                            <span className="text-gray-500">المسافة: </span>
                            <strong className="text-gray-900">{selectedOrderFullView.distance}</strong>
                          </div>
                          <div>
                            <span className="text-gray-500">عنوان الاستلام: </span>
                            <span className="text-gray-800 font-medium">{selectedOrderFullView.pickupAddress}</span>
                          </div>
                        </div>
                      </div>

                      {/* 7 Timestamps Grid */}
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        {selectedOrderFullView.timeChecks.map((tc) => (
                          <div key={tc.label} className="p-3 rounded-xl border border-gray-200 bg-gray-50/60">
                            <div className="text-xs text-gray-500">{tc.label}</div>
                            <div className="text-xs font-bold text-gray-900 mt-1">{tc.value}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {detailModalTab === "Order Items" && (
                    <div className="border border-gray-200 rounded-xl overflow-hidden">
                      <table className="w-full text-left text-xs">
                        <thead>
                          <tr className="bg-gray-50 border-b border-gray-200 text-gray-500 font-semibold">
                            <th className="py-2.5 px-4">QTY</th>
                            <th className="py-2.5 px-4">ITEM</th>
                            <th className="py-2.5 px-4 text-right">PRICE</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100">
                          {selectedOrderFullView.items.map((it, idx) => (
                            <tr key={idx}>
                              <td className="py-3 px-4 font-bold text-gray-800">{it.quantity || it.qty || 1}x</td>
                              <td className="py-3 px-4 text-gray-800">{it.name || it.title || "Item"}</td>
                              <td className="py-3 px-4 text-right font-semibold text-gray-900">
                                {typeof it.price === "number" ? formatMoney(it.price, "EGP") : it.price || "-"}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>

                {/* Modal Footer */}
                <div className="px-6 py-3 bg-gray-50 border-t border-gray-200 flex items-center justify-between text-xs text-gray-500">
                  <span>View-Only Mode (No actions permitted)</span>
                  <button
                    type="button"
                    onClick={() => setSelectedOrder(null)}
                    className="px-4 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 font-semibold text-gray-700"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
